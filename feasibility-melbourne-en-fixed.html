              {/*  DECISION CONFIDENCE & DATA FRESHNESS CARD  */}
              {qualitySignals&&(()=>{
                const qs=qualitySignals;
                const overall=qs.overall??0;
                const ob=scoreToBand(overall);
                const lowRows=qs.lowRows||[];
                return(
                  <>
                    {/* P0-3: Missing source metadata alert */}
                    {qs.missingSources&&qs.missingSources.length>0&&(
                      <div style={{background:"#faf5ff",border:`1.5px solid #c084fc`,borderRadius:8,padding:"10px 14px",marginBottom:10,fontFamily:sans,display:"flex",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                        <span style={{fontSize:18,marginTop:1}}></span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:700,color:"#6d28d9",fontSize:12,marginBottom:3}}>Missing Source Metadata  confidence score penalised by {qs.srcPenalty} pts</div>
                          <div style={{fontSize:11,color:"#374151",lineHeight:1.7}}>
                            These fields have values but no verified source:
                            {" "}<strong style={{color:"#6d28d9"}}>{qs.missingSources.join("  ")}</strong>
                            {" "} open each field's source badge () and select a data source to restore full confidence.
                          </div>
                        </div>
                        <button onClick={()=>{setTab("market");addToast(" Update source metadata on key fields to raise confidence score","info",6000);}}
                          style={{flexShrink:0,border:"1px solid #c084fc",background:"white",color:"#6d28d9",fontFamily:sans,fontSize:11,fontWeight:700,padding:"4px 11px",borderRadius:5,cursor:"pointer"}}>
                          Fix Sources
                        </button>
                      </div>
                    )}
                    {/* Low-confidence warning banner */}
                    {overall<60&&(
                      <div style={{background:"#fff7ed",border:`2px solid ${C.orange}`,borderRadius:10,padding:"12px 16px",marginBottom:12,fontFamily:sans,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                        <span style={{fontSize:22}}></span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:700,color:C.orange,fontSize:13}}>Low Decision Confidence  {overall}/100</div>
                          <div style={{fontSize:12,color:C.slate,marginTop:3,lineHeight:1.6}}>
                            {lowRows.map(r=>`${r.metric} (${r.score}/100)`).join("  ")}  these assumptions need verification before sharing externally.
                          </div>
                        </div>
                        <button onClick={()=>{
                          const first=lowRows[0];
                          if(!first)return;
                          setTab(first.tab);
                          setFixStepIdx(0);
                          addToast(` Highest priority: ${first.metric}  ${first.fixHint}`,"info",7000);
                        }} style={{background:C.orange,color:"#fff",border:"none",fontFamily:sans,fontSize:12,fontWeight:700,padding:"8px 16px",borderRadius:6,cursor:"pointer",whiteSpace:"nowrap"}}>
                           Fix highest priority
                        </button>
                      </div>
                    )}
                    <Card title=" Decision Confidence & Data Freshness" accent={ob.color}>
                      {/* Overall score gauge */}
                      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16,background:ob.bg,borderRadius:8,padding:"12px 16px"}}>
                        <div style={{textAlign:"center",minWidth:72}}>
                          <div style={{fontSize:38,fontWeight:900,fontFamily:mono,color:ob.color,lineHeight:1}}>{overall}</div>
                          <div style={{fontSize:10,color:ob.color,fontWeight:700,marginTop:2}}>/ 100</div>
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:15,fontWeight:700,color:ob.color,marginBottom:4}}>{ob.icon} Overall Confidence: {ob.band}</div>
                          <div style={{height:8,background:"#e5e7eb",borderRadius:4,overflow:"hidden"}}>
                            <div style={{width:`${overall}%`,height:"100%",background:ob.color,borderRadius:4,transition:"width .4s"}}/>
                          </div>
                          <div style={{fontSize:11,color:C.muted,marginTop:5,lineHeight:1.5}}>
                            {overall>=80?"All key assumptions have a verifiable basis  proceed with normal due diligence."
                             :overall>=60?"Most assumptions are documented  address low-confidence items before external sharing."
                             :"Multiple assumptions lack verification  validate before making investment decisions."}
                          </div>
                        </div>
                        {/* Live feed status */}
                        <div style={{textAlign:"center",minWidth:90,background:"#fff",borderRadius:7,padding:"8px 10px",border:`1px solid ${C.border}`}}>
                          <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Live Feed</div>
                          <div style={{fontSize:11,fontWeight:700,color:liveInd.status==="done"?C.teal:liveInd.status==="loading"?C.orange:C.muted}}>
                            {liveInd.status==="done"?" Active":liveInd.status==="loading"?" Loading":" Inactive"}
                          </div>
                          {liveInd.ts&&<div style={{fontSize:9,color:C.muted,marginTop:2}}>{calcFreshness(liveInd.ts).label}</div>}
                        </div>
                      </div>

                      {/* Per-metric table */}
                      <div style={{overflowX:"auto"}}>
                        <table style={{width:"100%",borderCollapse:"collapse",fontFamily:sans,fontSize:12}}>
                          <thead>
                            <tr style={{background:"#f8f9fa"}}>
                              {["Metric","Score","Band","Freshness","Primary Sources","Action"].map(h=>(
                                <th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:700,color:C.slate,fontSize:11,borderBottom:`2px solid ${C.border}`}}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {qs.rows.map((r,i)=>{
                              const rb=scoreToBand(r.score);
                              const isDone=r.score>=60;
                              return(
                                <tr key={i} style={{background:i%2===0?"#fff":"#fafafa",borderBottom:`1px solid ${C.border}`}}>
                                  <td style={{padding:"8px 10px",fontWeight:600,color:C.ink}}>{r.metric}</td>
                                  <td style={{padding:"8px 10px",fontFamily:mono,fontWeight:700,color:rb.color}}>
                                    <span style={{display:"inline-block",minWidth:32}}>{r.score}</span>
                                    <span style={{fontSize:10,color:C.muted}}>/100</span>
                                  </td>
                                  <td style={{padding:"8px 10px"}}>
                                    <span style={{background:rb.bg,color:rb.color,padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>{rb.icon} {rb.band}</span>
                                  </td>
                                  <td style={{padding:"8px 10px",fontSize:11,color:r.fresh.color,fontWeight:600}}>{r.fresh.label}</td>
                                  <td style={{padding:"8px 10px",fontSize:11,color:C.muted,maxWidth:200}}>{r.sources.join("  ")||""}</td>
                                  <td style={{padding:"8px 10px"}}>
                                    {!isDone?(
                                      <button onClick={()=>{setTab(r.tab);addToast(` ${r.metric}: ${r.fixHint}`,"info",7000);}}
                                        style={{background:rb.color,color:"#fff",border:"none",borderRadius:5,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
                                         Go fix
                                      </button>
                                    ):(
                                      <span style={{color:C.teal,fontSize:11,fontWeight:600}}> OK</span>

                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                      {/* Remediation flow  shows when there are low-confidence items */}
                      {lowRows.length>0&&(
                        <div style={{marginTop:12,background:"#f8f9fa",borderRadius:8,padding:"12px 14px",fontFamily:sans}}>
                          <div style={{fontSize:12,fontWeight:700,color:C.slate,marginBottom:8}}>
                             Remediation Flow  {fixStepIdx+1} / {lowRows.length} items
                          </div>
                          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8,marginBottom:10}}>
                            {lowRows.map((r,i)=>{
                              const rb=scoreToBand(r.score);
                              const isActive=i===fixStepIdx;
                              return(
                                <div key={i} onClick={()=>setFixStepIdx(i)}
                                  style={{background:isActive?rb.bg:"#fff",border:`2px solid ${isActive?rb.color:C.border}`,borderRadius:7,padding:"8px 10px",cursor:"pointer",transition:"all .15s"}}>
                                  <div style={{fontSize:10,color:rb.color,fontWeight:700,marginBottom:3}}>Step {i+1} {rb.icon}</div>
                                  <div style={{fontSize:12,fontWeight:600,color:C.ink}}>{r.metric}</div>
                                  <div style={{fontSize:11,color:rb.color,fontWeight:700}}>{r.score}/100</div>
                                </div>

                            })}
                          </div>

                            <div style={{background:scoreToBand(lowRows[fixStepIdx].score).bg,border:`1px solid ${scoreToBand(lowRows[fixStepIdx].score).color}`,borderRadius:7,padding:"10px 12px",marginBottom:8}}>
                              <div style={{fontSize:12,fontWeight:700,color:scoreToBand(lowRows[fixStepIdx].score).color,marginBottom:4}}>
                                Current: {lowRows[fixStepIdx].metric}  {lowRows[fixStepIdx].score}/100
                              </div>
                              <div style={{fontSize:12,color:C.slate,lineHeight:1.6}}>{lowRows[fixStepIdx].fixHint}</div>
                            </div>
                          )}
                          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                            <button onClick={()=>setFixStepIdx(i=>Math.max(0,i-1))} disabled={fixStepIdx===0}
                              style={{background:"#fff",color:C.slate,border:`1px solid ${C.border}`,fontFamily:sans,fontSize:12,fontWeight:600,padding:"6px 14px",borderRadius:6,cursor:fixStepIdx===0?"not-allowed":"pointer",opacity:fixStepIdx===0?0.5:1}}>
                               Previous
                            </button>
                            <button onClick={()=>{
                              const r=lowRows[fixStepIdx];
                              if(r){setTab(r.tab);addToast(` Step ${fixStepIdx+1}: ${r.metric}  ${r.fixHint}`,"info",7000);}
                            }} style={{background:C.brand,color:"#fff",border:"none",fontFamily:sans,fontSize:12,fontWeight:700,padding:"6px 16px",borderRadius:6,cursor:"pointer"}}>
                               Jump to this tab
                            </button>
                            <button onClick={()=>setFixStepIdx(i=>Math.min(lowRows.length-1,i+1))} disabled={fixStepIdx>=lowRows.length-1}
                              style={{background:"#fff",color:C.slate,border:`1px solid ${C.border}`,fontFamily:sans,fontSize:12,fontWeight:600,padding:"6px 14px",borderRadius:6,cursor:fixStepIdx>=lowRows.length-1?"not-allowed":"pointer",opacity:fixStepIdx>=lowRows.length-1?0.5:1}}>
                              Next
                            </button>
                            <button onClick={()=>{
                              // P1.2: "Run Full Flow" now uses in-page stepper instead of recursive window.confirm
                              if(lowRows.length>0){
                                setFixStepIdx(0);setTab(lowRows[0].tab);
                                addToast(` Guided flow started  ${lowRows.length} item${lowRows.length>1?"s":""} to review. Use Next  to step through.`,"info",6000);
                              }
                              const _unused=()=>{
                                let idx=0;
                                const step=()=>{
                                if(idx>=lowRows.length){addToast(" All remediation steps reviewed  re-check confidence scores","success");return;}
                                const r=lowRows[idx];setTab(r.tab);setFixStepIdx(idx);
                                idx++;step();
                              };
                              }; // end _unused (legacy recursive confirm removed)
                            }} style={{background:`linear-gradient(135deg,${C.teal},${C.brand})`,color:"#fff",border:"none",fontFamily:sans,fontSize:12,fontWeight:700,padding:"6px 16px",borderRadius:6,cursor:"pointer"}}>
                               Run Full Flow
                            </button>
                          </div>
                        </div>
                      )}
                      <div style={{marginTop:10,fontSize:11,color:C.muted,fontFamily:sans,lineHeight:1.6}}>
                         Confidence scores reflect input completeness and data freshness  not market conditions. A high score does not guarantee the project is viable; it means your assumptions are well-supported. Always verify GRV with a registered valuer and TDC with a QS before final commitment.
                      </div>
                    </Card>
                  </>
                );
              })()}

              {/*  THREE-SCENARIO ANALYSIS  */}
              {scenarioResults&&(
                <Card title=" Three-Scenario Analysis" accent={C.brand}>
                  {(()=>{
                    const [showSce,setShowSce]=React.useState(false);
                    return(
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:11,color:C.muted,fontFamily:sans,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                          <span><strong>Upside:</strong> GRV +{params.scGrvUp||5}%, {params.scMoUp||1}mo &nbsp;&nbsp; <strong>Base:</strong> Current &nbsp;&nbsp; <strong>Downside:</strong> GRV {params.scGrvDn||7}%, costs +{params.scCostUp||8}%, +{params.scMoDn||3}mo</span>
                          <button onClick={()=>setShowSce(s=>!s)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",color:C.slate,flexShrink:0}}> {showSce?"Close":"Edit"}</button>
                        </div>
                        {showSce&&(
                          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8,background:"#f8f9fa",borderRadius:6,padding:"8px 10px",border:`1px solid ${C.border}`,alignItems:"flex-end"}}>
                            {[{k:"scGrvUp",lb:"GRV Up %"},{k:"scGrvDn",lb:"GRV Down %"},{k:"scCostUp",lb:"Cost Up %"},{k:"scMoUp",lb:"Mo saved"},{k:"scMoDn",lb:"Mo added"}].map(({k,lb})=>(
                              <div key={k} style={{display:"flex",flexDirection:"column",gap:3,alignItems:"center"}}>
                                <span style={{fontSize:9,color:C.muted,fontFamily:sans}}>{lb}</span>
                                <input type="number" value={params[k]||""} min="0" max="30" step="1"
                                  onChange={e=>setParams(p=>({...p,[k]:e.target.value}))}
                                  style={{width:46,padding:"3px 5px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:mono,fontSize:12,textAlign:"center"}}/>
                              </div>
                            ))}
                            <button onClick={()=>setParams(p=>({...p,scGrvUp:"5",scGrvDn:"7",scCostUp:"8",scMoUp:"1",scMoDn:"3"}))}
                              style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,padding:"3px 8px",fontSize:10,cursor:"pointer",color:C.muted,alignSelf:"flex-end",marginBottom:2}}> Reset</button>
                          </div>
                        )}
                      </div>
                    );
                  })()}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                    {[scenarioResults.upside,scenarioResults.base,scenarioResults.downside].map((sc,i)=>{
                      const isActive=activeScenario===["upside","base","downside"][i];
                      const marginColor=sc.margin>=20?C.accent:sc.margin>=15?C.gold:sc.margin>=0?C.orange:C.warn;
                      return(
                        <div key={i} onClick={()=>setActiveScenario(["upside","base","downside"][i])}
                          style={{background:isActive?"#f0fdf4":"#f8fafc",border:`2px solid ${isActive?C.accent:C.border}`,borderRadius:10,padding:"14px 12px",cursor:"pointer",transition:"border 0.2s"}}>
                          <div style={{fontSize:13,fontWeight:700,color:C.ink,marginBottom:8}}>{sc.emoji} {sc.label}</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 10px",fontFamily:sans,fontSize:11}}>
                            <div style={{color:C.muted}}>GRV</div><div style={{fontFamily:mono,fontWeight:600,color:C.ink,textAlign:"right"}}>{fmt(sc.grv)}</div>
                            <div style={{color:C.muted}}>TDC</div><div style={{fontFamily:mono,fontWeight:600,color:C.ink,textAlign:"right"}}>{fmt(sc.total)}</div>
                            <div style={{color:C.muted}}>Profit</div><div style={{fontFamily:mono,fontWeight:700,color:sc.profit>=0?C.accent:C.warn,textAlign:"right"}}>{fmt(sc.profit)}</div>
                            <div style={{color:C.muted}}>Margin</div><div style={{fontFamily:mono,fontWeight:900,fontSize:14,color:marginColor,textAlign:"right"}}>{sc.margin.toFixed(1)}%</div>
                            <div style={{color:C.muted}}>IRR</div><div style={{fontFamily:mono,fontWeight:600,color:C.purple,textAlign:"right"}}>{sc.irr!=null?sc.irr.toFixed(1)+"%":""}</div>
                            <div style={{color:C.muted}}>Months</div><div style={{fontFamily:mono,textAlign:"right"}}>{sc.months}</div>
                          </div>

                        </div>
                      );
                    })}
                  </div>
                  <div style={{marginTop:10,fontSize:11,color:C.muted,fontFamily:sans}}>
                    Click a scenario to highlight it. All core calculations above remain on your actual inputs  scenarios are for comparison only.
                  </div>
                </Card>
              )}

              {/*  RISK MODEL LAYERS  */}
              {riskLayers&&(
                <Card title=" Risk Model  Four-Layer Assessment" accent={C.warn}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                    {[
                      {key:"planning",label:"Planning & Zoning",emoji:"",cat:riskLayers.planning},
                      {key:"delivery",label:"Delivery & Site",emoji:"",cat:riskLayers.delivery},
                      {key:"market",label:"Market & Financial",emoji:"",cat:riskLayers.market},
                      {key:"legal",label:"Legal & Title",emoji:"",cat:riskLayers.legal},
                    ].map(({key,label,emoji,cat})=>{
                      const score=cat.score;
                      const barColor=score>=75?"#22c55e":score>=50?"#f59e0b":score>=25?C.orange:"#dc2626";
                      return(
                        <div key={key} style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px"}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                            <span style={{fontSize:12,fontWeight:700,color:C.ink}}>{emoji} {label}</span>

                          </div>
                          <div style={{height:6,background:"#e5e7eb",borderRadius:3,marginBottom:8}}>
                            <div style={{height:6,width:score+"%",background:barColor,borderRadius:3,transition:"width 0.4s"}}/>

                          {cat.items.length>0?(

                  </div>

                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:12}}>

                      {label:"Weighted PSM",val:`$${weightedComps.weightedPsm.toLocaleString()}/m`,col:C.teal},
                      {label:"Suggested Range",val:`$${weightedComps.rangeLow.toLocaleString()}  $${weightedComps.rangeHigh.toLocaleString()}/m`,col:C.slate},

                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontFamily:sans,fontSize:11}}>

                          <th key={h} style={{padding:"5px 8px",textAlign:h==="PSM"||h==="Sale Price"||h==="Area Sim"||h==="Recency"||h==="Weight"?"right":"left",color:C.slate,fontWeight:700,borderBottom:`1px solid ${C.border}`}}>{h}</th>
                        ))}
                      </tr></thead>
                      <tbody>
                        {weightedComps.scored.map((c,i)=>(

                    <StatBox label="Residual Land Value" value={finStruct.rlv!=null?fmt(finStruct.rlv):""} color={finStruct.rlv!=null&&parseNum(fin.landPrice)>0&&finStruct.rlv>=parseNum(fin.landPrice)?C.accent:C.warn} sub="Max land cost at 20% target margin"/>

                    <StatBox label="Annualised ROE (IRR)" value={finStruct.irr!=null?pct(finStruct.irr):""} color={finStruct.irr>=20?C.accent:finStruct.irr>=15?C.gold:C.warn} sub="Target 18% p.a."/>
                    <StatBox label="NPV at Hurdle Rate" value={finStruct.npv!=null?fmt(finStruct.npv):""} color={finStruct.npv>0?C.accent:C.warn} sub={`${str.discountRate}% hurdle  ${str.projectMonths}mo`}/>
                    {finStruct.gstNetMargin!=null&&<StatBox label="Net Margin (post-GST)" value={pct(finStruct.gstNetMargin)} color={finStruct.gstNetMargin>=18?C.accent:C.warn} sub="After Margin Scheme GST remittance"/>}
                  </div>
                  {/* Bank lending metrics: DSCR, Equity Multiple, Peak Equity */}

                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:10}}>
                      <StatBox label="Equity Multiple (EM)"
                        value={finStruct.equityMultiple!=null?finStruct.equityMultiple.toFixed(2)+"":""}

                      <StatBox label="DSCR (Interest Cover)"

                      <StatBox label="Peak Equity Exposure"

                         Subdivision Suitability  {calc.frontageM.toFixed(1)}m frontage

                          padding:"4px 14px",borderRadius:20,fontWeight:700,fontSize:12,

                        </div>

                        <div style={{marginTop:8,fontSize:11,padding:"5px 9px",borderRadius:5,
                          background:calc.gravDrainRisk==="pump-risk"?"#fef2f2":"#fffbeb",
                          color:calc.gravDrainRisk==="pump-risk"?"#991b1b":"#78350f",
                          border:`1px solid ${calc.gravDrainRisk==="pump-risk"?"#fca5a5":"#fcd34d"}`}}>
                          {calc.gravDrainRisk==="pump-risk"
                            ?` Gravity Drainage Risk: Site falls toward rear with no registered easement. Pump system likely required  ${fmt(calc.pumpSystemPS)} provisional sum added to Hard Cost.`
                            :" Gravity Drainage: Site falls toward rear  possible rear easement exists. Verify drainage outlet rights with council before finalising site works budget."}
                        </div>
                      )}
                      {calc.drivewayConcretPS>0&&(
                        <div style={{marginTop:8,fontSize:11,padding:"5px 9px",borderRadius:5,background:"#f8fafc",color:"#334155",border:"1px solid #cbd5e1"}}>
                           <strong>Driveway Concrete:</strong> {calc.drivewaySqm}m RC concrete corridor (3.2m  ~{Math.round(calc.drivewaySqm/3.2)}m depth)  {fmt(calc.drivewayConcretPS)} added to Hard Cost at $200/m. Narrow tandem sites have a high pavement-to-building ratio.
                        </div>
                      )}
                      {calc.slopeStructuralPS>0&&(
                        <div style={{marginTop:8,fontSize:11,padding:"5px 9px",borderRadius:5,background:"#fef9c3",color:"#713f12",border:"1px solid #fde047"}}>

                        </div>
                      )}
                      {/*  TPZ Encroachment  */}
                      {calc.tpzEncroachSqm>0&&(
                        <div style={{marginTop:8,fontSize:11,padding:"5px 9px",borderRadius:5,background:"#f0fdf4",color:"#065f46",border:"1px solid #86efac"}}>
                           <strong>TPZ Footprint Encroachment:</strong> ~{calc.tpzEncroachSqm}m of buildable area occupied by Tree Protection Zone(s) ({osmTreeCount} tree{osmTreeCount!==1?"s":""} detected

                          {calc.effectiveBuildableAreaFinal>0&&` Adjusted net buildable area: ${calc.effectiveBuildableAreaFinal}m (from ${calc.effectiveBuildableArea||parseNum(plan.buildableArea)}m entered).`}
                          {" "}Verify canopy positions with arborist before finalising layout.
                        </div>
                      )}

                      {calc.northLightRisk==="high"&&(

                          Upper-storey north setback may need to increase beyond standard minimum to pass council's shadow impact assessment. Consult Clause 55.04-5 early in design.
                        </div>
                      )}
                      {calc.northLightRisk==="moderate"&&(
                        <div style={{marginTop:8,fontSize:11,padding:"5px 9px",borderRadius:5,background:"#fffbeb",color:"#78350f",border:"1px solid #fde68a"}}>
                           <strong>North Light Shadowing  MODERATE:</strong> Mixed lot orientation. Verify B17 solar setbacks for proposed wall height during PPAA.
                        </div>
                      )}
                    </div>
                  )}
                  {/* RLV narrative */}
                  {finStruct.rlv!=null&&parseNum(fin.landPrice)>0&&(
                    <div style={{padding:"10px 14px",borderRadius:8,background:finStruct.rlv>=parseNum(fin.landPrice)?"#f0fdf9":"#fff7ed",border:`1px solid ${finStruct.rlv>=parseNum(fin.landPrice)?C.accent:C.warn}44`,fontFamily:sans,fontSize:12,marginBottom:10}}>
                      <strong>RLV Assessment:</strong> At a 20% target margin, the maximum defensible land price is <strong style={{color:C.brand}}>{fmt(finStruct.rlv)}</strong>.
                      {finStruct.rlv>=parseNum(fin.landPrice)
                        ?<span style={{color:C.accentDark,fontWeight:700}}>  Paid {fmt(parseNum(fin.landPrice))}  {fmt(finStruct.rlv-parseNum(fin.landPrice))} headroom above RLV.</span>
                        :<span style={{color:C.warn,fontWeight:700}}>  Paid {fmt(parseNum(fin.landPrice))}  exceeds RLV by {fmt(parseNum(fin.landPrice)-finStruct.rlv)}. Restructure or renegotiate land price.</span>
                      }
                    </div>
                  )}
                  {/* RLV Stress Test  build cost escalation + market softening sensitivity */}
                  {finStruct.rlv!=null&&calc.grv>0&&(
                    <div style={{background:"#f1f5f9",borderRadius:8,padding:"10px 14px",fontFamily:sans,fontSize:12,marginBottom:10}}>
                      <div style={{fontWeight:700,color:C.slate,marginBottom:8}}> RLV Stress Test  Cost &amp; Market Sensitivity</div>
                      {(()=>{const m=calc.margin;if(m<-50||m>100){return(<div style={{marginBottom:8,padding:"7px 12px",background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:6,fontSize:11,color:"#92400e",display:"flex",alignItems:"center",gap:8}}><span></span><span><strong>Extreme inputs detected.</strong> Margin of {m.toFixed(1)}% is outside normal range  matrix figures may be distorted. Check GRV and cost inputs.</span></div>);}return null;})()}
                      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6}}>
                        {[
                          {label:"Base (current)",rlv:finStruct.rlv,sub:""},

                          {label:"Build cost +10%",rlv:finStruct.rlvStress10,sub:calc.hard>0?`Hard cost +${fmt(Math.round(calc.hard*0.10))}`:""},

                              <div style={{fontWeight:700,fontSize:14,color:belowPaid?C.warn:C.accent}}>{rlv!=null?fmt(rlv):""}</div>
                              {sub&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>{sub}</div>}
                              {belowPaid&&<div style={{fontSize:10,color:C.warn,marginTop:3}}> Below land price by {fmt(paid-rlv)}</div>}
                              {abovePaid&&idx>0&&<div style={{fontSize:10,color:C.accentDark,marginTop:3}}> Still above land price</div>}
                            </div>
                          );
                        })}
                      </div>
                      <div style={{fontSize:10,color:C.muted,marginTop:7}}>Each scenario shows the max defensible land price at 20% margin. If stressed RLV falls below your paid price, the deal becomes unviable under that scenario.</div>
                      {/*  Nexicon Safety Verdict  */}
                      {finStruct.rlv!=null&&parseNum(fin.landPrice)>0&&(()=>{
                        const paid=parseNum(fin.landPrice);
                        const baseRlv=finStruct.rlv;

                          </div>);
                        }
                        /* Paid < 90% of RLV  solid entry with buffer */
                        if(paid<=baseRlv*0.90){
                          return(<div style={{marginTop:8,padding:"8px 12px",borderRadius:6,background:"#f0fdf4",border:"1px solid #86efac",display:"flex",alignItems:"center",gap:8}}>

                    ].map((item,i)=>{
                      const m=item.s.margin;
                      const viability=m>=20?"VIABLE":m>=15?"MARGINAL":m>=0?"THIN":"LOSS";

                    <>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:14}}>
                        <StatBox label="Elevation" value={`${inv.elev.ctr?.toFixed(1)}m`} color={C.teal} sub="above sea level"/>
                        <StatBox label="Max Slope" value={`${inv.elev.maxSlope?.toFixed(1)}%`} color={inv.elev.categoryColor} sub={inv.elev.aspect}/>

                      {/*  Slope Heatmap SVG  */}
                      {inv.elev.elevs&&inv.elev.elevs.length>=9&&(()=>{
                        const e=inv.elev.elevs;
                        /* 33 grid: NW N NE / W C E / SW S SE  corners interpolated */
                        const grid=[
                          [e[1]+e[4]-e[0], e[1], e[1]+e[3]-e[0]],
                          [e[4],           e[0], e[3]           ],
                          [e[2]+e[4]-e[0], e[2], e[2]+e[3]-e[0]],
                        ];
                        const flat=grid.flat();
                        const mn=Math.min(...flat),mx=Math.max(...flat);
                        const rng=mx-mn||1;
                        const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
                        const cellColor=v=>{
                          const t=(v-mn)/rng;
                          /* cool (blue)  neutral (green)  warm (red) */
                          if(t<0.5){const u=t*2;return`rgb(${lerp(41,34,u)},${lerp(128,189,u)},${lerp(185,34,u)})`;}

                        const labels=[["NW","N","NE"],["W","Centre","E"],["SW","S","SE"]];
                        const sw=240,sh=170,cw=sw/3,ch=sh/3;
                        /* Arrow: direction of steepest descent */

            builder:{icon:"",label:"Builder View",desc:"Showing hard costs, physical constraints, and finance structure. Soft cost narrative and market depth are condensed.",color:"#1e40af",bg:"#eff6ff",border:"#bfdbfe",

            architect:{icon:"",label:"Architect View",desc:"Showing planning controls, site investigation, and physical features. Financial detail is condensed.",color:"#6d28d9",bg:"#f5f3ff",border:"#ddd6fe",

          const r=cfg[params.roleMode];
          if(!r)return null;
          const tabHidden=!r.tabs.includes(tab);
          return(
            <div style={{background:r.bg,border:`1px solid ${r.border}`,borderRadius:8,padding:"8px 14px",marginBottom:12,fontFamily:sans,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>

                Switch to Developer view

        const renderTab=()=>{
          const banner=renderRoleBanner();
          const wrap=(content)=>banner?<>{banner}{content}</>:content;
          switch(tab){
            case"finder":    return wrap(renderFinder());
            case"site":      return wrap(renderSite());
            case"plan":      return wrap(renderPlan());
            case"siteinv":   return wrap(renderSiteInv());
            case"melb":      return wrap(renderMelb());
            case"market":    return wrap(renderMarket());
            case"physical":  return wrap(renderPhysical());
            case"finance":   return wrap(renderFinance());

        return(

                    fontFamily:sans,fontSize:13,color:"#1a202c",lineHeight:1.5,

                    {t.msg}
                  </div>

              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}

                    background:gateModal.type==="danger"?"#fee2e2":"#fffbea",
                    borderBottom:`1px solid ${gateModal.type==="danger"?"#fca5a5":"#fcd34d"}`,

                  }}>
                    <span style={{fontSize:20}}>{gateModal.type==="danger"?"":""}</span>
                    <div>
                      <div style={{fontFamily:sans,fontWeight:700,fontSize:15,color:"#1a202c"}}>{gateModal.label}</div>
                      <div style={{fontFamily:sans,fontSize:12,color:"#6b7280",marginTop:2}}>
                        {gateModal.type==="danger"?"Destructive action  cannot be undone":"Low confidence detected  verification recommended before external use"}
                      </div>
                    </div>
                  </div>
                  {/* Modal body */}
                  <div style={{padding:"16px 20px"}}>
                    {gateModal.type==="danger"?(
                      <p style={{fontFamily:sans,fontSize:13,color:"#374151",margin:0,lineHeight:1.6}}>{gateModal.msg}</p>
                    ):(
                      <table style={{width:"100%",borderCollapse:"collapse",fontFamily:sans,fontSize:12}}>
                        <thead>
                          <tr style={{background:"#f9fafb"}}>
                            {["Metric","Score","Band"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#6b7280",fontWeight:600,borderBottom:"1px solid #e5e7eb"}}>{h}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {(gateModal.low||[]).map(r=>{const b=scoreToBand(r.score);return(
                            <tr key={r.metric} style={{borderBottom:"1px solid #f3f4f6"}}>
                              <td style={{padding:"6px 10px",color:"#374151",fontWeight:500}}>{r.metric}</td>
                              <td style={{padding:"6px 10px",fontFamily:mono}}>{r.score}/100</td>
                              <td style={{padding:"6px 10px"}}>
                                <span style={{background:b.bg,color:b.color,fontWeight:700,padding:"2px 8px",borderRadius:12,fontSize:11}}>{b.icon} {b.band}</span>
                              </td>
                            </tr>
                          );})}
                        </tbody>
                      </table>
                    )}

                  {/* Modal footer */}
                  <div style={{padding:"12px 20px",borderTop:"1px solid #e5e7eb",display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button onClick={()=>setGateModal(null)}
                      style={{background:"#fff",color:"#6b7280",border:"1px solid #d1d5db",fontFamily:sans,fontSize:13,fontWeight:600,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>
                      Cancel
                    </button>
                    <button onClick={gateModal.onProceed}
                      style={{background:gateModal.type==="danger"?"#dc2626":"#f59e0b",color:"#fff",border:"none",fontFamily:sans,fontSize:13,fontWeight:700,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>
                      {gateModal.type==="danger"?"Delete everything":"Proceed anyway"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* P1-1: Waiver Request Modal  state lives at top level (Rules of Hooks) */}
            {waiverForm&&(()=>{
              const submit=()=>{
                if(!wReason.trim()){addToast(" Please enter a waiver reason","warn");return;}
                const now=new Date();
                const expires=new Date(now.getTime()+parseInt(wDays||"30")*86400000);
                persistWaivers([...waivers.filter(w=>w.gateId!==waiverForm.gateId),
                  {gateId:waiverForm.gateId,reason:wReason.trim(),approvedBy:wBy.trim()||"Self",
                   approvedAt:now.toISOString(),expiresAt:expires.toISOString()}]);
                addToast(` Waiver granted for ${parseInt(wDays)} days`,"success");
                setWaiverForm(null);setWReason("");setWBy("");setWDays("30");
              };
              return(
                <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:10001,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
                  onClick={e=>{if(e.target===e.currentTarget){setWaiverForm(null);setWReason("");setWBy("");setWDays("30");}}}>
                  <div style={{background:"#fff",borderRadius:12,width:"100%",maxWidth:460,boxShadow:"0 20px 60px rgba(0,0,0,.3)",fontFamily:sans}}>
                    <div style={{background:"#fffbeb",borderRadius:"12px 12px 0 0",padding:"14px 20px",borderBottom:"1px solid #fcd34d",display:"flex",alignItems:"center",gap:10}}>

                      <div style={{flex:1}}>
                        <div style={{fontWeight:800,fontSize:14,color:"#92400e"}}>Request Gate Waiver</div>

                      </div>
                      <button onClick={()=>{setWaiverForm(null);setWReason("");setWBy("");setWDays("30");}} style={{background:"transparent",border:"none",fontSize:18,cursor:"pointer",color:"#92400e"}}></button>

                    <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:10}}>

                          placeholder="e.g. Legal advice received  covenant removal application lodged, expected to resolve in 3 months"
                          style={{width:"100%",padding:"8px 10px",border:"1.5px solid #fcd34d",borderRadius:6,fontFamily:sans,fontSize:12,resize:"vertical",boxSizing:"border-box"}}/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <div style={{flex:1}}>
                          <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>Approved by</label>
                          <input value={wBy} onChange={e=>setWBy(e.target.value)} placeholder="Name / Role"
                            style={{width:"100%",padding:"7px 10px",border:"1px solid #d1d5db",borderRadius:6,fontFamily:sans,fontSize:12,boxSizing:"border-box"}}/>
                        </div>
                        <div style={{width:90}}>
                          <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>Expires (days)</label>
                          <input type="number" value={wDays} onChange={e=>setWDays(e.target.value)} min="1" max="365" placeholder="30"
                            style={{width:"100%",padding:"7px 10px",border:"1px solid #d1d5db",borderRadius:6,fontFamily:mono,fontSize:12,boxSizing:"border-box"}}/>
                        </div>
                      </div>
                    </div>
                    <div style={{padding:"12px 20px",borderTop:"1px solid #e5e7eb",display:"flex",gap:8,justifyContent:"flex-end"}}>
                      <button onClick={()=>{setWaiverForm(null);setWReason("");setWBy("");setWDays("30");}}
                        style={{background:"#fff",color:"#6b7280",border:"1px solid #d1d5db",fontFamily:sans,fontSize:13,fontWeight:600,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>
                        Cancel

                      <button onClick={submit}
                        style={{background:"#f59e0b",color:"#fff",border:"none",fontFamily:sans,fontSize:13,fontWeight:700,padding:"8px 18px",borderRadius:7,cursor:"pointer"}}>
                         Grant Waiver

                    </div>
                  </div>
                </div>

            })()}

            {/* Header */}
            <div style={{background:`linear-gradient(135deg,${C.ink} 0%,${C.brand} 55%,#008e76 100%)`,padding:`${T.sp.xl}px ${T.sp.xl}px ${T.sp.lg}px`,color:"#fff"}} className="no-print">
              <div style={{maxWidth:990,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:T.sp.sm}}>
                <div>
                  <div style={{fontSize:T.fs.xxs,fontWeight:700,letterSpacing:3,textTransform:"uppercase",opacity:.5,marginBottom:T.sp.xs}}>Melbourne Property Development  Victoria</div>
                  <h1 style={{fontFamily:serif,fontSize:T.fs.xxl,fontWeight:800,margin:`0 0 ${T.sp.xs}px`,letterSpacing:-.8,lineHeight:1.15}}>Land Development Feasibility System</h1>
                  <p style={{fontSize:T.fs.sm,opacity:.65,margin:0,letterSpacing:.1}}>Melbourne Edition v{TOOL_VERSION} Pro  Baseline {BASELINE_DATE}  Smart Address Lookup  Auto Zone Detection  Live CBD Distance  35+ Suburb Database  Auto-Save  Confidence Audit Layer</p>
                </div>

                    {[{mode:true,icon:"",cn:"",title:"Site Explorer Mode  filter suburbs & find sites"},{mode:false,icon:"",cn:"",title:"Analysis Mode  deep-dive on a specific site"}].map(({mode,icon,cn,title})=>(
                      <button key={String(mode)} onClick={()=>{setExplorerMode(mode);if(mode)setTab("finder");}} title={title}
                        style={{border:"none",borderRadius:6,padding:"5px 15px",fontFamily:sans,fontSize:12,fontWeight:800,cursor:"pointer",

                      <button key={r.id} onClick={()=>setParams(p=>({...p,roleMode:r.id}))}
                        style={{border:"none",borderRadius:6,padding:"4px 11px",fontFamily:sans,fontSize:11,fontWeight:700,cursor:"pointer",

                  </div>
                  {savedAt&&<div style={{fontSize:T.fs.xs,opacity:.55,background:"rgba(255,255,255,.1)",padding:`${T.sp.xs}px ${T.sp.sm}px`,borderRadius:T.r.md}}> {savedAt}</div>}
                </div>
              </div>
            </div>

            {/*  ADDRESS SMART SEARCH BAR  */}
            <div style={{background:"#fff",borderBottom:`1px solid ${C.border}`,padding:`${T.sp.sm}px ${T.sp.lg}px`}} className="no-print">
              <div style={{maxWidth:990,margin:"0 auto"}}>
                {/* Input row */}
                <div style={{display:"flex",gap:T.sp.sm,alignItems:"center"}}>
                  <div style={{flex:1,position:"relative"}}>
                    <span style={{position:"absolute",left:T.sp.sm,top:"50%",transform:"translateY(-50%)",fontSize:T.fs.lg,pointerEvents:"none"}}></span>
                    <input
                      value={lookupAddr}
                      onChange={e=>setLookupAddr(e.target.value)}
                      onKeyDown={e=>e.key==="Enter"&&lookupAddress()}
                      placeholder="Enter any Melbourne property address  e.g. &quot;45 Smith St, Box Hill VIC 3128&quot;  press Enter or click Search"
                      style={{width:"100%",height:T.ctrlH,padding:`0 ${T.sp.md}px 0 34px`,border:`1.5px solid ${C.border}`,borderRadius:T.r.lg,fontSize:T.fs.md,fontFamily:sans,color:C.ink,outline:"none",boxSizing:"border-box",background:"#fafbfc",boxShadow:T.sh.xs}}
                      onFocus={e=>e.target.style.borderColor=C.brand}
                      onBlur={e=>e.target.style.borderColor=C.border}
                    />
                  </div>
                  <button
                    onClick={()=>lookupAddress()}
                    disabled={lookupStatus==="loading"||lookupStatus==="geo"||lookupStatus==="plan"}
                    style={{height:T.ctrlH,background:lookupStatus==="loading"||lookupStatus==="plan"?"#aaa":`linear-gradient(135deg,${C.brand},${C.teal})`,color:"#fff",border:"none",borderRadius:T.r.lg,padding:`0 ${T.sp.xl}px`,fontFamily:sans,fontSize:T.fs.md,fontWeight:700,cursor:lookupStatus==="loading"?"not-allowed":"pointer",whiteSpace:"nowrap",flexShrink:0,boxShadow:T.sh.sm}}>
                    {lookupStatus==="loading"?" Geocoding":lookupStatus==="plan"?" Querying planning":" Smart Search"}
                  </button>
                  {lookupResult&&<button onClick={()=>{setLookupResult(null);setLookupStatus("idle");setLookupCandidates([]);}} style={{height:T.ctrlH,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:T.r.lg,padding:`0 ${T.sp.md}px`,cursor:"pointer",fontFamily:sans,fontSize:T.fs.sm}}></button>}
                </div>

                {/* Multiple candidates dropdown */}
                {lookupCandidates.length>1&&lookupStatus==="done"&&(
                  <div style={{marginTop:8,background:"#fff",border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden",boxShadow:"0 4px 12px rgba(0,0,0,.08)"}}>
                    <div style={{padding:"6px 12px",fontSize:11,color:C.muted,fontFamily:sans,background:"#f8f9fa",borderBottom:`1px solid ${C.border}`}}>
                       Multiple matches found  click to select the correct address:
                    </div>
                    {lookupCandidates.map((item,i)=>{
                      /* Format as "18 Greendale Road, Doncaster East VIC 3109" using addressdetails */
                      const a=item.address||{};
                      const houseNum=a.house_number||"";
                      const road=cleanDisplay(a.road||a.street||a.path||"");
                      const locality=cleanDisplay(a.suburb||a.town||a.city_district||a.village||a.municipality||"");
                      const pc=a.postcode||"";
                      const streetPart=[houseNum,road].filter(Boolean).join(" ");
                      const formatted=streetPart?`${streetPart}, ${locality} VIC${pc?" "+pc:""}`:cleanDisplay(item.display_name).split(",").slice(0,4).join(",");
                      return(
                      <div key={i} onClick={()=>selectCandidate(item)}
                        style={{padding:"9px 12px",cursor:"pointer",fontSize:13,fontFamily:sans,color:C.slate,borderBottom:i<lookupCandidates.length-1?`1px solid ${C.border}`:"none",background:i===0?"#f0faf4":"#fff"}}
                        onMouseEnter={e=>{if(e.currentTarget.dataset.active!=="1")e.currentTarget.style.background="#dbeafe"}}
                        onMouseLeave={e=>e.currentTarget.style.background=i===0?"#f0faf4":"#fff"}>
                        <span style={{fontWeight:i===0?700:400,color:i===0?C.brand:C.ink}}>

                        {item.type&&item.type!=="house"&&<span style={{color:C.muted,marginLeft:8,fontSize:11}}>({item.type})</span>}
                      </div>
                      );
                    })}
                  </div>
                )}

                {/* Result panel */}
                {lookupStatus==="done"&&lookupResult&&!lookupResult.msg&&(
                  <div className="fade-in" style={{marginTop:10,background:"#f0fdf9",border:`1px solid ${C.teal}44`,borderRadius:10,padding:"12px 16px"}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"8px 24px",alignItems:"flex-start"}}>

                      {/* Confirmed address */}
                      <div style={{flex:"1 1 260px",minWidth:200}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
                          <div style={{fontSize:11,color:C.muted,fontFamily:sans}}> Confirmed Address</div>
                          <button onClick={()=>{navigator.clipboard?.writeText(site.address||lookupResult.display||"").catch(()=>{});}} style={{fontSize:10,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:4,padding:"1px 8px",cursor:"pointer",fontFamily:sans}}> Copy for VicPlan</button>
                        </div>
                        <div style={{fontSize:13,fontWeight:600,color:C.ink,fontFamily:sans,lineHeight:1.4}}>{cleanDisplay(lookupResult.display).split(",").slice(0,4).join(", ")}</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                          {lookupResult.suburb&&<span>Suburb: <strong>{lookupResult.suburb}</strong>{lookupResult.postcode&&`  ${lookupResult.postcode}`}</span>}

          } catch (runErr) {
            var msg2 = runErr.message || "Unknown error";
            console.error("[FeasMel] runCode error:", runErr);
            /* Purge cache: compiled code is broken, force fresh compile next time */
            try {
              localStorage.removeItem(CACHE_KEY);
            } catch (_) {}
            var errDiv = document.getElementById("loading-msg");
            if (errDiv) {
              errDiv.style.cssText =
                "color:#ef4444;font-size:13px;padding:16px;max-width:560px;text-align:left;line-height:1.6;";
              errDiv.textContent = ""; /* clear first */
              var h = document.createElement("strong");
              h.textContent = " App Load Error";
              errDiv.appendChild(h);
              errDiv.appendChild(document.createTextNode(": " + msg2));
              var br = document.createElement("br");
              errDiv.appendChild(br);
              errDiv.appendChild(document.createElement("br"));
              errDiv.appendChild(document.createTextNode("Cache cleared  "));
              var a = document.createElement("a");
              a.href = "";
              a.style.color = "#60a5fa";
              a.textContent = "Reload to retry";
              errDiv.appendChild(a);
            }
          }
        }

        /* CRITICAL: disable Babel auto-processing before loading Babel */
        function disableBabelAutoProcess() {
          var el = document.getElementById("app-src");
          if (el) el.type = "application/x-jsx"; /* Babel ignores this type */
        }

        /* Main-thread compilation (blocks UI  last resort) */
        function mainThreadCompile(src) {
          setMsg(
            "Compiling JSX on main thread (1530s, browser may briefly freeze)",
          );
          setTimeout(function () {
            try {
              var compiled = Babel.transform(src, { presets: ["react"] }).code;
              try {
                localStorage.setItem(CACHE_KEY, compiled);
              } catch (e) {}
              runCode(compiled);
            } catch (e) {
              setMsg("Compile error: " + e.message);
              console.error(e);
            }
          }, 100);
        }

        /* Load Babel on main thread then compile */
        function loadBabelMainThread(src) {
          disableBabelAutoProcess(); /* MUST happen before Babel script tag is added */
          if (typeof Babel !== "undefined") {
            mainThreadCompile(src);
            return;
          }
          setMsg("Loading Babel compiler (internet required)");
          var bs = document.createElement("script");
          bs.crossOrigin = "anonymous";
          bs.src = BABEL_CDN;
          bs.onload = function () {
            setBar(55);
            mainThreadCompile(src);
          };
          bs.onerror = function () {
            setMsg(
              "Cannot load Babel  check internet connection, then reload.",
            );
          };
          document.head.appendChild(bs);
        }

        /* Web Worker compilation (off-main-thread  preferred)
     Uses fetch+eval instead of importScripts  works from file:// null-origin context
     where importScripts("https://...") is blocked in Chrome 110+ */
        function workerCompile(src, onFail) {
          /*  Architecture: Main-thread fetch  Worker compile 
       ROOT CAUSE of prior failures: Blob Workers have null-origin, so fetch() to
       CDN URLs is blocked by Chrome (110+ increasingly strict, 147 very strict).
       FIX: Main thread fetches Babel (has real origin, CDN CORS allows it).
            Babel source passed to Worker via postMessage  zero network in Worker.
       BONUS: If Worker creation is blocked (some file:// policies), we already have
              babelSrc in hand  install on main page  mainThreadCompile() with no
              second download needed. */
          setMsg("Downloading Babel compiler");
          fetch(BABEL_CDN, { cache: "force-cache" })
            .then(function (r) {
              return r.ok ? r.text() : Promise.reject("HTTP " + r.status);
            })
            .then(function (babelSrc) {
              setMsg("Initialising compilation worker");
              setBar(32);
              /* Worker receives {babelSrc, jsxSrc}  no network requests needed */
              var wCode = [
                "self.onmessage=function(e){",
                "  (function(){",
                "    try{",
                "      /* Babel UMD needs window+document stubs in Worker scope */",
                '      if(typeof window==="undefined"){',
                "        self.window=self;",
                "        self.document={createElement:function(){return{style:{}}},",
                "          createElementNS:function(){return{}},",
                "          head:{appendChild:function(){}},body:{appendChild:function(){}}};",
                "      }",
                '      postMessage({t:"msg",v:"Compiling JSX (UI stays live)"});',
                "      (new Function(e.data.babelSrc))();",
                '      if(typeof Babel==="undefined"||typeof Babel.transform!=="function")',
                '        throw new Error("Babel failed to initialise in Worker");',
                '      var compiled=Babel.transform(e.data.jsxSrc,{presets:["react"]}).code;',
                '      postMessage({t:"done",v:compiled});',
                '    }catch(err){postMessage({t:"err",v:err.message});}',
                "  })();",
                "};",
              ].join("\n");
              var blob = new Blob([wCode], { type: "application/javascript" });
              var url = URL.createObjectURL(blob);
              var w,
                done = false;
              try {
                w = new Worker(url);
              } catch (e) {
                /* Worker blocked (file:// policy)  install Babel from already-fetched src */
                URL.revokeObjectURL(url);
                setMsg("Worker unavailable  compiling on main thread");
                disableBabelAutoProcess();
                try {
                  new Function(babelSrc)();
                } catch (_be) {}
                if (
                  typeof Babel !== "undefined" &&
                  typeof Babel.transform === "function"
                ) {
                  mainThreadCompile(src);
                } else {
                  onFail();
                }
                return;
              }
              var timer = setTimeout(function () {
                if (done) return;
                done = true;
                w.terminate();
                URL.revokeObjectURL(url);
                setMsg("Worker timed out  switching to main thread");
                disableBabelAutoProcess();
                try {
                  new Function(babelSrc)();
                } catch (_be) {}
                if (typeof Babel !== "undefined") {
                  mainThreadCompile(src);
                } else {
                  onFail();
                }
              }, 120000); /* 2 min: Worker only compiles, no download needed */
              w.onmessage = function (e) {
                if (done) return;
                var d = e.data;
                if (d.t === "msg") {
                  setMsg(d.v);
                  setBar(55);
                  return;
                }
                done = true;
                clearTimeout(timer);
                w.terminate();
                URL.revokeObjectURL(url);
                if (d.t === "done") {
                  try {
                    localStorage.setItem(CACHE_KEY, d.v);
                  } catch (_le) {}
                  runCode(d.v);
                } else {
                  setMsg(
                    "Worker compile error (" +
                      d.v +
                      ")  falling back to main thread",
                  );
                  disableBabelAutoProcess();
                  try {
                    new Function(babelSrc)();
                  } catch (_be) {}
                  if (typeof Babel !== "undefined") {
                    mainThreadCompile(src);
                  } else {
                    onFail();
                  }
                }
              };
              w.onerror = function () {
                if (done) return;
                done = true;
                clearTimeout(timer);
                w.terminate();
                URL.revokeObjectURL(url);
                setMsg("Worker error  falling back to main thread");
                disableBabelAutoProcess();
                try {
                  new Function(babelSrc)();
                } catch (_be) {}
                if (typeof Babel !== "undefined") {
                  mainThreadCompile(src);
                } else {
                  onFail();
                }
              };
              setBar(42);
              w.postMessage({ babelSrc: babelSrc, jsxSrc: src });
            })
            .catch(function (fetchErr) {
              /* fetch() itself failed (no internet, or CDN down) */
              setMsg(
                "Cannot reach Babel CDN (" +
                  fetchErr +
                  ")  trying importScripts fallback",
              );
              onFail(); /* loadBabelMainThread will try script tag as last resort */
            });
        }

        /* Main entry point */
        function start() {
          /* 1. Try localStorage cache (instant)  with integrity check */
          try {
            var cached = localStorage.getItem(CACHE_KEY);
            /* Validate: must be real compiled React output (not truncated/corrupted download) */
            var cacheValid =
              cached &&
              cached.length > 50000 &&
              cached.includes("React.createElement") &&
              cached.includes("useState");
            if (cacheValid) {
              setMsg("Loading from cache");
              setBar(88, true);
              runCode(cached);
              return;
            } else if (cached) {
              /* Corrupt/incomplete cache  purge it so next step recompiles */
              localStorage.removeItem(CACHE_KEY);
              setMsg("Cache invalid  recompiling");
            }
          } catch (e) {}

          /* 2. Compile fresh */
          setBar(22);
          var src = document.getElementById("app-src").textContent || "";
          if (src.trim().length < 1000) {
            setMsg("Error: JSX source not found in page.");
            return;
          }
          setBar(28);
          /* Try Worker first; fall back to main thread */
          workerCompile(src, function () {
            loadBabelMainThread(src);
          });
        }

        /*  Dependency integrity check  */
        function checkDeps() {
          var deps = [
            { name: "React", ok: typeof window.React !== "undefined" },
            { name: "ReactDOM", ok: typeof window.ReactDOM !== "undefined" },
            { name: "Turf.js", ok: typeof window.turf !== "undefined" },
            { name: "Leaflet", ok: typeof window.L !== "undefined" },
          ];
          var failed = deps.filter(function (d) {
            return !d.ok;
          });
          if (failed.length > 0) {
            var names = failed
              .map(function (d) {
                return d.name;
              })
              .join(", ");
            console.warn(
              "[FeasMel] Dependency check: NOT loaded: " +
                names +
                "  some features will be degraded. Check internet connection.",
            );
            /* Non-fatal: app continues but may have limited map/geospatial functionality */
          }
        }

        /* Fire after 2 rAFs so splash definitely paints first */
        function kickoff() {
          checkDeps();
          requestAnimationFrame(function () {
            requestAnimationFrame(start);
          });
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", kickoff);
        } else {
          kickoff();
        }
      })();
    </script>
  </body>
</html>
