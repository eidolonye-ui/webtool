              <Row>
                <Input label="Open Space Contribution" value={fin.openSpaceContrib} onChange={uF("openSpaceContrib")} placeholder={String(autoOS||"")} suffix="$" hint={`Council reference: ${fmt(autoOS)} (5% of land)  verify council DCP rate`}/>
                <Input label="Infrastructure Contribution" value={fin.infraContrib} onChange={uF("infraContrib")} placeholder="0" suffix="$" hint="Established suburbs $0  Growth area DCP: $8K$30K per dwelling"/>
                {/* #34 : Developer/PM Fee  commonly omitted, 2-4% of TDC */}
                <Input label="Developer / PM Fee" value={fin.devFee} onChange={uF("devFee")}
                  placeholder={(()=>{const t=calc.total;return t>0?String(Math.round(t*0.025)):"0";})()}
                  suffix="$" hint={(()=>{const t=calc.total;return t>0?`2.5% of TDC = ${fmt(Math.round(t*0.025))}  Covers developer overhead, project management time (24% typical)`:"Developer's own overhead & project management (24% of TDC). Required if you are managing the project.";})()}/>
              </Row>
              {/*  Due Diligence & Compliance Costs  */}
              <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",margin:"8px 0",fontFamily:sans,fontSize:12,color:"#166534",fontWeight:700}}>
                 Due Diligence &amp; Compliance
              </div>
              <Row>
                <Input label="Phase 1 ESA" value={fin.phase1ESA} onChange={uF("phase1ESA")} placeholder="6000" suffix="$"
                  hint="Environmental Site Assessment  required for any site with prior industrial/commercial use. Typical cost $5K$8K. Phase 2 (intrusive) $15K$40K if contamination suspected."/>
                <Input label="Plan of Subdivision" value={fin.planOfSubdiv} onChange={uF("planOfSubdiv")} placeholder="12000" suffix="$"
                  hint="Titles Victoria lodgement fees + licensed surveyor + service authority (water/power/gas) connection notices. Typically $10K$25K for 36 lot subdivision."/>
              </Row>
              <Row>
                {/* Absentee Owner + Trust Surcharge  auto-calc or manual override */}
                <div style={{gridColumn:"1/-1"}}>
                  <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"12px 14px",fontFamily:sans}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#5b21b6",marginBottom:8}}> VIC SRO Surcharges (on top of standard land tax)</div>
                    <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:10}}>
                      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:C.slate}}>
                        <input type="checkbox" checked={!!conds.absenteeOwnerAuto} onChange={e=>uCond("absenteeOwnerAuto")(e.target.checked)} style={{accentColor:"#7c3aed"}}/>
                        <strong>Absentee Owner Surcharge</strong>  2% p.a. of site value (non-Australian resident/company)
                        {conds.absenteeOwnerAuto&&calc.autoAbsenteePS>0&&<span style={{marginLeft:6,fontFamily:mono,fontWeight:700,color:"#7c3aed"}}> {fmt(calc.autoAbsenteePS)} auto-added</span>}
                      </label>
                      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:C.slate}}>
                        <input type="checkbox" checked={!!conds.trustHolderAuto} onChange={e=>uCond("trustHolderAuto")(e.target.checked)} style={{accentColor:"#7c3aed"}}/>
                        <strong>Trust Surcharge</strong>  0.5% p.a. of site value (trusts not eligible for PPR exemption)
                        {conds.trustHolderAuto&&calc.autoTrustPS>0&&<span style={{marginLeft:6,fontFamily:mono,fontWeight:700,color:"#7c3aed"}}> {fmt(calc.autoTrustPS)} auto-added</span>}
                      </label>
                    </div>
                    {(!conds.absenteeOwnerAuto&&!conds.trustHolderAuto)&&(
                      <Input label="Manual Absentee/Trust Surcharge (override)" value={fin.absenteeOwner} onChange={uF("absenteeOwner")} placeholder="0" suffix="$"
                        hint="Enter a fixed dollar amount if known. Or tick the checkboxes above for auto-calculation from land price  rate  holding years."/>
                    )}
                    {(conds.absenteeOwnerAuto||conds.trustHolderAuto)&&(
                      <div style={{fontSize:11,color:"#5b21b6",background:"#ede9fe",borderRadius:5,padding:"6px 10px"}}>
                        Total auto-surcharge: <strong>{fmt((calc.autoAbsenteePS||0)+(calc.autoTrustPS||0))}</strong>
                        &nbsp;({[conds.absenteeOwnerAuto&&`${(parseNum(fin.landPrice)*0.02*(parseNum(str.projectMonths)||24)/12/1000).toFixed(0)}K@2%`,conds.trustHolderAuto&&`${(parseNum(fin.landPrice)*0.005*(parseNum(str.projectMonths)||24)/12/1000).toFixed(0)}K@0.5%`].filter(Boolean).join(" + ")})
                        &nbsp; added to Soft Costs. Source: SRO VIC 2024-25. Verify with registered tax agent.
                      </div>
                    )}
                  </div>
                </div>
                <div style={{padding:"4px 0",fontFamily:sans,fontSize:11,color:C.muted}}>
                  {plan.hasAboriginal&&(
                    <div style={{background:"#fefce8",border:"1px solid #fde047",borderRadius:6,padding:"8px 10px",color:"#713f12",fontWeight:600}}>
                       CHMP Provisional Sum: <strong style={{color:C.purple}}>{fmt(calc.chmpPS||12000)}</strong> auto-injected into soft costs<br/>
                      <span style={{fontWeight:400,fontSize:10}}>Cultural Heritage Management Plan required (Aboriginal overlay active). Budget $5K$30K. Mid-estimate ${(calc.chmpPS||12000).toLocaleString()} used. Enter actual in Consultant Fees to override.</span>
                    </div>
                  )}
                </div>
              </Row>
              {autoOS>0&&<button onClick={()=>uF("openSpaceContrib")(String(autoOS))} style={{border:"none",background:C.orange,color:"#fff",fontFamily:sans,fontSize:11,fontWeight:600,padding:"5px 12px",borderRadius:6,cursor:"pointer",marginBottom:8}}> Auto-fill Open Space Estimate</button>}
              <div style={{textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:700,color:C.orange}}>Soft cost subtotal: {fmt(calc.soft)}</div>
            </Card>

            <Card title=" Site Conditions  Provisional Sums" accent={C.orange}>
              <div style={{background:"#fff7ed",border:`1px solid ${C.orange}22`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontFamily:sans,fontSize:12,color:"#92400e"}}>
                Auto-injects provisional sums into Hard Costs based on site conditions. These are mandatory budget reserves  not optional.
                {siteInv?.elev&&!siteInv.elev.error&&<span style={{marginLeft:8,color:C.brand,fontWeight:600}}>SRTM data: slope {siteInv.elev.maxSlope?.toFixed(1)}%  auto-detected as <strong>{conds.slopeClass==="auto"?(siteInv.elev.maxSlope>=10?"Steep":siteInv.elev.maxSlope>=5?"Moderate":"Flat"):"manual override"}</strong></span>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.slate,fontFamily:sans,display:"block",marginBottom:6}}>Soil Class (Provisional Sums)</label>
                  <select value={conds.soilClass} onChange={e=>uCond("soilClass")(e.target.value)} style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontFamily:sans,fontSize:12,background:"#fff"}}>
                    <option value="">Unknown  budget contingency separately</option>
                    <option value="M">Class M  Medium reactivity (+$15,000 provisional)</option>
                    <option value="H">Class H  High reactivity (+$40,000 provisional)</option>
                    <option value="P">Class P  Problem soil / piling likely (+$80,000 provisional)</option>
                  </select>
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.slate,fontFamily:sans,display:"block",marginBottom:6}}>Slope / Site Works Class</label>
                  <select value={conds.slopeClass} onChange={e=>uCond("slopeClass")(e.target.value)} style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontFamily:sans,fontSize:12,background:"#fff"}}>
                    <option value="auto">Auto from SRTM terrain data{siteInv?.elev&&!siteInv.elev.error?` (${siteInv.elev.maxSlope?.toFixed(1)}% detected)`:""}</option>
                    <option value="flat">Flat (&lt;2% / &lt;1m fall)  $0 additional</option>
                    <option value="moderate">Moderate (510% / 13m fall)  +$30,000</option>
                    <option value="steep">Steep (&gt;10% / &gt;3m fall)  +$70,000</option>
                  </select>
                </div>
              </div>
              {/* Rock Excavation  separate row below soil/slope */}
              <div style={{marginBottom:12}}>
                <label style={{fontSize:12,fontWeight:600,color:C.slate,fontFamily:sans,display:"block",marginBottom:6}}>
                   Rock Excavation Grade
                  <span style={{fontWeight:400,color:C.muted,marginLeft:8,fontSize:11}}>Common in Melbourne's north/east  Heidelberg, Donvale, Templestowe, Eltham, Research</span>
                </label>
                <select value={conds.rockGrade} onChange={e=>uCond("rockGrade")(e.target.value)}
                  style={{width:"100%",padding:"8px 10px",border:`1.5px solid ${conds.rockGrade?"#dc2626":C.border}`,borderRadius:6,fontFamily:sans,fontSize:12,background:"#fff",color:conds.rockGrade?"#991b1b":"inherit"}}>
                  <option value="">Not assessed / not applicable  no rock provisional</option>
                  <option value="R1">R1  Occasional rock fragments (sandstone / scattered basalt)  +$25,000 Hard Cost provisional</option>
                  <option value="R2">R2  Significant rock seam / prevalent basalt (Heidelberg, Templestowe)  +$65,000 Hard Cost provisional</option>
                  <option value="R3">R3  Massive rock, blasting may be required (Eltham, Research, upper Yarra)  +$120,000 Hard Cost provisional</option>
                </select>
                {conds.rockGrade&&(
                  <div style={{marginTop:6,padding:"6px 12px",background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:5,fontFamily:sans,fontSize:11,color:"#991b1b",display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{fontSize:14,flexShrink:0}}></span>
                    <span>
                      Rock grade <strong>{conds.rockGrade}</strong>  ${({R1:25000,R2:65000,R3:120000}[conds.rockGrade]||0).toLocaleString()} provisional added to Hard Costs.
                      {conds.rockGrade==="R3"&&" Blasting permits + vibration monitoring required  allow 46 extra weeks."}
                      {" "}Confirm with a geotechnical report before committing.
                    </span>
                  </div>
                )}
              </div>
              {/*  BUSHFIRE BAL RATING (#62)  */}
              {conds.bushfireProne&&(
                <div style={{marginBottom:12,background:"#fff7ed",border:"1.5px solid #f97316",borderRadius:8,padding:"12px 14px"}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#92400e",fontFamily:sans,display:"block",marginBottom:6}}>
                     BAL Rating (Bushfire Attack Level)
                    <span style={{fontWeight:400,color:C.muted,marginLeft:8,fontSize:11}}>Required for bushfire-prone sites  triggers BAL compliance cost in Hard Costs</span>
                  </label>
                  <select value={conds.balRating} onChange={e=>uCond("balRating")(e.target.value)}
                    style={{width:"100%",padding:"8px 10px",border:`1.5px solid ${conds.balRating?"#f97316":C.border}`,borderRadius:6,fontFamily:sans,fontSize:12,background:"#fff"}}>
                    <option value="">Not assessed  default BAL-29 provisional ($18,000) used</option>
                    <option value="BAL-12">BAL-12  Low risk zone (ember protection only)  $0 additional</option>
                    <option value="BAL-19">BAL-19  Moderate risk (ember + radiant heat 19kW/m)  +$12,000</option>
                    <option value="BAL-29">BAL-29  High risk (radiant heat 29kW/m, spec windows)  +$22,000</option>
                    <option value="BAL-40">BAL-40  Very high risk (non-combustible construction)  +$38,000</option>
                    <option value="FZ">FZ  Flame Zone (extreme  full non-combustible + fire-resistant glass)  +$65,000</option>
                  </select>
                  {conds.balRating&&(
                    <div style={{marginTop:6,padding:"6px 12px",background:"#fff7ed",borderRadius:5,fontFamily:sans,fontSize:11,color:"#92400e",display:"flex",gap:8,alignItems:"flex-start"}}>
                      <span style={{fontSize:14,flexShrink:0}}></span>
                      <span>
                        BAL Rating <strong>{conds.balRating}</strong>  <strong style={{color:"#dc2626"}}>{fmt(calc.balPS||0)}</strong> added to Hard Costs.
                        {conds.balRating==="FZ"&&" Flame Zone is the highest BAL rating  confirm with a BAL Assessor before proceeding."}
                        {conds.balRating==="BAL-12"&&" Low risk  only standard ember protection required. No additional hard cost."}
                      </span>
                    </div>
                  )}
                  {!conds.balRating&&(
                    <div style={{marginTop:5,fontSize:10,color:"#92400e",fontFamily:sans,opacity:0.8}}>
                       BAL rating not set  using BAL-29 provisional ($18,000) as conservative default. Obtain a BAL Assessment Report from a registered assessor.
                    </div>
                  )}
                </div>
              )}
              {/*  CAR PARKING (#64)  */}
              <div style={{marginBottom:12,background:"#f0f7ff",border:`1px solid ${C.brand}22`,borderRadius:8,padding:"12px 14px"}}>
                <div style={{fontSize:12,fontWeight:700,color:C.brand,fontFamily:sans,marginBottom:8}}> Car Parking  Type &amp; Cost Auto-Injection</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:C.slate,fontFamily:sans,display:"block",marginBottom:5}}>Parking Structure Type</label>
                    <select value={conds.parkingType} onChange={e=>uCond("parkingType")(e.target.value)}
                      style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontFamily:sans,fontSize:12,background:"#fff"}}>
                      <option value="on-grade">On-grade (surface)  $10,000/space</option>
                      <option value="semi-basement">Semi-basement  $45,000/space</option>
                      <option value="full-basement">Full basement  $72,000/space</option>
                    </select>
                    <div style={{fontSize:10,color:C.muted,marginTop:3,fontFamily:sans}}>
                      On-grade: flat site, no excavation  Semi-basement: 11.5m below NGL  Full basement: 2m+ excavation
                    </div>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,color:C.slate,fontFamily:sans,display:"block",marginBottom:5}}>Number of Parking Spaces</label>
                    <input type="number" value={conds.parkingSpaces} onChange={e=>uCond("parkingSpaces")(e.target.value)}
                      placeholder={String(parseNum(plan.estUnits)||2)} min="0" max="100"
                      style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontFamily:mono,fontSize:13,fontWeight:600,boxSizing:"border-box"}}/>
                    <div style={{fontSize:10,color:C.muted,marginTop:3,fontFamily:sans}}>ResCode: 1 space/dwelling (GRZ/RGZ)  DDO may require 2/dwelling for >3-bed</div>
                  </div>
                </div>
                {(calc.parkingPS||0)>0&&(
                  <div style={{marginTop:8,padding:"8px 12px",background:"#fff",borderRadius:6,border:`1px solid ${C.brand}22`,fontFamily:sans,fontSize:12,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
                    <span> <strong>{calc.parkingSpaces} spaces</strong>  {conds.parkingType}</span>
                    <span style={{color:C.brand,fontWeight:700}}>= {fmt(calc.parkingPS)} Hard Cost</span>
                    <span style={{fontSize:10,color:C.muted}}>({fmt({["on-grade"]:10000,["semi-basement"]:45000,["full-basement"]:72000}[conds.parkingType]||10000)}/space)</span>
                  </div>
                )}
                {!(calc.parkingPS>0)&&(
                  <div style={{marginTop:6,fontSize:10,color:C.muted,fontFamily:sans}}>Enter parking spaces above to auto-inject into Hard Costs.</div>
                )}
              </div>
              {/*  FIRB FEE DISPLAY (#66)  */}
              {fin.isForeign&&(
                <div style={{marginBottom:12,background:"#fdf4ff",border:"1.5px solid #d946ef",borderRadius:8,padding:"12px 14px"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#7e22ce",fontFamily:sans,marginBottom:6}}> FIRB Application Fee  Foreign Investor</div>
                  <div style={{fontSize:12,fontFamily:sans,color:C.slate,lineHeight:1.7}}>
                    {(()=>{
                      const lp=parseNum(fin.landPrice);
                      if(!lp)return <span style={{color:C.muted}}>Enter land price in the Land Acquisition section to calculate FIRB fee.</span>;
                      const tier=lp<=75000?"$75K: $4,200":lp<=1000000?"$1M: $14,100":lp<=2000000?"$1M$2M: $28,200":lp<=3000000?"$2M$3M: $56,400":lp<=4000000?"$3M$4M: $84,600":lp<=5000000?"$4M$5M: $112,800":">$5M: $112,800+";
                      return(<>
                        Land price <strong>{fmt(lp)}</strong>  FIRB fee: <strong style={{color:"#7e22ce",fontSize:14}}>{fmt(calc.firbFee||0)}</strong>
                        <br/><span style={{fontSize:11,color:C.muted}}>Bracket: {tier} (FIRB 2024-25 flat fee per price tier, source: firb.gov.au).
                        Added automatically to Soft Costs. Obtain FIRB approval before exchange of contracts.</span>
                      </>);
                    })()}
                  </div>
                  {(calc.firbFee||0)>0&&(
                    <div style={{marginTop:8,display:"flex",gap:10,flexWrap:"wrap",fontSize:11,fontFamily:sans,color:"#7e22ce"}}>
                      <span style={{background:"#fae8ff",padding:"3px 10px",borderRadius:6,fontWeight:600}}> Auto-injected into Soft Costs</span>
                      <span style={{background:"#f3e8ff",padding:"3px 10px",borderRadius:6}}>FIRB 202526 residential schedule</span>
                      <a href="https://firb.gov.au/fees" target="_blank" rel="noopener noreferrer" style={{padding:"3px 10px",borderRadius:6,background:"#ede9fe",color:"#5b21b6",textDecoration:"none",fontWeight:600}}>firb.gov.au/fees </a>
                    </div>
                  )}
                </div>
              )}
              {(calc.soilPS>0||calc.slopePS>0||calc.rockPS>0||calc.boePS>0||calc.adjSoftPS>0||calc.habWindowPS>0||calc.powerLinePS>0||calc.treeReportPS>0||calc.vcatPS>0||calc.drainageSinkPS>0||calc.councilRulesPS>0||calc.growthLevyPS>0||calc.balPS>0||calc.parkingPS>0)&&(
                <div style={{background:"#f8f9fa",borderRadius:8,padding:"10px 14px",fontFamily:sans}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.slate,marginBottom:8}}>Auto-Injected Provisional Sums (included in TDC)</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 16px",fontSize:12,color:C.slate}}>
                    {calc.soilPS>0&&<div> Soil (Class {conds.soilClass}): <strong style={{color:C.orange}}>{fmt(calc.soilPS)}</strong></div>}
                    {calc.slopePS>0&&<div> Slope/Retaining ({calc.slopeClass}, {calc.maxSlopeVal?.toFixed(1)}%): <strong style={{color:C.orange}}>{fmt(calc.slopePS)}</strong> <span style={{fontSize:10,color:C.muted}}>${calc.SLOPE_RATE}/m  {calc.SLOPE_COMPLEXITY} complexity  soil {calc.SOIL_FACTOR} {calc.maxSlopeVal>10?<span style={{color:C.warn}}> Exponential rate (>10% slope)</span>:null}</span></div>}
                    {calc.rockPS>0&&<div style={{color:"#dc2626",gridColumn:"1/-1"}}> Rock Excavation (Grade {conds.rockGrade}): <strong style={{color:"#dc2626"}}>{fmt(calc.rockPS)}</strong> <span style={{fontSize:10,color:C.muted}}>Hard Cost provisional  confirm with geotechnical report</span></div>}
                    {(calc.contourStructuralPS||0)>0&&<div style={{color:"#7c3aed",gridColumn:"1/-1"}}> Structural Engineer  Retaining Design (survey range {site.contourRange}m): <strong style={{color:"#7c3aed"}}>{fmt(calc.contourStructuralPS)}</strong> <span style={{fontSize:10,color:C.muted}}>Soft Cost  reg. Building Regulations 2018 cl.152 (walls &gt;1m)</span></div>}
                    {calc.balPS>0&&<div style={{color:"#92400e"}}> BAL Compliance ({calc.balRatingKey||"BAL-29 default"}): <strong style={{color:"#dc2626"}}>{fmt(calc.balPS)}</strong> <span style={{fontSize:10,color:C.muted}}> Hard Cost</span></div>}
                    {calc.parkingPS>0&&<div style={{color:C.blue}}> Parking ({calc.parkingSpaces}  {conds.parkingType}): <strong style={{color:C.blue}}>{fmt(calc.parkingPS)}</strong> <span style={{fontSize:10,color:C.muted}}> Hard Cost</span></div>}
                  {(calc.buildPermitLevy||0)>0&&<div style={{color:C.slate}}> Building Permit Levy (0.141% of build cost): <strong style={{color:C.slate}}>{fmt(calc.buildPermitLevy)}</strong> <span style={{fontSize:10,color:C.muted}}> Hard Cost</span></div>}
                  {(calc.reSurveyPS||0)>0&&<div style={{color:C.purple}}> Re-establishment Survey PS: <strong style={{color:C.purple}}>{fmt(calc.reSurveyPS)}</strong> <span style={{fontSize:10,color:C.muted}}> Soft Cost (enter actual in Survey Fees to override)</span></div>}
                  {(calc.autoAbsenteePS||0)+(calc.autoTrustPS||0)>0&&<div style={{color:"#7c3aed"}}> VIC Surcharges (auto): <strong style={{color:"#7c3aed"}}>{fmt((calc.autoAbsenteePS||0)+(calc.autoTrustPS||0))}</strong> <span style={{fontSize:10,color:C.muted}}> Soft Cost</span></div>}
                    {calc.boePS>0&&<div> BOE/Report &amp; Consent: <strong style={{color:C.orange}}>{fmt(calc.boePS)}</strong></div>}
                    {calc.adjSoftPS>0&&<div> Overlooking (planner): <strong style={{color:C.orange}}>{fmt(calc.adjSoftPS)}</strong></div>}
                    {calc.habWindowPS>0&&<div> Privacy screens ({conds.habWindowCount||1} window(s)): <strong style={{color:C.orange}}>{fmt(calc.habWindowPS)}</strong></div>}
                    {calc.powerLinePS>0&&<div style={{color:"#dc2626"}}> Undergrounding est. ({calc.osmLineCount} line seg.): <strong style={{color:"#dc2626"}}>{fmt(calc.powerLinePS)}</strong> <span style={{fontSize:10,color:C.muted}}>OSM auto-detected  Hard Cost</span></div>}
                    {calc.treeReportPS>0&&<div style={{color:"#15803d"}}> Arborist report ({calc.osmTreeCount} nature strip tree{calc.osmTreeCount!==1?"s":""}): <strong style={{color:"#15803d"}}>{fmt(calc.treeReportPS)}</strong> <span style={{fontSize:10,color:C.muted}}>OSM auto-detected  Soft Cost</span></div>}
                    {calc.vcatPS>0&&<div style={{color:C.purple}}> VCAT Contingency (HO + VPO): <strong style={{color:C.purple}}>{fmt(calc.vcatPS)}</strong> <span style={{fontSize:10,color:C.muted}}>High friction overlay combination  Soft Cost</span></div>}
                    {(calc.chmpPS||0)>0&&<div style={{color:"#92400e"}}> CHMP (Aboriginal Heritage): <strong style={{color:"#92400e"}}>{fmt(calc.chmpPS)}</strong> <span style={{fontSize:10,color:C.muted}}>Cultural Heritage overlay active  Soft Cost</span></div>}
                    {calc.drainageSinkPS>0&&<div style={{color:C.blue}}> Drainage Sink / Pump Pit: <strong style={{color:C.blue}}>{fmt(calc.drainageSinkPS)}</strong> <span style={{fontSize:10,color:C.muted}}>SRTM: lot centre {((siteInv?.elev?.elevs?.[0]||0)-((siteInv?.elev?.elevs?.[1]||0)+(siteInv?.elev?.elevs?.[2]||0)+(siteInv?.elev?.elevs?.[3]||0)+(siteInv?.elev?.elevs?.[4]||0))/4).toFixed(2)}m below surrounds  charged stormwater required  Hard Cost</span></div>}
                    {calc.councilRulesPS>0&&<div style={{color:C.teal}}> {calc.councilNameCalc} Schedule: <strong style={{color:C.teal}}>{fmt(calc.councilRulesPS)}</strong> <span style={{fontSize:10,color:C.muted}}>Council-specific landscaping/assessment  Soft Cost</span></div>}

                          if(!lp||lp<=300000)return 0;
                          /* SRO VIC 2024-25 progressive rates */
                          if(lp<=600000)  return Math.round(375+(lp-300000)*0.001);
                          if(lp<=1000000) return Math.round(675+(lp-600000)*0.0025);
                          if(lp<=1800000) return Math.round(1675+(lp-1000000)*0.0075);
                          if(lp<=3000000) return Math.round(7675+(lp-1800000)*0.01);
                          return Math.round(19675+(lp-3000000)*0.015);
                        })();

                      {fin.landTaxHold&&parseNum(fin.landTaxHold)>0

                  <Input label="Council Rates" value={fin.councilRatesHold} onChange={uF("councilRatesHold")} placeholder={(()=>{const months=parseNum(str.loanTermMonths)||18;return String(Math.round(2200*months/12));})()}
                    suffix="$" hint={(()=>{const months=parseNum(str.loanTermMonths)||18;return`Melbourne metropolitan avg ~$2,200/yr. Est. for ${months}mo: ${fmt(Math.round(2200*months/12))}.`;})()}/>
                  <Input label="Contract Works Insurance" value={fin.cwInsurance} onChange={uF("cwInsurance")} placeholder={(()=>{const h=parseNum(fin.buildCostPSM)*parseNum(fin.buildArea)||0;return h>0?String(Math.round(h*0.004)):"";})()}

                        {["Scenario","GRV","Total Cost","Profit","on Cost","on GRV"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"center",fontWeight:600,borderBottom:`2px solid ${C.purple}`,fontSize:12}}>{h}</th>)}

                        <div style={{fontSize:10,color:C.muted}}>Bridging cost estimate</div>

                    {/* Sensitivity: 50% slower scenario */}
                    {ac.slowExtMonths>0&&(
                      <div style={{background:"rgba(0,0,0,.05)",borderRadius:6,padding:"8px 12px",fontSize:11,color:C.slate}}>

                  <StatBox label="Senior Debt" value={fmt(finStruct.seniorDebt)} color={C.blue} sub={finStruct.debtConstraint||`LVR ${str.lvrPct}%`}/>
                  <StatBox label="Equity Required"   value={fmt(finStruct.equityRequired)} color={C.warn}/>

                  <StatBox label="Ann. Return on Equity"   value={finStruct.irr!=null?pct(finStruct.irr):""} color={finStruct.irr>=20?C.accent:finStruct.irr>=15?C.gold:C.warn} sub={`${str.projectMonths} months  two-cashflow model`}/>

                    <div style={{fontSize:11,color:C.muted}}>Verify with registered tax adviser</div>

                {fin.applyGSTMargin&&finStruct.gstNetProfit!=null&&(
                  <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>

                      <div style={{fontSize:16,fontWeight:800,fontFamily:mono,color:C.ink}}>{fmt(calc.profit)}</div>

                    <div style={{background:"#fff0ed",borderRadius:8,padding:"12px",border:`1px solid ${C.warn}33`}}>

                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,fontFamily:mono,marginBottom:4}}>
                        <span style={{color:C.muted}}>Gross Profit</span><span>{fmt(calc.profit)}</span>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,fontFamily:mono,marginBottom:4}}>
                        <span style={{color:C.muted}}>GST (GRV  11)</span><span style={{color:C.warn}}>{fmt(finStruct.standard)}</span>

                      <div style={{height:1,background:C.border,margin:"6px 0"}}/>

                        <span style={{color:(calc.profit-finStruct.standard)>=0?C.ink:C.warn}}>{fmt(calc.profit-finStruct.standard)}</span>

                      {calc.total>0&&<div style={{fontSize:10,color:C.muted,marginTop:4}}>{pct((calc.profit-finStruct.standard)/calc.total*100)} net margin on cost</div>}
                    </div>
                    <div style={{background:"#f0faf4",borderRadius:8,padding:"12px",border:`1px solid ${C.accent}44`}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.accent,marginBottom:8,fontFamily:sans}}> Margin Scheme (Recommended)</div>

            {/*  PRE-SALES GATE (#63)  */}
            <Card title=" Pre-Sales Gate  Construction Finance Threshold" accent={C.orange}>
              <div style={{background:"#fff7ed",border:`1px solid ${C.orange}44`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontFamily:sans,fontSize:12,color:"#92400e"}}>
                Most Australian construction lenders require a minimum percentage of the project's GDV to be pre-sold (under contract) before releasing construction funding.
                Enter your current pre-sales % to monitor this gate  flagged as a Risk if below the lender threshold.
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                <div>
                  <label style={{fontSize:11,fontWeight:700,color:C.slate,fontFamily:sans,display:"block",marginBottom:5}}>Current Pre-Sales Achieved (%)</label>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <input type="number" value={params.preSalesPct} onChange={e=>uParam("preSalesPct")(e.target.value)} min="0" max="100" step="5"
                      placeholder="e.g. 45"
                      style={{flex:1,padding:"8px 10px",border:`1.5px solid ${
                        parseNum(params.preSalesPct)>0&&parseNum(params.preSalesPct)>=(parseNum(params.preSalesThreshold)||60)?C.ok
                        :parseNum(params.preSalesPct)>0?C.warn:C.border}`,
                        borderRadius:6,fontFamily:mono,fontSize:14,fontWeight:700,color:C.ink}}/>
                    <span style={{fontSize:13,color:C.muted,fontFamily:sans}}>%</span>
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginTop:3,fontFamily:sans}}>Enter 0 if pre-sales not yet commenced</div>
                </div>
                <div>
                  <label style={{fontSize:11,fontWeight:700,color:C.slate,fontFamily:sans,display:"block",marginBottom:5}}>Lender Pre-Sales Threshold (%)</label>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <input type="number" value={params.preSalesThreshold} onChange={e=>uParam("preSalesThreshold")(e.target.value)} min="0" max="100" step="5"
                      placeholder="60"
                      style={{flex:1,padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontFamily:mono,fontSize:14,fontWeight:700,color:C.ink}}/>
                    <span style={{fontSize:13,color:C.muted,fontFamily:sans}}>%</span>
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginTop:3,fontFamily:sans}}>Typical lender requirement: 5075% of GDV. Confirm with your finance broker.</div>
                </div>
              </div>
              {(()=>{
                const preSalesPct=parseNum(params.preSalesPct)||0;
                const threshold=parseNum(params.preSalesThreshold)||60;
                const units=parseNum(plan.estUnits)||0;
                const grv=calc.grv||0;
                const preSalesGRV=grv>0?Math.round(grv*preSalesPct/100):0;
                const requiredGRV=grv>0?Math.round(grv*threshold/100):0;
                const gapGRV=Math.max(0,requiredGRV-preSalesGRV);
                const unitsPre=units>0?Math.round(units*preSalesPct/100):0;
                const unitsRequired=units>0?Math.ceil(units*threshold/100):0;
                const unitGap=Math.max(0,unitsRequired-unitsPre);
                const isGated=preSalesPct<threshold;
                const hasData=preSalesPct>0;
                if(!hasData)return(
                  <div style={{padding:"10px 14px",background:"#f8f9fa",borderRadius:8,fontFamily:sans,fontSize:12,color:C.muted,textAlign:"center"}}>
                    Enter pre-sales % above to see gate status and GDV coverage analysis.
                  </div>
                );
                return(
                  <div style={{background:isGated?"#fef2f2":"#f0fdf4",border:`1.5px solid ${isGated?"#fca5a5":"#86efac"}`,borderRadius:10,padding:"14px 16px",fontFamily:sans}}>
                    <div style={{fontWeight:800,fontSize:13,color:isGated?"#dc2626":"#15803d",marginBottom:10}}>
                      {isGated?"":""} Pre-Sales Gate: {isGated?`${threshold-preSalesPct}% BELOW threshold`:"PASSED"}
                      <span style={{fontWeight:400,fontSize:11,marginLeft:12,color:C.muted}}>{preSalesPct}% achieved vs {threshold}% required</span>
                    </div>
                    {/* Progress bar */}
                    <div style={{position:"relative",height:20,borderRadius:6,background:"#e5e7eb",overflow:"hidden",marginBottom:10}}>
                      <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${Math.min(100,preSalesPct)}%`,background:isGated?C.warn:C.ok,transition:"width 0.5s"}}/>
                      <div style={{position:"absolute",left:`${threshold}%`,top:0,bottom:0,width:"2px",background:"#dc2626",zIndex:2}}/>
                      <div style={{position:"absolute",left:`${threshold+0.5}%`,top:1,fontSize:9,color:"#dc2626",fontWeight:700,whiteSpace:"nowrap"}}>
                        {threshold}% threshold
                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:"6px 14px",fontSize:12}}>
                      <div>Pre-sold value: <strong style={{color:isGated?C.orange:C.ok}}>{grv>0?fmt(preSalesGRV):`${preSalesPct}%`}</strong></div>
                      <div>Required value: <strong>{grv>0?fmt(requiredGRV):`${threshold}%`}</strong></div>
                      {gapGRV>0&&grv>0&&<div style={{color:"#dc2626"}}>Gap to clear: <strong>{fmt(gapGRV)}</strong></div>}
                      {units>0&&<div>Units pre-sold: <strong style={{color:isGated?C.orange:C.ok}}>{unitsPre}/{units}</strong></div>}
                      {unitGap>0&&<div style={{color:"#dc2626"}}>Units still needed: <strong>{unitGap} more</strong></div>}
                    </div>
                    {isGated&&(
                      <div style={{marginTop:10,padding:"8px 12px",background:"#fff7ed",borderRadius:6,fontSize:11,color:"#92400e",lineHeight:1.6}}>
                        <strong> Action required before construction drawdown:</strong> {unitGap>0
                          ?`Sell ${unitGap} more dwelling${unitGap>1?"s":""} to reach the ${threshold}% threshold (${fmt(gapGRV)} additional GDV).`
                          :`Achieve ${(threshold-preSalesPct).toFixed(0)}% additional pre-sales coverage.`}
                        {" "}Consult your development finance broker  some lenders accept overseas pre-sales or substitute security.
                      </div>
                    )}
                  </div>
                );
              })()}
            </Card>

            {/*  JV / WATERFALL EQUITY DISTRIBUTION (#70)  */}
            {(calc.profit>0&&finStruct.equityRequired>0)&&(
            <Card title=" JV Equity Waterfall  Partner Distribution" accent="#7c3aed">
              <div style={{background:"#faf5ff",border:`1px solid #ddd6fe`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontFamily:sans,fontSize:12,color:"#5b21b6"}}>
                Model equity splits and profit waterfall between Developer and JV Partner / Land Owner / Passive Investor.
                Assumes a preferred return hurdle before profit sharing  standard Australian JV structure.
              </div>
              {(()=>{
                /* JV state is ephemeral local to this render  use fin for persistence */
                const devSplit=parseNum(fin.jvDevSplit)||70;
                const partnerSplit=100-devSplit;
                const hurdle=parseNum(fin.jvHurdle)||8; /* preferred return % p.a. */
                const projMonths=parseNum(str.projectMonths)||30;
                const equity=finStruct.equityRequired;
                const profit=calc.profit;
                /* Preferred return: equity  hurdle%  years */
                const prefReturn=Math.round(equity*(hurdle/100)*(projMonths/12));
                const residualProfit=Math.max(0,profit-prefReturn);
                const partnerPrefPct=100-devSplit; // assume partner gets pref return proportionate to their equity split
                /* Developer contribution = assume dev puts in devSplit% of equity */
                const devEquity=Math.round(equity*devSplit/100);
                const partnerEquity=Math.round(equity*partnerSplit/100);
                /* Waterfall:
                   1. Return of equity (all back to contributors proportionally)
                   2. Preferred return (pari passu at hurdle% per annum)
                   3. Residual profit split at devSplit/partnerSplit */
                const devPref=Math.round(prefReturn*devSplit/100);
                const partnerPref=Math.round(prefReturn*partnerSplit/100);
                const devResidual=Math.round(residualProfit*devSplit/100);
                const partnerResidual=Math.round(residualProfit*partnerSplit/100);
                const devTotal=devEquity+devPref+devResidual;
                const partnerTotal=partnerEquity+partnerPref+partnerResidual;
                const devROE=devEquity>0?((devPref+devResidual)/devEquity)*100:null;
                const partnerROE=partnerEquity>0?((partnerPref+partnerResidual)/partnerEquity)*100:null;
                return(
                  <div>
                    {/* Split slider */}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                      <div>
                        <label style={{fontSize:11,fontWeight:700,color:"#5b21b6",fontFamily:sans,display:"block",marginBottom:5}}>Developer Equity Split</label>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <input type="range" min="10" max="95" step="5" value={devSplit} onChange={e=>uF("jvDevSplit")(e.target.value)}
                            style={{flex:1,accentColor:"#7c3aed"}}/>
                          <span style={{fontFamily:mono,fontWeight:700,fontSize:13,color:"#7c3aed",minWidth:35}}>{devSplit}%</span>
                        </div>
                        <div style={{fontSize:10,color:C.muted,fontFamily:sans}}>Partner: {partnerSplit}%</div>
                      </div>
                      <div>
                        <label style={{fontSize:11,fontWeight:700,color:"#5b21b6",fontFamily:sans,display:"block",marginBottom:5}}>Preferred Return Hurdle (% p.a.)</label>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <input type="number" value={fin.jvHurdle||"8"} onChange={e=>uF("jvHurdle")(e.target.value)} min="0" max="25" step="0.5"
                            style={{flex:1,padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:5,fontFamily:mono,fontSize:13,fontWeight:600,color:C.ink}}/>
                          <span style={{fontSize:11,color:C.muted,fontFamily:sans}}>% p.a.</span>
                        </div>
                        <div style={{fontSize:10,color:C.muted,fontFamily:sans}}>Standard JV hurdle: 612% p.a. before split</div>
                      </div>
                    </div>
                    {/* Visual equity bar */}
                    <div style={{marginBottom:12}}>
                      <div style={{height:28,borderRadius:6,overflow:"hidden",display:"flex",border:"1px solid #e5e7eb",marginBottom:4}}>
                        <div style={{width:`${devSplit}%`,background:"#7c3aed",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",fontWeight:700,transition:"width .3s"}}>
                          Dev {devSplit}%
                        </div>
                        <div style={{flex:1,background:"#a78bfa",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",fontWeight:700}}>
                          Partner {partnerSplit}%
                        </div>
                      </div>
                    </div>
                    {/* Waterfall table */}
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontFamily:sans,fontSize:12}}>
                        <thead>
                          <tr style={{background:"#f5f3ff"}}>
                            {["Waterfall Layer","Developer","Partner","Total"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"center",fontWeight:700,borderBottom:"2px solid #ddd6fe",fontSize:11,color:"#5b21b6"}}>{h}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {[
                            {layer:" Equity Return",   dev:devEquity,  part:partnerEquity,  total:equity,       color:"#374151"},
                            {layer:` Preferred Return (${hurdle}%  ${(projMonths/12).toFixed(1)}yr)`,dev:devPref,part:partnerPref,total:prefReturn,color:C.orange},
                            {layer:" Residual Profit",  dev:devResidual,part:partnerResidual,total:residualProfit,color:"#15803d"},
                            {layer:"TOTAL DISTRIBUTIONS",dev:devTotal,   part:partnerTotal,   total:devTotal+partnerTotal, color:"#7c3aed",bold:true},
                          ].map((row,i)=>(
                            <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:row.bold?"#f5f3ff":i%2===0?"#fafbfc":"#fff"}}>
                              <td style={{padding:"8px 10px",fontWeight:row.bold?700:400,color:row.color,fontSize:row.bold?12:11}}>{row.layer}</td>
                              <td style={{padding:"8px 10px",textAlign:"center",fontFamily:mono,fontSize:12,color:row.bold?"#7c3aed":"#374151",fontWeight:row.bold?700:400}}>{fmt(row.dev)}</td>
                              <td style={{padding:"8px 10px",textAlign:"center",fontFamily:mono,fontSize:12,color:row.bold?"#7c3aed":"#374151",fontWeight:row.bold?700:400}}>{fmt(row.part)}</td>
                              <td style={{padding:"8px 10px",textAlign:"center",fontFamily:mono,fontSize:12,color:row.color,fontWeight:700}}>{fmt(row.total)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {/* ROE summary */}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}>
                      {[
                        {label:"Developer ROE",value:devROE,equity:devEquity,color:"#7c3aed"},
                        {label:"Partner ROE",value:partnerROE,equity:partnerEquity,color:"#a78bfa"},
                      ].map((x,i)=>(
                        <div key={i} style={{background:"#faf5ff",borderRadius:8,padding:"10px 14px",textAlign:"center"}}>
                          <div style={{fontSize:11,color:C.muted,fontFamily:sans,marginBottom:4}}>{x.label}</div>
                          <div style={{fontSize:22,fontWeight:800,fontFamily:mono,color:x.color}}>{x.value!=null?x.value.toFixed(1)+"%" :""}</div>
                          <div style={{fontSize:10,color:C.muted}}>on {fmt(x.equity)} equity</div>
                        </div>
                      ))}
                    </div>
                    <div style={{marginTop:8,fontSize:10,color:C.muted,fontFamily:sans,lineHeight:1.6}}>
                       This is a simplified waterfall model  actual JV agreements vary significantly. Engage a solicitor and accountant to structure correctly.
                      Preferred return is pari passu (both parties rank equally) before the profit split activates.
                    </div>
                  </div>
                );
              })()}
            </Card>
            )}

            {/*  PROJECT TIMELINE MODEL (#71)  */}
            <Card title=" Project Timeline  DA to Completion Milestones" accent={C.blue}>
              {(()=>{
                const zone=normaliseZone(plan.zone)||plan.zone||"";
                const hasHO=plan.hasHO;
                const hasVPO=plan.hasVPO;
                const hasSBO=plan.hasSBO;
                const hasEasement=plan.hasEasementBoe;

                const units=parseNum(plan.estUnits)||0;

                const phases=[
                  {label:"DD & Due Diligence",months:1.5,color:"#6366f1",icon:"",
                    items:["Section 32 legal review","Building & pest inspection","Planning history search","Council pre-application meeting (book 46wks ahead)"]},
                  {label:"Planning Permit Application",months:hasHO?5.5:hasVPO?5.0:isMU?7:3.5,color:C.orange,icon:"",
                    items:[
                      `Council assessment (${hasHO?"HO overlay  46mo typical":hasVPO?"VPO  46mo typical":isMU?"MUZ/complex  58mo":"34mo standard"})`+(plan.hasSBO?" + SBO flood report":""),
                      hasS173?"S.173 Agreement variation or removal  allow +2mo":"",
                      ...(hasHO?["Heritage consultant report","HO design referral"]:[]),
                      ...(hasVPO?["Vegetation assessment report"]:[]),
                      units>2?"Referral to Works-in-Road authority (if applicable)":"",
                      "Advertising / notice period: 2 weeks (if notified)",
                    ].filter(Boolean)},
                  {label:"Permit Conditions & Plans",months:1.5,color:C.teal,icon:"",
                    items:["Respond to permit conditions","Working drawings (architect)","Engineering (structure, civil, services)","Section 173 (if applicable)"]},
                  {label:"Building Permit (VBA)",months:1.5,color:C.brand,icon:"",
                    items:["Private building surveyor appointment","Engineering approval","DBI insurance (mandatory)","Permit issued"]},
                  {label:"Construction",months:Math.max(8,Math.round(buildCostTotal/400000)||12),color:C.purple,icon:"",

                  {label:"Subdivision & Settlement",months:units>1?2.5:1.5,color:C.accent,icon:"",

                            :<span style={{color:"#15803d"}}>  within your Finance Structure timeline of {userMonths}mo.</span>}

                          <div key={i} title={`${p.label}: ${p.months}mo`}

                        <span>Month {Math.round(totalMonths/2)}</span>
                        <span>Month {Math.round(totalMonths)}</span>
                      </div>

                    {/* Phase cards */}

                      {phases.map((p,i)=>{

                            </div>
                            <div style={{background:"#f8f9fa",borderRadius:8,padding:"10px 12px"}}>
                              <ul style={{margin:0,paddingLeft:16,fontFamily:sans,fontSize:11,color:C.slate,lineHeight:2}}>
                                {p.items.map((it,j)=><li key={j}>{it}</li>)}
                              </ul>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    {/* Total */}
                    <div style={{marginTop:12,padding:"12px 16px",background:C.ink,borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
                      <div style={{color:"#fff",fontFamily:sans,fontSize:12,fontWeight:600}}>Total estimated project duration</div>
                      <div style={{fontFamily:mono,fontSize:24,fontWeight:900,color:C.accent}}>{totalMonths.toFixed(0)} months</div>
                    </div>
                    <div style={{marginTop:8,fontSize:10,color:C.muted,fontFamily:sans,lineHeight:1.6}}>
                       Timeline is indicative based on standard Melbourne council processing times (202526).
                      Heritage/vegetation overlays, VCAT appeals, complex engineering and council backlog can add 312+ months.
                      Engage a registered town planner for a project-specific programme.
                    </div>
                  </div>
                );
              })()}
            </Card>

            {/*  Extension vs Knockdown Comparison  */}
            <Card title=" Extension vs Knockdown-Rebuild Comparison" accent="#8e44ad">

                Compare retaining and extending your existing structure vs. full knockdown-rebuild. Enter your personal equity position to get a true capital-efficiency comparison.
              </div>
              {(()=>{
                const currentLandVal=parseNum(fin.landPrice)||0;
                const remainMortgage=parseNum(fin.extMortgage)||0;
                const currentEquity=Math.max(0,currentLandVal-remainMortgage);
                const extCost=parseNum(fin.extBuildCost)||0;
                const extGRV=parseNum(fin.extGRV)||0;
                const extProfit=extGRV-(currentEquity+extCost+(extCost*parseNum(str.interestRate)/100*0.5));
                const extROE=currentEquity+extCost>0?extProfit/(currentEquity+extCost)*100:null;
                const extMonths=parseNum(fin.extMonths)||18;
                /* True IRR for extension: cash out at t=0, cash in (GRV) at month extMonths */
                const extIRR=(()=>{
                  const totalOut=currentEquity+extCost;
                  if(!totalOut||!extGRV||!extMonths)return null;
                  const extCFs=new Array(extMonths+1).fill(0);
                  extCFs[0]=-totalOut;extCFs[extMonths]=extGRV;
                  const rawIRR=calcTrueIRR(extCFs);
                  return rawIRR!=null?((Math.pow(1+rawIRR,12)-1)*100):null;
                })();
                const kdProfit=calc.profit;
                const kdROE=finStruct.roe;
                const kdIRR=finStruct.irr;
                const kdMonths=parseNum(str.projectMonths)||30;
                const hasData=currentLandVal>0||extCost>0||extGRV>0;
                return(
                  <div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>

                          </div>
                          <div>
                            <label style={{fontSize:11,color:C.muted,fontFamily:sans,display:"block",marginBottom:3}}>Extension / Reno Cost ($)</label>
                            <input type="number" value={fin.extBuildCost||""} onChange={e=>uF("extBuildCost")(e.target.value)} placeholder="550000" style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:5,fontFamily:mono,fontSize:13}} min="0"/>
                          </div>
                          <div>
                            <label style={{fontSize:11,color:C.muted,fontFamily:sans,display:"block",marginBottom:3}}>Post-Reno Market Value ($)</label>
                            <input type="number" value={fin.extGRV||""} onChange={e=>uF("extGRV")(e.target.value)} placeholder="1800000" style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:5,fontFamily:mono,fontSize:13}} min="0"/>
                          </div>
                          <div>
                            <label style={{fontSize:11,color:C.muted,fontFamily:sans,display:"block",marginBottom:3}}>Build Duration (months)</label>
                            <input type="number" value={fin.extMonths||""} onChange={e=>uF("extMonths")(e.target.value)} placeholder="18" style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:5,fontFamily:mono,fontSize:13}} min="1" max="60"/>
                          </div>
                        </div>
                      </div>
                      <div style={{background:C.brandLight,borderRadius:8,padding:"12px 14px",border:`1px solid ${C.brand}33`}}>
                        <div style={{fontWeight:700,fontSize:13,color:C.brand,marginBottom:10,fontFamily:sans}}> Knockdown-Rebuild (from Financial Analysis)</div>
                        {calc.total>0?(
                          <div style={{display:"flex",flexDirection:"column",gap:8}}>
                            {[
                              {label:"TDC",val:fmt(calc.total)},
                              {label:"GRV",val:fmt(calc.grv)},
                              {label:"Profit",val:fmt(calc.profit),bold:true},
                              {label:"Duration",val:`${str.projectMonths} months`},
                            ].map(({label,val,bold})=>(
                              <div key={label} style={{display:"flex",justifyContent:"space-between",fontSize:12,fontFamily:sans,borderBottom:`1px solid ${C.border}`,paddingBottom:4}}>
                                <span style={{color:C.muted}}>{label}</span>
                                <span style={{fontFamily:mono,fontWeight:bold?700:500,color:C.ink}}>{val}</span>
                              </div>
                            ))}
                          </div>
                        ):<div style={{fontSize:12,color:C.muted}}>Enter data in Financial Analysis tab</div>}
                      </div>
                    </div>
                    {hasData&&extGRV>0&&extCost>0&&(
                      <div style={{background:"#f8f9fa",borderRadius:8,padding:"12px 14px"}}>
                        <div style={{fontWeight:700,fontSize:13,color:C.slate,marginBottom:10,fontFamily:sans}}> Head-to-Head Comparison</div>
                        <table style={{width:"100%",borderCollapse:"collapse",fontFamily:sans,fontSize:12}}>
                          <thead>
                            <tr style={{background:"#edf2f7"}}>
                              {["Metric"," Extension"," KD-Rebuild","Winner"].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"center",fontWeight:700,fontSize:11,color:C.slate}}>{h}</th>)}
                            </tr>
                          </thead>
                          <tbody>
                            {[
                              {m:"Profit",a:extProfit,b:kdProfit,fmt:v=>fmt(v)||"",higher:true},
                              {m:"ROE",a:extROE,b:kdROE,fmt:v=>pct(v)||"",higher:true},
                              {m:"Ann. IRR",a:extIRR,b:kdIRR,fmt:v=>pct(v)||"",higher:true},
                              {m:"Duration",a:extMonths,b:parseNum(str.projectMonths)||30,fmt:v=>`${v}mo`,higher:false},
                              {m:"Capital Tied",a:currentEquity+extCost,b:finStruct.equityRequired,fmt:v=>fmt(v)||"",higher:false},
                            ].map(({m,a,b,fmt:f,higher})=>{
                              const aWins=higher?(a>=b):(a<=b);
                              const bWins=higher?(b>=a):(b<=a);
                              const tie=a===b;
                              return(
                                <tr key={m} style={{borderBottom:`1px solid ${C.border}`}}>
                                  <td style={{padding:"7px 10px",fontWeight:600,color:C.slate}}>{m}</td>

                                  <td style={{padding:"7px 10px",textAlign:"center",fontFamily:mono,fontWeight:bWins&&!tie?700:400,color:bWins&&!tie?C.brand:C.ink}}>{f(b)}</td>
                                  <td style={{padding:"7px 10px",textAlign:"center",fontSize:14}}>{tie?"":aWins?"":""}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                        {extROE!=null&&kdROE!=null&&(
                          <div style={{marginTop:10,padding:"8px 12px",borderRadius:6,background:extROE>kdROE?"#f0fdf9":"#f0f4ff",fontFamily:sans,fontSize:12,fontWeight:600,color:extROE>kdROE?C.accent:C.brand}}>

                          </div>

                      </div>
                    )}
                    {!hasData&&<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:"16px 0"}}>Enter extension cost and post-reno value, and land price in Financial Analysis, to compare scenarios</div>}
                  </div>
                );
              })()}
            </Card>

            {/*  Exit Strategy Comparison  */}
            {(()=>{
              const landAcqCost=parseNum(fin.landPrice)+parseNum(fin.stampDuty);
              const landPriceRaw=parseNum(fin.landPrice);
              const months=parseNum(str.projectMonths)||30;
              const years=months/12;
              const grossYieldRate=0.035; // 3.5% gross Melbourne townhouse yield assumption

              const sellLandNet=landPriceRaw>0?Math.round(landPriceRaw*(1-agentCommPct)):null;
              const sellLandProfit=sellLandNet!=null?sellLandNet-landAcqCost:null;

              // Option B  Develop + Sell
              const devProfit=calc.profit||0;
              const devIRR=finStruct.irr;
              const devMonths=months;
              const devROE=finStruct.roe;

              // Option C  Develop + Hold (Rent)
              const annualRent=calc.grv>0?Math.round(calc.grv*grossYieldRate):null;
              const yearsToRecover=annualRent>0&&calc.total>0?Math.round((calc.total/annualRent)*10)/10:null;
              const equityRecoveryYears=annualRent>0&&finStruct.equityRequired>0?Math.round((finStruct.equityRequired/annualRent)*10)/10:null;

              if(!landPriceRaw&&!calc.grv)return null;
              return(
                <Card title=" Exit Strategy Comparison" accent={C.teal}>
                  <div style={{fontFamily:sans,fontSize:12,color:C.muted,marginBottom:12}}>

                    {/* Option A */}
                    <div style={{background:"#fff7e6",border:`2px solid ${C.gold}`,borderRadius:10,padding:"14px 16px"}}>
                      <div style={{fontSize:13,fontWeight:700,color:C.goldDark,marginBottom:8,fontFamily:sans}}>A  Sell Land Now ()</div>
                      <div style={{fontFamily:mono,fontSize:20,fontWeight:800,color:C.goldDark,marginBottom:4}}>{sellLandNet!=null?fmt(sellLandNet):""}</div>
                      <div style={{fontSize:11,color:C.slate,marginBottom:8}}>Net proceeds after ~2.5% agent comm.</div>
                      {sellLandProfit!=null&&(
                        <div style={{fontSize:12,color:sellLandProfit>=0?C.accentDark:C.warn,fontWeight:600}}>
                          {sellLandProfit>=0?"+" : ""}{fmt(sellLandProfit)} vs acquisition cost
                        </div>
                      )}
                      <div style={{marginTop:8,fontSize:11,color:C.muted}}> Immediate cash  No development risk  No holding cost</div>
                    </div>

                    {/* Option B */}
                    <div style={{background:"#f0fdf9",border:`2px solid ${C.accent}`,borderRadius:10,padding:"14px 16px"}}>
                      <div style={{fontSize:13,fontWeight:700,color:C.accentDark,marginBottom:8,fontFamily:sans}}>B  Develop + Sell ()</div>
                      <div style={{fontFamily:mono,fontSize:20,fontWeight:800,color:C.accentDark,marginBottom:4}}>{calc.profit?fmt(calc.profit):""}</div>
                      <div style={{fontSize:11,color:C.slate,marginBottom:8}}>Developer profit  Timeline {devMonths} months</div>
                      {devROE!=null&&<div style={{fontSize:12,color:devROE>=25?C.accentDark:C.orange,fontWeight:600,marginBottom:2}}>ROE {pct(devROE)}  Ann. {devIRR!=null?pct(devIRR):""}</div>}
                      <div style={{fontSize:11,color:C.muted}}> Highest absolute return  Requires construction risk tolerance</div>
                    </div>

                    {/* Option C */}
                    <div style={{background:"#f0f4ff",border:`2px solid ${C.blue}`,borderRadius:10,padding:"14px 16px"}}>
                      <div style={{fontSize:13,fontWeight:700,color:C.blue,marginBottom:8,fontFamily:sans}}>C  Develop + Hold ()</div>
                      <div style={{fontFamily:mono,fontSize:20,fontWeight:800,color:C.blue,marginBottom:4}}>{annualRent?fmt(annualRent)+"/yr":""}</div>
                      <div style={{fontSize:11,color:C.slate,marginBottom:8}}>Est. gross rental at 3.5% yield on GRV</div>
                      {yearsToRecover!=null&&<div style={{fontSize:12,color:C.blue,fontWeight:600,marginBottom:2}}>~{yearsToRecover} yrs to recover TDC via rent</div>}
                      {equityRecoveryYears!=null&&<div style={{fontSize:12,color:C.slate,marginBottom:2}}>~{equityRecoveryYears} yrs to recover equity</div>}
                      <div style={{fontSize:11,color:C.muted}}> Long-term wealth building  Capital growth + rental income</div>
                    </div>

                  </div>
                  {/* Comparison verdict */}
                  {calc.profit>0&&sellLandProfit!=null&&(
                    <div style={{marginTop:12,padding:"10px 14px",borderRadius:8,background:"#f8f9fa",fontFamily:sans,fontSize:12,color:C.slate,lineHeight:1.7}}>
                      <strong>Quick Comparison: </strong>
                      Develop & sell generates <strong style={{color:C.accentDark}}>{fmt(calc.profit-Math.max(0,sellLandProfit))}</strong> more profit than selling land now,
                      but requires <strong>{devMonths} months</strong> of development risk and capital commitment.
                      {annualRent>0&&<> Holding for rent would return the equity investment in approximately <strong>{equityRecoveryYears} years</strong> via rent alone (before capital growth).</>}
                    </div>
                  )}
                  <div style={{marginTop:8,fontSize:11,color:C.muted}}> Rental yield is indicative at 3.5% gross  verify current market yields for the specific suburb and dwelling type. Tax treatment differs significantly between options. Seek financial and tax advice.</div>
                </Card>
              );
            })()}
            <Card title=" Rate  Price Sensitivity Matrix" accent={C.purple}>
              <div style={{marginBottom:10,padding:"8px 12px",background:"#f4ecf7",borderRadius:6,fontSize:12,color:C.purple,fontFamily:sans}}>
                The two variables lenders stress-test first: what if interest rates rise AND end values fall? Each cell shows Margin on Cost and absolute profit.
              </div>
              <RatePriceSensitivity
                baseGrv={calc.grv}
                baseCost={calc.total}
                baseRatePct={parseNum(str.interestRate)||8.5}
                seniorDebt={finStruct.seniorDebt}
                loanMonths={parseNum(str.loanTermMonths)||18}
              />
            </Card>
            {/*  MONTHLY CASHFLOW DETAIL TABLE  */}
            {calc.total>0&&(
            <Card title=" Monthly Cashflow Statement  Full Detail" accent={C.blue}>
              <div style={{background:C.brandLight,border:`1px solid ${C.brand}22`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontFamily:sans,fontSize:12,color:C.brand}}>
                Month-by-month cashflow built from your project inputs: land at settlement, soft costs spread over planning phase, construction on S-curve drawdown, sales proceeds at completion.
                <button onClick={handleExportXLSX}
                  style={{marginLeft:12,background:"#15803d",color:"#fff",border:"none",fontFamily:sans,fontSize:11,fontWeight:700,padding:"5px 12px",borderRadius:5,cursor:"pointer"}}>
                   Export to Excel
                </button>
              </div>
              {(()=>{
                const rows=buildMonthlyCashflowTable(
                  calc.land||0, calc.soft||0, calc.hard||0, calc.sale||0, calc.grv||0,
                  parseNum(str.lvrPct)||65, parseNum(str.projectMonths)||30, parseNum(str.interestRate)||8.5,
                  fin.gstITC?(finStruct.totalITC||0):0
                );
                const planM=Math.max(4,Math.round((parseNum(str.projectMonths)||30)*0.47));
                const pm=parseNum(str.projectMonths)||30;
                const phaseColor=m=>m===0?"#6366f1":m<=planM?"#f59e0b":m<=pm?"#3b82f6":m<=pm+4?"#10b981":"#374151";
                const phaseName=m=>m===0?"Land":m<=planM?"Plan":m<=pm?"Build":"Sell";
                const peakRow=rows.reduce((p,r)=>r.cumCashflow<p.cumCashflow?r:p,{cumCashflow:0});

                return(
                  <div>
                    {/* Summary metrics */}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:14}}>
                      {[
                        {label:"Peak Exposure",value:fmt(Math.abs(peakRow.cumCashflow)),sub:`Month ${peakRow.month}`,color:"#dc2626"},
                        {label:"Month Cashflow Turns +",value:posRow?`Month ${posRow.month}`:"",sub:"First positive month",color:"#15803d"},
                        {label:"Total Interest",value:fmt(Math.abs(rows.reduce((s,r)=>s+(r.interest||0),0))),sub:"S-curve accrued",color:C.orange},
                        {label:"Net Profit (model)",value:fmt(rows[rows.length-1]?.cumCashflow||0),sub:"End cumulative",color:C.brand},

                          <div style={{fontSize:16,fontWeight:800,fontFamily:mono,color:x.color}}>{x.value}</div>
                          <div style={{fontSize:10,color:C.muted}}>{x.sub}</div>
                        </div>
                      ))}
                    </div>
                    {/* Mini cumulative chart */}
                    <div style={{position:"relative",height:60,background:"#f8f9fa",borderRadius:8,overflow:"hidden",marginBottom:12,border:`1px solid ${C.border}`}}>
                      {(()=>{
                        const vals=rows.map(r=>r.cumCashflow);
                        const minV=Math.min(...vals),maxV=Math.max(...vals,1);
                        const range=maxV-minV||1;
                        const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${((1-(v-minV)/range)*58+1).toFixed(1)}`).join(" ");
                        const zeroY=((1-(0-minV)/range)*58+1).toFixed(1);
                        return(
                          <svg width="100%" height="60" preserveAspectRatio="none" viewBox={`0 0 100 60`}>
                            <line x1="0" y1={zeroY} x2="100" y2={zeroY} stroke="#e5e7eb" strokeWidth="0.5" strokeDasharray="2,1"/>
                            <polyline points={pts} fill="none" stroke={C.brand} strokeWidth="1.5"/>
                            {vals.map((v,i)=>v>0&&vals[i-1]<=0?<circle key={i} cx={(i/(vals.length-1)*100).toFixed(1)} cy={((1-(v-minV)/range)*58+1).toFixed(1)} r="2" fill={C.ok}/>:null)}
                          </svg>

                      })()}
                    </div>
                    {/* Scrollable table */}
                    <div style={{overflowX:"auto",maxHeight:360,overflowY:"auto",border:`1px solid ${C.border}`,borderRadius:8}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontFamily:mono,fontSize:11,minWidth:760}}>
                        <thead style={{position:"sticky",top:0,zIndex:2}}>
                          <tr style={{background:C.ink,color:"#fff"}}>

                          </tr>
                        </thead>
                        <tbody>
                          {rows.map((r,i)=>{

                              <tr key={r.month} style={{
                                background:isZeroCross?"#dcfce7":r.month===peakRow.month?"#fef2f2":i%2===0?"#fafbfc":"#fff",
                                borderBottom:`1px solid ${C.border}`}}>
                                <td style={{padding:"4px 8px",textAlign:"right",color:C.muted,fontWeight:600}}>{r.month}</td>
                                <td style={{padding:"4px 8px",textAlign:"center"}}>

                                  <td key={j} style={{padding:"4px 8px",textAlign:"right",color:v<0?"#dc2626":v>0?"#15803d":C.muted}}>
                                    {v!==0?(v<0?"-":"")+fmt(Math.abs(v)).replace("$",""):""}
                                  </td>
                                ))}
                                <td style={{padding:"4px 8px",textAlign:"right",color:(r.gstRefund||0)>0?"#059669":"#9ca3af",fontWeight:(r.gstRefund||0)>0?700:400,background:(r.gstRefund||0)>0?"#ecfdf5":undefined}}>
                                  {(r.gstRefund||0)>0?"+"+fmt(r.gstRefund).replace("$",""):""}
                                </td>
                                {[r.sales,r.saleOut,r.loanRepay].map((v,j)=>(
                                  <td key={j} style={{padding:"4px 8px",textAlign:"right",color:v<0?"#dc2626":v>0?"#15803d":C.muted}}>
                                    {v!==0?(v<0?"-":"")+fmt(Math.abs(v)).replace("$",""):""}
                                  </td>
                                ))}
                                <td style={{padding:"4px 8px",textAlign:"right",fontWeight:700,color:r.netCashflow<0?"#dc2626":"#15803d"}}>
                                  {r.netCashflow!==0?(r.netCashflow<0?"-":"")+fmt(Math.abs(r.netCashflow)).replace("$",""):""}
                                </td>
                                <td style={{padding:"4px 8px",textAlign:"right",fontWeight:700,color:r.cumCashflow<0?"#dc2626":"#15803d",background:isZeroCross?"#bbf7d0":r.month===peakRow.month?"#fecaca":""}}>
                                  {(r.cumCashflow<0?"-":"")+fmt(Math.abs(r.cumCashflow)).replace("$","")}
                                </td>
                                <td style={{padding:"4px 8px",textAlign:"right",color:C.slate}}>
                                  {r.loanBalance>0?fmt(r.loanBalance).replace("$",""):""}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    <div style={{marginTop:6,fontSize:10,color:C.muted,fontFamily:sans,lineHeight:1.6}}>
                       Red row = peak exposure month   Green row = first cashflow-positive month  Hard costs split: equity-funded portion ({100-Math.round(parseNum(str.lvrPct)||65)}%) and debt-drawn ({Math.round(parseNum(str.lvrPct)||65)}% LVR).
                      Export to Excel to see the full model with all three sheets.
                    </div>
                  </div>
                );
              })()}
            </Card>
            )}

            <Card title=" Project Cash Flow Waterfall" accent={C.teal}>
              <div style={{marginBottom:10,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                <div style={{padding:"8px 12px",background:"#e8f8f5",borderRadius:6,fontSize:12,color:"#00695c",fontFamily:sans,flex:1}}>
                  Simulates cumulative cash position month-by-month, showing peak capital exposure and the month cash turns positive.
                </div>
                <button onClick={()=>setSettlementDelay(d=>d===0?6:0)} style={{background:settlementDelay>0?C.warn:"#fff",color:settlementDelay>0?"#fff":C.warn,border:`2px solid ${C.warn}`,fontFamily:sans,fontSize:12,fontWeight:700,padding:"8px 14px",borderRadius:6,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                  {settlementDelay>0?" +6 Month Delay Active":" Stress Test: +6 Month Delay"}
                </button>

                const top5=actions.slice(0,5);

                const roleLabels={developer:{icon:"",label:"Developer"},builder:{icon:"",label:"Builder"},architect:{icon:"",label:"Architect"}};
                const rl=roleLabels[role]||roleLabels.developer;
                return(
                  <div style={{background:"#fafafa",border:"1.5px solid #e5e7eb",borderRadius:12,padding:"14px 18px",marginBottom:14,fontFamily:sans}}>

                      <div style={{fontWeight:800,fontSize:13,color:"#111827"}}>Top Actions  {rl.label} View</div>
