          "Loading financial engine",
          "Building UI components",
          "Wiring calculation logic",
          "Almost ready",
        ];
        var pct = 0;
        var idx = 0;
        var iv = setInterval(function () {
          pct = Math.min(pct + Math.random() * 3, 92);
          if (bar) bar.style.width = pct + "%";
          if (msg && Math.random() > 0.7 && idx < msgs.length - 1) {

            msg.textContent = msgs[idx];
          }
        }, 150);
        window.__loadingInterval = iv;

      function scoreToBand(s) {

      function calcFreshness(isoTs) {
        if (!isoTs) return { label: "No data", score: 0, color: "#9ca3af" };
        const ageDays =
          (Date.now() - new Date(isoTs).getTime()) / (1000 * 60 * 60 * 24);
        if (ageDays < 1)
          return { label: "Fresh (<1 day)", score: 100, color: "#00b894" };
        if (ageDays < 7)
          return { label: "Recent (<7 days)", score: 70, color: "#f39c12" };
        if (ageDays < 30)

      /*  CBD DISTANCE (Melbourne CBD: -37.8136, 144.9631)  */
      function calcCBDDist(lat, lon) {
        const R = 6371,
          dLat = ((lat - -37.8136) * Math.PI) / 180,
          dLon = ((lon - 144.9631) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((-37.8136 * Math.PI) / 180) *
            Math.cos((lat * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

            /^(GRZ|NRZ|RGZ|MUZ|C1Z|C2Z|LDRZ|TZ|PUZ|FZ|RCZ|PCRZ|CCZ|CAZ|MHZ)/,
          );

      function calcVicStampDuty(
        price,
        isForeign = false,
        isOTP = false,
        buildCost = 0,
      ) {
        /* Victorian Land Transfer Duty  SRO VIC 2024-25 (corrected brackets)
     Source: sro.vic.gov.au/land-transfer-duty
     OTP concession: for off-the-plan purchases, dutiable value = contract price
     less the construction proportion not yet completed at contract date.
     Simplified here: when isOTP=true & buildCost provided, duty on land component only. */
        if (!price || price <= 0) return 0;
        /* OTP: dutiable value is land component (price minus construction not yet done) */
        const dutiable =
          isOTP && buildCost > 0 ? Math.max(0, price - buildCost) : price;
        let d;
        /* SRO VIC 2024-25  7 correct brackets (sro.vic.gov.au/land-transfer-duty)
     $130k$440k: 5% marginal  |  $440k$550k: 6%  |  $550k$960k: 6%
     $960k+: FLAT 5.5% of TOTAL (not marginal  creates a duty cliff at $960k)
     $2M+:   FLAT 6.5% of TOTAL */
        if (dutiable <= 25000) d = dutiable * 0.014;
        else if (dutiable <= 130000) d = 350 + (dutiable - 25000) * 0.024;
        else if (dutiable <= 440000)
          d = 2870 + (dutiable - 130000) * 0.05; // 5% bracket $130k$440k
        else if (dutiable <= 550000)
          d = 18370 + (dutiable - 440000) * 0.06; // 6% bracket $440k$550k
        else if (dutiable <= 960000)
          d = 24970 + (dutiable - 550000) * 0.06; // 6% bracket $550k$960k
        else if (dutiable <= 2000000)
          d = dutiable * 0.055; // FLAT 5.5% of total (not marginal)
        else d = dutiable * 0.065; // FLAT 6.5% of total (not marginal)
        if (isForeign) d += dutiable * 0.08; // Foreign Acquirer Duty (FIRB residential)
        return Math.round(d);
      }
      function calcGST(grv, landCost) {
        const margin = Math.max(0, grv - landCost);
        return {
          standard: Math.round(grv / 11),
          marginScheme: Math.round(margin / 11),
        };
      }

      /*  TRUE IRR  Newton-Raphson on monthly cash flows  */
      /* Replaces simple annualised-ROE approximation.
   cashFlows: array indexed by month (0..n), negative=outflow, positive=inflow.
   Returns annualised IRR in %, or null if no solution. */
      function calcTrueIRR(cashFlows, maxIter = 60, tol = 1e-8) {
        if (!cashFlows || cashFlows.length < 2) return null;
        /* Bracket: find sign change between rate=-99% and +100% per month */
        let r = 0.01; // starting guess: 1%/month  12.7% annualised
        for (let iter = 0; iter < maxIter; iter++) {
          let npv = 0,
            dnpv = 0;
          for (let t = 0; t < cashFlows.length; t++) {
            const cf = cashFlows[t];
            if (!cf) continue;
            const disc = Math.pow(1 + r, t);
            npv += cf / disc;
            dnpv -= (t * cf) / (disc * (1 + r));
          }
          if (Math.abs(dnpv) < 1e-10) break;
          const nr = r - npv / dnpv;
          if (Math.abs(nr - r) < tol) {
            r = nr;
            break;
          }
          r = Math.max(-0.99, Math.min(0.99, nr));
        }
        if (r <= -1 || isNaN(r)) return null;
        return (Math.pow(1 + r, 12) - 1) * 100; // annualise
      }

      /* Build simplified monthly cash flows for IRR calc (mirrors CashFlowWaterfall logic) */
      function buildIRRCashFlows(
        land,
        soft,
        hard,
        grv,
        lvrPct,
        projectMonths,
        delayMonths = 0,
        interestRate = 8.5,
      ) {
        const lv = lvrPct / 100;
        const pm = Math.max(6, Math.round(projectMonths));
        const planM = Math.max(4, Math.round(pm * 0.47));
        const buildM = pm - planM;
        const saleM = 4;
        const settleStart = pm + delayMonths;
        const totalM = settleStart + saleM;
        const monthlyRate = interestRate / 100 / 12;
        const sCurve = (t) =>
          0.5 * (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, t))));
        const flows = Array(totalM + 1).fill(0);
        for (let m = 0; m <= totalM; m++) {
          let eq = 0,
            db = 0,
            proc = 0;
          if (m === 0) {
            eq += land * (1 - lv);
            db += land * lv;
          }
          if (m >= 1 && m <= planM && soft > 0) {
            eq += soft / planM;
          }
          if (m >= planM && m < pm && hard > 0) {
            const t0 = (m - planM) / buildM,
              t1 = (m - planM + 1) / buildM;
            const h = hard * (sCurve(t1) - sCurve(t0));
            db += h * lv;
            eq += h * (1 - lv);
          }
          if (m > settleStart && m <= totalM && grv > 0) proc += grv / saleM;
          flows[m] += proc - eq - db;
        }
        return flows;
      }

      /*  DETAILED MONTHLY CASHFLOW TABLE BUILDER 
   Returns array of monthly rows for display & xlsx export.
   Each row: {month, land, soft, hard, hardEquity, hardDebt, sales,
              netCashflow, cumCashflow, loanBalance, interest}       */
      function buildMonthlyCashflowTable(
        land,
        soft,
        hard,
        saleCost,
        grv,
        lvrPct,
        projectMonths,
        interestRate = 8.5,
        gstITC = 0,
      ) {
        /* gstITC: total GST Input Tax Credits receivable during construction phase
     (approx hard/11  90% recovery for registered suppliers).
     ATO BAS lodgement cycle: quarterly  refund arrives ~month after quarter end.
     This is a positive cashflow injection that reduces peak equity exposure. */
        const lv = Math.min(0.85, lvrPct / 100);
        const pm = Math.max(6, Math.round(projectMonths));
        const planM = Math.max(4, Math.round(pm * 0.47)); // planning phase
        const buildM = Math.max(4, pm - planM); // construction phase
        const saleM = 4; // settlement phase
        const totalM = pm + saleM;
        const monthlyRate = interestRate / 100 / 12;
        const sCurve = (t) =>
          0.5 * (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, t))));
        /* GST ITC: distribute as quarterly BAS refunds during construction phase
     Quarters start 1 month into build (ATO processes within ~28 days).
     Any residual claimed in the quarter after construction completes. */
        const numBuildQuarters = Math.max(1, Math.ceil(buildM / 3));
        const itcPerQuarter =
          gstITC > 0 ? Math.round(gstITC / numBuildQuarters) : 0;
        const rows = [];
        let loanBalance = 0;
        let cumCashflow = 0;
        for (let m = 0; m <= totalM; m++) {
          let landOut = 0,
            softOut = 0,
            hardEquity = 0,
            hardDebt = 0,
            salesIn = 0,
            interest = 0,
            gstRefund = 0;
          // Land at M0
          if (m === 0) {
            landOut = land;
            loanBalance += land * lv;
          }
          // Soft costs spread over planning phase (equity funded)
          if (m >= 1 && m <= planM && soft > 0) softOut = soft / planM;
          // Hard costs on S-curve during construction phase
          if (m > planM && m <= pm && hard > 0) {
            const t0 = (m - 1 - planM) / buildM,
              t1 = (m - planM) / buildM;
            const draw = hard * (sCurve(t1) - sCurve(t0));
            hardDebt = draw * lv;
            hardEquity = draw * (1 - lv);
            loanBalance += hardDebt;
          }
          // GST ITC: quarterly BAS refund during construction (months planM+3, +6, +9)
          if (itcPerQuarter > 0 && m > planM) {
            const monthInBuild = m - planM;
            if (monthInBuild % 3 === 0 && monthInBuild <= buildM + 3)
              gstRefund = itcPerQuarter;
          }
          // Accrued interest on loan balance each month
          if (loanBalance > 0) {
            interest = Math.round(loanBalance * monthlyRate);
            loanBalance += interest;
          }
          // Sales proceeds spread over settlement phase
          if (m > pm && m <= pm + saleM && grv > 0) salesIn = grv / saleM;
          // Selling costs at start of settlement phase
          let saleOut = 0;
          if (m === pm + 1 && saleCost > 0) saleOut = saleCost;
          // Loan repayment at end of settlement
          let loanRepay = 0;
          if (m === pm + saleM && loanBalance > 0) {
            loanRepay = loanBalance;
            loanBalance = 0;
          }
          const netCashflow =
            salesIn +
            gstRefund -
            landOut -
            softOut -
            hardEquity -
            hardDebt -
            interest -
            saleOut -
            loanRepay;
          cumCashflow += netCashflow;
          rows.push({
            month: m,
            land: -landOut,
            soft: -softOut,
            hardEquity: -hardEquity,
            hardDebt: -hardDebt,
            interest: -interest,
            gstRefund,
            sales: salesIn,
            saleOut: -saleOut,
            loanRepay: -loanRepay,
            netCashflow,
            cumCashflow,
            loanBalance,
          });
        }
        return rows;
      }

      /* Backwards-compat alias  used in a few display strings */
      function estimateIRR(profit, equity, months) {
        if (!equity || equity <= 0 || months <= 0) return null;
        return (Math.pow(1 + profit / equity, 1 / (months / 12)) - 1) * 100;
      }

      /*  ITERATIVE RLV ENGINE  */
      /* Accounts for circular dependency: stamp duty = f(landPrice).
   Iterates until land price converges (typically 4-6 rounds). */
      function calcRLVIterative(
        grv,
        targetMarginPct,
        otherCostsExLand,
        isForeign = false,
        maxIter = 10,
      ) {
        if (!grv || grv <= 0) return null;
        const t = targetMarginPct / 100;
        const targetTotal = grv / (1 + t);
        /* Initial guess ignoring duty */
        let landGuess = targetTotal - otherCostsExLand;
        if (landGuess <= 0) return 0;
        for (let i = 0; i < maxIter; i++) {
          const duty = calcVicStampDuty(Math.max(0, landGuess), isForeign);

      /*  DONUT CHART  */
      function DonutChart({slices,size=155,centerLabel}){
        const total=slices.reduce((s,x)=>s+x.value,0);
        if(!total)return<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:20}}>No data yet</div>;
        const r=56,cx=size/2,cy=size/2;let angle=-Math.PI/2;
        const paths=slices.filter(s=>s.value>0).map((s,i)=>{
          const ratio=s.value/total,a1=angle,a2=angle+ratio*2*Math.PI;
          const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
          const d=`M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${ratio>0.5?1:0} 1 ${x2} ${y2}Z`;
          angle=a2;
          return<path key={i} d={d} fill={s.color} stroke="#fff" strokeWidth={2}/>;
        });
        return(
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
            {paths}
            <circle cx={cx} cy={cy} r={32} fill="#fff"/>
            {centerLabel&&<text x={cx} y={cy+4} textAnchor="middle" fontSize="10" fontFamily={sans} fill={C.slate} fontWeight="600">{centerLabel}</text>}
          </svg>
        );
      }

      /*  CASH FLOW WATERFALL  */
      function CashFlowWaterfall({landCost,softCost,hardCost,saleCost,grv,projectMonths,lvrPct,seniorDebt,equityRequired,profit,margin,delayMonths=0,interestRate=8.5}){
        const lv=lvrPct/100;
        const pm=Math.max(6,Math.round(projectMonths));
        const planM=Math.max(4,Math.round(pm*0.47));
        const buildM=pm-planM;
        const saleM=4;
        const settleStart=pm+delayMonths; /* delayed settlement pushes sales receipts right */
        const totalM=settleStart+saleM;
        const monthlyRate=(interestRate/100)/12;
        if(!grv||!landCost)return<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:20}}>Enter land price and GRV to generate cash flow model</div>;
        const sCurve=t=>0.5*(1-Math.cos(Math.PI*Math.min(1,Math.max(0,t))));
        const months=[];
        for(let m=0;m<=totalM;m++){
          let eqOut=0,dbOut=0,procIn=0;
          if(m===0){eqOut=landCost*(1-lv);dbOut=landCost*lv;}
          if(m>=1&&m<=planM&&softCost>0){eqOut+=softCost/planM;}
          if(m>=planM&&m<pm&&hardCost>0){
            const t0=(m-planM)/buildM,t1=(m-planM+1)/buildM;
            const h=hardCost*(sCurve(t1)-sCurve(t0));
            dbOut+=h*lv;eqOut+=h*(1-lv);
          }
          if(m===pm){eqOut+=saleCost||0;}
          /* During delay period: loan interest continues to accrue (extra holding cost) */
          if(delayMonths>0&&m>pm&&m<=settleStart){dbOut+=seniorDebt*monthlyRate*0.8;}
          if(m>settleStart&&m<=totalM&&grv>0){procIn+=grv/saleM;}
          months.push({m,eqOut,dbOut,procIn,net:procIn-eqOut-dbOut});
        }
        let cum=0;
        const cf=months.map(x=>{cum+=x.net;return{...x,cum};});
        const minCum=Math.min(...cf.map(x=>x.cum));
        const maxCum=Math.max(...cf.map(x=>x.cum));
        const peakIdx=cf.findIndex(x=>x.cum===minCum);
        const breakEvenIdx=cf.findIndex((x,i)=>i>pm&&x.cum>=0);
        const W=600,H=210,pL=58,pR=20,pT=22,pB=38;
        const cW=W-pL-pR,cH=H-pT-pB;
        const yR=maxCum-minCum||1;
        const xS=i=>pL+(i/totalM)*cW;
        const yS=v=>pT+((maxCum-v)/yR)*cH;
        const yZ=yS(0);
        const pts=cf.map((x,i)=>`${i===0?"M":"L"}${xS(x.m).toFixed(1)},${yS(x.cum).toFixed(1)}`).join(" ");
        const fM=v=>{const a=Math.abs(v);return(v<0?"-":"")+(a>=1e6?`$${(a/1e6).toFixed(1)}M`:a>=1e3?`$${(a/1e3).toFixed(0)}K`:`$${a.toFixed(0)}`);};
        const ticks=5;
        return(
          <div>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",maxWidth:W}}>
              <defs>
                <clipPath id="cfNeg"><rect x={pL} y={yZ} width={cW} height={H-pB-yZ+pT}/></clipPath>
                <clipPath id="cfPos"><rect x={pL} y={pT} width={cW} height={yZ-pT}/></clipPath>
              </defs>
              {/* Grid lines */}
              {Array.from({length:ticks+1},(_,i)=>{
                const v=minCum+(i/ticks)*yR,y=yS(v);
                return<g key={i}><line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#edf2f7" strokeWidth="1"/><text x={pL-4} y={y+4} textAnchor="end" fontSize="9" fontFamily="Inter,sans-serif" fill="#8a9bae">{fM(v)}</text></g>;
              })}
              {/* Zero line */}
              <line x1={pL} y1={yZ} x2={W-pR} y2={yZ} stroke="#b0bec5" strokeWidth="1.5" strokeDasharray="5,4"/>
              {/* Area fills */}
              <path d={`${pts} L${xS(totalM)},${yZ} L${pL},${yZ} Z`} fill="#e17055" fillOpacity="0.12" clipPath="url(#cfNeg)"/>
              <path d={`${pts} L${xS(totalM)},${yZ} L${pL},${yZ} Z`} fill="#00b894" fillOpacity="0.15" clipPath="url(#cfPos)"/>
              {/* Main line */}
              <path d={pts} fill="none" stroke="#0f4c75" strokeWidth="2.2" strokeLinejoin="round"/>
              {/* Phase markers */}
              {[[0,"Land",C.warn],[planM,"Build",C.orange],[settleStart,"Sales",C.accent]].map(([m,lbl,col])=>(
                <g key={lbl}><line x1={xS(m)} y1={pT} x2={xS(m)} y2={H-pB} stroke={col} strokeWidth="1.2" strokeDasharray="4,3"/>
                <text x={xS(m)+3} y={pT+11} fontSize="9" fontFamily="Inter,sans-serif" fill={col} fontWeight="600">{lbl}</text></g>
              ))}
              {/* Peak marker */}
              <circle cx={xS(peakIdx)} cy={yS(minCum)} r="5" fill={C.warn} stroke="#fff" strokeWidth="1.5"/>
              <text x={xS(peakIdx)+7} y={yS(minCum)+4} fontSize="9" fontFamily="Inter,sans-serif" fill={C.warn} fontWeight="700">{fM(minCum)}</text>
              {/* Break-even marker */}
              {breakEvenIdx>=0&&<circle cx={xS(breakEvenIdx)} cy={yZ} r="4" fill={C.accent} stroke="#fff" strokeWidth="1.5"/>}
              {/* X axis */}
              {Array.from({length:Math.min(7,totalM+1)},(_,i)=>{const m=Math.round(i*totalM/6);return<text key={m} x={xS(m)} y={H-pB+14} textAnchor="middle" fontSize="9" fontFamily="Inter,sans-serif" fill="#8a9bae">M{m}</text>;})}
              <text x={pL-10} y={H-pB+14} fontSize="8" fontFamily="Inter,sans-serif" fill="#8a9bae" textAnchor="end">Month</text>
            </svg>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8,marginTop:8}}>
              {[
                {label:"Peak Capital Exposure",value:fM(Math.abs(minCum)),sub:`Month ${peakIdx}`,color:C.warn,bg:C.warnBg},
                {label:"Equity Required",value:fM(equityRequired),sub:"Developer equity in",color:C.brand,bg:C.brandLight},
                {label:"Break-Even Month",value:breakEvenIdx>=0?`M${breakEvenIdx}`:"Post-project",sub:"Cash turns positive",color:C.teal,bg:"#e8f8f5"},
                {label:"Net Developer Profit",value:fM(profit),sub:`${margin?.toFixed(1)}% margin on cost`,color:profit>=0?C.accent:C.warn,bg:profit>=0?"#f0fdf9":C.warnBg},
              ].map((s,i)=>(
                <div key={i} style={{background:s.bg,borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:C.muted,fontFamily:sans,marginBottom:3}}>{s.label}</div>
                  <div style={{fontSize:16,fontWeight:800,fontFamily:mono,color:s.color}}>{s.value}</div>
                  <div style={{fontSize:10,color:C.muted,marginTop:1}}>{s.sub}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:8,padding:"8px 12px",background:"#f8f9fa",borderRadius:6,fontSize:11,color:C.muted,fontFamily:sans,lineHeight:1.6}}>
              <strong>Model:</strong> Land at M0  Soft costs spread over {planM}-month planning/permit phase  Hard costs on S-curve over {buildM}-month construction  Sales proceeds over final {saleM} months  {Math.round(lvrPct)}% LVR applied to construction drawdowns. Peak exposure = maximum cumulative cash outflow before settlement receipts. For planning purposes only  engage QS and development finance broker for detailed monthly cash flow model.
            </div>
          </div>
        );
      }

      /*  RATE  PRICE SENSITIVITY MATRIX  */
      function RatePriceSensitivity({baseGrv,baseCost,baseRatePct,seniorDebt,loanMonths}){
        if(!baseGrv||!baseCost||!baseRatePct)return<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:20}}>Enter GRV, cost and loan rate to generate matrix</div>;
        const priceDs=[-10,-7,-4,-2,0,+2,+4,+7];
        const rateDs=[-1.5,-1,-0.5,0,+0.5,+1,+1.5,+2];
        /* Extract non-interest cost: baseCost already includes calcInterest.
           Reverse-engineer base interest using same S-curve formula, then re-calc with new rate */
        const baseInterest=seniorDebt*0.65*(baseRatePct/100)*(loanMonths/12);
        const nonInterestCost=baseCost-baseInterest;
        return(
          <div style={{overflowX:"auto"}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:8,fontFamily:sans}}>
              Rows = Sale price &Delta;%  Columns = Interest rate &Delta; (p.a.)  Cells = Margin on Cost  Base rate: <strong>{baseRatePct}% p.a.</strong>
              &nbsp;&nbsp;<span style={{color:C.warn}}>Red &lt;15%</span>&nbsp;&nbsp;<span style={{color:"#b7770d"}}>Amber 1520%</span>&nbsp;&nbsp;<span style={{color:"#1e8449"}}>Green 20%</span>
            </div>
            <table style={{borderCollapse:"collapse",fontFamily:mono,fontSize:11,width:"100%",minWidth:480}}>
              <thead>
                <tr>
                  <th style={{padding:"6px 8px",background:"#f4f6f9",fontSize:10,fontFamily:sans,color:C.slate,whiteSpace:"nowrap"}}>Price / Rate</th>
                  {rateDs.map(d=><th key={d} style={{padding:"5px 8px",background:"#f4f6f9",fontSize:10,fontFamily:sans,color:d>0?C.warn:d<0?C.accent:C.ink,textAlign:"center"}}>{d>0?"+":""}{d}%</th>)}
                </tr>
              </thead>
              <tbody>
                {priceDs.map(pd=>(
                  <tr key={pd}>
                    <td style={{padding:"6px 8px",fontFamily:sans,fontSize:10,color:pd>0?C.accent:pd<0?C.warn:C.ink,fontWeight:700,textAlign:"center",whiteSpace:"nowrap"}}>{pd>0?"+":""}{pd}%</td>
                    {rateDs.map(rd=>{
                      const newGrv=baseGrv*(1+pd/100);
                      const newRate=baseRatePct+rd;
                      const newInterest=seniorDebt*0.65*(newRate/100)*(loanMonths/12);
                      const newCost=nonInterestCost+newInterest;
                      const m=newCost>0?(newGrv-newCost)/newCost*100:0;
                      const profit=newGrv-newCost;
                      const bg=m>=20?"#d5f5e3":m>=15?"#fef9e7":m>=0?"#fdebd0":"#fdedec";
                      const fc=m>=20?"#1e8449":m>=15?"#7d6608":m>=0?"#784212":"#c0392b";
                      const isBase=rd===0&&pd===0;
                      return<td key={rd} style={{padding:"5px 7px",background:bg,color:fc,textAlign:"center",fontWeight:isBase?900:500,border:isBase?`2px solid ${C.ink}`:"none",lineHeight:1.3}}>
                        <div style={{fontSize:11}}>{m.toFixed(1)}%</div>
                        <div style={{fontSize:9,opacity:.7}}>{fmtM(profit)}</div>
                      </td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      /*  2D SITE SETBACK & BUILDING ENVELOPE VISUALIZER (Turf.js-powered)  */
      /* ResCode setbacks table  B6 (front), B17 (side/rear), B28 (garden area), site coverage by zone */
      const ZSB_RESCODE={
        NRZ: {f:7.5,r:6,s1:1.5,s2:2.0,cov:0.50,gdn:0.35,ffu:4.0},
        GRZ: {f:5.0,r:3,s1:1.2,s2:1.5,cov:0.60,gdn:0.35,ffu:4.0},
        RGZ: {f:3.0,r:3,s1:1.2,s2:1.5,cov:0.65,gdn:0.20,ffu:3.0},
        MUZ: {f:3.0,r:2,s1:1.0,s2:1.5,cov:0.70,gdn:0.15,ffu:2.0},
        C1Z: {f:0.0,r:0,s1:0.0,s2:0.5,cov:0.80,gdn:0.05,ffu:0.0},
        LDRZ:{f:7.5,r:6,s1:2.0,s2:2.5,cov:0.30,gdn:0.50,ffu:6.0},
      };

      /*  VICMAP PARCEL BOUNDARY QUERY  */
      /* Queries DEECA public ArcGIS for real Victorian lot polygon.
         Falls back to DataVic WFS geoserver if ArcGIS fails.
         Returns a GeoJSON Feature<Polygon|MultiPolygon> or null. */
      async function fetchVicmapParcel(lat,lon){
        /* Attempt 1  services6.arcgis.com Vicmap Property FeatureServer */
        const ARCGIS=`https://services6.arcgis.com/GB33F62SbDxJjwEL/arcgis/rest/services/Vicmap_Property/FeatureServer/0/query`;
        const p=new URLSearchParams({geometry:`${lon},${lat}`,geometryType:"esriGeometryPoint",
          inSR:"4326",spatialRel:"esriSpatialRelWithin",outFields:"propnum,lga_code",
          returnGeometry:"true",outSR:"4326",f:"geojson"});
        try{
          const r=await fetch(`${ARCGIS}?${p}`,{signal:AbortSignal.timeout(10000)});
          if(!r.ok)throw new Error("HTTP "+r.status);
          const d=await r.json();
          const feat=d.features?.[0];
          if(feat?.geometry?.type?.includes("Polygon"))return feat;
        }catch(e){/* try WFS */}

        /* Attempt 2  DataVic WFS geoserver */
        try{
          const WFS=`https://opendata.maps.vic.gov.au/geoserver/datavic/wfs`+
            `?service=WFS&version=2.0.0&request=GetFeature&typeNames=datavic:VMPROPTY_PARCEL_MP`+
            `&CQL_FILTER=INTERSECTS(SHAPE,POINT(${lon}%20${lat}))&outputFormat=application/json&srsName=EPSG:4326&count=1`;
          const r=await fetch(WFS,{signal:AbortSignal.timeout(10000)});
          if(!r.ok)throw new Error("HTTP "+r.status);
          const d=await r.json();
          const feat=d.features?.[0];
          if(feat?.geometry?.type?.includes("Polygon"))return feat;
        }catch(e){/* both failed */}

        return null;
      }

      /* Helper: build rectangular site + buildable envelope polygons via Turf.js
         wallHeight: actual proposed wall height in metres (from plan.maxHeight).
         B17 dynamic upper setback: max(sb.s2, (wallHeight  3.6)  0.3)
         Example: 9m wall  (93.6)0.3 = 1.62m > 1.5m (GRZ sb.s2)  1.62m used */
      function computeTurfSetbacks(lat,lon,F,D,zone,wallHeight){
        if(typeof turf==="undefined"||!lat||!lon||!F||!D)return null;
        try{
          const sb=ZSB_RESCODE[zone]||ZSB_RESCODE.GRZ;
          /* ResCode B17  upper floor side setback increases with wall height above 3.6m */
          const wh=parseFloat(wallHeight)||0;
          const s2_dyn=wh>3.6?Math.max(sb.s2,(wh-3.6)*0.3):sb.s2;
          const latDeg=1/111320;
          const lonDeg=1/(111320*Math.cos(lat*Math.PI/180));
          const hW=(F/2)*lonDeg, hD=(D/2)*latDeg;
          /* site polygon  NWNESESWclose; street at SOUTH */
          const sitePoly=turf.polygon([[
            [lon-hW, lat+hD],[lon+hW, lat+hD],
            [lon+hW, lat-hD],[lon-hW, lat-hD],
            [lon-hW, lat+hD],
          ]]);
          /* buildable envelope  asymmetric setbacks: front (south), rear (north), sides */
          const bW=Math.max(0,F-sb.s1*2), bD=Math.max(0,D-sb.f-sb.r);
          const bHW=(bW/2)*lonDeg, bHD=(bD/2)*latDeg;
          /* center of buildable zone is shifted north by (sb.f-sb.r)/2 from lot center */
          const bCY=lat+(sb.f-sb.r)/2*latDeg;
          const buildPoly=turf.polygon([[
            [lon-bHW, bCY+bHD],[lon+bHW, bCY+bHD],
            [lon+bHW, bCY-bHD],[lon-bHW, bCY-bHD],
            [lon-bHW, bCY+bHD],
          ]]);
          /* upper floor  B17 dynamic side setbacks */
          const uW=Math.max(0,F-s2_dyn*2), uHW=(uW/2)*lonDeg;
          const upperPoly=turf.polygon([[
            [lon-uHW, bCY+bHD],[lon+uHW, bCY+bHD],
            [lon+uHW, bCY-bHD],[lon-uHW, bCY-bHD],
            [lon-uHW, bCY+bHD],
          ]]);
          return{
            siteAreaTurf:    turf.area(sitePoly),
            buildAreaTurf:   turf.area(buildPoly),
            upperAreaTurf:   turf.area(upperPoly),
            coverageLimitM2: turf.area(sitePoly)*sb.cov,
            gardenReqM2:     turf.area(sitePoly)*sb.gdn,
            gardenAvailM2:   Math.max(0,turf.area(sitePoly)-Math.min(turf.area(buildPoly),turf.area(sitePoly)*sb.cov)),
            sb,bW,bD,uW,s2_dyn,
            /* GeoJSON bbox corners for SVG projection [minLon,minLat,maxLon,maxLat] */
            bbox:turf.bbox(sitePoly),
          };
        }catch(e){return null;}
      }

      function SiteFootprintVisualizer({frontage,depth,area,zone,estUnits,lat,lon,parcelPoly,parcelStatus,wallHeight,easementWidth=0,hasEasement=false,natTrees=[]}){
        const F=parseFloat(frontage)||0;
        const A=parseFloat(area)||0;
        const D=parseFloat(depth)||(F>0&&A>0?A/F:0);
        const sb=ZSB_RESCODE[zone]||ZSB_RESCODE.GRZ;
        /* B17 dynamic upper setback from wall height */
        const wh=parseFloat(wallHeight)||0;
        const s2_dyn=wh>3.6?Math.max(sb.s2,(wh-3.6)*0.3):sb.s2;

        /*  Mode A: Real parcel polygon from Vicmap  */
        const parcelData=useMemo(()=>{
          if(!parcelPoly||typeof turf==="undefined")return null;
          try{
            const siteF=turf.feature(parcelPoly.geometry||parcelPoly);
            const siteArea=turf.area(siteF);
            const bbox=turf.bbox(siteF); // [minLon,minLat,maxLon,maxLat]
            const midLatRad=((bbox[1]+bbox[3])/2)*Math.PI/180;
            const widthM=(bbox[2]-bbox[0])*111320*Math.cos(midLatRad);  // E-W metres
            const heightM=(bbox[3]-bbox[1])*111320;                      // N-S metres
            const degPerM_NS=1/111320;

            /*  Front Setback Geometry (south-edge heuristic)
               Melbourne convention: frontage = southern lot edge (faces street).
               Create a strip from bbox[1] (south) extending north by sb.f metres,
               then intersect with siteF to clip to actual lot shape.            */
            let frontSetbackF=null;
            try{
              const fDeg=sb.f*degPerM_NS;
              const frontPoly=turf.polygon([[
                [bbox[0],bbox[1]],[bbox[2],bbox[1]],
                [bbox[2],bbox[1]+fDeg],[bbox[0],bbox[1]+fDeg],[bbox[0],bbox[1]]
              ]]);
              frontSetbackF=turf.intersect(siteF,frontPoly);
            }catch(_fs){frontSetbackF=null;}

            /*  Easement Geometry (rear / north-edge)
               Section 32 easement width (eW metres)  assumed rear placement.
               Creates a strip from bbox[3] (north) extending south by eW metres. */
            let easementF=null;
            const eW=parseFloat(easementWidth)||0;
            if(hasEasement&&eW>0){
              try{
                const eDeg=eW*degPerM_NS;
                const rearPoly=turf.polygon([[
                  [bbox[0],bbox[3]-eDeg],[bbox[2],bbox[3]-eDeg],
                  [bbox[2],bbox[3]],[bbox[0],bbox[3]],[bbox[0],bbox[3]-eDeg]
                ]]);
                easementF=turf.intersect(siteF,rearPoly);
              }catch(_ea){easementF=null;}
            }

            /*  Buildable Envelope: buffer  frontSetback  easement
               1. Uniform side-setback buffer (sb.s1) as the base
               2. Subtract front setback zone (sb.f > sb.s1 so front bites into buffer)
               3. Subtract rear easement if present
               Falls back to plain turf.buffer if any boolean op fails.          */
            let buildF=null;
            try{
              const bufF=turf.buffer(siteF,-sb.s1/1000,{units:"kilometers"});
              if(bufF){
                let tmp=bufF;
                if(frontSetbackF){
                  const d1=turf.difference(tmp,frontSetbackF);
                  if(d1)tmp=d1;
                }
                if(easementF){
                  const d2=turf.difference(tmp,easementF);
                  if(d2)tmp=d2;
                }
                buildF=tmp;
              }
            }catch(_bf){
              /* Graceful degradation: plain uniform buffer */
              try{buildF=turf.buffer(siteF,-sb.s1/1000,{units:"kilometers"});}catch(_){buildF=null;}
            }

            /*  Upper floor envelope (B17 dynamic side setback)  */
            let upperF=null;
            try{upperF=turf.buffer(siteF,-s2_dyn/1000,{units:"kilometers"});}catch(_){upperF=null;}

            /*  Areas  */
            const buildArea=buildF?turf.area(buildF):0;
            const upperArea=upperF?turf.area(upperF):0;
            const coverageLimit=siteArea*sb.cov;
            const effBuild=Math.min(buildArea,coverageLimit);
            const gardenReq=siteArea*sb.gdn;
            const gardenAvail=Math.max(0,siteArea-effBuild);

            /*  SVG projection  */
            const PAD={t:20,r:55,b:40,l:20};
            const SVW=500,SVH=395,cW=SVW-PAD.l-PAD.r,cH=SVH-PAD.t-PAD.b;
            const lonR=bbox[2]-bbox[0],latR=bbox[3]-bbox[1];
            const scl=Math.min(cW/lonR,cH/latR)*0.88;
            const ox=PAD.l+(cW-lonR*scl)/2,oy=PAD.t+(cH-latR*scl)/2;
            const proj=([ln,lt])=>[ox+(ln-bbox[0])*scl, oy+(bbox[3]-lt)*scl];
            const ringPath=(ring)=>"M "+ring.map(proj).map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join("L ")+" Z";
            const geomToPath=(geom)=>{
              if(!geom)return"";
              if(geom.type==="Polygon")return geom.coordinates.map(ringPath).join(" ");
              if(geom.type==="MultiPolygon")return geom.coordinates.flat().map(ringPath).join(" ");
              return"";
            };

            /*  TPZ circles (unchanged from v48)  */
            const treeCircles=(natTrees||[]).filter(t=>t.lat&&t.lon).map(t=>{
              try{
                const [tx,ty]=proj([t.lon,t.lat]);
                const circM=parseFloat(t.circumference)||0;
                const dbhMm=circM>0?Math.round(circM/Math.PI*1000):400;
                const tpzM=calcTPZFromDBH(dbhMm);
                const rSvg=Math.max(12,tpzM*scl);
                return{x:parseFloat(tx.toFixed(1)),y:parseFloat(ty.toFixed(1)),
                       r:parseFloat(rSvg.toFixed(1)),species:t.species||"Tree",
                       d:t.d,dbhMm,tpzM:parseFloat(tpzM.toFixed(1))};
              }catch(_){return null;}
            }).filter(Boolean);

            return{
              siteArea,buildArea:effBuild,upperArea:Math.min(upperArea,coverageLimit),
              gardenReq,gardenAvail,gardenOK:gardenAvail>=gardenReq,coverageLimit,
              sitePath:geomToPath(siteF.geometry),
              buildPath:buildF?geomToPath(buildF.geometry):"",
              upperPath:upperF?geomToPath(upperF.geometry):"",
              frontSetbackPath:frontSetbackF?geomToPath(frontSetbackF.geometry):"",
              easementPath:easementF?geomToPath(easementF.geometry):"",
              hasFrontSetback:!!frontSetbackF,hasEasementLayer:!!easementF,
              eW,widthM,heightM,
              SVW,SVH,PAD,treeCircles,
            };
          }catch(e){return null;}
        },[parcelPoly,sb,s2_dyn,natTrees,easementWidth,hasEasement]);

        /*  Mode B: Turf.js rectangular approx (from lat/lon + dimensions)  */
        const turfRes=useMemo(()=>{
          if(parcelData)return null; // real polygon takes priority
          return computeTurfSetbacks(parseFloat(lat),parseFloat(lon),F,D,zone,wh);
        },[parcelData,lat,lon,F,D,zone,wh]);

        if(!F||!D||!zone)return(
          <div style={{textAlign:"center",padding:"20px 10px",color:C.muted,fontSize:12,fontFamily:sans}}>
            Enter <strong>Frontage</strong>, <strong>Depth</strong> (or Area), and <strong>Zone</strong> to generate envelope
          </div>
        );

        /*  Derived values (unified across all modes)  */
        const siteAreaFallback=A||F*D;
        const gfW=Math.max(0,F-sb.s1*2), gfD=Math.max(0,D-sb.f-sb.r);
        /* B17: upper floor uses dynamic setback based on wall height */
        const ffW=Math.max(0,F-s2_dyn*2), ffArea=ffW*Math.max(0,D-sb.f-sb.r-1);
        const dispSiteArea = parcelData?.siteArea ?? turfRes?.siteAreaTurf ?? siteAreaFallback;
        const maxCovM2=dispSiteArea*sb.cov;
        const effGF = parcelData?.buildArea ?? (turfRes?Math.min(turfRes.buildAreaTurf,turfRes.coverageLimitM2):Math.min(gfW*gfD,maxCovM2));
        const gardenReq = parcelData?.gardenReq ?? (turfRes?.gardenReqM2 ?? siteAreaFallback*sb.gdn);
        const gardenAvail = parcelData?.gardenAvail ?? (turfRes?.gardenAvailM2 ?? Math.max(0,siteAreaFallback-effGF));
        const gardenOK = parcelData?.gardenOK ?? (gardenAvail>=gardenReq);
        const dispS2=(turfRes?.s2_dyn??s2_dyn).toFixed(2);
        const dispUpperArea = parcelData?.upperArea ?? (turfRes?Math.min(turfRes.upperAreaTurf,maxCovM2):ffArea);
        const hasRealParcel=!!parcelData;
        const hasTurf=!!(turfRes||parcelData);

        /*  SVG for Mode B (rectangular)  */
        const PAD_B={t:20,r:50,b:64,l:20};
        const SVW_B=500,SVH_B=360,cW_B=SVW_B-PAD_B.l-PAD_B.r,cH_B=SVH_B-PAD_B.t-PAD_B.b;
        const sclB=Math.min(cW_B/F,cH_B/D);
        const oxB=PAD_B.l+(cW_B-F*sclB)/2,oyB=PAD_B.t;
        const sW_B=F*sclB,sH_B=D*sclB;
        const bW_sv=(turfRes?turfRes.bW:gfW)*sclB,bD_sv=(turfRes?turfRes.bD:gfD)*sclB;
        const gfX=oxB+(F*sclB-bW_sv)/2,gfY=oyB+sb.f*sclB,gfPH=bD_sv;
        const uW_sv=(turfRes?turfRes.uW:ffW)*sclB; // uses s2_dyn via turfRes.uW or fallback ffW
        const ffX=oxB+(F*sclB-uW_sv)/2,ffY=gfY,ffPW=uW_sv,ffPH=bD_sv;
        const rearY=gfY+gfPH,rearH=sb.r*sclB,frontH=sb.f*sclB;
        const fs=11;

        return(
          <div>
            {/* Status badge */}
            {hasRealParcel?(
              <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"#f0fdf4",border:"1px solid #86efac",borderRadius:20,padding:"4px 12px",fontSize:11,color:"#15803d",fontFamily:mono,marginBottom:8}}>
                <span style={{fontWeight:800}}> Vicmap Parcel</span>
                <span>real lot boundary  {dispSiteArea.toFixed(0)}m
                  {parcelData?.hasFrontSetback&&<span style={{color:"#c2410c",marginLeft:6}}> Front {sb.f}m</span>}
                  {parcelData?.hasEasementLayer&&<span style={{color:"#dc2626",marginLeft:6}}> Easement {parcelData.eW}m</span>}
                  {!parcelData?.hasFrontSetback&&<span style={{opacity:.65}}> side {sb.s1}m buffer</span>}
                </span>
              </div>
            ):parcelStatus==="loading"?(
              <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:20,padding:"4px 12px",fontSize:11,color:"#1e40af",fontFamily:mono,marginBottom:8}}>
                <span> Fetching Vicmap parcel boundary</span>
              </div>
            ):hasTurf?(
              <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"#ecfdf5",border:"1px solid #6ee7b7",borderRadius:20,padding:"3px 10px",fontSize:11,color:"#065f46",fontFamily:mono,marginBottom:8}}>
                <span style={{fontWeight:700}}> Turf.js</span>
                <span>rectangular approx  {dispSiteArea.toFixed(0)}m from coordinates</span>
              </div>
            ):(
              <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"#fefce8",border:"1px solid #fde68a",borderRadius:20,padding:"3px 10px",fontSize:11,color:"#92400e",fontFamily:mono,marginBottom:8}}>
                <span> Estimate only  Search address to activate Vicmap + Turf.js</span>
              </div>
            )}

            {/*  SVG: Mode A  real parcel polygon (4-layer envelope)  */}
            {hasRealParcel&&parcelData.sitePath&&(
              <svg viewBox={`0 0 ${parcelData.SVW} ${parcelData.SVH}`} style={{width:"100%",maxWidth:parcelData.SVW,display:"block"}}>
                <defs>
                  {/* Orange diagonal hatch  front setback zone */}
                  <pattern id="frontSetbackPat" patternUnits="userSpaceOnUse" width="8" height="8">
                    <line x1="0" y1="8" x2="8" y2="0" stroke="#f97316" strokeWidth="1.4" opacity="0.55"/>
                  </pattern>
                  {/* Red cross-hatch  easement / prohibited zone */}
                  <pattern id="easementPat" patternUnits="userSpaceOnUse" width="8" height="8">
                    <line x1="0" y1="0" x2="8" y2="8" stroke="#dc2626" strokeWidth="1.3" opacity="0.6"/>
                    <line x1="0" y1="8" x2="8" y2="0" stroke="#dc2626" strokeWidth="1.3" opacity="0.6"/>
                  </pattern>
                  {/* Garden green hatch  side/rear setback residual */}
                  <pattern id="setbackPat2" patternUnits="userSpaceOnUse" width="8" height="8">
                    <line x1="0" y1="8" x2="8" y2="0" stroke="#94a3b8" strokeWidth="0.9" opacity="0.35"/>
                  </pattern>
                </defs>

                {/* LAYER 1: Site boundary  light gray base (all zones visible) */}
                <path d={parcelData.sitePath} fill="#f1f5f9" stroke="#1e293b" strokeWidth="2.5"/>

                {/* LAYER 2: Side/rear setback hatch  gray stripe over site */}
                <path d={parcelData.sitePath} fill="url(#setbackPat2)" opacity="0.6"/>

                {/* LAYER 3: Front setback zone  orange hatch (south edge) */}
                {parcelData.frontSetbackPath&&(
                  <>
                    <path d={parcelData.frontSetbackPath} fill="#fff" opacity="0.4"/>
                    <path d={parcelData.frontSetbackPath} fill="url(#frontSetbackPat)" stroke="#f97316" strokeWidth="1.5"/>
                  </>
                )}

                {/* LAYER 4: Easement zone  red cross-hatch (north / rear edge) */}
                {parcelData.easementPath&&(
                  <>
                    <path d={parcelData.easementPath} fill="#fee2e2" fillOpacity="0.5"/>
                    <path d={parcelData.easementPath} fill="url(#easementPat)" stroke="#dc2626" strokeWidth="1.5"/>
                  </>
                )}

                {/* LAYER 5: Buildable envelope  green (final usable area) */}
                {parcelData.buildPath&&<path d={parcelData.buildPath} fill="#fff" opacity="0.7"/>}
                {parcelData.buildPath&&(
                  <path d={parcelData.buildPath} fill="#22c55e" fillOpacity="0.28" stroke="#16a34a" strokeWidth="2"/>
                )}

                {/* LAYER 6: Upper floor envelope  purple dashed (B17) */}
                {parcelData.upperPath&&(
                  <path d={parcelData.upperPath} fill="none" stroke="#7c3aed" strokeWidth="1.5" strokeDasharray="6,3"/>
                )}

                {/* LAYER 7: TPZ circles  OSM nature-strip trees (AS 4970-2009) */}
                {parcelData.treeCircles?.map((t,i)=>(
                  <g key={`tpz-${i}`}>
                    <circle cx={t.x} cy={t.y} r={t.r}
                      fill="#ef4444" fillOpacity="0.14" stroke="#b91c1c" strokeWidth="1.5" strokeDasharray="4,2"/>
                    <circle cx={t.x} cy={t.y} r="5" fill="#b91c1c" fillOpacity="0.9"/>
                    <text x={t.x} y={t.y-t.r-4} textAnchor="middle" fontSize="8"
                      fontWeight="700" fontFamily="Inter,sans-serif" fill="#991b1c">
                      TPZ {t.tpzM}m
                    </text>
                  </g>
                ))}

                {/* Centre label  buildable area (show only when buildPath exists) */}
                {parcelData.buildPath&&(
                  <>
                    <text x={parcelData.SVW/2} y={parcelData.SVH/2-12} textAnchor="middle"
                      fontSize="15" fontWeight="800" fontFamily="Inter,sans-serif" fill="#15803d">
                      {effGF.toFixed(0)}m
                    </text>
                    <text x={parcelData.SVW/2} y={parcelData.SVH/2+6} textAnchor="middle"
                      fontSize="10" fontFamily="Inter,sans-serif" fill="#15803d">
                      buildable envelope
                    </text>
                    {parcelData.hasFrontSetback&&(
                      <text x={parcelData.SVW/2} y={parcelData.SVH/2+20} textAnchor="middle"
                        fontSize="9" fontFamily="Inter,sans-serif" fill="#c2410c">
                         {sb.f}m front setback (south)
                      </text>
                    )}
                  </>
                )}

                {/* Legend row 1: Buildable + Upper + Front setback */}
                <g transform={`translate(${parcelData.PAD.l},${parcelData.SVH-27})`}>
                  <rect width="10" height="8" fill="#22c55e" fillOpacity="0.5" stroke="#16a34a"/>
                  <text x="13" y="7.5" fontSize="8.5" fill="#15803d" fontFamily="Inter,sans-serif" fontWeight="600">Buildable {effGF.toFixed(0)}m</text>
                  <rect x="98" width="10" height="8" fill="none" stroke="#7c3aed" strokeDasharray="3,2"/>
                  <text x="111" y="7.5" fontSize="8.5" fill="#475569" fontFamily="Inter,sans-serif">Upper ({dispS2}m B17)</text>
                  <rect x="210" width="10" height="8" fill="url(#frontSetbackPat)" stroke="#f97316" strokeWidth="0.5"/>
                  <text x="223" y="7.5" fontSize="8.5" fill="#c2410c" fontFamily="Inter,sans-serif">Front {sb.f}m setback</text>
                  {parcelData.easementPath&&(
                    <>
                      <rect x="330" width="10" height="8" fill="url(#easementPat)" stroke="#dc2626" strokeWidth="0.5"/>
                      <text x="343" y="7.5" fontSize="8.5" fill="#dc2626" fontFamily="Inter,sans-serif" fontWeight="600">Easement {parcelData.eW}m</text>
                    </>
                  )}
                </g>
                {/* Legend row 2: TPZ info */}
                {parcelData.treeCircles?.length>0&&(
                  <g transform={`translate(${parcelData.PAD.l},${parcelData.SVH-14})`}>
                    <circle cx="5" cy="4" r="5" fill="#ef4444" fillOpacity="0.3" stroke="#b91c1c" strokeWidth="1" strokeDasharray="2,1"/>
                    <circle cx="5" cy="4" r="2" fill="#b91c1c"/>
                    <text x="13" y="7.5" fontSize="8.5" fill="#b91c1c" fontFamily="Inter,sans-serif" fontWeight="600">
                      TPZ zone  {parcelData.treeCircles.length} tree{parcelData.treeCircles.length>1?"s":""} (OSM  AS 4970-2009 r=12DBH)
                    </text>
                  </g>
                )}
              </svg>
            )}
            {/*  SVG: Mode B  rectangular approximation  */}
            {!hasRealParcel&&(
              <svg viewBox={`0 0 ${SVW_B} ${SVH_B}`} style={{width:"100%",maxWidth:SVW_B,display:"block"}}>
                <defs>
                  <pattern id="gdnPat" patternUnits="userSpaceOnUse" width="10" height="10">
                    <line x1="0" y1="10" x2="10" y2="0" stroke="#22c55e" strokeWidth="1.2" opacity="0.5"/>
                  </pattern>
                  <pattern id="frontPat" patternUnits="userSpaceOnUse" width="8" height="8">
                    <line x1="0" y1="8" x2="8" y2="0" stroke="#f97316" strokeWidth="1" opacity="0.4"/>
                  </pattern>
                </defs>
                <rect x={oxB} y={oyB} width={sW_B} height={sH_B} fill="#f1f5f9" stroke="#1e293b" strokeWidth="2.5"/>
                <rect x={oxB} y={oyB+sH_B-frontH} width={sW_B} height={frontH} fill="url(#frontPat)"/>
                <rect x={gfX} y={rearY} width={bW_sv} height={rearH} fill="url(#gdnPat)"/>
                <rect x={gfX} y={gfY} width={bW_sv} height={gfPH} fill="#3b82f6" fillOpacity="0.22" stroke="#2563eb" strokeWidth="2"/>
                {dispUpperArea>0&&<rect x={ffX} y={ffY} width={ffPW} height={ffPH} fill="none" stroke="#7c3aed" strokeWidth="1.5" strokeDasharray="6,3"/>}
                <text x={gfX+bW_sv/2} y={gfY+gfPH/2-8} textAnchor="middle" fontSize={fs} fontWeight="700" fontFamily="Inter,sans-serif" fill="#1d4ed8">{(turfRes?turfRes.bW:gfW).toFixed(1)}m  {(turfRes?turfRes.bD:gfD).toFixed(1)}m</text>
                <text x={gfX+bW_sv/2} y={gfY+gfPH/2+8} textAnchor="middle" fontSize={fs-1} fontFamily="Inter,sans-serif" fill="#1d4ed8">GF: {effGF.toFixed(0)}m</text>
                <text x={oxB+sW_B/2} y={oyB+sH_B-frontH/2+4} textAnchor="middle" fontSize={fs-1} fill="#c2410c" fontFamily="Inter,sans-serif" fontWeight="600">Front {sb.f}m</text>
                {rearH>12&&<text x={gfX+bW_sv/2} y={rearY+rearH/2+4} textAnchor="middle" fontSize={fs-1} fill="#15803d" fontFamily="Inter,sans-serif" fontWeight="600">Rear {sb.r}m</text>}
                {sb.s1>0&&<text x={oxB+sb.s1*sclB/2} y={gfY+gfPH/2} textAnchor="middle" fontSize={fs-2} fill="#c2410c" fontFamily="Inter,sans-serif" transform={`rotate(-90,${oxB+sb.s1*sclB/2},${gfY+gfPH/2})`}>{sb.s1}m</text>}
                <line x1={oxB} y1={oyB+sH_B+12} x2={oxB+sW_B} y2={oyB+sH_B+12} stroke={C.muted} strokeWidth="1"/>
                <line x1={oxB} y1={oyB+sH_B+8} x2={oxB} y2={oyB+sH_B+16} stroke={C.muted} strokeWidth="1"/>
                <line x1={oxB+sW_B} y1={oyB+sH_B+8} x2={oxB+sW_B} y2={oyB+sH_B+16} stroke={C.muted} strokeWidth="1"/>
                <text x={oxB+sW_B/2} y={oyB+sH_B+24} textAnchor="middle" fontSize={fs} fill={C.slate} fontFamily="Inter,sans-serif">Frontage: {F}m</text>
                <line x1={oxB+sW_B+10} y1={oyB} x2={oxB+sW_B+10} y2={oyB+sH_B} stroke={C.muted} strokeWidth="1"/>

      /*  FEASIBILITY GAUGE  */
      function FeasGauge({score}){
        const angle=(score/100)*180-90;
        const rad=angle*Math.PI/180;
        const r=68,cx=90,cy=88;
        const nx=cx+r*Math.cos(rad),ny=cy+r*Math.sin(rad);

      /*  DOCUMENT PARSERS & Q4 HELPERS  */

      /* Planning Permit Fee  VBA Victoria 2024-25 fee schedule */
      function calcPlanningPermitFee(projectCost){
        if(!projectCost||projectCost<=0)return 0;
        if(projectCost<=10000)return 199;
        if(projectCost<=100000)return Math.round(199+(projectCost-10000)*0.0017);
        if(projectCost<=1000000)return Math.round(369+(projectCost-100000)*0.0024);
        if(projectCost<=5000000)return Math.round(2525+(projectCost-1000000)*0.00145);
        if(projectCost<=15000000)return Math.round(8325+(projectCost-5000000)*0.0012);
        if(projectCost<=50000000)return Math.round(20325+(projectCost-15000000)*0.0006);
        return 41325;
      }

      /* Growth Corridor Infrastructure Contributions Plan (ICP)  $/ha residential approx 2024 */
      const GROWTH_LEVY={
        "Casey":{ratePerHa:130000,note:"Casey ICP residential infrastructure levy"},
        "Wyndham":{ratePerHa:145000,note:"Wyndham ICP residential levy  one of highest in metro"},
        "Hume":{ratePerHa:135000,note:"Hume ICP residential levy"},
        "Melton":{ratePerHa:125000,note:"Melton ICP residential levy"},
        "Whittlesea":{ratePerHa:135000,note:"Whittlesea ICP residential levy"},
        "Cardinia":{ratePerHa:130000,note:"Cardinia ICP residential levy"},
        "Yarra Ranges":{ratePerHa:80000,note:"Yarra Ranges development contributions  lower rate (semi-rural)"},
      };
      function calcGrowthLevy(councilName,areaM2){
        const norm=s=>(s||"").toLowerCase();
        const key=Object.keys(GROWTH_LEVY).find(k=>norm(councilName).includes(norm(k)));
        if(!key||!areaM2)return{levy:0,found:false,note:""};
        const areaHa=areaM2/10000;
        const levy=Math.round(GROWTH_LEVY[key].ratePerHa*areaHa);
        return{levy,found:true,note:GROWTH_LEVY[key].note,rate:GROWTH_LEVY[key].ratePerHa,areaHa:areaHa.toFixed(3)};
      }

      /*
         VicPlan Planning Property Report parser (v2  battle-tested)
         Handles official DELWP/DEECA VicPlan PDF output format
         Returns:
           zone          "GRZ1" | "NRZ" | ...
           overlays      [{flag, label}, ...]    specific overlays found
           overlaysConfirmedNone  true if report explicitly says "None"
           council       "Manningham" | ...
           bushfire      "No" | "Yes" | ""
           propnum       property number string
           area          land area in m (string)
           lot           lot reference string
           rawLines      first 60 extracted lines for debugging
          */
      function parseVicPlanText(text){
        if(!text||!text.trim())return null;
        // Normalise whitespace while preserving line breaks for context scanning
        const t=text.replace(/\r\n/g,"\n").replace(/[ \t]+/g," ").trim();
        const tUpper=t.toUpperCase();
        const result={zone:"",overlays:[],overlaysConfirmedNone:false,council:"",bushfire:"",propnum:"",area:"",lot:"",address:"",nativeVeg:"",rawLines:t.split("\n").slice(0,60)};

        /*  1. ZONE DETECTION
           Priority: (a) explicit code in parens like (GRZ1) or "GRZ1 " near "Zone"
                     (b) schedule inline: "General Residential Zone - Schedule 1"
                     (c) base zone code only                                   */
        // (a) Code in parentheses or standalone  most reliable
        const codeInParen=t.match(/\(\s*(NRZ|GRZ|RGZ|MUZ|C1Z|C2Z|LDRZ)\s*(\d+)?\s*\)/i); /* fix: \d+ captures GRZ10+ */
        if(codeInParen){
          result.zone=(codeInParen[1]+(codeInParen[2]||"")).toUpperCase();
        }
        if(!result.zone){
          // (b) Zone code followed or preceded by "Schedule N" in same context
          const codeSchedule=t.match(/\b(NRZ|GRZ|RGZ|MUZ|C1Z|C2Z|LDRZ)\s*[-]?\s*Schedule\s+(\d+)/i)||
            t.match(/Schedule\s+(\d+)\s*[-]?\s*(?:to\s+the\s+)?(NRZ|GRZ|RGZ|MUZ|C1Z|C2Z|LDRZ)/i); /* fix: \d+ */
          if(codeSchedule){
            // group order varies between the two patterns
            const code=codeSchedule[1].length<=4?codeSchedule[1]:codeSchedule[2];
            const sched=codeSchedule[1].length<=4?codeSchedule[2]:codeSchedule[1];
            result.zone=(code+sched).toUpperCase();
          }
        }
        if(!result.zone){
          // (c) Base zone code anywhere
          const codeAlone=t.match(/\b(NRZ\d+|GRZ\d+|RGZ\d+|NRZ|GRZ|RGZ|MUZ|C1Z|C2Z|LDRZ)\b/i); /* fix: \d+ captures GRZ10/NRZ11 */
          if(codeAlone)result.zone=codeAlone[1].toUpperCase();
        }
        if(!result.zone){
          // (d) Long-form name  code, then hunt for schedule number nearby
          const nameMap=[
            {rx:/Neighbourhood\s+Residential\s+Zone/i,code:"NRZ"},
            {rx:/General\s+Residential\s+Zone/i,      code:"GRZ"},
            {rx:/Residential\s+Growth\s+Zone/i,       code:"RGZ"},
            {rx:/Mixed\s+Use\s+Zone/i,                code:"MUZ"},
            {rx:/Low\s+Density\s+Residential/i,       code:"LDRZ"},
            {rx:/Commercial\s+1\s+Zone/i,             code:"C1Z"},
          ];
          for(const {rx,code} of nameMap){
            if(rx.test(t)){
              result.zone=code;
              // Look for "Schedule N" within 120 chars of the zone name match
              const mIdx=t.search(rx);
              const nearby=t.slice(Math.max(0,mIdx-20),mIdx+120);
              const sm=nearby.match(/Schedule\s+(\d+)/i)||nearby.match(/[-(]\s*(\d+)\s*[)]/); /* fix: \d+ */
              if(sm)result.zone=code+sm[1];
              break;
            }
          }
        }

        /*  2. PLANNING OVERLAYS
           Critical: detect explicit "None" first  prevents false positives
           from overlay names appearing elsewhere in document text.          */
        // Detect "None" / "Nil" under the Overlays section heading
        const overlaySection=t.match(/Planning\s+Overlay[s]?[:\s\-]+([^\n]{0,200})/i);
        const overlaySectionText=overlaySection?overlaySection[1]:"";
        const hasNoneKeyword=/\bNone\b|\bNil\b|\bNo\s+Overlays?\b/i;
        if(hasNoneKeyword.test(overlaySectionText)||(tUpper.includes("PLANNING OVERLAYS")&&hasNoneKeyword.test(t.slice(tUpper.indexOf("PLANNING OVERLAYS"),tUpper.indexOf("PLANNING OVERLAYS")+100)))){
          result.overlaysConfirmedNone=true;
          // No overlays  don't search for overlay names in rest of doc
        } else {
          // Only scan for overlay names if not confirmed None
          const overlayDefs=[
            {rx:/Heritage\s+Overlay|\bHO(?:\s*\d+)?\b/i,           flag:"hasHO",   label:"Heritage Overlay (HO)"},
            {rx:/Vegetation\s+Protection\s+Overlay|\bVPO\s*\d*\b/i,flag:"hasVPO",label:"Vegetation Protection Overlay (VPO)"},
            {rx:/Significant\s+Landscape\s+Overlay|\bSLO\s*\d*\b/i,flag:"hasSLO",label:"Significant Landscape Overlay (SLO)"},
            {rx:/Environmental\s+Significance\s+Overlay|\bESO\s*\d*\b/i,flag:"hasESO",label:"Environmental Significance Overlay (ESO)"},
            {rx:/Special\s+Building\s+Overlay|\bSBO\s*\d*\b|Land\s+Subject\s+to\s+Inundation|\bLSIO\s*\d*\b/i,flag:"hasSBO",label:"Flood Risk Overlay (SBO/LSIO)"},
            {rx:/Bushfire\s+Management\s+Overlay|\bBMO\s*\d*\b/i,flag:"hasBMO",label:"Bushfire Management Overlay (BMO)"},
            {rx:/Aboriginal\s+Cultural\s+Heritage\s+Overlay|\bACHO\b/i,flag:"hasAboriginal",label:"Aboriginal Cultural Heritage Overlay (ACHO)"},
            {rx:/Geotechnical\s+Overlay|Landslip\s+Overlay|\bEMO\s*\d*\b|Erosion\s+Management\s+Overlay/i,flag:"hasGeo",label:"Geotechnical/Erosion Overlay (EMO)"},
            {rx:/Design\s+and\s+Development\s+Overlay|\bDDO\s*\d*\b/i,flag:"hasDDO",label:"Design & Development Overlay (DDO)"},
          ];
          overlayDefs.forEach(({rx,flag,label})=>{if(rx.test(t))result.overlays.push({flag,label});});
        }

        /*  3. COUNCIL / LGA  */
        const lgaM=t.match(/(?:Local\s+Government\s+Area|LGA|Council|Municipality)[:\s\-]+([A-Za-z\s]+?)(?:\n|$|,|\()/i);
        if(lgaM){
          const raw=lgaM[1].trim().replace(/^(City\s+of|Shire\s+of|Borough\s+of|Rural\s+City\s+of|Town\s+of)\s+/i,"");
          if(raw.length>2&&raw.length<40)result.council=raw.trim();
        }

        /*  4. BUSHFIRE PRONE AREA  */
        const bfM=t.match(/Bushfire\s+Prone\s+Area[:\s\-]+([A-Za-z]+)/i);
        if(bfM)result.bushfire=bfM[1].trim();

        /*  5. PROPERTY NUMBER  */
        const propM=t.match(/(?:Property\s+No|Prop\.?\s*No\.?|Property\s+Number|PROPNUM|Parcel\s+No)[.:\s]+([A-Z0-9\/\-]+)/i);
        if(propM)result.propnum=propM[1].trim();

        /*  6. LAND AREA  */
        const areaM=t.match(/(?:Land\s+Area|Site\s+Area|Total\s+Area|Area\s+of\s+Land|Lot\s+Area)[:\s]+(\d[\d,]*\.?\d*)\s*(?:m2|m|sq\.?m|square\s+metres?)/i)||
          t.match(/(\d[\d,]{2,})\s*m[2]/); // fallback: any large m value
        if(areaM)result.area=areaM[1].replace(/,/g,"");

        /*  7. LOT / PLAN REFERENCE  */
        const lotM=t.match(/Lot\s+(\d+)\s+(?:on\s+)?(?:LP|PS|TP|SP|CP)\s*(\d+)/i);
        if(lotM)result.lot=`Lot ${lotM[1]} on ${lotM[0].match(/\bPS\b/i)?"PS":"LP"}${lotM[2]}`;

        /*  8. PROPERTY ADDRESS
           VicPlan reports typically show address near the top.
           Pattern: "<number> <street name>, <suburb> VIC <postcode>"  */
        const addrM=t.match(/\b(\d{1,4}[A-Z]?)\s+([A-Za-z][A-Za-z\s'-]{2,40}(?:Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Place|Pl|Way|Lane|Ln|Boulevard|Blvd|Crescent|Cres|Close|Cl|Grove|Gr|Terrace|Tce)[.]?)\s*[,\s]+([A-Za-z][A-Za-z\s]{2,30})\s+VIC\s+(\d{4})/i);
        if(addrM)result.address=`${addrM[1]} ${addrM[2].trim()}, ${addrM[3].trim()} VIC ${addrM[4]}`;

        /*  9. NATIVE VEGETATION
           Distinct from VPO overlay  explicit statement about native veg presence */
        if(/within\s+(?:a\s+)?(?:native\s+vegetation|vegetation\s+protection|significant\s+vegetation)/i.test(t)||
           /native\s+vegetation\s+(?:present|applicable|detected|exists)/i.test(t)){
          result.nativeVeg="Within";
        } else if(/outside\s+(?:native\s+vegetation|vegetation\s+protection)/i.test(t)||
                  /no\s+native\s+vegetation/i.test(t)){
          result.nativeVeg="Outside";
        }

        return result;
      }

      /* Section 32 / Contract text parser  extracts restrictions, easements, title details */
      function parseSection32Text(text){
        if(!text||!text.trim())return null;
        const t=text.replace(/\r\n/g,"\n").replace(/[ \t]+/g," ");
        const result={hasSingleCovenant:false,hasEasement:false,easementDesc:"",easementWidthM:"",
          hasS173:false,s173Desc:"",covenantDesc:"",hasMortgage:false,mortgageDesc:"",
          hasMCP:false,mcpDesc:"",hasRestrictiveCovenant:false,restrictiveCovenantDesc:"",
          hasEncumbrance:false,encumbranceDesc:"",vendorName:"",lot:"",area:"",
          titleVolume:"",titleFolio:"",
          /* Services connected */
          servicesElec:"",servicesGas:"",servicesWater:"",servicesSewer:"",servicesTel:"",
          /* Outgoings */
          councilRatesAmt:"",waterRatesAmt:"",landTaxAmt:"",
          /* Planning permit if attached */
          hasPermit:false,permitNo:"",permitDesc:"",
          covenantDocNums:[]
        };
        // Single dwelling covenant
        if(/single[\s-]dwelling\s+covenant|no\s+subdivision|one\s+dwelling\s+only|restricted\s+to\s+one\s+dwelling|one\s+private\s+dwelling/i.test(t)){
          result.hasSingleCovenant=true;
          result.covenantDesc="Single dwelling covenant  restricts to one private dwelling";
        } else {
          const covM=t.match(/(?:restrictive\s+)?covenant[^.;\n]{0,200}/i);
          if(covM){result.covenantDesc=covM[0].trim().slice(0,150)+(covM[0].length>150?"":"");}
        }
        /* MCP  Memorandum of Common Provisions (design/use restrictions in new estates) */
        const mcpM=t.match(/(?:memorandum\s+of\s+common\s+provisions?|\bMCP\b|common\s+provisions?)[^.;\n]{0,200}/i);
        if(mcpM){result.hasMCP=true;result.mcpDesc=mcpM[0].trim().slice(0,150)+(mcpM[0].length>150?"":"");}
        /* General restrictive covenant (non-single-dwelling: material, design, use restrictions) */
        if(!result.hasSingleCovenant&&/restrictive\s+covenant|registered\s+covenant|restrictive\s+agreement/i.test(t)){
          result.hasRestrictiveCovenant=true;
          const rcM=t.match(/restrictive\s+covenant[^.;\n]{0,200}/i);
          if(rcM&&!result.covenantDesc)result.restrictiveCovenantDesc=rcM[0].trim().slice(0,150)+(rcM[0].length>150?"":"");
        }
        // Easements  also extract width in metres or links
        const eM=t.match(/easement[^.;\n]{0,150}/i);
        if(eM){
          result.hasEasement=true;
          result.easementDesc=eM[0].trim().slice(0,120);
          const widthM=eM[0].match(/(\d+\.?\d*)\s*m(?:etre|eter)?s?\b/i)||eM[0].match(/(\d+\.?\d*)\s*m\b/);
          if(widthM)result.easementWidthM=widthM[1];
          /* Convert links to metres (1 link = 0.201168m) */
          const widthLinks=eM[0].match(/(\d+\.?\d*)\s*links?/i);
          if(widthLinks&&!result.easementWidthM)result.easementWidthM=String((parseFloat(widthLinks[1])*0.201168).toFixed(2));
        }
        // Section 173 agreement
        if(/section\s+173|s\.?\s*173\s+agreement/i.test(t)){
          result.hasS173=true;
          const s173M=t.match(/section\s+173[^.;\n]{0,200}/i);
          if(s173M)result.s173Desc=s173M[0].trim().slice(0,150)+(s173M[0].length>150?"":"");
        }
        // Area (handles hectares too)
        const areaM=t.match(/(?:total\s+area|lot\s+area|site\s+area|area\s+of\s+land|land\s+area)[:\s]+(\d[\d,]*\.?\d*)\s*(m2|m|sq\.?m|square\s+metres?|ha|hectares?)/i);
        if(areaM){
          let area=areaM[1].replace(/,/g,"");
          if(/ha|hectares?/i.test(areaM[2]))area=String(Math.round(parseFloat(area)*10000));
          result.area=area;
        }
        // Lot number
        const lotM=t.match(/Lot\s+(\d+)\s+(?:on\s+)?(?:PS|LP|TP|SP|CP)\s*(\d+)/i);
        if(lotM)result.lot=`Lot ${lotM[1]} on ${lotM[0].match(/\bPS\b/i)?"PS":"LP"}${lotM[2]}`;

        /* Mortgage / charge detection */
        const mortM=t.match(/(?:mortgage|charge)[^.;\n]{0,150}/i);
        if(mortM&&!/no\s+mortgage|no\s+charge/i.test(mortM[0])){
          result.hasMortgage=true;
          result.mortgageDesc=mortM[0].trim().slice(0,120)+(mortM[0].length>120?"":"");
        }
        /* Other encumbrances */
        const encM=t.match(/encumbrance[^.;\n]{0,150}/i);
        if(encM){result.hasEncumbrance=true;result.encumbranceDesc=encM[0].trim().slice(0,120);}

        /* Vendor / owner name */
        const vendorM=t.match(/(?:vendor|owner|registered\s+proprietor)[:\s]+([A-Z][A-Za-z\s'-]{3,60})(?:\n|,|\()/i);
        if(vendorM)result.vendorName=vendorM[1].trim();

        /* Certificate of Title volume/folio */
        const ctM=t.match(/(?:Volume|Vol\.?)\s+(\d+)\s+(?:Folio|Fol\.?)\s+(\d+)/i);
        if(ctM){result.titleVolume=ctM[1];result.titleFolio=ctM[2];}

        /* Services connected  search for each service near Yes/No answers */
        const svcSection=t.match(/(?:services?|utilities|connections?)[:\s\-]+([^]{0,600})/i)?.[1]||t;
        const parseService=(rx)=>{
          const m=svcSection.match(rx);
          if(!m)return"";
          const after=(svcSection.slice(svcSection.search(rx)).match(/(?:yes|no|connected|not\s+connected|available|unavailable)/i)||[""])[0];
          return after?after.replace(/not\s+connected|unavailable/i,"No").replace(/connected|available|yes/i,"Yes"):"";
        };
        result.servicesElec=parseService(/electricity/i)||(/electricity[^.]{0,50}yes/i.test(t)?"Yes":/electricity[^.]{0,50}no\b/i.test(t)?"No":"");
        result.servicesGas =parseService(/\bgas\b/i)||(/\bgas[^.]{0,50}yes/i.test(t)?"Yes":/\bgas[^.]{0,50}no\b/i.test(t)?"No":"");
        result.servicesWater=parseService(/water/i)||(/water[^.]{0,50}yes/i.test(t)?"Yes":/water[^.]{0,50}no\b/i.test(t)?"No":"");
        result.servicesSewer=parseService(/sewer(?:age)?/i)||(/sewer[^.]{0,50}yes/i.test(t)?"Yes":/sewer[^.]{0,50}no\b/i.test(t)?"No":"");
        result.servicesTel  =parseService(/telephone|telecommunications?|nbn/i)||(/(?:telephone|nbn)[^.]{0,50}yes/i.test(t)?"Yes":/(?:telephone|nbn)[^.]{0,50}no\b/i.test(t)?"No":"");

        /* Council rates / outgoings */
        const crM=t.match(/council\s+rates?[:\s$]+(\d[\d,]*\.?\d*)\s*(?:per\s+annum|p\.?a\.?|\/yr|\/year|per\s+quarter|per\s+qtr)?/i);
        if(crM)result.councilRatesAmt=crM[1].replace(/,/g,"");
        const wrM=t.match(/water\s+(?:rates?|charges?)[:\s$]+(\d[\d,]*\.?\d*)/i);
        if(wrM)result.waterRatesAmt=wrM[1].replace(/,/g,"");
        const ltM=t.match(/land\s+tax[:\s$]+(\d[\d,]*\.?\d*)/i);
        if(ltM)result.landTaxAmt=ltM[1].replace(/,/g,"");

        /* Planning permit attached */
        const ppM=t.match(/planning\s+permit[:\s#]+([A-Z0-9\/\-]{4,20})/i);
        if(ppM){result.hasPermit=true;result.permitNo=ppM[1];}
        const ppDesc=t.match(/permit(?:ted)?\s+(?:for|to)[:\s]+([^.;\n]{0,100})/i);
        if(ppDesc)result.permitDesc=ppDesc[1].trim().slice(0,80);

        /* Registered instrument / dealing numbers  e.g. D151733, E455329 */
        const _docNums=[...t.matchAll(/\b(?:Dealing|Instrument|Document|Registration|Reference)\s+No\.?\s*([A-Z]\d{5,8})\b/gi)];
        _docNums.forEach(m=>{const n=m[1];if(!result.covenantDocNums.includes(n))result.covenantDocNums.push(n);});
        /* Also standalone Land Victoria dealing format: letter + 68 digits */
        const _standaloneNums=[...t.matchAll(/\b([DTE]\d{6,8})\b/g)];
        _standaloneNums.forEach(m=>{const n=m[1];if(!result.covenantDocNums.includes(n))result.covenantDocNums.push(n);});

        return result;
      }

      /* Lazy-load PDF.js from CDN for in-browser PDF text extraction */
      function loadPdfJs(){
        return new Promise((resolve,reject)=>{
          if(window.pdfjsLib){resolve(window.pdfjsLib);return;}
          const s=document.createElement("script");
          s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
          s.onload=()=>{
            window.pdfjsLib.GlobalWorkerOptions.workerSrc=
              "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            resolve(window.pdfjsLib);
          };
          s.onerror=()=>reject(new Error("PDF.js failed to load"));
          document.head.appendChild(s);
        });
      }
      /* OCR fallback for scanned PDFs  uses Tesseract.js loaded from CDN */
      async function tryOcrPages(pdf,maxPages){
        return new Promise(async(resolve)=>{
          try{
            if(!window.Tesseract){
              await new Promise((res,rej)=>{
                const s=document.createElement("script");
                s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.3/tesseract.min.js";
                s.onload=res;
                s.onerror=()=>rej(new Error("Tesseract.js failed to load"));
                document.head.appendChild(s);
              });
            }
            const worker=await Tesseract.createWorker("eng",1,{
              logger:()=>{},/* suppress progress logs */
            });
            const ocrParts=[];
            for(let i=1;i<=maxPages;i++){
              const page=await pdf.getPage(i);
              const viewport=page.getViewport({scale:2.0});
              const canvas=document.createElement("canvas");
              canvas.width=viewport.width;canvas.height=viewport.height;
              const ctx=canvas.getContext("2d");
              await page.render({canvasContext:ctx,viewport}).promise;
              const {data:{text}}=await worker.recognize(canvas);
              ocrParts.push(text);
            }
            await worker.terminate();
            resolve(ocrParts.join("\n"));
          }catch(e){
            console.warn("[OCR] Tesseract failed:",e.message);
            resolve("");
          }
        });
      }
      async function extractPdfText(file){
        const pdfjs=await loadPdfJs();
        const buf=await file.arrayBuffer();
        const pdf=await pdfjs.getDocument({data:buf}).promise;
        const texts=[];
        for(let i=1;i<=Math.min(pdf.numPages,30);i++){
          const page=await pdf.getPage(i);
          const tc=await page.getTextContent();
          texts.push(tc.items.map(it=>it.str).join(" "));
        }
        const allText=texts.join("\n");
        /* Scanned-PDF detection: avg chars per page very low = likely image scan */
        const avgChars=allText.replace(/\s+/g,"").length/Math.max(1,pdf.numPages);
        if(avgChars<60){
          /* Attempt OCR on first 10 pages */
          const ocrText=await tryOcrPages(pdf,Math.min(pdf.numPages,10));
          if(ocrText.trim().length>allText.trim().length+200){
            console.info(`[OCR] Extracted ${ocrText.length} chars vs ${allText.length} native  using OCR output`);
            return ocrText;
          }
        }
        return allText;
      }
      async function extractFileText(file){
        if(file.type==="application/pdf"||file.name.endsWith(".pdf"))return extractPdfText(file);
        return new Promise((resolve,reject)=>{
          const fr=new FileReader();
          fr.onload=e=>resolve(e.target.result||"");
          fr.onerror=reject;
          fr.readAsText(file);
        });
      }

      /*
         UNIFIED FIELD EXTRACTION ENGINE v1
         Calls all three parsers (VicPlan / Section32 / Survey), maps results
         to canonical field keys, scores confidence per source, detects
         conflicts, and recommends the authoritative value.

         Returns:
           fields    {fieldKey: {sources[], status, recommended, requiresManualConfirm}}
           conflicts  [fieldKey, ...]
           audit     [{fieldKey, sourceType, value, confidence, evidence, extractedAt}]
           scanned   {vp, s32, sv}  true = likely scanned PDF (low reliability)
          */
      function extractAllFields(vpText,s32Text,svText){
        /* Scanned-PDF heuristic: very short avg line length = layout fragments, not prose */
        const likelyScanned=(txt)=>{
          if(!txt)return false;
          const lines=txt.split("\n").filter(l=>l.trim().length>0);
          if(lines.length<5)return false;
          return lines.reduce((s,l)=>s+l.trim().length,0)/lines.length<20;
        };
        const now=new Date().toISOString();
        const fields={};
        const audit=[];
        /* Source priority for conflict resolution  higher number wins */
        const PRIORITY={Survey:3,VicPlan:2,Section32:1};
        /* Fields that always need manual confirmation regardless of confidence */
        const CRITICAL=new Set(["plan.zone","plan.hasSingleCovenant","plan.hasEasementBoe","plan.s173","plan.bushfireProneArea","site.area","site.frontage","site.depth"]);

        const register=(fieldKey,sourceType,value,confidence,evidence)=>{
          const strVal=(value===null||value===undefined)?"":String(value);
          if(strVal===""||strVal==="false")return;
          if(!fields[fieldKey])fields[fieldKey]={sources:[]};
          fields[fieldKey].sources.push({sourceType,value:strVal,confidence:Math.min(100,Math.max(0,confidence)),evidence});
          audit.push({fieldKey,sourceType,value:strVal,confidence,evidence,extractedAt:now});
        };

        /*  Parse each source  */
        const vp=vpText?parseVicPlanText(vpText):null;
        const s32=s32Text?parseSection32Text(s32Text):null;
        const sv=svText?parseLandSurveyText(svText):null;
        const scanned={vp:likelyScanned(vpText),s32:likelyScanned(s32Text),sv:likelyScanned(svText)};

        /*  VicPlan registrations  */
        if(vp){
          const sp=scanned.vp?20:0; // scan penalty
          if(vp.zone){
            const zCode=normaliseZone(vp.zone)||vp.zone;
            const known=["NRZ","GRZ","RGZ","MUZ","C1Z","C2Z","LDRZ"].some(z=>zCode.startsWith(z));
            const zFull=vp.zone||zCode; /* preserve schedule e.g. GRZ1 */
            register("plan.zone","VicPlan",zCode,(known?90:65)-sp,
              `Zone from VicPlan: ${zFull}${zFull!==zCode?" (system uses base code "+zCode+" for ResCode lookups)":""}`);
          }
          if(vp.overlaysConfirmedNone)
            register("plan.overlays","VicPlan","__none__",90-sp,'VicPlan explicitly states "No Overlays"');
          else if(vp.overlays?.length>0)
            register("plan.overlays","VicPlan",JSON.stringify(vp.overlays),85-sp,
              `${vp.overlays.length} overlay(s): ${vp.overlays.map(o=>o.label).join(", ")}`);
          if(vp.council) register("site.council","VicPlan",vp.council,80-sp,"LGA from VicPlan certificate");
          if(vp.area){
            const n=parseFloat(vp.area.replace(/,/g,""));
            const inRange=n>=50&&n<=20000;
            register("site.area","VicPlan",String(n),(inRange?80:42)-sp,
              `Area ${n} m from VicPlan${inRange?"":"  outside 5020000 m expected range"}`);
          }
          if(vp.lot||vp.propnum) register("site.lotNumber","VicPlan",vp.lot||vp.propnum,75-sp,"Lot/property reference from VicPlan");
          /* Bushfire Prone Area  VicPlan is the authoritative source for this field */
          if(vp.bushfire){
            const bfNorm=vp.bushfire.toLowerCase();
            const isWithin=/yes|within|applicable|affected/i.test(bfNorm);
            register("plan.bushfireProneArea","VicPlan",isWithin?"Yes":"No",88-sp,
              `Bushfire Prone Area: "${vp.bushfire}"  ${isWithin?"BAL rating and fire-resistant construction required":"Outside bushfire prone area"}`);
          }
          /* Native Vegetation  explicit VicPlan statement (separate from VPO overlay) */
          if(vp.nativeVeg)
            register("plan.hasNativeVeg","VicPlan",vp.nativeVeg,82-sp,
              `Native vegetation status: "${vp.nativeVeg}"  ${vp.nativeVeg==="Within"?"Environmental report + DELWP approval likely required, add 36 months":"No native vegetation restrictions"}`);
          /* Property Address  VicPlan shows the registered address; auto-fill if site.address is blank */
          if(vp.address)
            register("site.address","VicPlan",vp.address,78-sp,"Property address extracted from VicPlan certificate");
        }

        /*  Section 32 registrations  */
        if(s32){
          const sp=scanned.s32?20:0;
          if(s32.hasSingleCovenant)
            register("plan.hasSingleCovenant","Section32","true",95-sp,
              'Keyword match: "single dwelling covenant" / "one dwelling only"');
          if(s32.hasEasement)
            register("plan.hasEasementBoe","Section32","true",85-sp,
