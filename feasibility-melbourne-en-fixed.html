        /*  Site Finder  */
        const runFinderOverpass=useCallback(async(suburbName)=>{
          const suburbData=MEL_SUBURBS[suburbName];
          if(!suburbData)return;
          setFinderOverpassStatus("loading");
          setFinderOverpassResults([]);
          /* Approximate suburb bounding box via Nominatim */
          try{
            const nmResp=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(suburbName+", Victoria, Australia")}&format=json&limit=1&addressdetails=0`,{headers:{"Accept-Language":"en"}});
            const nmData=await nmResp.json();
            if(!nmData.length){setFinderOverpassStatus("error");return;}
            const bbox=nmData[0].boundingbox; /* [minLat,maxLat,minLng,maxLng] */
            const [s,n,w,e]=bbox.map(Number);
            /* Overpass: fetch residential land parcels */
            const mirrors=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.openstreetmap.ru/api/interpreter"];
            const q=`[out:json][timeout:20];(way["landuse"="residential"](${s},${w},${n},${e});way["building"="residential"](${s},${w},${n},${e}););out center tags 60;`;
            let resp=null;
            for(const m of mirrors){try{resp=await fetch(`${m}?data=${encodeURIComponent(q)}`,{signal:AbortSignal.timeout(20000)});if(resp.ok)break;}catch{resp=null;}}
            if(!resp||!resp.ok){setFinderOverpassStatus("error");return;}
            const data=await resp.json();
            const results=(data.elements||[]).slice(0,40).map(el=>({
              id:el.id,lat:el.center?.lat||el.lat,lon:el.center?.lon||el.lon,
              addr:[el.tags?.["addr:housenumber"],el.tags?.["addr:street"]].filter(Boolean).join(" ")||"",
              name:el.tags?.name||el.tags?.["addr:street"]||"",
            })).filter(r=>r.lat&&r.lon);
            setFinderOverpassResults(results);
            setFinderOverpassStatus("done");
          }catch(e){setFinderOverpassStatus("error");}
        },[]);

        /*  Fetch DA activity from Planning Alerts for a suburb  */
        const fetchFinderDA=useCallback(async(suburbName)=>{
          if(finderDAActivity[suburbName])return; /* cached */
          setFinderDAStatus("loading");
          try{
            const url=`https://www.planningalerts.org.au/applications.json?suburb=${encodeURIComponent(suburbName)}&state=VIC&count=20`;
            const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw new Error("PA fetch failed");
            const data=await r.json();
            const apps=(data.applications||[]).slice(0,10).map(a=>({
              address:a.address||"",
              description:(a.description||"").slice(0,80),
              date:a.date_received?.slice(0,10)||"",
              lat:a.lat,lon:a.lng,
              url:`https://www.planningalerts.org.au/applications/${a.id}`,
            }));
            setFinderDAActivity(prev=>({...prev,[suburbName]:{count:data.total_count||apps.length,recent:apps}}));
            setFinderDAStatus("done");
          }catch(e){
            /* Planning Alerts CORS may block  show fallback link silently */
            setFinderDAActivity(prev=>({...prev,[suburbName]:{count:null,recent:[]}}));
            setFinderDAStatus("done");
          }
        },[finderDAActivity]);

        /*  Finder suburb map (Leaflet)  initialise when finderMapSuburb changes  */
        useEffect(()=>{
          if(!finderMapSuburb||typeof window.L==="undefined")return;
          const container=finderMapRef.current;
          if(!container)return;
          /* Destroy previous */
          if(finderLeafletRef.current){finderLeafletRef.current.remove();finderLeafletRef.current=null;}
          const L=window.L;
          /* Geocode suburb centre via Nominatim */
          const initMap=async()=>{
            try{
              const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(finderMapSuburb+",Victoria,Australia")}&format=json&limit=1`,{headers:{"Accept-Language":"en"}});
              const d=await r.json();
              const lat=d[0]?parseFloat(d[0].lat):-37.814;
              const lon=d[0]?parseFloat(d[0].lon):144.963;
              const map=L.map(container,{scrollWheelZoom:true}).setView([lat,lon],14);
              L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:' OpenStreetMap',maxZoom:19}).addTo(map);
              /* Centre marker */
              const si=L.divIcon({html:`<div style="background:#0f4c75;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">${finderMapSuburb}</div>`,className:"",iconAnchor:[0,0]});
              L.marker([lat,lon],{icon:si}).addTo(map);
              /* DA activity markers */
              const acts=finderDAActivity[finderMapSuburb]?.recent||[];
              acts.forEach(a=>{
                if(!a.lat||!a.lon)return;
                const di=L.divIcon({html:`<div style="background:#e17055;color:#fff;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,className:"",iconSize:[10,10],iconAnchor:[5,5]});
                L.marker([a.lat,a.lon],{icon:di}).addTo(map).bindPopup(`<strong>${a.address}</strong><br><span style="font-size:11px">${a.description}</span><br><a href="${a.url}" target="_blank" style="font-size:10px">View </a>`);
              });
              finderLeafletRef.current=map;
            }catch(e){/* ignore */}
          };
          const t=setTimeout(initMap,80);
          return()=>{clearTimeout(t);if(finderLeafletRef.current){finderLeafletRef.current.remove();finderLeafletRef.current=null;}};
        },[finderMapSuburb,finderDAActivity]);

        const renderFinder=()=>(
          <>
            <Card title=" Site Finder  Filter Melbourne Suburbs by Development Criteria" accent={C.brand}>
              <div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.6}}>
                Filter the Melbourne suburb database by zone, ring distance, and area range to find the right market for your development strategy. Select a suburb to load its market data into the analysis.
              </div>
              <Row>
                <div style={{flex:1}}>
                  <label style={{fontSize:11,fontWeight:700,color:C.slate,display:"block",marginBottom:4}}>Suburb Name Search</label>
                  <input value={finderFilter.suburb} onChange={e=>uFF("suburb")(e.target.value)}
                    placeholder="e.g. Brunswick, Preston"
                    style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:13,fontFamily:sans,color:C.ink}}/>
                </div>
                <Sel label="Planning Zone" value={finderFilter.zone} onChange={uFF("zone")}
                  options={["","GRZ","NRZ","MUZ","C1Z","RGZ","TZ"]}/>
                <Sel label="Ring" value={finderFilter.ring} onChange={uFF("ring")}
                  options={["","inner","middle","outer"]}/>
              </Row>
              <Row>
                <Input label="Min Area (m)" value={String(finderFilter.minArea)} onChange={v=>setFinderFilter(p=>({...p,minArea:Number(v)||0}))} placeholder="300" suffix="m"/>
                <Input label="Max Area (m)" value={String(finderFilter.maxArea)} onChange={v=>setFinderFilter(p=>({...p,maxArea:Number(v)||9999}))} placeholder="1200" suffix="m"/>
                <Input label="Min Frontage" value={String(finderFilter.minFrontage)} onChange={v=>setFinderFilter(p=>({...p,minFrontage:Number(v)||0}))} placeholder="10" suffix="m"/>
              </Row>
              <div style={{marginTop:8,fontSize:12,color:C.brand,fontWeight:600}}>
                {finderSuburbs.length} suburb{finderSuburbs.length!==1?"s":""} match your criteria
              </div>
            </Card>

            {/* Results Grid */}
            {finderSuburbs.length>0&&(
              <Card title={` Matching Suburbs (${finderSuburbs.length})`} accent={C.accent}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
                  {finderSuburbs.map(([name,d])=>{
                    const isSelected=selSuburb===name;
                    /* Suburb-level potential: use zone + typical area (site area if loaded, else 700m) */
                    const subPot=calcSitePotential({zone:d.zone,area:isSelected&&site.area?site.area:"700",frontage:isSelected&&site.frontage?site.frontage:"16",overlays:[],hasEasement:false,hasCovenant:false,slopeClass:"flat",bushfire:false});
                    return(
                      <div key={name} style={{
                        background:isSelected?"#e8f9f4":"#fff",
                        border:`2px solid ${isSelected?C.accent:C.border}`,
                        borderRadius:10,padding:"14px 16px",
                        boxShadow:isSelected?"0 0 0 3px #00b89422":T.sh.sm,
                        transition:"all .15s"
                      }}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:14,color:C.ink}}>{name}</div>
                            <div style={{fontSize:11,color:C.muted}}>{d.zone}  {d.ring} ring  {d.dist}km CBD  {d.council}</div>
                          </div>
                          {/* Potential score badge */}
                          <div style={{textAlign:"center"}}>
                            <div style={{fontSize:16,fontWeight:800,color:subPot.color,lineHeight:1}}>{subPot.score}</div>
                            <div style={{fontSize:9,color:subPot.color,fontWeight:700}}>{subPot.band==="green"?"":subPot.band==="amber"?"":""}</div>
                          </div>
                        </div>
                        {/* Mini potential bar */}
                        <div style={{height:4,background:"#f0f0f0",borderRadius:4,marginBottom:8,overflow:"hidden"}}>
                          <div style={{height:"100%",width:`${subPot.score}%`,background:subPot.color,borderRadius:4,transition:"width .4s"}}/>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,fontSize:11,marginBottom:10}}>
                          <div style={{color:C.muted}}>Median House <strong style={{color:C.ink}}>${(d.medH/1000).toFixed(0)}k</strong></div>
                          <div style={{color:C.muted}}>Median TH <strong style={{color:C.ink}}>${(d.medTH/1000).toFixed(0)}k</strong></div>
                          <div style={{color:C.muted}}>Days on Mkt <strong style={{color:C.ink}}>{d.dom}</strong></div>
                          <div style={{color:C.muted}}>CAGR <strong style={{color:C.accent}}>{d.cagr}%</strong></div>
                        </div>
                        <div style={{fontSize:10,color:C.muted,fontStyle:"italic",marginBottom:10,lineHeight:1.4}}>{d.notes}</div>
                        <div style={{display:"flex",gap:6}}>
                          <button
                            onClick={()=>{
                              setSelSuburb(name);
                              setMarket(p=>({...p,medianHouse:String(d.medH),medianTH:String(d.medTH),medianUnit:String(d.medU),dom:String(d.dom),cagr:String(d.cagr)}));
                              setPlan(p=>({...p,zone:p.zone||d.zone}));
                              setExplorerMode(false);
                              addToast(` ${name} loaded   Site Overview `,"success",6000);
                              setTab("site");
                            }}
                            style={{flex:1,background:isSelected?C.accent:C.brand,color:"#fff",border:"none",borderRadius:6,padding:"7px 0",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                            {isSelected?" Loaded":"Load Suburb"}
                          </button>
                          <button
                            onClick={()=>{runFinderOverpass(name);fetchFinderDA(name);setFinderMapSuburb(name);}}
                            disabled={finderOverpassStatus==="loading"}
                            style={{background:finderMapSuburb===name?"#f5f3ff":"#f0f4f8",color:finderMapSuburb===name?C.purple:C.slate,border:`1px solid ${finderMapSuburb===name?"#c4b5fd":C.border}`,borderRadius:6,padding:"7px 12px",fontSize:11,cursor:"pointer",fontWeight:finderMapSuburb===name?700:400}}>
                            {finderMapSuburb===name?" Active":" Map"}
                          </button>
                          {/* DA activity badge */}
                          {finderDAActivity[name]&&(
                            <span style={{alignSelf:"center",fontSize:10,background:"#fee2e2",color:C.warn,padding:"3px 8px",borderRadius:8,fontWeight:700,flexShrink:0}}
                              title="Recent planning applications from Planning Alerts">
                              {finderDAActivity[name].count!=null?`${finderDAActivity[name].count} DAs`:"PA link"}
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            )}

            {/* Overpass Results */}
            {finderOverpassStatus==="loading"&&(
              <Card title=" Searching Parcels" accent={C.teal}>
                <div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:13}}>Querying OpenStreetMap for parcels in selected suburb</div>
              </Card>
            )}
            {finderOverpassStatus==="done"&&finderOverpassResults.length>0&&(
              <Card title={` OSM Parcel Results (${finderOverpassResults.length} found)`} accent={C.teal}>
                <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Click any result to view on Google Maps or load the address into the feasibility analysis.</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,maxHeight:320,overflowY:"auto"}}>
                  {finderOverpassResults.map(r=>(
                    <div key={r.id} style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px"}}>
                      <div style={{fontSize:12,fontWeight:600,color:C.ink,marginBottom:4}}>{r.addr||r.name||`OSM #${r.id}`}</div>
                      <div style={{fontSize:10,color:C.muted,marginBottom:8}}>{r.lat.toFixed(5)}, {r.lon.toFixed(5)}</div>
                      <div style={{display:"flex",gap:5}}>
                        <a href={`https://maps.google.com/?q=${r.lat},${r.lon}`} target="_blank" rel="noopener noreferrer"
                          style={{flex:1,textAlign:"center",background:C.brandLight,color:C.brand,borderRadius:5,padding:"5px 0",fontSize:11,fontWeight:600,textDecoration:"none"}}>
                          Maps
                        </a>
                        {r.addr&&(
                          <button onClick={()=>{setSite(p=>({...p,address:r.addr}));setLookupAddr(r.addr);setExplorerMode(false);addToast(` ${r.addr}  `,"success",4000);setTab("site");}}
                            style={{flex:1,background:"#e8f9f4",color:C.accent,border:"none",borderRadius:5,padding:"5px 0",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                            Load
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </Card>
            )}
            {finderOverpassStatus==="error"&&(
              <Card title=" OSM Query Failed" accent={C.warn}>
                <div style={{fontSize:12,color:C.muted}}>Could not retrieve parcel data. Check your internet connection or try another suburb.</div>
              </Card>
            )}

            {/*  Suburb DA Activity Map  */}
            {finderMapSuburb&&(
              <Card title={` ${finderMapSuburb}  Development Activity Map`} accent={C.purple}>
                <div style={{fontSize:12,color:C.muted,marginBottom:10}}>
                  OSM parcel markers (blue) + Planning Alerts DA applications (red dots). Click markers for details.
                  <a href={`https://www.planningalerts.org.au/search?q=${encodeURIComponent(finderMapSuburb+" VIC")}`} target="_blank" rel="noopener noreferrer"
                    style={{marginLeft:8,color:C.accent,fontWeight:700,textDecoration:"none"}}>View all on Planning Alerts </a>
                </div>
                <div ref={finderMapRef} style={{width:"100%",height:380,borderRadius:8,border:`1px solid ${C.border}`,overflow:"hidden",background:"#e8f0e8"}}/>
                {/* DA Activity list */}
                {finderDAActivity[finderMapSuburb]?.recent?.length>0&&(
                  <div style={{marginTop:12}}>
                    <div style={{fontSize:12,fontWeight:700,color:C.ink,marginBottom:6}}>
                       Recent Planning Applications {finderDAActivity[finderMapSuburb].count!=null?`(${finderDAActivity[finderMapSuburb].count} total)`:""}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:200,overflowY:"auto"}}>
                      {finderDAActivity[finderMapSuburb].recent.map((a,i)=>(
                        <div key={i} style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:6,padding:"7px 10px",fontSize:11}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                            <div>
                              <div style={{fontWeight:600,color:C.ink}}>{a.address}</div>
                              <div style={{color:C.muted,marginTop:2}}>{a.description}</div>
                            </div>
                            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                              {a.date&&<span style={{fontSize:10,color:C.muted}}>{a.date}</span>}
                              {a.url&&<a href={a.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:C.accent,fontWeight:700,textDecoration:"none"}}>View </a>}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {finderDAActivity[finderMapSuburb]?.recent?.length===0&&(
                  <div style={{marginTop:10,fontSize:11,color:C.muted,background:"#fffbea",border:"1px solid #fcd34d",borderRadius:6,padding:"8px 12px"}}>
                     Planning Alerts data unavailable (CORS restriction). Use the direct link above to view DAs on planningalerts.org.au.
                  </div>
                )}
              </Card>
            )}

            {/* Quick-access zones legend */}
            <Card title=" Melbourne Zone Quick Reference" accent={C.purple}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
                {[
                  {z:"GRZ",n:"General Residential Zone",tip:"Primary suburban zone. Permits up to 3 dwellings by right (Cl. 32.08). Min lot ~300m per schedule."},
                  {z:"NRZ",n:"Neighbourhood Residential Zone",tip:"Neighbourhood character protection. Max 2 dwellings (Cl. 32.09). Heritage-sensitive councils."},
                  {z:"MUZ",n:"Mixed Use Zone",tip:"High-density flexible zone. Apartments, shops, offices all permitted. No mandatory maximum height in many areas."},
                  {z:"RGZ",n:"Residential Growth Zone",tip:"Targeted density. Minimum setbacks reduced. Typically permits 4+ storeys in schedule areas."},
                  {z:"C1Z",n:"Commercial 1 Zone",tip:"Main street commercial. Residential above ground floor permitted. High footfall and transit access expected."},
                ].map(({z,n,tip})=>(
                  <div key={z} style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      <span style={{background:C.brandLight,color:C.brand,padding:"2px 8px",borderRadius:8,fontWeight:800,fontSize:11}}>{z}</span>
                      <span style={{fontSize:12,fontWeight:600,color:C.ink}}>{n}</span>
                    </div>
                    <div style={{fontSize:11,color:C.muted,lineHeight:1.5}}>{tip}</div>
                    <button onClick={()=>{uFF("zone")(z);addToast(` Filtering by ${z} zone`,"info",3000);}}
                      style={{marginTop:8,background:"transparent",border:`1px solid ${C.brand}`,color:C.brand,borderRadius:5,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>
                      Filter {z}
                    </button>
                  </div>
                ))}
              </div>
            </Card>
          </>
        );

        const renderSite=()=>(
          <>
            <Card title="Basic Information" accent={C.brand}>
              <Row><Input label="Property Address" value={site.address} onChange={uS("address")} placeholder="12 Smith St, Templestowe Lower VIC 3107" wide/></Row>
              <Row>
                <Input label="Land Area" value={site.area} onChange={uS("area")} placeholder="850" suffix="m" hint="Auto-filled from Vicmap parcel"/>
                <Input label="Lot / Property Number" value={site.lotNumber} onChange={uS("lotNumber")} placeholder="LP123456" hint="Auto-filled from Vicmap (propnum)"/>
                <Sel label="Lot Shape" value={site.shape} onChange={uS("shape")} options={["Regular Rectangle","L-Shape","Irregular","Battleaxe / Flag Lot","Trapezoid","Triangular"]}/>
              </Row>
              <Row>
                <Input label="Frontage Width" value={site.frontage} onChange={uS("frontage")} placeholder="20" suffix="m" hint="Auto-estimated from Vicmap bbox (shorter side)"/>
                <Input label="Depth" value={site.depth} onChange={uS("depth")} placeholder="42" suffix="m" hint="Auto-estimated from Vicmap bbox (longer side)"/>
                <Sel label="Tenure Type" value={site.tenure} onChange={uS("tenure")} options={["Freehold","Strata Title","Company Title","Crown Land"]}/>
              </Row>
              {bboxDims&&(
                <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"7px 14px",fontSize:11,color:"#1e40af",fontFamily:sans,marginTop:-6,marginBottom:2,lineHeight:1.6}}>
                   <strong>Vicmap bbox:</strong> ~{bboxDims.w}m E-W  ~{bboxDims.h}m N-S
                   <strong>Frontage est. ~{bboxDims.frontEst}m</strong>  <strong>Depth est. ~{bboxDims.depthEst}m</strong>
                  <span style={{color:"#3b82f6",marginLeft:6}}>(shorter side used as frontage proxy  confirm against title plan)</span>
                </div>
              )}
              {/* Effective Width / Subdivision Feasibility Warning */}
              {(()=>{
                const frontEst=bboxDims?.frontEst||parseNum(site.frontage);
                if(!frontEst||frontEst>=18)return null;
                const isCritical=frontEst<9;
                const isNarrow=frontEst<14;
                return(
                  <div style={{background:isCritical?"#fef2f2":isNarrow?"#fffbeb":"#fff7ed",border:`2px solid ${isCritical?"#dc2626":isNarrow?"#f59e0b":C.orange}`,borderRadius:8,padding:"10px 14px",fontFamily:sans,fontSize:12,marginTop:4,marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <span style={{fontSize:16}}>{isCritical?"":isNarrow?"":""}</span>
                      <strong style={{color:isCritical?"#dc2626":isNarrow?"#92400e":C.orange,fontSize:13}}>
                        {isCritical?"Critical: Frontage Too Narrow for Two Separate Lots":isNarrow?"Narrow Frontage  Subdivision Constrained":"Frontage Below 18m  Common Driveway Required for Subdivision"}
                      </strong>
                    </div>
                    <div style={{color:C.slate,lineHeight:1.6,fontSize:11}}>
                      {isCritical&&<span>Estimated frontage <strong>~{frontEst}m</strong> is below 9m  subdivision into two separate titles is unlikely to be achievable in most zones. Development is likely limited to a single dwelling or duplex on one lot.<br/></span>}
                      {!isCritical&&isNarrow&&<span>Estimated frontage <strong>~{frontEst}m</strong>  below 14m. Side-by-side double garage impossible; tandem parking only. Townhouse layout severely constrained. Check ResCode Cl. 52.06 car parking dimensions.<br/></span>}
                      {!isCritical&&!isNarrow&&<span>Estimated frontage <strong>~{frontEst}m</strong> is below the practical 18m Clause 56 subdivision threshold. Subdivision into standard separate lots requires a <strong>Common Property Driveway</strong> (Cl. 56.06-6).<br/></span>}
                      <span style={{color:C.muted}}>
                        Common driveway implications: <strong>+$15K$25K</strong> design &amp; construction  usable private open space per dwelling reduced  Body Corporate required (ongoing OC fees ~$800$1,500/yr per lot)  may reduce end-buyer appeal and GRV by 35%.
                      </span>
                    </div>
                  </div>
                );
              })()}
              {/*  Battleaxe / Flag Lot Warning */}
              {site.shape==="Battleaxe / Flag Lot"&&(
                <div style={{background:"#fff7ed",border:`2px solid ${C.orange}`,borderRadius:8,padding:"10px 14px",marginTop:8,fontFamily:sans,fontSize:12,lineHeight:1.7}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <span style={{fontSize:16}}></span>
                    <strong style={{color:C.orange,fontSize:13}}>Battleaxe / Flag Lot  Access Handle Requirements</strong>
                  </div>
                  <div style={{color:C.slate}}>
                    <strong>Cl. 56.06-2 (ResCode standard):</strong> A battleaxe (flag) lot requires a minimum <strong>3.0m wide access handle</strong> for the full length from the street to the main lot body.
                    If shared by two lots, each must have independent access (6.0m total width) or a registered common property driveway.<br/>
                    <strong>Cost implications:</strong> Access handle construction: <strong>$8K$18K</strong> (concrete crossover + sealed driveway).
                    Minimum lot size for battleaxe subdivisions is typically 300m (usable area, excluding the handle) under most GRZ/NRZ schedules.<br/>
                    <strong>Planning risk:</strong> Some councils (Boroondara, Stonnington) are reluctant to approve battleaxe subdivisions on sites below 700m due to overlooking and privacy impacts.
                    Confirm with a pre-application meeting before proceeding.
                  </div>
                </div>
              )}
            </Card>
            <Card title="Location & Amenities" accent={C.accent}>
              <Row>
                <Input label="Distance to CBD" value={site.cbdDist} onChange={uS("cbdDist")} placeholder="18km north-east"/>
                <Input label="Schools" value={site.schools} onChange={uS("schools")} placeholder="Serpell PS (0.5km), Doncaster SC (1.2km)" wide/>
              </Row>
              <Row>
                <Input label="Shopping" value={site.shops} onChange={uS("shops")} placeholder="Westfield Doncaster (2km)"/>
                <Input label="Parks / Recreation" value={site.parks} onChange={uS("parks")} placeholder="Ruffey Lake Park (0.8km)"/>
                <Input label="Medical Facilities" value={site.medical} onChange={uS("medical")} placeholder="Box Hill Hospital (5km)"/>
              </Row>
            </Card>
            <Card title="Transport Connectivity" accent="#5f7b93">
              <Row>
                <Input label="Public Transport" value={site.publicTransport} onChange={uS("publicTransport")} placeholder="Bus route 903 (300m walk)"/>
                <Input label="Major Roads" value={site.mainRoads} onChange={uS("mainRoads")} placeholder="Doncaster Road, Bulleen Road"/>
                <Input label="Freeway Access" value={site.freeway} onChange={uS("freeway")} placeholder="Eastern Freeway (3km)"/>

                  "plan.hasEasementBoe":   {label:"Easement on Title",       icon:"",section:"Legal",   primaryDoc:"Section32", warn:null},
                  "plan.easements":        {label:"Easement Description",    icon:"",section:"Legal",   primaryDoc:"Section32", warn:null},
                  "plan.s173":             {label:"Section 173 Agreement",   icon:"",section:"Legal",   primaryDoc:"Section32", warn:"S173 may restrict use  confirm details with solicitor"},

                  "site.adjacentWindowNote":{label:"Adjacent Upper-Floor Windows",   icon:"",section:"Site",   primaryDoc:"Survey",   warn:"Overlooking screening required  $8K$15K PS per affected window"},

                };
                const SRC_COLORS={VicPlan:"#0369a1",Section32:"#92400e",Survey:"#065f46"};
                const SRC_BG={VicPlan:"#dbeafe",Section32:"#fef3c7",Survey:"#d1fae5"};
                const SRC_BORDER={VicPlan:"#93c5fd",Section32:"#fcd34d",Survey:"#6ee7b7"};
                const confBand=(c)=>c>=85?{label:"High",color:"#15803d"}:c>=60?{label:"Med",color:"#0369a1"}:{label:"Low",color:"#dc2626"};

                const grouped={Planning:[],Legal:[],Site:[]};
                Object.entries(importResult.fields).forEach(([fieldKey,fieldData])=>{
                  const meta=FIELD_META[fieldKey]||{label:fieldKey,icon:"",section:"Site",primaryDoc:"",warn:null};
                  grouped[meta.section||"Site"].push({fieldKey,meta,...fieldData});
                });

                const totalFields=Object.keys(importResult.fields).length;
                const checkedCount=Object.values(importChecks).filter(Boolean).length;

                const canApply=checkedCount>0&&unresolvedConflicts===0;

                const formatVal=(fieldKey,val)=>{
                  if(!val||val==="false")return "";

                    {/*  Action bar  */}

                    <Input label="Land Area B" value={consol.area2} onChange={uCS("area2")} placeholder="700" suffix="m"/>
                    <Input label="Frontage B" value={consol.frontage2} onChange={uCS("frontage2")} placeholder="18" suffix="m"/>
                    <Input label="Depth B" value={consol.depth2} onChange={uCS("depth2")} placeholder="39" suffix="m"/>
                  </Row>
                  <Row>
                    <Input label="Est. Purchase Price B" value={consol.price2} onChange={uCS("price2")} placeholder="1,400,000" suffix="$"/>
                    <Sel label="Amalgamation Layout" value={consol.shape} onChange={uCS("shape")} options={["Side-by-Side","Front-Back","Corner"]}/>
                  </Row>

                  {/* Consolidation Analysis Result */}
                  {consolCalc&&(
                    <div style={{marginTop:14,background:"linear-gradient(135deg,#f5f3ff,#ede9fe)",border:"2px solid #a78bfa",borderRadius:10,padding:"16px 18px"}}>
                      <div style={{fontWeight:800,fontSize:13,color:C.purple,marginBottom:12}}> Consolidated Site Analysis</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
                        <div style={{background:"#fff",borderRadius:8,padding:"10px 12px",textAlign:"center",boxShadow:T.sh.sm}}>
                          <div style={{fontSize:20,fontWeight:800,color:C.ink}}>{consolCalc.mergedArea.toLocaleString()}</div>
                          <div style={{fontSize:10,color:C.muted}}>Combined Area m</div>
                          <div style={{fontSize:10,color:C.accent,fontWeight:600}}>+{consolCalc.mergedArea-(parseNum(site.area)||0)} vs solo</div>
                        </div>
                        <div style={{background:"#fff",borderRadius:8,padding:"10px 12px",textAlign:"center",boxShadow:T.sh.sm}}>
                          <div style={{fontSize:20,fontWeight:800,color:C.ink}}>{consolCalc.mergedFrontage.toFixed(1)}</div>
                          <div style={{fontSize:10,color:C.muted}}>Combined Frontage m</div>
                          <div style={{fontSize:10,color:C.accent,fontWeight:600}}>{consol.shape}</div>
                        </div>
                        <div style={{background:"#fff",borderRadius:8,padding:"10px 12px",textAlign:"center",boxShadow:T.sh.sm}}>
                          <div style={{fontSize:20,fontWeight:800,color:C.purple}}>{consolCalc.mergedUnits}</div>
                          <div style={{fontSize:10,color:C.muted}}>Est. Dwellings</div>
                          <div style={{fontSize:10,color:C.purple,fontWeight:600}}>+{consolCalc.uplift} vs {consolCalc.existingUnits} solo</div>
                        </div>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12}}>
                        <div style={{background:"#fff8",borderRadius:6,padding:"8px 12px"}}>
                          <div style={{color:C.muted}}>Additional Land Cost</div>
                          <div style={{fontWeight:700,color:C.warn,fontSize:14}}>${consolCalc.addLandCost.toLocaleString()}</div>
                        </div>
                        <div style={{background:"#fff8",borderRadius:6,padding:"8px 12px"}}>
                          <div style={{color:C.muted}}>Additional Revenue Est.</div>
                          <div style={{fontWeight:700,color:C.accent,fontSize:14}}>${consolCalc.addRevenue.toLocaleString()}</div>
                          <div style={{fontSize:10,color:C.muted}}>{consolCalc.uplift} extra units  {fmt(parseNum(market.grvPerUnit)||0)}</div>
                        </div>
                        <div style={{background:consolCalc.netUplift>0?"#e8f9f4":"#fff0ee",borderRadius:6,padding:"8px 12px",gridColumn:"1/-1",border:`1px solid ${consolCalc.netUplift>0?"#86efac":"#fca5a5"}`}}>
                          <div style={{color:C.muted}}>Net Uplift from Consolidation</div>
                          <div style={{fontWeight:800,fontSize:16,color:consolCalc.netUplift>0?C.accent:C.warn}}>
                            {consolCalc.netUplift>0?"+":" "}{fmt(consolCalc.netUplift)}
                          </div>
                          <div style={{fontSize:11,color:C.muted,marginTop:3}}>
                            {consolCalc.netUplift>0?" Consolidation adds value  feasibility uplift is positive":" Additional land cost exceeds revenue uplift  reconsider purchase price or unit mix"}
                          </div>
                        </div>
                      </div>
                      {parseNum(market.grvPerUnit)===0&&(
                        <div style={{marginTop:8,fontSize:11,color:C.warn}}> Enter Est. Sale Price per Dwelling in Market Analysis tab for a complete revenue estimate.</div>
                      )}
                      <button
                        onClick={()=>{
                          /* Merge site data  update area, frontage for combined site */
                          setSite(p=>({...p,
                            area:String(consolCalc.mergedArea),
                            frontage:String(consolCalc.mergedFrontage.toFixed(1)),
                            address:p.address+(consol.address2?` + ${consol.address2}`:"")
                          }));
                          setPlan(p=>({...p,estUnits:String(consolCalc.mergedUnits)}));
                          setFin(p=>({...p,landPrice:String((parseNum(p.landPrice)||0)+(parseNum(consol.price2)||0))}));
                          setConsol(p=>({...p,enabled:false}));
                          addToast(` Consolidated: ${consolCalc.mergedArea.toLocaleString()}m  ${consolCalc.mergedUnits} units  Land cost updated`,"success",7000);
                        }}
                        style={{marginTop:12,background:C.purple,color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",width:"100%"}}>
                         Apply Consolidation to Feasibility Model
                      </button>
                    </div>
                  )}
                  {!consolCalc&&consol.area2&&(
                    <div style={{marginTop:10,fontSize:12,color:C.muted}}>Enter Parcel A area (Site Overview  Land Area) and Parcel B area above to see the consolidated analysis.</div>
                  )}
                </>
              )}
            </Card>
          </>
        );

        const renderPlan=()=>{
          const zoneKey=normaliseZone(plan.zone)||plan.zone; // handles NRZ1NRZ, GRZ3GRZ etc.
          const zr=ZONE_RULES[zoneKey];
          return(
            <>
              {/* P0-1: Gate anchor targets */}
              <span id="gate-anchor-zone" style={{display:"block",height:0,marginTop:-8}}/>
              <Card title="Land Zoning" accent={C.warn}>
                <Row>
                  <Sel label="Zone Type" value={plan.zone} onChange={uP("zone")} options={(()=>{
                    const opts=[];
                    Object.entries(ZONE_RULES).forEach(([k,v])=>{
                      opts.push({value:k,label:`${k}  ${v.label}`});
                      if(v.schedules)Object.keys(v.schedules).sort().forEach(s=>
                        opts.push({value:`${k}${s}`,label:`${k}${s}  ${v.label}  Schedule ${s}`}));
                    });
                    return opts;
                  })()} hint="Directly determines maximum development density (NRZ1, NRZ2, NRZ3 etc. available)"/>
                  <Input label="Max Building Height (actual)" value={plan.maxHeight} onChange={uP("maxHeight")} placeholder="9" suffix="m" hint={zr?`Reference: ${zr.maxHeight}`:""}/>
                </Row>
                <Row>
                  <Input label="Max Site Coverage" value={plan.maxCoverage} onChange={uP("maxCoverage")} placeholder="60" suffix="%"/>
                  <span id="gate-anchor-units" style={{display:"inline-block",height:0}}/>
                  <Input label="Estimated Developable Dwellings" value={plan.estUnits} onChange={uP("estUnits")} placeholder="4" suffix=" dwellings" hint={zr?`Reference: ${zr.maxDwellings}`:""}/>
                  <Input label="Avg Bedrooms per Dwelling" value={plan.bedsPerUnit} onChange={uP("bedsPerUnit")} placeholder="3" suffix="bed" hint="Used for Cl. 52.06 parking calc: 2 bed = 1 space, 3+ bed = 2 spaces"/>
                </Row>
                {/* Task #30  Site Coverage real-time warning */}
                {(()=>{
                  const sa=parseNum(site.area);
                  const ba=parseNum(plan.buildableArea);
                  if(!sa||!ba||!plan.zone)return null;
                  const sb=ZSB_RESCODE[normaliseZone(plan.zone)||plan.zone]||ZSB_RESCODE.GRZ;
                  const covPct=(ba/sa)*100;
                  const limitPct=sb.cov*100;
                  const over=covPct>limitPct;
                  const maxBa=Math.floor(sa*sb.cov);
                  return(
                    <div style={{background:over?"#fef2f2":"#f0fdf9",border:`2px solid ${over?C.warn:C.accent}44`,borderRadius:8,padding:"10px 14px",marginTop:8,fontFamily:sans,fontSize:12}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,color:over?C.warn:C.accent,fontSize:13}}>{over?" Site Coverage Exceeded":" Site Coverage OK"}</span>
                        <span style={{color:C.slate}}>
                          Net Buildable <strong>{ba.toLocaleString()}m</strong>  Site <strong>{sa.toLocaleString()}m</strong> = <strong style={{color:over?C.warn:C.accent}}>{covPct.toFixed(1)}%</strong>
                          <span style={{color:C.muted}}>  {plan.zone} ResCode limit: <strong>{limitPct.toFixed(0)}%</strong> ({maxBa.toLocaleString()}m)</span>
                        </span>
                      </div>
                      {over&&<div style={{color:C.warn,marginTop:5,fontWeight:600}}>Reduce Net Buildable Area by {(ba-maxBa).toLocaleString()}m to comply (max {maxBa.toLocaleString()}m)</div>}
                    </div>
                  );
                })()}
                {zr&&(
                  <div style={{background:zr.color+"11",border:`1px solid ${zr.color}33`,borderRadius:8,padding:"12px 14px",marginTop:8}}>
                    <div style={{fontSize:12,fontWeight:700,color:zr.color,marginBottom:8,fontFamily:sans}}>{plan.zone}{zoneKey!==plan.zone?` (${zoneKey})`:""}  {zr.label}  Development Potential{"".repeat(zr.devRating>=8?3:zr.devRating>=5?2:1)}</div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 16px",fontFamily:sans,fontSize:12,color:C.slate}}>
                      <div><strong>Max Height:</strong> {zr.maxHeight}</div>
                      <div><strong>Max Dwellings:</strong> {zr.maxDwellings}</div>
                      <div><strong>Min Lot Size:</strong> {zr.minLot}</div>
                      <div><strong>Setbacks:</strong> {zr.setbacks}</div>
                    </div>
                    <div style={{fontSize:12,color:zr.color,marginTop:8,fontWeight:600}}>{zr.notes}</div>
                    {/* Zone Schedule Sub-info */}
                    {(()=>{const sNum=getZoneScheduleNum(plan.zone);const schedInfo=zr.schedules?.[sNum];return schedInfo?(
                      <div style={{marginTop:8,padding:"8px 12px",background:"#f8f9fa",borderRadius:6,border:`1px solid ${C.border}`,fontFamily:sans,fontSize:12}}>
                        <strong style={{color:C.ink}}>Schedule {sNum} Detail: </strong>
                        <span style={{color:C.slate}}>Min lot: {schedInfo.minLot}  Max dwellings: {schedInfo.maxDwellings}</span>
                        <div style={{color:C.muted,marginTop:3}}>{schedInfo.notes}</div>
                      </div>
                    ):sNum?<div style={{marginTop:8,fontSize:11,color:C.muted,fontFamily:sans}}>Schedule {sNum} detected  verify details in council planning scheme</div>:null;})()}
                  </div>
                )}
                {/* Garden Area Compliance */}
                {site.area&&(()=>{
                  const area=parseNum(site.area);
                  if(!area)return null;
                  const minGarden=Math.round(area*0.35);
                  const maxBuildable=area-minGarden;
                  const ba=parseNum(plan.buildableArea);
                  const compliant=!ba||ba<=maxBuildable;
                  return(
                    <div style={{background:compliant?"#f0fdf9":"#fff7ed",border:`1px solid ${compliant?C.accent:C.warn}44`,borderRadius:8,padding:"12px 14px",marginTop:10}}>
                      <div style={{fontSize:12,fontWeight:700,color:compliant?C.accent:C.warn,marginBottom:8,fontFamily:sans}}> ResCode Garden Area (Clause 55.05-4)</div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8,fontFamily:sans,fontSize:12,color:C.slate,marginBottom:6}}>
                        <div><strong>Site Area:</strong> {area.toLocaleString()}m</div>
                        <div><strong>Min. Garden (35%):</strong> <span style={{color:C.accent,fontWeight:700}}>{minGarden.toLocaleString()}m</span></div>
                        <div><strong>Max Footprint:</strong> <span style={{color:C.brand,fontWeight:700}}>{maxBuildable.toLocaleString()}m</span></div>
                        {ba>0&&<div><strong>Your Buildable Area:</strong> <span style={{color:compliant?C.accentDark:C.warn,fontWeight:700}}>{ba.toLocaleString()}m</span></div>}
                      </div>
                      {ba>0&&<div style={{fontSize:12,fontWeight:600,color:compliant?C.accentDark:C.warn}}>
                        {compliant?" Buildable area complies with 35% garden requirement":" Buildable area exceeds permitted footprint  design may not comply"}
                      </div>}
                      <div style={{fontSize:11,color:C.muted,marginTop:4}}>Applies to NRZ and GRZ under ResCode Amendment VC148. Minimum 35% of site must remain as garden (not hard-paved). Verify with council.</div>
                      {(()=>{const area2=parseNum(site.area);if(!area2)return null;
                        const minG=Math.round(area2*0.35),maxB=area2-minG,ba2=parseNum(plan.buildableArea)||maxB;
                        return(<div style={{marginTop:12}}>
                          <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:8,fontFamily:sans}}> Site Coverage Breakdown</div>
                          <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
                            <DonutChart size={110} centerLabel="Site" slices={[
                              {value:Math.min(ba2,maxB),color:C.brand},
                              {value:minG,color:C.accent},
                              {value:Math.max(0,ba2-maxB),color:C.warn},
                            ]}/>
                            <div style={{fontSize:12,fontFamily:sans,lineHeight:2}}>
                              <div><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:C.brand,marginRight:6}}/><strong>Building footprint:</strong> {Math.min(ba2,maxB).toLocaleString()}m ({(Math.min(ba2,maxB)/area2*100).toFixed(0)}%)</div>
                              <div><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:C.accent,marginRight:6}}/><strong>Min. garden (35%):</strong> {minG.toLocaleString()}m</div>
                              {ba2>maxB&&<div style={{color:C.warn}}><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:C.warn,marginRight:6}}/><strong>Over-footprint:</strong> {(ba2-maxB).toLocaleString()}m  non-compliant</div>}
                            </div>
                          </div>
                        </div>);
                      })()}
                    </div>
                  );
                })()}
              </Card>
              {/*  LOT YIELD ESTIMATOR  */}
              {(()=>{
                const area=parseNum(site.area);
                const frontage=parseNum(site.frontage);
                if(!area||!plan.zone)return null;
                const zr2=ZONE_RULES[normaliseZone(plan.zone)||plan.zone];
                if(!zr2)return null;
                /* Extract min lot size from zone */
                const minLotMap={NRZ:500,GRZ:300,RGZ:200,MUZ:80,C1Z:80,LDRZ:4000};
                const schedNum=getZoneScheduleNum(plan.zone);
                const schedMinLot=zr2.schedules?.[schedNum]?parseInt((zr2.schedules[schedNum].minLot||"300").replace(/[^0-9]/g,"")):null;
                const minLot=schedMinLot||minLotMap[plan.zone]||300;
                /* Theoretical maximum (area only) */
                const theoreticalMax=Math.floor(area/minLot);
                /* Practical constraints */
                const gardenPct=["NRZ","GRZ"].includes(plan.zone)?0.35:0.20;
                const buildableArea=area*(1-gardenPct);
                /* Frontage constraint: assume 6m min per dwelling frontage (+ 3m side setbacks) */
                const frontageDwellings=frontage>0?Math.floor((frontage-3)/6):theoreticalMax;
                /* ResCode setback constraint estimate: front 5m, rear 3m, sides 1.2m each */
                const effectiveDepth=parseNum(site.depth)>0?Math.max(0,parseNum(site.depth)-8):null; // front 5m + rear 3m
                /* Conservative practical estimate */
                const practicalMax=Math.min(
                  theoreticalMax,
                  frontageDwellings>0?frontageDwellings:theoreticalMax,
                  plan.zone==="NRZ"?2:99
                );
                const conservative=Math.max(1,Math.floor(practicalMax*0.85));
                const optimistic=practicalMax;
                const color=practicalMax>=4?C.accent:practicalMax>=2?C.gold:C.warn;
                return(
                  <Card title=" Lot Yield Estimator" accent={color}>
                    <div style={{background:color+"11",border:`1px solid ${color}33`,borderRadius:8,padding:"12px 16px",marginBottom:12,fontFamily:sans,fontSize:12,color:C.slate}}>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:10}}>
                        <div style={{textAlign:"center",padding:"10px",background:"#fff",borderRadius:8,border:`1px solid ${C.border}`}}>
                          <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Min Lot Size ({plan.zone}{schedNum})</div>
                          <div style={{fontSize:22,fontWeight:800,fontFamily:mono,color:C.brand}}>{minLot.toLocaleString()}m</div>
                        </div>
                        <div style={{textAlign:"center",padding:"10px",background:"#fff",borderRadius:8,border:`1px solid ${C.border}`}}>
                          <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Theoretical Max Lots</div>
                          <div style={{fontSize:22,fontWeight:800,fontFamily:mono,color:C.slate}}>{theoreticalMax}</div>
                          <div style={{fontSize:10,color:C.muted}}>site area  min lot only</div>
                        </div>
                        <div style={{textAlign:"center",padding:"10px",background:color+"11",borderRadius:8,border:`2px solid ${color}44`}}>
                          <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Practical Range</div>
                          <div style={{fontSize:22,fontWeight:800,fontFamily:mono,color}}>
                            {conservative===optimistic?conservative:`${conservative}${optimistic}`}
                          </div>
                          <div style={{fontSize:10,color:C.muted}}>dwellings (ResCode adjusted)</div>
                        </div>
                        <div style={{textAlign:"center",padding:"10px",background:"#fff",borderRadius:8,border:`1px solid ${C.border}`}}>
                          <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Max Buildable Footprint</div>
                          <div style={{fontSize:18,fontWeight:800,fontFamily:mono,color:C.blue}}>{Math.round(buildableArea).toLocaleString()}m</div>
                          <div style={{fontSize:10,color:C.muted}}>{Math.round((1-gardenPct)*100)}% site (garden: {Math.round(gardenPct*100)}%)</div>
                        </div>
                      </div>
                      <div style={{marginTop:10,fontSize:12,color:C.slate,lineHeight:1.7}}>
                        <strong>Indicative yield: {conservative===optimistic?`${conservative} dwellings`:`${conservative}${optimistic} dwellings`}</strong>
                        {frontage>0&&frontageDwellings<theoreticalMax&&<span style={{color:C.orange}}>  Frontage constraint: {frontage}m frontage limits to {frontageDwellings} dwelling(s) wide</span>}
                        {plan.zone==="NRZ"&&<span style={{color:C.warn}}>  NRZ hard limit: typically maximum 2 dwellings (check schedule)</span>}
                      </div>
                      <div style={{marginTop:6,fontSize:11,color:C.muted}}>
                         This is a desktop estimate only  not a planning assessment. Engage a registered town planner to confirm yield. Setbacks, overlays, site access, and council-specific schedules can further reduce yield.
                      </div>
                    </div>
                    {optimistic>0&&parseNum(market.grvPerUnit)>0&&(
                      <div style={{padding:"10px 14px",borderRadius:8,background:"#f0f4ff",border:`1px solid ${C.blue}33`,fontFamily:sans,fontSize:12,color:C.slate}}>
                        <strong>Implied GRV range at {fmt(parseNum(market.grvPerUnit))}/dwelling: </strong>
                        {conservative!==optimistic?<>{fmt(conservative*parseNum(market.grvPerUnit))}  {fmt(optimistic*parseNum(market.grvPerUnit))}</>:<>{fmt(optimistic*parseNum(market.grvPerUnit))}</>}
                        {!market.grvUnits&&optimistic>0&&<span style={{marginLeft:8,color:C.muted}}> Update "Number of Dwellings" in Market Analysis to use this yield</span>}
                      </div>
                    )}
                  </Card>
                );
              })()}

              <span id="gate-anchor-overlays" style={{display:"block",height:0,marginTop:-8}}/>
              <span id="gate-anchor-ddo" style={{display:"block",height:0}}/>
              <Card title="Planning Overlays" accent={C.orange}>
                <div style={{marginBottom:10,fontSize:12,fontWeight:700,color:C.accent,fontFamily:sans}}> Environmental / Landscape</div>
                <Row>
                  <Toggle label="Vegetation Protection Overlay (VPO)" checked={plan.hasVPO} onChange={uP("hasVPO")} hint="Tree report required, removal needs permit  adds time & cost"/>
                  <Toggle label="Significant Landscape Overlay (SLO)" checked={plan.hasSLO} onChange={uP("hasSLO")} hint="Height & appearance restricted, landscape consultant required"/>
                  <Toggle label="Environmental Significance Overlay (ESO)" checked={plan.hasESO} onChange={uP("hasESO")} hint="Ecological assessment required, may restrict construction"/>
                </Row>
                <div style={{marginBottom:10,marginTop:14,fontSize:12,fontWeight:700,color:C.warn,fontFamily:sans}}> Risk Overlays</div>
                <Row>
                  <Toggle label="Flood Risk (SBO / LSIO)" checked={plan.hasSBO} onChange={uP("hasSBO")} hint="Hydrology report required, floor levels may be raised, insurance costs increase"/>
                  <Toggle label="Bushfire Management Overlay (BMO/WMO)" checked={plan.hasBMO} onChange={uP("hasBMO")} hint="BAL rating required, materials restricted, construction cost +1015%"/>
                  <Toggle label="Geotechnical Risk" checked={plan.hasGeo} onChange={uP("hasGeo")} hint="Geotechnical report required, specialised footing design likely"/>
                </Row>
                <div style={{marginBottom:10,marginTop:14,fontSize:12,fontWeight:700,color:C.blue,fontFamily:sans}}> Design Controls</div>
                <Row>
                  <Toggle label="Design & Development Overlay (DDO)" checked={!!plan.hasDDO} onChange={uP("hasDDO")} hint="DDO overrides zone height limits  check DDO schedule for your specific street/precinct"/>
                  <Input label="DDO Schedule (e.g. DDO8)" value={plan.ddoSchedule} onChange={uP("ddoSchedule")} placeholder="e.g. DDO8, DDO12" hint="Mandatory to check: each schedule has different height, setback and design requirements"/>
                </Row>
                {plan.hasDDO&&(
                  <div style={{background:"#eff6ff",border:`1px solid ${C.blue}`,borderRadius:8,padding:"10px 14px",marginBottom:8,fontFamily:sans,fontSize:12,lineHeight:1.7}}>
                    <strong style={{color:C.blue}}> DDO Height Override Active</strong><br/>
                    A Design &amp; Development Overlay (DDO) can <strong>both increase and decrease</strong> the maximum height permitted by the zone.
                    For example, MUZ zones have no height limit by default, but a DDO may cap development at 813m in residential transition areas.
                    Conversely, DDO8 in Box Hill permits buildings up to 50m+.<br/>
                    <strong>Action required:</strong> Obtain the current DDO schedule from the council planning scheme (search VicPlan or Council website).
                    Confirm whether your proposed {plan.maxHeight?`${plan.maxHeight}m`:"(enter height above)"} complies with the DDO maximum height, and whether the DDO specifies street wall heights, setback variations, or built form guidelines.
                    {plan.ddoSchedule&&<span style={{marginLeft:6,color:C.brand,fontWeight:600}}>Schedule noted: {plan.ddoSchedule}</span>}
                  </div>
                )}
                <div style={{marginBottom:10,marginTop:14,fontSize:12,fontWeight:700,color:C.purple,fontFamily:sans}}> Heritage Protection</div>
                <Row>
                  <Toggle label="Heritage Overlay (HO)" checked={plan.hasHO} onChange={uP("hasHO")} hint="Demolition may be refused, alterations tightly controlled, approval timelines significantly extended"/>
                  <Toggle label="Aboriginal Cultural Heritage" checked={plan.hasAboriginal} onChange={uP("hasAboriginal")} hint="Cultural Heritage Management Plan (CHMP) required, may delay project 612 months"/>
                </Row>
                {/* P0.1  Explicit overlay confirmation gate (prevents phantom confidence score) */}
                <div style={{marginTop:12,display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:plan.overlayReviewed?"#f0fdf9":"#fffbea",border:`1px solid ${plan.overlayReviewed?C.teal:C.orange}`,borderRadius:8}}>
                  <div style={{flex:1,fontFamily:sans,fontSize:12,color:C.slate,lineHeight:1.6}}>
                    {plan.overlayReviewed

            {/*  Massing Viewer  SVG Footprint + Section  */}
            <Card title=" Development Massing Viewer" accent={C.purple}>
              <div style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>
                Live envelope diagram showing max buildable footprint (top view) and height section (side view) based on zone rules, setbacks, and site dimensions. Updates automatically as you fill in planning controls.
              </div>
              {(()=>{
                const zKey=normaliseZone(plan.zone)||plan.zone||"GRZ";
                const zr=ZONE_RULES[zKey]||ZONE_RULES["GRZ"];
                const aNum=parseNum(site.area)||700;
                const fNum=parseNum(site.frontage)||bboxDims?.frontEst||18;
                const dNum=parseNum(site.depth)||bboxDims?.depthEst||Math.round(aNum/fNum);
                const maxH=parseNum(plan.maxHeight||zr?.maxHeight)||9;
                const covPct=parseNum(plan.maxCoverage||"60")/100;
                const ddoKey=plan.ddoSchedule&&Object.keys(DDO_RULES).find(k=>k.toLowerCase().includes(plan.ddoSchedule.toLowerCase()))||(zKey==="GRZ"?"Generic GRZ (suburban)":zKey==="NRZ"?"Generic NRZ":zKey==="RGZ"?"Generic RGZ":zKey==="MUZ"?"Generic MUZ":null);
                const ddo=ddoKey?DDO_RULES[ddoKey]:null;

                /* Setbacks from zone */
                const frontSB=parseNum(plan.zone==="NRZ"?"6":"4");
                const rearSB=3;
                const sideSB=parseNum(plan.zone==="NRZ"?"1.2":"1.0");
                const floors=ddo?ddo.maxFloors:Math.max(1,Math.round(maxH/3.2));
                const floorH=maxH/floors;

                /* SVG dimensions */
                const SW=340,SH=240; /* footprint canvas */
                const scale=Math.min((SW-40)/fNum,(SH-40)/dNum);
                const sW=fNum*scale,sH=dNum*scale;
                const ox=(SW-sW)/2,oy=(SH-sH)/2;
                /* Buildable box */
                const bx=ox+sideSB*scale,by=oy+frontSB*scale;
                const bw=sW-sideSB*2*scale,bh=sH-(frontSB+rearSB)*scale;
                const buildArea=bw*bh/(scale*scale);
                /* Section SVG */
                const SecW=340,SecH=180;
                const secScale=Math.min((SecW-60)/fNum,SecH*0.7/maxH);
                const secSW=fNum*secScale;
                const secOx=(SecW-secSW)/2;
                const groundY=SecH-20;

                return(
                  <div style={{display:"flex",flexWrap:"wrap",gap:24,justifyContent:"center"}}>
                    {/*  Footprint (top view)  */}
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:6,textAlign:"center"}}> Top View  Footprint & Setbacks</div>
                      <svg width={SW} height={SH} style={{border:`1px solid ${C.border}`,borderRadius:8,background:"#f0f4f0"}}>
                        {/* Site boundary */}
                        <rect x={ox} y={oy} width={sW} height={sH} fill="#dde8dd" stroke="#6b9b6b" strokeWidth={2}/>
                        {/* Front label */}
                        <text x={SW/2} y={oy-4} textAnchor="middle" fontSize={10} fill={C.muted}>{fNum.toFixed(1)}m frontage</text>
                        <text x={ox-4} y={SH/2} textAnchor="middle" fontSize={10} fill={C.muted} transform={`rotate(-90,${ox-4},${SH/2})`}>{dNum.toFixed(1)}m</text>
                        {/* Setback zones */}
                        <rect x={ox} y={oy} width={sW} height={frontSB*scale} fill="#fef3c7" opacity={0.7}/>
                        <rect x={ox} y={oy+sH-rearSB*scale} width={sW} height={rearSB*scale} fill="#fef3c7" opacity={0.7}/>
                        <rect x={ox} y={oy} width={sideSB*scale} height={sH} fill="#fef3c7" opacity={0.7}/>
                        <rect x={ox+sW-sideSB*scale} y={oy} width={sideSB*scale} height={sH} fill="#fef3c7" opacity={0.7}/>
                        {/* Buildable envelope */}
                        {bw>0&&bh>0&&<rect x={bx} y={by} width={bw} height={bh} fill={zr?.color||"#27ae60"} opacity={0.35} stroke={zr?.color||"#27ae60"} strokeWidth={1.5} strokeDasharray="4,2"/>}
                        {/* Labels */}
                        <text x={SW/2} y={oy+frontSB*scale/2+4} textAnchor="middle" fontSize={9} fill="#92400e">Front {frontSB}m</text>
                        <text x={SW/2} y={oy+sH-rearSB*scale/2+4} textAnchor="middle" fontSize={9} fill="#92400e">Rear {rearSB}m</text>
                        <text x={bx+bw/2} y={by+bh/2+4} textAnchor="middle" fontSize={10} fontWeight="bold" fill={zr?.color||"#27ae60"}>{Math.round(buildArea)}m</text>
                        <text x={bx+bw/2} y={by+bh/2+17} textAnchor="middle" fontSize={9} fill={zr?.color||"#27ae60"}>buildable envelope</text>
                        {/* Compass */}
                        <text x={SW-18} y={26} textAnchor="middle" fontSize={14}></text>
                        <text x={SW-18} y={38} textAnchor="middle" fontSize={9} fill={C.muted}>N</text>
                      </svg>
                      <div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:4}}>{zKey}  {Math.round(covPct*100)}% max coverage  setbacks: F{frontSB}m R{rearSB}m S{sideSB}m</div>
                    </div>

                    {/*  Section (side view)  */}
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:C.slate,marginBottom:6,textAlign:"center"}}> Side Section  Height Envelope</div>
                      <svg width={SecW} height={SecH} style={{border:`1px solid ${C.border}`,borderRadius:8,background:"#f5f7fa"}}>
                        {/* Ground */}
                        <line x1={0} y1={groundY} x2={SecW} y2={groundY} stroke="#9ca3af" strokeWidth={1}/>
                        <text x={SecW/2} y={SecH-4} textAnchor="middle" fontSize={9} fill={C.muted}>ground level</text>
                        {/* Site footprint on ground */}
                        <rect x={secOx} y={groundY} width={secSW} height={4} fill="#6b9b6b"/>
                        <text x={secOx} y={groundY+14} fontSize={9} fill={C.muted}>{sideSB}m</text>
                        <text x={secOx+secSW} y={groundY+14} textAnchor="end" fontSize={9} fill={C.muted}>{sideSB}m</text>
                        {/* Building floors */}
                        {Array.from({length:floors}).map((_,i)=>{
                          const floorY=groundY-(i+1)*floorH*secScale;
                          const fw=secSW-sideSB*2*secScale;
                          const fx=secOx+sideSB*secScale;
                          const isTop=i===floors-1;
                          return(
                            <g key={i}>
                              <rect x={fx} y={floorY} width={fw} height={floorH*secScale}
                                fill={isTop?"#6c5ce7":i%2===0?"#a78bfa":"#c4b5fd"} stroke="#7c3aed" strokeWidth={0.8} opacity={0.7}/>
                              <text x={fx+fw/2} y={floorY+floorH*secScale/2+4} textAnchor="middle" fontSize={9} fill="#3b0764">
                                {isTop?"Roof / Top":i===0?"GF":` L${i+1}`}
                              </text>
                            </g>
                          );
                        })}
                        {/* Height arrow */}
                        <line x1={secOx-10} y1={groundY} x2={secOx-10} y2={groundY-maxH*secScale} stroke="#374151" strokeWidth={1} markerStart="url(#arr)" markerEnd="url(#arr)"/>
                        <text x={secOx-24} y={groundY-maxH*secScale/2+4} textAnchor="middle" fontSize={9} fill={C.slate} transform={`rotate(-90,${secOx-24},${groundY-maxH*secScale/2+4})`}>{maxH}m</text>
                        {/* Width label */}
                        <text x={secOx+secSW/2} y={20} textAnchor="middle" fontSize={10} fill={C.muted}>{fNum.toFixed(1)}m width</text>
                      </svg>
                      <div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:4}}>{floors} floor{floors>1?"s":""}  {maxH}m max  {zKey}</div>
                    </div>
                  </div>
                );
              })()}
              <div style={{marginTop:14,padding:"10px 14px",background:C.brandLight,borderRadius:8,fontSize:11,color:C.brand,lineHeight:1.6}}>
                <strong> How to read this diagram:</strong> Yellow zones = mandatory setbacks (not buildable).
                Shaded box = maximum permitted building footprint.
                Section view shows max floor stack at the height limit.
                These are envelope maximums  actual design will be smaller after ResCode constraints, parking, open space, and neighbour amenity requirements.
              </div>
            </Card>

            <Card title=" ResCode Compliance Snapshot  Key Standards (Clause 55)" accent={C.blue}>
              {(()=>{
                const _zKey=normaliseZone(plan.zone)||plan.zone||"GRZ";
                const _sb=ZSB_RESCODE[_zKey]||ZSB_RESCODE.GRZ;
                const _wallH=parseNum(plan.maxHeight)||9;

                const _gardenPct=_siteArea>0?Math.round((1-_cov)*100):null;
                const _b17Req=_wallH>3.6?Math.max(_sb.s2,(_wallH-3.6)*0.3):_sb.s1;
                const _carProvided=parseNum(conds.parkingSpaces)||0;
                const _isGardenZone=["NRZ","GRZ"].some(z=>_zKey.startsWith(z));
                const checks=[
                  {id:"B6",title:"Front Setback",
                    status:_sb.f>0?"info":"pass",
                    detail:`Required ${_sb.f}m for ${_zKey}  ${_sb.f===0?"No minimum (commercial zone)":"Enter actual setback in Planning tab for exact compliance check"}`,
                    fix:"Planning tab  Zone & Overlays  verify proposed front setback"},
                  {id:"B17",title:"Upper Floor Side Setback",
                    status:"info",
                    detail:`Wall ${_wallH}m  required side setback ${_b17Req.toFixed(1)}m`+(_wallH>3.6?` (formula: max(${_sb.s2}, (${_wallH}3.6)0.3))`:` (GF rule: ${_sb.s1}m)`),
                    fix:"Review massing SVG above for visual confirmation"},
                  {id:"B19",title:"Shadow Impact Assessment",
                    status:_estFloors>=3||(plan.zone==="RGZ"||plan.zone==="MUZ")?"warn":"pass",
                    detail:_estFloors>=3?`~${_estFloors} floors estimated  shadow diagram likely required (9am3pm, 22 Sep)`:
                      (plan.zone==="RGZ"||plan.zone==="MUZ")?`Zone allows 4+ storeys  confirm with council planner`:`${_estFloors} floors at ${_wallH}m  shadow assessment unlikely unless council-triggered`,
                    fix:"Engage shadow consultant ($2,000$4,000). Allow 34 weeks."},
                  {id:"B22",title:"Overlooking / Privacy Screening",
                    status:(conds.adjNorthPOS||conds.adjHabitableWindow)?"warn":"pass",
                    detail:(conds.adjNorthPOS||conds.adjHabitableWindow)?
                      `Adjoining ${[conds.adjNorthPOS?"north POS":null,conds.adjHabitableWindow?"habitable window":null].filter(Boolean).join(" + ")} flagged  privacy screens required`:
                      "No overlooking risks flagged from Site Conditions",
                    fix:"Budget $2,000$5,000 per screening location; frosted glazing or opaque screens"},
                  {id:"B28",title:"Private Open Space (POS)  min 8m",
                    status:_posPerUnit==null?"unknown":_posPerUnit>=8?"pass":"fail",
                    detail:_posPerUnit!=null?`Est. ${_posPerUnit}m/dwelling (${_siteArea}m site, ${Math.round(_cov*100)}% coverage, ${_units} dwellings)`:`Enter site area + unit count + coverage to calculate`,
                    fix:"Reduce site coverage or unit count; upper-level terraces may substitute (requires Planning approval)"},
                  {id:"B29",title:`Garden Area ${_isGardenZone?"(min 35%)":" Zone Exemption"}`,
                    status:!_isGardenZone?"pass":_gardenPct==null?"unknown":_gardenPct>=35?"pass":"fail",
                    detail:!_isGardenZone?`Not required for ${_zKey}`:_gardenPct!=null?`Est. ${_gardenPct}% open area (min 35%  Amendment VC148)`:`Enter site area + site coverage to calculate`,
                    fix:"Increase soft landscaping; permeable paving counts; reduce hard-paved driveway areas"},
                  {id:"B30",title:"Car Parking (Cl. 52.06  min 1/dwelling)",
                    status:_units===0?"unknown":_carProvided>=_units?"pass":_carProvided>0?"warn":"unknown",
                    detail:_carProvided>0?`${_carProvided} space${_carProvided>1?"s":""} entered for ${_units>0?_units:"?"} dwelling${_units!==1?"s":""}${_units>0&&_carProvided<_units?`  ${_units-_carProvided} short`:""}`:
                      `Enter parking spaces in Site Conditions tab to check`,
                    fix:"Tandem accepted if frontage <14m; visitor spaces required for 5+ dwellings"},
                ];
                const statusIcon={pass:"",fail:"",warn:"",info:"",unknown:""};
                const statusBg={pass:"#f0fdf4",fail:"#fef2f2",warn:"#fffbeb",info:"#f0f9ff",unknown:"#f8fafc"};
                const statusBorder={pass:C.accent,fail:C.warn,warn:"#d97706",info:C.blue,unknown:C.muted};
                const passCount=checks.filter(c=>c.status==="pass").length;
                const failCount=checks.filter(c=>c.status==="fail").length;
                const warnCount=checks.filter(c=>c.status==="warn").length;
                return(

                        color:failCount>0?C.warn:warnCount>0?"#92400e":C.brand}}>

                    <div style={{display:"flex",flexDirection:"column",gap:7}}>
                      {checks.map(ch=>(

                            )}
                          </div>

                      ))}
                    </div>
                    <div style={{marginTop:12,padding:"8px 12px",background:"#f1f5f9",borderRadius:8,fontSize:11,color:C.muted,fontFamily:sans,textAlign:"center"}}>
                      All references are to <strong>Clause 55</strong> (Two or more dwellings on a lot, VicCode). Enter Planning tab data for more accurate results. Always obtain a planning certificate from your local council.
                    </div>
                  </>
                );
              })()}
            </Card>
          </>
        );
