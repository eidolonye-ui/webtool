          const projectMonths=parseNum(str.projectMonths)||30;
          const irrCashFlows=calc.grv&&calc.land&&calc.hard?
            buildIRRCashFlows(calc.land,calc.soft,calc.hard,calc.grv,parseNum(str.lvrPct)||65,projectMonths,0,parseNum(str.interestRate)||8.5):null;
          const trueIRR=irrCashFlows?calcTrueIRR(irrCashFlows):null;
          /* Fallback simple IRR for display when cash flows not available */
          const simpleIRR=estimateIRR(calc.profit,equityRequired,projectMonths);
          const irr=trueIRR??simpleIRR;
          const irrMethod=trueIRR!=null?"Cash-flow IRR":"Simple annualised ROE";
          const roe=equityRequired>0?(calc.profit/equityRequired)*100:null;
          const gst=calcGST(calc.grv,parseNum(fin.landPrice));
          /* GST Input Tax Credits (ITC)  #33 accuracy note:
             Hard cost: (cost - cost/1.1)  90% recovery = GST component  90% (not all suppliers registered)
             Soft cost: cost/11  80% (professional fees often incl GST; some exempt: council fees, stamp duty)
             These are estimates only  actual ITC verified by tax adviser under margin scheme or full method. */
          const hardCostExGST=calc.hard>0?calc.hard/1.1:0;
          const itcCredit=fin.gstITC&&calc.hard>0?Math.round((calc.hard-hardCostExGST)*0.9):0;
          const softITC=fin.gstITC&&calc.soft>0?Math.round(calc.soft/11*0.8):0;
          const totalITC=itcCredit+softITC;
          /* Simple NPV: -equity at T=0, equity+profit at T=n months */
          const r=parseNum(str.discountRate)/100;
          const n=projectMonths;
          const npv=equityRequired>0?Math.round(((equityRequired+calc.profit)/Math.pow(1+r,n/12))-equityRequired):null;
          /*  RLV: iterative solver  accounts for stamp duty circular dependency */
          const otherCostsExLand=calc.soft+calc.hard+calc.hold+calc.sale;
          const rlv=calc.grv>0?calcRLVIterative(calc.grv,20,otherCostsExLand,fin.isForeign):null;
          /*  RLV Stress Test  sensitivity to build cost escalation and market softening
             Hard cost is the most volatile input (labour + materials inflation, 2024-26 avg +6-9% p.a.)
             GRV stress models a soft market or forced-sale scenario at 5% below current estimates */
          const rlvStress5=calc.grv>0&&calc.hard>0?calcRLVIterative(calc.grv,20,otherCostsExLand+Math.round(calc.hard*0.05),fin.isForeign):null;
          const rlvStress10=calc.grv>0&&calc.hard>0?calcRLVIterative(calc.grv,20,otherCostsExLand+Math.round(calc.hard*0.10),fin.isForeign):null;
          const rlvStressGrv5=calc.grv>0?calcRLVIterative(Math.round(calc.grv*0.95),20,otherCostsExLand,fin.isForeign):null;
          /* Net-of-GST profit under Margin Scheme */
          const gstNetProfit=fin.applyGSTMargin?calc.profit-gst.marginScheme:null;
          const gstNetMargin=gstNetProfit!=null&&calc.total>0?(gstNetProfit/calc.total)*100:null;
          /* LVR on GRV (bank metric: senior debt / GRV, target <65%) */
          const lvrOnGRV=calc.grv>0?seniorDebt/calc.grv*100:null;
          /*  Bankability Indicator (LVR Safety Line)
             Standard construction finance LVR on GRV cap: 70% (major banks, 2026)
             Tightened to 65% for Heritage Overlay / high-risk LGAs  banks apply
             higher risk weighting to properties with potential heritage constraints.
             Mezzanine lenders accept 7580% but at +46% rate premium. */
          const lgaHasDangerAlert=calc.lgaAlerts&&calc.lgaAlerts.some(a=>a.level==="danger");
          const bankLvrCap=lgaHasDangerAlert?65:70; /* % of GRV */
          const bankLvrCapAmt=calc.grv>0?Math.round(calc.grv*bankLvrCap/100):null;
          const bankabilityStatus=lvrOnGRV==null?"unknown"
            :lvrOnGRV<=bankLvrCap?"bankable"
            :lvrOnGRV<=75?"mezzanine-territory"
            :"over-leveraged";
          /* Equity Multiple: (equity + profit) / equity  standard LP/developer metric */
          const equityMultiple=equityRequired>0?(equityRequired+calc.profit)/equityRequired:null;
          /* DSCR: Debt Service Coverage Ratio  NOI / annual debt service
             Banks require 1.25 for construction finance. Uses annualised interest as proxy for debt service. */
          const annualDebtService=calcInterest>0?calcInterest/(projectMonths/12):null;
          const noi=calc.grv>0?calc.grv*0.045:null; // proxy: ~4.5% yield on end value (stabilised NOI)
          const dscr=annualDebtService>0&&noi?noi/annualDebtService:null;
          /* Peak equity: worst-case from monthly cashflow table (minimum cumulative cashflow point) */
          const mCF=irrCashFlows?irrCashFlows:null;
          const peakEquityExposure=mCF?Math.abs(Math.min(0,...mCF.map(cf=>cf.cumCashflow||0))):equityRequired;
          return{seniorDebt,debtConstraint,debtByTDC,debtByGRV,mez,equityRequired,calcInterest,
            irr,irrMethod,trueIRR,simpleIRR,roe,npv,totalITC,rlv,rlvStress5,rlvStress10,rlvStressGrv5,
            gstNetProfit,gstNetMargin,lvrOnGRV,
            equityMultiple,dscr,annualDebtService,peakEquityExposure,
            lgaHasDangerAlert,bankLvrCap,bankLvrCapAmt,bankabilityStatus,...gst};
        },[calc,str,fin.landPrice,fin.gstITC,fin.applyGSTMargin,fin.isForeign]);

        const qualitySignals=useMemo(()=>{
          /*  GRV / Exit Value confidence
             Does the exit valuation have a verifiable basis?     */
          let grvScore=0;
          const grvSources=[];
          // P1.1: source registry bonus  higher-quality sources add extra points
          const grvSrc=sourceReg?.grvPerUnit;
          if(parseNum(market.grvPerUnit)>0){
            const srcBonus=grvSrc?.source==="Comparable Sales"?15:grvSrc?.source==="Domain"?10:0;
            grvScore+=30+srcBonus;
            grvSources.push(grvSrc?.source&&grvSrc.source!=="Manual"?`GRV via ${grvSrc.source}`:"Manual GRV entry");
          }
          if(parseNum(market.grvUnits)>0) {grvScore+=10;grvSources.push("Unit count set");}
          if(benchmarks&&benchmarks.length>0){grvScore+=Math.min(20,benchmarks.length*5);grvSources.push(`${benchmarks.length} historical comp${benchmarks.length>1?"s":""}`);}
          if(parseNum(market.dom)>0)      {grvScore+=10;grvSources.push("DOM data");}
          if(domainData?.status==="ok")   {grvScore+=20;grvSources.push("Domain live data");}
          if(parseNum(market.lastSalePrice)>0){grvScore+=10;grvSources.push("Subject sale price");}
          const grvFresh=domainData?.status==="ok"?calcFreshness(liveInd.ts):calcFreshness(grvSrc?.lastVerifiedAt||null);
          /* P1-3: freshness decay  stale GRV source loses points */
          const grvFreshDecay=calcSourceFreshness(grvSrc?.lastVerifiedAt).decayPts;
          grvScore=Math.max(0,grvScore-grvFreshDecay);

          /*  Construction & TDC confidence  */
          let costScore=0;
          const costSources=[];
          if(parseNum(fin.buildCostPSM)>0)                  {costScore+=25;costSources.push("Build rate $/m");}
          const hasArea=parseNum(fin.buildArea)>0||parseNum(fin.areaLiving)>0;
          if(hasArea)                                        {costScore+=25;costSources.push("GFA entered");}
          if(params.buildType&&params.buildType!=="")        {costScore+=20;costSources.push("Build type set");}
          const unitCount=parseNum(market.grvUnits)||parseNum(plan.estUnits);
          if(unitCount>0)                                    {costScore+=15;costSources.push("Unit count");}
          if(parseNum(fin.contingencyPct)>0||parseNum(fin.contingency)>0){costScore+=15;costSources.push("Contingency set");}
          const costFresh=calcFreshness(null); // construction rates are static inputs, no live feed
          /* P1-3: freshness decay  stale cost source loses points */
          const costSrc=sourceReg?.buildCostPSm;
          const costFreshDecay=calcSourceFreshness(costSrc?.lastVerifiedAt).decayPts;
          costScore=Math.max(0,costScore-costFreshDecay);

          /*  IRR & Returns confidence  */
          let irrScore=0;
          const irrSources=[];
          if(finStruct?.trueIRR!=null)               {irrScore+=40;irrSources.push("Cash-flow IRR (Newton-Raphson)");}
          else if(finStruct?.simpleIRR!=null)        {irrScore+=20;irrSources.push("Simple annualised ROE (estimate)");}
          if(parseNum(str.projectMonths)>0)          {irrScore+=20;irrSources.push("Project months set");}
          if(parseNum(str.interestRate)>0)           {irrScore+=20;irrSources.push("Interest rate set");}
          if(parseNum(str.lvrPct)>0)                 {irrScore+=20;irrSources.push("LVR set");}
          const irrFresh=calcFreshness(liveInd?.ts);
          /* P1-3: freshness decay  stale interest rate / timeline source loses points */
          const irrSrc=sourceReg?.interestRate;
          const irrFreshDecay=calcSourceFreshness(irrSrc?.lastVerifiedAt).decayPts;
          irrScore=Math.max(0,irrScore-irrFreshDecay);

          /*  Planning & Timeline confidence  */
          let planScore=0;
          const planSources=[];
          if(plan.zone&&plan.zone!=="")              {planScore+=30;planSources.push("Zone set");}
          if(lookupResult?.lat)                      {planScore+=20;planSources.push("Address geocoded");}
          /* P0.1 fix: overlayReviewed must be explicitly set  never infer from presence of any overlay flag.
             Reason: a project with no overlays scores the same as an unchecked project if we use flag presence. */
          if(plan.overlayReviewed)                   {planScore+=20;planSources.push("Overlays confirmed");}
          /* P0.1 fix: easements !== undefined is always true (field exists in state), use explicit review flag. */
          if(plan.easementReviewed)                  {planScore+=15;planSources.push("Easements confirmed");}
          if(parseNum(site.area)>0)                  {planScore+=15;planSources.push("Site area set");}
          const planFresh=lookupResult?.lat?calcFreshness(liveInd?.ts):calcFreshness(null);

          /*  P0-3: Source Registry penalty
             If a key field has a value but source is still "Manual" (default),
             deduct points from the relevant sub-score.
             Fields: grvPerUnit, buildCostPSm, interestRate, projectMonths, contingencyPct, zone */
          const missingSources=[];
          const srcCheck=[
            {key:"grvPerUnit",   label:"GRV / Sale Price",  hasValue:parseNum(market.grvPerUnit)>0, score:"grv"},
            {key:"buildCostPSm", label:"Build Cost ($/m)",  hasValue:parseNum(fin.buildCostPSM)>0, score:"cost"},
            {key:"interestRate", label:"Interest Rate",       hasValue:parseNum(str.interestRate)>0, score:"irr"},
            {key:"projectMonths",label:"Project Timeline",    hasValue:parseNum(str.projectMonths)>0,score:"irr"},
            {key:"contingencyPct",label:"Contingency %",      hasValue:parseNum(fin.contingencyPct)>0,score:"cost"},
            {key:"zone",         label:"Planning Zone source",hasValue:!!(plan.zone),               score:"plan"},
          ];
          srcCheck.forEach(({key,label,hasValue})=>{
            const reg=sourceReg?.[key];
            if(hasValue&&(!reg||reg.source==="Manual"||reg.source==="")){ missingSources.push(label); }
          });
          /* Each missing source deducts 8 points from overall (max deduct = 20) */
          const srcPenalty=Math.min(20,missingSources.length*8);

          /*  Aggregate  */
          const overall=Math.max(0,Math.round((grvScore+costScore+irrScore+planScore)/4)-srcPenalty);

          const rows=[
            {metric:"GRV / Exit Value",   score:grvScore,  sources:grvSources,  fresh:grvFresh,  tab:"market",  fixHint:"Enter GRV per unit, add comparable sales, or load Domain live data"},
            {metric:"Construction & TDC", score:costScore, sources:costSources, fresh:costFresh, tab:"finance", fixHint:"Enter build rate ($/m), GFA, select build type, and set contingency %"},
            {metric:"IRR & Returns",      score:irrScore,  sources:irrSources,  fresh:irrFresh,  tab:"structure",fixHint:"Set project months, interest rate, and LVR in Finance Structure tab"},
            {metric:"Planning & Timeline",score:planScore, sources:planSources, fresh:planFresh, tab:"plan",    fixHint:"Set zone, geocode address, confirm overlays from VicPlan, enter site area"},
          ];

          const lowRows=rows.filter(r=>r.score<60).sort((a,b)=>a.score-b.score);

          return{overall,rows,lowRows,missingSources,srcPenalty};
        },[market,fin,plan,str,params,finStruct,liveInd,lookupResult,domainData,benchmarks,site.area,sourceReg]);

        /* confirmQualityGate removed in P1.2  replaced by triggerWithGate (callback pattern) */

        /* triggerWithGate: replaces synchronous window.confirm pattern
           If no low-confidence rows  execute action immediately
           Otherwise  show in-page gate modal with low-confidence table */
        const triggerWithGate=useCallback((actionLabel,action)=>{
          const low=qualitySignals?.lowRows||[];
          if(!low.length){action();return;}
          setGateModal({label:actionLabel,low,onProceed:()=>{setGateModal(null);action();}});
        },[qualitySignals]);

        /*  Site Potential Score  */
        const sitePotential=useMemo(()=>{
          const overlays=[plan.hasVPO,plan.hasSLO,plan.hasESO,plan.hasSBO,plan.hasBMO,plan.hasGeo,plan.hasHO,plan.hasAboriginal,plan.hasDDO].filter(Boolean);
          return calcSitePotential({
            zone:plan.zone,
            area:site.area,
            frontage:site.frontage||bboxDims?.frontEst,
            overlays,
            hasEasement:plan.hasEasementBoe||((plan.easements||"").length>3),
            hasCovenant:plan.hasSingleCovenant,
            slopeClass:calc?.slopeClass||conds.slopeClass,
            bushfire:conds.bushfireProne||plan.bushfireProneArea==="Yes",
          });
        },[plan,site.area,site.frontage,bboxDims,conds,calc]);

        /* Sensitivity */
        const sensitivity=useMemo(()=>[
          {name:"Optimistic",gM:1.05,cM:1.00,emoji:""},
          {name:"Base Case",gM:1.00,cM:1.00,emoji:""},
          {name:"Conservative",gM:0.95,cM:1.05,emoji:""},
          {name:"Pessimistic",gM:0.90,cM:1.10,emoji:""},
        ].map(s=>{const g=calc.grv*s.gM,c=calc.total*s.cM,p=g-c,m=c>0?(p/c)*100:0;return{...s,grv:g,cost:c,profit:p,margin:m}}),[calc]);

        /*  ABSORPTION RATE  HOLDING COST
           Models the impact of sales pace on total project duration.
           If units sell slower than loan term allows, the project needs
           bridging finance  each extra month costs interest on residual debt
           plus ongoing agent/marketing fees.                                */
        const absorptionCalc=useMemo(()=>{
          const rate=parseNum(str.absorptionRate); // units per month entered by user
          const units=parseNum(market.grvUnits)||parseNum(plan.estUnits)||0;
          const projMonths=parseNum(str.projectMonths)||30;
          if(!rate||rate<=0||!units)return null;
          /* Construction occupies ~60% of total project timeline; sales begin when build is complete */
          const constructionMonths=Math.round(projMonths*0.60);
          const salesDurationMonths=Math.ceil(units/rate); // months to clear all stock
          const totalRequired=constructionMonths+salesDurationMonths;
          const extMonths=Math.max(0,totalRequired-projMonths); // months beyond planned timeline
          /* Cost of extension: residual senior debt  monthly interest + pro-rata agent fees */
          const seniorDebt=finStruct?.seniorDebt||0;
          const monthlyRate=(parseNum(str.interestRate)||8.5)/100/12;
          /* Agent/marketing spreads over the sales period */
          const agentMonthly=(calc.sale||0)/Math.max(1,salesDurationMonths);
          const penalty=Math.round(extMonths*(seniorDebt*monthlyRate+agentMonthly));
          /* Sensitivity: what if rate is 50% slower? */
          const slowRate=rate*0.5;
          const slowSalesDur=Math.ceil(units/slowRate);
          const slowTotal=constructionMonths+slowSalesDur;
          const slowExtMonths=Math.max(0,slowTotal-projMonths);
          const slowPenalty=Math.round(slowExtMonths*(seniorDebt*monthlyRate+agentMonthly));
          const warningLevel=extMonths===0?"ok":extMonths<=3?"warn":"risk";
          return{rate,units,constructionMonths,salesDurationMonths,totalRequired,extMonths,
            penalty,warningLevel,seniorDebt,monthlyRate,agentMonthly,
            slowExtMonths,slowPenalty};
        },[str.absorptionRate,str.projectMonths,str.interestRate,market.grvUnits,plan.estUnits,finStruct,calc.sale]);

        /* Risk flags */
        const riskFlags=useMemo(()=>{
          const f=[];
          if(plan.hasVPO)     f.push({label:"Vegetation Protection Overlay (VPO)",   tip:"Tree report required, removal needs permit  impacts buildable area"});
          if(plan.hasSLO)     f.push({label:"Significant Landscape Overlay (SLO)",   tip:"Design must protect landscape views, building bulk strictly limited"});
          if(plan.hasESO)     f.push({label:"Environmental Significance Overlay (ESO)",   tip:"Environmental assessment required, may restrict construction scope"});
          if(plan.hasSBO)     f.push({label:"Flood Risk Overlay (SBO/LSIO)",   tip:"Hydrology report required, floor levels may need to be raised, insurance costs increase"});
          if(plan.hasBMO)     f.push({label:"Bushfire Management Overlay (BMO)",   tip:"BAL rating required, building materials restricted, construction cost +1015%"});
          if(plan.hasGeo)     f.push({label:"Geotechnical Risk",       tip:"Geotechnical investigation required, footing costs may increase substantially"});
          if(plan.hasHO)      f.push({label:"Heritage Overlay",tip:"Demolition may be refused, alterations subject to strict controls"});
          if(plan.hasAboriginal) f.push({label:"Aboriginal Cultural Heritage",  tip:"CHMP assessment required, may delay project 612 months"});
          if(plan.covenants)  f.push({label:"Restrictive Covenant",     tip:"Covenant directly restricts development  careful legal review required"});
          if(plan.zone==="NRZ") f.push({label:"NRZ  Density Restriction", tip:"Typically max 2 dwellings  high-density development not viable"});
          if(plan.hasSingleCovenant) f.push({label:" SINGLE DWELLING COVENANT  Development Blocked",tip:"Legal covenant restricts property to one dwelling only. Any subdivision or multi-dwelling development is prohibited. Seek solicitor advice before purchasing."});
          if(plan.hasEasementBoe) f.push({label:"Easement Detected  Build Over Easement (BOE) Risk",tip:"Easement may pass through developable area. BOE application ($1,500$5,000) and Report & Consent from relevant authority required. May reduce net buildable area."});
          if(conds.adjNorthPOS) f.push({label:"North Neighbour Private Open Space  Overlooking Risk (ResCode B22)",tip:"Proposed upper-level windows may need to comply with overlooking screens or increased setbacks. Budget $2,000 for town planner assessment."});
          if(conds.adjHabitableWindow) f.push({label:"Adjoining Habitable Room Window Within 3m  Privacy Screen Required (ResCode B22)",tip:"Privacy screening or frosted glazing required for any windows that have sightlines to neighbour's habitable rooms within 3m of boundary."});
          /* Site Investigation: powerline detection */
          if(siteInv.status==="done"&&siteInv.osm&&!siteInv.osm.error&&siteInv.osm.powerLines?.length>0)
            f.push({label:`Overhead Power Lines Detected (OSM  ${siteInv.osm.powerLines.length} segment(s))`,tip:"Undergrounding cost $15,000$60,000 and may be developer-funded. Confirm with distributor (CitiPower / Powercor / United Energy)"});
          if(siteInv.status==="done"&&siteInv.elev&&!siteInv.elev.error&&siteInv.elev.maxSlope>=10)
            f.push({label:`Steep Site  Slope ${siteInv.elev.maxSlope?.toFixed(1)}%`,tip:"Site works cost uplift $80,000$120,000+ for slopes >10%. Retaining walls, cut-and-fill, and drainage design required."});
          /* Drainage sink: SRTM elevation shows lot centre below surroundings */
          if(siteInv?.status==="done"&&siteInv?.elev&&!siteInv.elev.error&&Array.isArray(siteInv.elev.elevs)&&siteInv.elev.elevs.length>=5){
            const e=siteInv.elev.elevs;
            const surroundAvg=(e[1]+e[2]+e[3]+e[4])/4;
            if(e[0]<surroundAvg-0.30)
              f.push({label:`Drainage Sink Detected  Charged Stormwater / Pump Pit Required`,tip:`SRTM elevation data shows lot centre ${(surroundAvg-e[0]).toFixed(2)}m below surrounding grade. Gravity drainage to street is not possible  a charged stormwater system / pump pit is required. Budget $20,000$30,000. $25,000 auto-injected into Hard Costs.`});
          }
          /* Task 34  Neighbourhood intensity: sparse context with high proposed yield  objection risk */
          const osmOKni=siteInv?.status==="done"&&siteInv?.osm&&!siteInv?.osm?.error;
          if(osmOKni&&siteInv.osm.neighbourIntensity==="sparse"&&parseNum(plan.estUnits)>2)
            f.push({label:`Sparse Neighbourhood (~${siteInv.osm.nearbyBuildings} bldgs/200m)  Over-development Objection Risk`,tip:`OSM shows only ~${siteInv.osm.nearbyBuildings} mapped buildings within 200m  a low-density street context. Proposing ${plan.estUnits}+ dwellings may face resident objections and planning officer pushback. Allow extra planning timeline (24 months) and consider reducing yield to 2 dwellings.`});
          /* Absorption rate risk flag  injected by absorptionCalc when sales extend beyond loan term */
          if(absorptionCalc&&absorptionCalc.extMonths>3)
            f.push({label:`Slow Absorption  ${absorptionCalc.extMonths} months beyond loan term at ${absorptionCalc.rate} units/month`,
              tip:`At ${absorptionCalc.rate} units/month, all ${absorptionCalc.units} dwellings sell in ~${absorptionCalc.salesDurationMonths} months (after ${absorptionCalc.constructionMonths}mo construction = ${absorptionCalc.totalRequired}mo total). This exceeds the current ${str.projectMonths}mo timeline by ${absorptionCalc.extMonths} months. Estimated bridging cost: $${absorptionCalc.penalty.toLocaleString()} (${absorptionCalc.extMonths}mo  residual debt interest + agent fees). Consider reducing price or offering early-buyer incentives.`});
          /* Bushfire Prone Area (BAL) risk flag  auto-injected from VicPlan */
          if(conds.bushfireProne){
            f.push({label:`Bushfire Prone Area  BAL Compliance Required  $18,000 provisional (NCC Section 3)`,
              tip:`This site is in a declared Bushfire Prone Area. NCC 2022 Section 3 requires BAL-rated construction  fire-resistant glazing, ember guards, external wall cladding upgrades. Typical cost range $10K$25K depending on BAL rating (BAL-12.5 to BAL-FZ). Budget $18K provisional. A BAL assessment report must be obtained from an accredited assessor ($1,500$3,000).`});
          }
          /* Native Vegetation risk flag  adds timeline and approval cost */
          if(plan.hasNativeVeg==="Within"){
            f.push({label:`Native Vegetation Within Protected Area  Add 36 months for DELWP approval`,
              tip:`VicPlan confirms native vegetation exists on or near this site. Removal or destruction requires a permit under the Planning and Environment Act. DELWP assessment typically adds 36 months and $8K$20K in ecological assessment and offset costs. A Native Vegetation Precinct Plan may be required.`});
          }
          /* Mortgage on title  settlement risk */
          if(plan.hasMortgage){
            f.push({label:`Mortgage/Charge Detected on Title (Section 32)`,
              tip:`A mortgage or charge was identified in the Section 32 vendor statement. Confirm discharge prior to settlement. Factor in potential delays if mortgagee consent to subdivision/development is required.`});
          }
          /* Rock excavation risk flag */
          if(conds.rockGrade){
            const ROCK_LABEL={R1:"Minor rock fragments",R2:"Significant rock seam / basalt",R3:"Massive rock  blasting likely"};
            const ROCK_PS={R1:25000,R2:65000,R3:120000};
            f.push({label:`Rock Excavation Risk (${ROCK_LABEL[conds.rockGrade]||conds.rockGrade})  $${(ROCK_PS[conds.rockGrade]||0).toLocaleString()} provisional`,
              tip:`Rock grade ${conds.rockGrade} increases footing excavation cost. ${conds.rockGrade==="R3"?"Blasting permits and vibration monitoring may be required  allow 46 weeks and $120K+ provisional.":conds.rockGrade==="R2"?"Rock breaking equipment required, specialist subcontractors. Budget $65K provisional in hard costs.":"Budget $25K provisional for occasional rock fragments. Confirm with geotechnical report."}`});
          }
          /* Tandem parking constraint: frontage < 14m with multi-dwelling */
          const frontEstRisk=bboxDims?.frontEst||parseNum(site.frontage);
          const estUnitsRisk=parseNum(plan.estUnits)||parseNum(market.grvUnits)||0;
          if(frontEstRisk>0&&frontEstRisk<14&&estUnitsRisk>1){
            const bedsRisk=parseNum(plan.bedsPerUnit)||3;
            const spacesRisk=(bedsRisk>=3?2:1)*estUnitsRisk;
            f.push({label:`Tandem Parking Required  Frontage ~${frontEstRisk}m < 14m (ResCode Cl. 52.06)`,
              tip:`${spacesRisk} resident parking space${spacesRisk>1?"s":""} required but side-by-side double garages are impossible at ${frontEstRisk}m frontage. All spaces must be tandem (one behind the other). This severely constrains ground-floor layout, eliminates through-access to rear, and may require architectural redesign ($8K$15K). Check driveway width against Cl. 52.06-8 (min 3.0m single / 5.5m double).`});
          }
          /* Retaining wall structural requirement  slope  5% + large site means likely cut > 1m */
          const siteAreaRisk=parseNum(site.area)||0;
          if(calc?.retainingWallRisk){
            f.push({label:`Retaining Wall > 1m Likely  Structural Engineering Certification Required`,
              tip:`Site slope (${maxSlopeVal?.toFixed(1)||"?"}%) across ${siteAreaRisk}m indicates average cut depth exceeding 1m. Under the Building Regulations 2018, retaining walls > 1m require a building permit and a structural engineer's certification. Add $8K$15K for structural design + $1.5K$3K for permits. If soil class is M or H, increase by 3050%.`});
          }
          /* Drainage pump risk: slope falling away from street + rear easement detected */
          if((calc?.slopeClass==="steep"||calc?.slopeClass==="moderate")&&plan.hasEasementBoe&&siteAreaRisk>0){
            f.push({label:`Drainage Pump Risk  Rear Easement + Downslope Site  $20,000 provisional`,
              tip:`The combination of a rear drainage/sewerage easement and a site that falls away from the street means gravity drainage to the street is likely impossible. A submersible pump system (approx $15K$25K installed) will be required. Include in hard costs. Confirm drainage strategy with civil engineer before permit application.`});
          }
          /* Garden Area Rule (Clause 54/55): sites > 650m in NRZ/GRZ must retain 35% as garden */
          const gardenZone=normaliseZone(plan.zone)||plan.zone;
          if(siteAreaRisk>650&&(gardenZone==="GRZ"||gardenZone==="NRZ")&&parseNum(plan.estUnits)>=2){
            const minGarden=Math.round(siteAreaRisk*0.35);
            const buildable=Math.round(siteAreaRisk*0.65);
            f.push({label:`Garden Area Rule Applies  Site ${siteAreaRisk}m > 650m (Cl. 54.04-1 / 55.05-4)`,
              tip:`For sites > 650m in ${gardenZone}, at least 35% (${minGarden}m) must remain as permeable garden area. Maximum buildable footprint is therefore ${buildable}m. This directly constrains ground floor coverage and may require redesign if your current buildable area exceeds ${buildable}m. Cross-check your Site Coverage against this threshold.`});
          }
          /* Side-by-side feasibility: frontage < 15m cannot support true side-by-side dual occupancy */
          if(frontEstRisk>0&&frontEstRisk<15&&estUnitsRisk>=2&&(gardenZone==="GRZ"||gardenZone==="NRZ")){
            f.push({label:`Side-by-Side Dual Occ Infeasible  Frontage ~${frontEstRisk}m < 15m`,
              tip:`A true side-by-side double occupancy requires minimum ~15m frontage (7.2m per dwelling + 0.6m boundary + driveways). At ${frontEstRisk}m, consider a Tandem (front/rear) configuration instead, which only requires ~10m frontage. This significantly changes the building envelope, access design, and GRV per dwelling.`});
          }
          /* Covenant negative confirmation  never assume clean */
          if(!plan.hasSingleCovenant&&!plan.covenantDesc){
            f.push({label:` Covenant: Not Detected in Documents  Verify Pages 2426 Manually`,
              tip:`The automated scan did not find a restrictive covenant. This does NOT confirm the title is covenant-free. Section 32 / Vendor Statement must be reviewed by a solicitor  specifically pp. 2426 (Schedule of Encumbrances) and the title search. Request a full Register Search Statement from your conveyancer.`,severity:"info"});
          }
          /*  ARCHITECT / DESIGNER FLAGS  */
          /* Shadow diagram (ResCode B28/B29  Cl. 55.04-5): 3+ storey facing north neighbours */
          const estFloors=Math.ceil(parseNum(plan.maxHeight||"9")/3.2);
          if(estFloors>=3||(plan.zone==="RGZ"||plan.zone==="MUZ")){
            f.push({label:`Shadow Impact Assessment Likely Required (ResCode B28/B29  Cl.55.04-5)`,
              tip:`${estFloors>=3?`Estimated ${estFloors} floors`:"Zone allows 4+ storeys"}  council will require a shadow diagram demonstrating the development does not reduce solar access to neighbouring POS or habitable north-facing windows between 9am3pm on 22 September. Engage a shadow consultant ($2,000$4,000). Allow 3-4 weeks.`,severity:"info"});
          }
          /* POS compliance (Cl. 55.05-3): each dwelling needs 8m with min 3m dimension */
          const estUnitsForPOS=parseNum(plan.estUnits)||parseNum(market.grvUnits)||0;
          const areaNum=parseNum(site.area)||0;
          const covPctNum=parseNum(plan.maxCoverage)||60;
          if(estUnitsForPOS>0&&areaNum>0){
            const openArea=areaNum*(1-(covPctNum/100));
            const posPerUnit=Math.round(openArea/estUnitsForPOS);
            if(posPerUnit<8){
              f.push({label:`Private Open Space Risk  Est. ${posPerUnit}m/dwelling < 8m min (Cl.55.05-3)`,
                tip:`With ${covPctNum}% site coverage and ${estUnitsForPOS} dwellings, open area = ${Math.round(openArea)}m  ~${posPerUnit}m per dwelling. ResCode Cl.55.05-3 requires a minimum 8m POS with a 3m  3m usable area. Reduce site coverage or unit count, or use upper-level terraces as POS (requires Planning Scheme approval).`});
            }else if(posPerUnit<25){
              f.push({label:`POS is Marginal  ~${posPerUnit}m/dwelling (Cl.55.05-3 min 8m, good practice 25m)`,
                tip:`POS per dwelling is above the 8m minimum but below the 25m recommended standard for townhouses. Marginal POS may attract objections from council officers on amenity grounds. Consider open plan landscape design to maximise perceived space.`,severity:"info"});
            }
          }
          /* Pervious surface  Cl. 56.07-4 / 55.06-4: min 20% permeable */
          if(areaNum>0&&covPctNum>0){
            const permeableEst=Math.round(areaNum*(1-covPctNum/100)*0.5); /* 50% of open area assumed permeable */
            const permeablePct=Math.round((permeableEst/areaNum)*100);
            if(permeablePct<20){
              f.push({label:`Permeable Surface Risk  Est. ~${permeablePct}% permeable < 20% min (Cl.56.07-4)`,
                tip:`With ${covPctNum}% site coverage and typical paved driveways, estimated permeable area = ~${permeableEst}m (${permeablePct}% of site). ResCode requires 20%. Use permeable paving (Dricon / ACO systems), rainwater tanks, or garden areas to meet minimum. Landscaping plan required.`});
            }
          }
          /* Natural light risk: narrow sites with multi-storey multi-unit (Cl.55.04-3) */
          const frontEstWidth=bboxDims?.frontEst||parseNum(site.frontage)||0;
          if(frontEstWidth>0&&frontEstWidth<11&&estUnitsForPOS>=2&&estFloors>=2){
            f.push({label:`Natural Light Risk  Width ~${frontEstWidth}m < 11m, Middle Rooms May Fail Cl.55.04-3`,
              tip:`Sites narrower than ~11m with 2+ dwellings and 2 storeys risk having middle habitable rooms (bedrooms/living) that cannot achieve 10% floor area as window glazing facing outdoors (ResCode Cl.55.04-3). This typically requires a skylights or light wells  budget $8,000$15,000 per unit affected. Verify with architect at sketch design stage.`,severity:"info"});
          }
          /* FIRB timeline warning */
          if(fin.isForeign&&calc.firbFee>0){
            f.push({label:`FIRB Approval Required  Application Fee ${fmt(calc.firbFee)}  Allow 34 Months`,
              tip:`Foreign persons must obtain FIRB approval before purchasing residential property in Australia. Application fee: ${fmt(calc.firbFee)} (based on purchase price). Processing time typically 3090 days. Condition: new dwelling only (not established). Submit early to avoid settlement delays.`,severity:"info"});
          }
          /* BAL rating risk upgrade */
          if(conds.bushfireProne&&!conds.balRating){
            f.push({label:`BAL Rating Not Set  Default BAL-29 Cost ($18k) Applied. Get CFA Assessment`,
              tip:`CFA BAL assessment determines your actual Bushfire Attack Level rating. Higher ratings (BAL-40, FZ) significantly increase construction costs. Obtain a formal BAL assessment from a registered building surveyor or bush fire consultant before finalising your build budget.`,severity:"info"});
          }
          /* Pre-sales gate */
          const preSalesPctNum=parseNum(params.preSalesPct);
          const preSalesThreshNum=parseNum(params.preSalesThreshold)||60;
          const estUnitsNum=parseNum(plan.estUnits)||parseNum(market.grvUnits)||0;
          if(estUnitsNum>=3&&preSalesPctNum>0&&preSalesPctNum<preSalesThreshNum){
            f.push({label:`Pre-Sales ${preSalesPctNum.toFixed(0)}% < ${preSalesThreshNum}% Threshold  Construction Finance at Risk`,
              tip:`Most construction lenders require ${preSalesThreshNum}% of GDV pre-sold before releasing funding. Current pre-sales = ${preSalesPctNum.toFixed(0)}%  ${(preSalesThreshNum-preSalesPctNum).toFixed(0)}% gap. Consider increasing pre-sales marketing, reducing unit count, or seeking alternative JV funding to bridge the gap.`});
          }
          return f;
        },[plan,siteInv,conds,site.frontage,site.area,bboxDims,market.grvUnits,absorptionCalc,str.projectMonths,calc,fin.isForeign,params.preSalesPct,params.preSalesThreshold]);

        /* SWOT auto-generation */
        const swotAnalysis=useMemo(()=>{
          const S=[],W=[],O=[],T=[];
          const sub=MEL_SUBURBS[selSuburb];
          /* Strengths */
          if(siteInv.loc?.score>=70) S.push(`High location score (${siteInv.loc.score}/100)  well-connected precinct`);
          if(lookupResult?.cbdKm&&lookupResult.cbdKm<15) S.push(`Inner/middle ring location  ${lookupResult.cbdKm.toFixed(1)}km from CBD drives strong end-user demand`);
          if(siteInv.loc?.trains?.length>0) S.push(`Train station within ${siteInv.loc.trains[0].d}m  premium transport connectivity`);
          if(calc.margin>=20) S.push(`Strong margin (${calc.margin.toFixed(1)}%)  exceeds bank lending threshold, healthy developer return`);
          if(["MUZ","RGZ"].includes(plan.zone)) S.push(`${plan.zone} zoning  maximum development flexibility and density potential`);
          if(sub?.cagr>=5) S.push(`${selSuburb} 5yr CAGR ${sub.cagr}%  above-average suburb growth track record`);
          if(siteInv.elev?.maxSlope<2) S.push("Flat site (<2% slope)  minimal site works, efficient construction layout");
          if(sub?.dom<=28) S.push(`Fast-moving market (avg ${sub.dom} DOM)  strong end-buyer demand reduces unsold stock risk`);
          if(calc.contingencyAmt>=20000) S.push(`${fmtM(calc.contingencyAmt)} contingency buffer in TDC  prudent cost risk management, protects margin against overruns`);
          /* Weaknesses */
          if(plan.zone==="NRZ") W.push("NRZ zoning  density capped at typically 2 dwellings, limits project scale");
          if(siteInv.elev?.maxSlope>=10) W.push(`Steep slope (${siteInv.elev.maxSlope?.toFixed(1)}%)  significant site works cost $80K+, drainage and retaining required`);
          if(calc.margin<18&&calc.margin>=0) W.push(`Thin margin (${calc.margin.toFixed(1)}%)  below typical bank lending threshold of 1820%`);
          if(plan.hasHO) W.push("Heritage Overlay  demolition risk, design restrictions, extended approval timeline");
          if(siteInv.osm?.powerLines?.length>0) W.push("Overhead powerlines detected  undergrounding cost $15K$60K, possibly developer-funded");
          const frontEst=bboxDims?.frontEst||parseNum(site.frontage);
          if(frontEst>0&&frontEst<9) W.push(`Critical  frontage ~${frontEst}m: too narrow for separate lot subdivision in most zones`);
          else if(frontEst>0&&frontEst<14) W.push(`Narrow frontage ~${frontEst}m  tandem parking only, severely constrained townhouse layout (ResCode Cl. 52.06)`);
          else if(frontEst>0&&frontEst<18) W.push(`Frontage ~${frontEst}m below 18m  Common Driveway required for subdivision (Cl. 56.06-6), adds $15K$25K and OC obligations`);
          if(!calc.contingencyAmt&&calc.hard>0) W.push("No contingency budgeted  any cost overrun (typically 510% on Melbourne builds) directly erodes developer margin");
          /* Opportunities */
          if(["GRZ","RGZ","MUZ"].includes(plan.zone)&&parseNum(site.area)>=800) O.push(`Large ${plan.zone} site (${site.area}m)  potential for 4+ dwellings maximises GRV`);
          if(liveInd.rba?.rate&&liveInd.rba.rate<=4.0) O.push(`RBA cash rate ${liveInd.rba.rate}%  low rate environment favours development finance`);
          if(sub?.cagr>=5.5) O.push("Above-average CAGR  end values likely to appreciate through project duration (2436 months)");
          if(domainData?.status==="ok") O.push("Domain API data loaded  live suburb stats available for end-value validation");
          if(siteInv.loc?.schools?.length>=3) O.push(`${siteInv.loc.schools.length} schools within 2.5km  premium school zone is a major buyer driver`);
          /* Threats */
          if(riskFlags.length>=3) T.push(`${riskFlags.length} planning risk factors active  elevated approval risk and potential cost escalation`);
          if(liveInd.rba?.rate&&liveInd.rba.rate>=5) T.push(`High cash rate (${liveInd.rba.rate}%)  construction finance expensive, buyer borrowing capacity reduced`);
          if(parseNum(market.dom)>=40) T.push(`Slow market (${market.dom} DOM)  extended absorption timeline increases holding cost exposure`);
          if(plan.hasVPO||plan.hasSLO) T.push("Environmental overlays (VPO/SLO)  tree/landscape constraints restrict buildable area and add approval risk");
          if(liveInd.ppi?.qoq>3) T.push(`Building activity rising ${liveInd.ppi.qoq?.toFixed(1)}% QoQ  potential labour and materials cost pressure ahead`);
          if(plan.zone==="NRZ"&&plan.easements) T.push(" Critical: NRZ zone + recorded easement  density already capped at ~2 dwellings AND easement reduces buildable area further. Project economics require careful re-evaluation.");
          return{S,W,O,T};
        },[calc,plan,site,riskFlags,siteInv,liveInd,selSuburb,market,lookupResult,domainData,bboxDims]);

        /* Single Dwelling Covenant  score forced to 0 (project is legally blocked for multi-dwelling) */
        const feasScore=useMemo(()=>{
          if(!calc.total)return null;
          if(calc.covenantLocked)return 0;
          return calcFeasScore(calc.margin,riskFlags.length,plan.zone,parseNum(market.dom));
        },[calc.margin,calc.total,calc.covenantLocked,riskFlags.length,plan.zone,market.dom]);

        /*  RISK-ADJUSTED MARGIN  */
        const riskAdjMargin=useMemo(()=>calc.margin!=null?calcRiskAdjustedMargin(calc.margin,riskFlags):null,[calc.margin,riskFlags]);

        /*  OVERLAY TIMELINE MODEL  */
        const overlayTimeline=useMemo(()=>{
          /* Estimate monthly holding cost from existing finance inputs */
          const seniorDebt=calc.total*(parseNum(str.lvrPct)/100||0.65);
          const monthlyRate=parseNum(str.interestRate)/100/12||0.0071;
          const monthlyHold=Math.round(seniorDebt*monthlyRate+parseNum(fin.holdingCosts)/Math.max(1,parseNum(str.projectMonths)||24));
          return calcOverlayTimeline(plan,monthlyHold,calc.osmTreeCount||0);
        },[plan,calc.total,calc.osmTreeCount,str.lvrPct,str.interestRate,str.projectMonths,fin.holdingCosts]);

        /*  LGA OPEN SPACE CONTRIBUTION  */
        const oscData=useMemo(()=>{
          const council=MEL_SUBURBS[selSuburb]?.council||lookupResult?.council||"";
          const landVal=parseNum(fin.landPrice)||0;
          return getOSC(council,landVal);
        },[selSuburb,lookupResult,fin.landPrice]);

        /*  RLV ENGINE  Iterative Residual Land Value  */
        /* Uses calcRLVIterative: accounts for stamp duty circular dependency.
           Land price affects duty  duty changes total cost  total affects max land.
           Converges in 46 iterations to within $500. */
        const rlvData=useMemo(()=>{
          if(!calc.grv||!calc.total)return null;
          const otherCostsExLand=calc.soft+calc.hard+calc.hold+calc.sale;
          const maxLand=calcRLVIterative(calc.grv,rlvTargetMargin,otherCostsExLand,fin.isForeign);
          /* Stamp duty on max land price (iterative result is land price, duty is additional) */
          const maxLandDuty=calcVicStampDuty(maxLand,fin.isForeign);
          const maxLandLegal=Math.round(maxLand*0.003+1500);
          const maxLandBucket=maxLand+maxLandDuty+maxLandLegal; // total land acquisition cost
          const currentLand=parseNum(fin.landPrice)||0;
          const gap=maxLand-currentLand;
          const t=rlvTargetMargin/100;
          const targetProfit=Math.round(calc.grv*t/(1+t));
          const perUnitRLV=calc.units>0?Math.round(maxLand/calc.units):null;
          return{maxLand,maxLandDuty,maxLandLegal,maxLandBucket,currentLand,gap,
            currentMargin:calc.margin,targetProfit,perUnitRLV,otherCostsExLand,
            feasible:maxLand>0&&currentLand<=maxLand};
        },[calc,rlvTargetMargin,fin.landPrice,fin.isForeign]);

        /*  STRESS TEST  */
        /* Scenario A: Sale price 10%  |  Scenario B: Timeline +6 months  |  Scenario C: A+B */
        const stressTest=useMemo(()=>{
          if(!calc.grv||!calc.total)return null;
          /* Monthly holding cost (from finStruct logic) */
          const seniorDebt=calc.total*(parseNum(str.lvrPct)/100||0.65);
          const monthlyRate=parseNum(str.interestRate)/100/12||0.0071;
          const monthlyHold=Math.round(seniorDebt*monthlyRate+parseNum(fin.holdingCosts)/Math.max(1,parseNum(str.projectMonths)||24));
          const extraInterest6=monthlyHold*6;
          /* Scenario A: GRV drops 10% */
          const grvA=calc.grv*0.90;
          const profitA=grvA-calc.total;
          const marginA=calc.total>0?(profitA/calc.total)*100:0;
          /* Scenario B: +6 months holding  extra interest added to cost */
          const totalB=calc.total+extraInterest6;
          const profitB=calc.grv-totalB;
          const marginB=totalB>0?(profitB/totalB)*100:0;
          /* Scenario C: A+B combined */
          const profitC=grvA-totalB;
          const marginC=totalB>0?(profitC/totalB)*100:0;
          return{
            base:{grv:calc.grv,total:calc.total,profit:calc.profit,margin:calc.margin},
            scenA:{label:"Sale Price 10%",grv:grvA,total:calc.total,profit:profitA,margin:marginA,delta:profitA-calc.profit},
            scenB:{label:"Timeline +6 months",grv:calc.grv,total:totalB,profit:profitB,margin:marginB,delta:profitB-calc.profit,extraCost:extraInterest6},
            scenC:{label:"Combined (10% + 6 months)",grv:grvA,total:totalB,profit:profitC,margin:marginC,delta:profitC-calc.profit},
            monthlyHold,
          };
        },[calc,str.lvrPct,str.interestRate,str.projectMonths,fin.holdingCosts]);

        /*  THREE-SCENARIO ANALYSIS  */
        const scenarioResults=useMemo(()=>{
          if(!calc.total||!calc.grv)return null;
          const baseMonths=parseNum(str.projectMonths)||30;
          const monthlyRate=parseNum(str.interestRate)/100/12;
          /* Helper: recompute hold cost for different duration */
          const rescaleHold=(months)=>{
            if(!calc.hold||!baseMonths)return calc.hold;
            return Math.round(calc.hold*(months/baseMonths));
          };
          /* Base */
          const base={
            label:"Base Case",emoji:"",
            grv:calc.grv,hard:calc.hard,soft:calc.soft,hold:calc.hold,land:calc.land,sale:calc.sale,
            months:baseMonths,
          };
          base.total=base.land+base.soft+base.hard+base.hold+base.sale;
          base.profit=base.grv-base.total;
          base.margin=base.total>0?(base.profit/base.total)*100:0;
          base.marginOnGrv=base.grv>0?(base.profit/base.grv)*100:0;
          /* Upside/Downside deltas  user-configurable via params */
          const _grvUp=(parseNum(params.scGrvUp)||5)/100;
          const _grvDn=(parseNum(params.scGrvDn)||7)/100;
          const _costUp=(parseNum(params.scCostUp)||8)/100;
          const _moUp=parseNum(params.scMoUp)||1;
          const _moDn=parseNum(params.scMoDn)||3;
          const uMonths=Math.max(6,baseMonths-_moUp);
          const up={
            label:"Upside",emoji:"",
            grv:Math.round(calc.grv*(1+_grvUp)),hard:calc.hard,soft:calc.soft,
            hold:rescaleHold(uMonths),land:calc.land,sale:calc.sale,months:uMonths,
          };
          up.total=up.land+up.soft+up.hard+up.hold+up.sale;
          up.profit=up.grv-up.total;
          up.margin=up.total>0?(up.profit/up.total)*100:0;
          up.marginOnGrv=up.grv>0?(up.profit/up.grv)*100:0;
          const dMonths=baseMonths+_moDn;
          const dn={
            label:"Downside",emoji:"",
            grv:Math.round(calc.grv*(1-_grvDn)),
            hard:Math.round(calc.hard*(1+_costUp)),soft:Math.round(calc.soft*(1+_costUp)),
            hold:rescaleHold(dMonths),land:calc.land,sale:calc.sale,months:dMonths,
          };
          dn.total=dn.land+dn.soft+dn.hard+dn.hold+dn.sale;
          dn.profit=dn.grv-dn.total;
          dn.margin=dn.total>0?(dn.profit/dn.total)*100:0;
          dn.marginOnGrv=dn.grv>0?(dn.profit/dn.grv)*100:0;
          /* IRR (simplified: profit/equity at project end) */
          const lvr=parseNum(str.lvrPct)/100||0.65;
          const irrSimple=(sc)=>{
            const eq=sc.total*(1-lvr);
            const yrs=sc.months/12;
            return eq>0&&yrs>0?((Math.pow(1+sc.profit/eq,1/yrs)-1)*100):null;
          };
          base.irr=irrSimple(base); up.irr=irrSimple(up); dn.irr=irrSimple(dn);
          return{base,upside:up,downside:dn};
        },[calc,str.projectMonths,str.interestRate,str.lvrPct,params.scGrvUp,params.scGrvDn,params.scCostUp,params.scMoUp,params.scMoDn]);

        /*  RISK MODEL LAYERING  */
        const riskLayers=useMemo(()=>{
          /* Four categories: planning / delivery / market / legal */
          const planning={items:[],score:100};
          const delivery={items:[],score:100};
          const market={items:[],score:100};
          const legal={items:[],score:100};
          /* Planning risks */
          if(plan.hasHO){planning.items.push({label:"Heritage Overlay",deduct:20,action:"Engage heritage consultant ($8K$20K)  allow 12 months"});planning.score-=20;}
          if(plan.hasVPO){planning.items.push({label:"VPO  Vegetation removal permit required",deduct:12,action:"Arborist report + council permit ($4K$8K)"});planning.score-=12;}
          if(plan.hasSLO){planning.items.push({label:"Significant Landscape Overlay",deduct:15,action:"Design to protect landscape character  reduced bulk"});planning.score-=15;}
          if(plan.hasESO){planning.items.push({label:"Environmental Significance Overlay",deduct:15,action:"Ecological assessment ($5K$12K)"});planning.score-=15;}
          if(plan.zone==="NRZ"||plan.zone==="NRZ1"||plan.zone==="NRZ2"){planning.items.push({label:"NRZ  Density capped ~2 dwellings",deduct:18,action:"Confirm subdivision potential with planner"});planning.score-=18;}
          if(siteInv?.osm?.neighbourIntensity==="sparse"&&parseNum(plan.estUnits)>2){planning.items.push({label:"Low-density context  over-development objection risk",deduct:10,action:"Allow +24 months; consider reducing to 2 dwellings"});planning.score-=10;}
          /* Delivery risks */
          if(siteInv?.elev?.maxSlope>=10){delivery.items.push({label:`Steep site ${siteInv.elev.maxSlope?.toFixed(1)}%  earthworks + retaining`,deduct:15,action:"Engage geotechnical engineer; budget $80K$120K site works"});delivery.score-=15;}
          if(calc.soilPS>0){delivery.items.push({label:`Reactive soil (Class ${conds.soilClass})  engineered footings`,deduct:10,action:"Structural engineer footing design; $15K$40K uplift"});delivery.score-=10;}
          if(calc.drainageSinkPS>0){delivery.items.push({label:"Drainage sink  charged stormwater / pump pit required",deduct:8,action:"Civil engineer drainage design; $20K$30K"});delivery.score-=8;}
          if(siteInv?.osm?.powerLines?.length>0){delivery.items.push({label:`Overhead powerlines (${siteInv.osm.powerLines.length} segment)  undergrounding risk`,deduct:10,action:"Confirm with distributor  budget $15K$60K"});delivery.score-=10;}
          {const _nst=getNatureStripTrees(siteInv?.osm);if(_nst.length>0){delivery.items.push({label:`Nature strip trees (${_nst.length})  council permit + bond`,deduct:5,action:"Arborist assessment; tree bond $2K$8K per tree"});delivery.score-=5;}}
          /* Market risks */
          const domVal=parseNum(market.dom);
          if(domVal>=45){market.items.push({label:`Slow market ${domVal} DOM  extended absorption`,deduct:15,action:"Extended sales campaign; increase holding cost budget"});market.score-=15;}
          else if(domVal>=35){market.items.push({label:`Moderately slow market ${domVal} DOM`,deduct:8,action:"Allow 34 month sales period post-completion"});market.score-=8;}
          if(calc.margin<15&&calc.margin>=0){market.items.push({label:`Thin margin ${calc.margin.toFixed(1)}%  below bank threshold`,deduct:20,action:"Re-model exit pricing or value-engineer construction"});market.score-=20;}
          else if(calc.margin<20){market.items.push({label:`Margin ${calc.margin.toFixed(1)}%  below 20% target`,deduct:8,action:"Stress-test with downside scenario"});market.score-=8;}
          if(liveInd.rba?.rate>=5){market.items.push({label:`Cash rate ${liveInd.rba.rate}%  buyer affordability pressure`,deduct:10,action:"Monitor rate trajectory; consider fixed-rate construction finance"});market.score-=10;}
          /* Legal / Title risks */
          if(plan.hasSingleCovenant){legal.items.push({label:"Single Dwelling Covenant  BLOCKED",deduct:80,action:"Solicitor advice on removal before any LOI  1224 months, $15K$40K+"});legal.score-=80;}
          if(plan.hasEasementBoe){legal.items.push({label:"Easement  BOE / R&C required",deduct:15,action:"Confirm easement location on title; BOE R&C $1.5K$5K"});legal.score-=15;}
          if(plan.hasS173||plan.s173){legal.items.push({label:"Section 173 Agreement on title",deduct:15,action:"Solicitor review; variation/removal 36 months"});legal.score-=15;}
          if(plan.hasHO){legal.items.push({label:"Heritage Overlay  demolition permit required",deduct:10,action:"Heritage Impact Statement ($5K$15K) before VCAT"});legal.score-=10;}
          /* Clamp scores to 0-100 */
          [planning,delivery,market,legal].forEach(c=>c.score=Math.max(0,Math.min(100,c.score)));
          /* Recommended contingency: base 5%, add for high delivery/planning risk */
          const deliveryRisk=100-delivery.score;
          const planningRisk=100-planning.score;
          const suggestedContingency=Math.min(20,5+Math.round((deliveryRisk*0.08+planningRisk*0.04)));
          const totalRiskScore=Math.round((planning.score+delivery.score+market.score+legal.score)/4);
          return{planning,delivery,market,legal,totalRiskScore,suggestedContingency};
        },[plan,siteInv,calc,conds,market,liveInd]);

        /*  WEIGHTED COMPS VALUATION  */
        const weightedComps=useMemo(()=>{
          const valid=comps.filter(c=>parseNum(c.price)>0&&parseNum(c.area)>0);
          if(valid.length<2)return null;
          const siteArea=parseNum(site.area)||0;
          const now=new Date();
          const scored=valid.map(c=>{
            const compArea=parseNum(c.area);
            const compPrice=parseNum(c.price);
            const ppm=compArea>0?compPrice/compArea:0;
            /* Area similarity: 1 at identical, 0 at 2 difference */
            const areaSim=siteArea>0?Math.max(0,1-Math.abs(compArea-siteArea)/(siteArea)):0.5;
            /* Recency: 1 at 0 months, 0 at 18 months */
            let recency=0.5;
            if(c.date){const d=new Date(c.date);if(!isNaN(d)){const monthsAgo=(now-d)/(1000*60*60*24*30.5);recency=Math.max(0,1-monthsAgo/18);}}
            const weight=(areaSim*0.5+recency*0.5);
            return{...c,ppm,areaSim,recency,weight};
          });
          const totalWeight=scored.reduce((s,c)=>s+c.weight,0);
          if(totalWeight===0)return null;
          const weightedPsm=Math.round(scored.reduce((s,c)=>s+c.ppm*c.weight,0)/totalWeight);
          const psms=scored.map(c=>c.ppm).sort((a,b)=>a-b);
          const siteAreaForExit=parseNum(site.area)||parseNum(fin.buildArea)||0;
          /* Suggested exit PSM range: weighted mid 8% */
          const rangeLow=Math.round(weightedPsm*0.92);
          const rangeHigh=Math.round(weightedPsm*1.08);
          /* Suggested exit value for site */
          const suggestedExitValue=siteAreaForExit>0?Math.round(weightedPsm*siteAreaForExit):null;
          return{weightedPsm,rangeLow,rangeHigh,suggestedExitValue,scored,count:scored.length};
        },[comps,site.area,fin.buildArea]);

        /*  NET YIELD vs SELL ANALYSIS  */
        /* Compares "sell all units now" vs "hold & rent" for each dwelling.
           Deductions: Land Tax (~0.8% of improved value), Mgmt fee (8%), Ins (0.3%), Vacancy (4%), Maintenance (0.5%). */
        const netYieldData=useMemo(()=>{
          const rpw=parseNum(rentPerWeek);
          const units=calc.units||1;
          const grv=calc.grv||0;
          const profit=calc.profit;
          if(!rpw||!grv)return null;
          const annualGrossRent=rpw*52*units;
          const grvPerUnit=grv/units;
          /* Deductions (% of portfolio value) */
          /* #33 FIX: VIC land tax on proper progressive brackets (SRO 2024-25).
             Site value  35% of market (GRV) for inner-mid Melbourne residential.
             Replaces previous flat 0.8%  GRV which overstated by 5-10. */
          const siteValue=Math.round(grv*0.35);
          const _calcLT=(sv)=>{
            if(sv<=300000)return 0;
            let t=0;
            t+=(Math.min(sv,600000)-300000)*0.001;
            if(sv>600000) t+=(Math.min(sv,1000000)-600000)*0.0025;
            if(sv>1000000)t+=(Math.min(sv,1800000)-1000000)*0.0075;
            if(sv>1800000)t+=(Math.min(sv,3000000)-1800000)*0.010;
            if(sv>3000000)t+=(sv-3000000)*0.015;
            return Math.round(t);
          };
          const landTax=_calcLT(siteValue);
          const mgmtFeeRate=0.08;
          const insuranceRate=0.003;
          const vacancyRate=0.04;
          const maintenanceRate=0.005;
          const mgmtFee=Math.round(annualGrossRent*mgmtFeeRate);
          const insurance=Math.round(grv*insuranceRate);
          const vacancy=Math.round(annualGrossRent*vacancyRate);
          const maintenance=Math.round(grv*maintenanceRate);
          const totalDeductions=landTax+mgmtFee+insurance+vacancy+maintenance;
          const annualNetRent=Math.round(annualGrossRent-totalDeductions);
          const netYieldPct=grv>0?(annualNetRent/grv)*100:0;
          const grossYieldPct=grv>0?(annualGrossRent/grv)*100:0;
          /* Payback: years to recover full TDC from net rent */
          const paybackYears=annualNetRent>0?calc.total/annualNetRent:null;
          /* Compare to sell now: annualised dev profit over project duration */
          const projectYears=(parseNum(str.projectMonths)||30)/12;
          const annualisedDevReturn=projectYears>0?profit/projectYears:null;
          /* Break-even: at what year does cumulative net rent equal development profit? */
          const breakEvenYears=annualNetRent>0&&profit>0?profit/annualNetRent:null;
          /* Tax Depreciation Shield (Division 43 + Division 40)  5-year estimate at 32.5% marginal rate */
          const buildCostTotal=calc.hard||0;
          const div43Annual=Math.round(buildCostTotal*0.025);         // Div 43: 2.5%/yr construction allowance
          const div40Annual=Math.round(buildCostTotal*0.10/5);        // Div 40: ~10% of build cost over 5yr (plant & equipment)
          const annualDepreciation=div43Annual+div40Annual;
          const taxShieldAnnual=Math.round(annualDepreciation*0.325); // Tax saved at 32.5% marginal rate
          const taxShield5yr=taxShieldAnnual*5;
          return{
            rpw,units,annualGrossRent,annualNetRent,netYieldPct,grossYieldPct,
            landTax,mgmtFee,insurance,vacancy,maintenance,totalDeductions,
            paybackYears,annualisedDevReturn,breakEvenYears,profit,grv,grvPerUnit,projectYears,
            div43Annual,div40Annual,annualDepreciation,taxShieldAnnual,taxShield5yr,
          };
        },[rentPerWeek,calc,str.projectMonths]);

        /*  AFTER-TAX ANALYSIS
           Covers three tax scenarios for Australian residential development:
            Sell-on-completion (taxed as ordinary income / trading stock)
            Hold >12 months then sell (CGT with 50% discount for individuals)
            Division 43 depreciation benefit for hold-and-rent strategy
           Rates: Individual 37%/45%, Company 30%, SMSF 15% (accumulation)     */
        const taxCalc=useMemo(()=>{
          const profit=calc.profit||0;
          const grv=calc.grv||0;
          const buildCost=calc.hard||0;
          const landCost=calc.land||0;
          const margRate=(parseNum(tax.marginalRate)||37)/100;
          const holdMonths=parseNum(tax.holdMonths)||parseNum(str.projectMonths)||30;
          const holdYrs=holdMonths/12;
          const isSMSF=tax.isSMSF;
          const isTrust=tax.isTrust;
          const cgtEligible=(tax.cgtDiscount&&holdYrs>1)&&!isTrust; // trusts can distribute CGT discount
          const effectiveRate=isSMSF?0.15:margRate;
          /*  SELL-ON-COMPLETION (trading stock  no CGT discount) */
          const taxOnProfit_sell=Math.round(profit*effectiveRate);
          const afterTaxProfit_sell=profit-taxOnProfit_sell;
          const afterTaxMargin_sell=calc.total>0?afterTaxProfit_sell/calc.total*100:0;
          /*  CGT SALE (hold >12 months, 50% discount for individual / 33.3% SMSF) */
          const cgtDiscount=isSMSF?0.333:0.50;
          const taxableGain_cgt=cgtEligible?profit*(1-cgtDiscount):profit;
          const taxOnProfit_cgt=Math.round(taxableGain_cgt*effectiveRate);
          const afterTaxProfit_cgt=profit-taxOnProfit_cgt;
          const cgtSaving=taxOnProfit_sell-taxOnProfit_cgt;
          const afterTaxMargin_cgt=calc.total>0?afterTaxProfit_cgt/calc.total*100:0;
          /*  DIVISION 43 depreciation (construction allowance  hold & rent strategy) */
          const div43Rate=0.025; // 2.5%/yr of construction cost
          const div40Pct=(parseNum(tax.div40Rate)||10)/100; // plant & equipment % of build
          const div43Annual=Math.round(buildCost*div43Rate);
          const div40Annual=Math.round(buildCost*div40Pct/5); // over 5yr effective life avg
          const totalDeprecAnnual=div43Annual+div40Annual;
          const taxShieldAnnual=Math.round(totalDeprecAnnual*effectiveRate);
          const taxShield10yr=taxShieldAnnual*10;
          const taxShield5yr=taxShieldAnnual*5;
          /*  COST BASE for CGT (land + stamp duty + holding costs = cost base) */
          const costBase=landCost+(calc.soft||0)+(calc.hold||0);
          const capitalGain=Math.max(0,grv-costBase);
          const taxableCapGain=cgtEligible?capitalGain*(1-cgtDiscount):capitalGain;
          const cgtPayable=Math.round(taxableCapGain*effectiveRate);
          /*  AFTER-TAX IRR (simple approximation  after-tax equity return) */
          const equity=finStruct?.equityRequired||0;
          const projectMonths=parseNum(str.projectMonths)||30;
          const atIRR_sell=equity>0?(Math.pow(1+afterTaxProfit_sell/equity,1/(projectMonths/12))-1)*100:null;
          const atIRR_cgt=equity>0?(Math.pow(1+afterTaxProfit_cgt/equity,1/(projectMonths/12))-1)*100:null;
          return{
            margRate,effectiveRate,holdYrs,cgtEligible,cgtDiscount,
            taxOnProfit_sell,afterTaxProfit_sell,afterTaxMargin_sell,
            taxOnProfit_cgt,afterTaxProfit_cgt,afterTaxMargin_cgt,cgtSaving,
            div43Annual,div40Annual,totalDeprecAnnual,taxShieldAnnual,taxShield5yr,taxShield10yr,
            costBase,capitalGain,taxableCapGain,cgtPayable,
            atIRR_sell,atIRR_cgt,
          };
        },[calc,finStruct,tax,str.projectMonths]);

        /*  UNIFIED DOCUMENT PARSE (dry-run)
           Accepts up to three sources. Calls extractAllFields, stores the
           dry-run result in importResult for the review panel.              */
        const handleUnifiedParse=useCallback(async()=>{
          setDocParsing(true);
          try{
            let vpTxt=docVpText||"";
            let s32Txt=docS32Text||"";
            let svTxt=docSvText||"";
            if(docVpFile&&!vpTxt) vpTxt=await extractFileText(docVpFile);
            if(docS32File&&!s32Txt)s32Txt=await extractFileText(docS32File);
            if(docSvFile&&!svTxt) svTxt=await extractFileText(docSvFile);
            if(!vpTxt&&!s32Txt&&!svTxt){addToast(" No document content found  upload a file or paste text","warn",5000);setDocParsing(false);return;}
            const result=extractAllFields(vpTxt,s32Txt,svTxt);
            if(!result||Object.keys(result.fields).length===0){
              addToast(" Could not extract any fields from the documents  check the files and try again","warn",6000);
              setDocParsing(false);return;
            }
            /* Default checks: include high/med-confidence non-conflict fields;
               conflict fields start UNCHECKED  user must explicitly choose a source */
            const initialChecks={};
            Object.entries(result.fields).forEach(([k,f])=>{
              const isConflict=f.status==="conflict";
              const lowConf=(f.recommended?.confidence||0)<60;
              initialChecks[k]=!isConflict&&!lowConf;
            });
            setImportChecks(initialChecks);
            setImportConflictChoices({});
            setImportResult(result);
            const n=Object.keys(result.fields).length;
            const conflicts=result.conflicts.length;
            addToast(` Extracted ${n} field${n!==1?"s":""} from documents${conflicts>0?`   ${conflicts} conflict${conflicts>1?"s":""} need review`:""}`,conflicts>0?"warn":"success",6000);
          }catch(e){addToast(" Parse error: "+e.message,"error",7000);}
          setDocParsing(false);
        },[docVpFile,docS32File,docSvFile,docVpText,docS32Text,docSvText,addToast]);

        /*  APPLY IMPORT RESULT (unified, with audit log)
           Only applies fields where importChecks[key]===true.
           Writes each applied field into sourceReg for confidence tracking. */
        const applyImportResult=useCallback((result,checks,conflictChoices={})=>{
          if(!result)return;
          const{fields}=result;
          const applied=[];
          const now=new Date().toISOString();

          Object.entries(fields).forEach(([fieldKey,fieldData])=>{
            if(checks[fieldKey]===false)return; // user excluded this field
            /* For conflict fields: use user-chosen source if provided, else fall back to recommended */
            const rec=conflictChoices[fieldKey]||fieldData.recommended;
            if(!rec)return;

                try{
                  const overlays=JSON.parse(val);
                  const flags={overlayReviewed:true};
                  overlays.forEach(o=>{flags[o.flag]=true;});
                  setPlan(p=>({...p,...flags}));
                }catch{}
              }
            } else if(fieldKey==="plan.hasSingleCovenant"){
              setPlan(p=>({...p,hasSingleCovenant:true}));
            } else if(fieldKey==="plan.hasEasementBoe"){
              setPlan(p=>({...p,hasEasementBoe:true}));
            } else if(fieldKey==="plan.easements"){
              setPlan(p=>({...p,easements:val}));
            } else if(fieldKey==="plan.s173"){
              setPlan(p=>({...p,s173:val}));
            } else if(fieldKey==="site.area"){
              setSite(p=>({...p,area:val}));
              setSourceReg(r=>({...r,siteArea:{source:src,confidence:rec.confidence,lastVerifiedAt:now,evidence:rec.evidence}}));
            } else if(fieldKey==="site.frontage"){
              setSite(p=>({...p,frontage:val}));
            } else if(fieldKey==="site.depth"){
              setSite(p=>({...p,depth:val}));
            } else if(fieldKey==="site.lotNumber"){
              setSite(p=>({...p,lotNumber:val}));
            } else if(fieldKey==="site.council"){
              setLookupResult(p=>p?({...p,council:val}):({council:val,lat:null,lon:null}));

              const oscPresets={"Manningham":5,"Boroondara":5,"Whitehorse":5,"Stonnington":5,"Yarra":5,"Darebin":5,"Monash":5.7,"Moonee Valley":5};
              const osc=oscPresets[val];
              if(osc)setFin(p=>p.openSpaceContrib?p:({...p,openSpaceContrib:String(Math.round((parseNum(fin.landPrice)||0)*osc/100))}));
            } else if(fieldKey==="site.address"){
              /* Only auto-fill if site address is currently blank  don't override user entry */
              setSite(p=>p.address?p:({...p,address:val}));
            } else if(fieldKey==="plan.bushfireProneArea"){
              /* Inject BAL provisional sum into conds state and flag for cost calc */
              setPlan(p=>({...p,bushfireProneArea:val}));
              if(val==="Yes")setConds(p=>({...p,bushfireProne:true}));
            } else if(fieldKey==="plan.hasNativeVeg"){
              setPlan(p=>({...p,hasNativeVeg:val}));
              if(val==="Within")setPhys(p=>({...p,vegetation:p.vegetation||"Native vegetation present  DELWP approval required"}));
            } else if(fieldKey==="plan.hasMortgage"){
              setPlan(p=>({...p,hasMortgage:true}));
            } else if(fieldKey==="plan.hasEncumbrance"){
              setPlan(p=>({...p,hasEncumbrance:true}));

            } else if(fieldKey==="site.titleRef"){

            } else if(fieldKey==="site.ahd"){

            } else if(fieldKey==="site.surveyDate"){
              setSite(p=>({...p,surveyDate:val}));
            } else if(fieldKey==="site.surveyor"){
              /* Store in notes  surfaced in audit log */
            } else if(fieldKey==="site.easementWidth"){
              /* Lock easement setback  store in plan.easements description for reference */
              setPlan(p=>({...p,easements:p.easements||(val?`Easement width: ${val}m  rear/side setback minimum locked`:""),hasEasementBoe:true}));
            } else if(fieldKey==="site.councilRatesAmt"){
              /* Auto-fill council rates into holding cost  converted to monthly */

            } else if(fieldKey==="plan.existingPermit"){
              setPlan(p=>({...p,existingPermit:val}));
              addToast(` Planning Permit detected: ${val}. Consider switching to construction-phase mode.`,"warn",8000);
            } else if(fieldKey==="site.svcElec"||fieldKey==="site.svcGas"||fieldKey==="site.svcSewer"){
              /* Services not connected  inject connection fee into hard costs */

                const feeMap={"site.svcElec":6000,"site.svcGas":3500,"site.svcSewer":10000};

                const lbl={"site.svcElec":"Electricity","site.svcGas":"Gas","site.svcSewer":"Sewer"}[fieldKey];
                setFin(p=>({...p,serviceConn:String((parseNum(p.serviceConn)||0)+fee)}));
                addToast(` ${lbl} not connected  $${fee.toLocaleString()} connection fee added to Hard Costs`,"warn",6000);
              }
            } else if(fieldKey==="site.tandemOnly"){
              /* Tandem flag  PS auto-included via frontage in calc */
              addToast(" Frontage <15.2m  only front-rear (tandem) subdivision possible. $18,000 PS auto-included in Hard Costs.","warn",8000);
            } else if(fieldKey==="site.contourRange"){
              /* Contour range  store in site + suggest slope class + structural fee advisory */
              setSite(p=>({...p,contourRange:val}));

              if(_range>=3){
                setConds(p=>({...p,slopeClass:"steep"}));

                setConds(p=>p.slopeClass&&p.slopeClass!=="auto"?p:({...p,slopeClass:"moderate"}));

            }
            applied.push({fieldKey,sourceType:src,value:val,confidence:rec.confidence,evidence:rec.evidence,appliedAt:now});
          });

          try{localStorage.setItem("cc_import_audit",JSON.stringify(newLog));}catch{}

          setImportResult(null);

        const [waivers,setWaivers]=useState(()=>{try{const w=JSON.parse(localStorage.getItem("cc_waivers")||"[]");return w;}catch{return[];}});
        const [waiverForm,setWaiverForm]=useState(null); // {gateId, msg} | null

         */
        const hardGates=useMemo(()=>{
          /*  LEGAL GATE  */
          let legalStatus="pass";
          const legalIssues=[];
          if(plan.hasSingleCovenant){
            legalStatus="block";
            legalIssues.push({gateId:"legal-covenant",sev:"block",tab:"plan",anchorId:"gate-anchor-covenant",
              msg:"Single Dwelling Covenant  development legally restricted to 1 dwelling",
              fix:"Engage solicitor for covenant removal/modification. Typically 1224 months and $15K$40K+."});
          }
          if(plan.hasEasementBoe){
            if(legalStatus==="pass")legalStatus="warn";
            legalIssues.push({gateId:"legal-boe",sev:"warn",tab:"plan",anchorId:"gate-anchor-easement",
              msg:"Build-Over Easement  BOE approval required before construction",
              fix:"Obtain BOE approval ($1,500$5,000) from relevant authority. May reduce net buildable area."});
          }
          if(plan.s173&&plan.s173.trim()&&plan.s173!=="None"){
            if(legalStatus==="pass")legalStatus="warn";
            legalIssues.push({gateId:"legal-s173",sev:"warn",tab:"plan",anchorId:"gate-anchor-s173",
              msg:`S.173 Agreement on title: "${(plan.s173||"").slice(0,70)}"`,
              fix:"Review agreement terms  may restrict use, density, or subdivision. Solicitor review required."});
          }
          /*  PLANNING GATE  */
          let planStatus="pass";
          const planIssues=[];
          const normZ2=plan.zone?(plan.zone.replace(/\s+/g,"").toUpperCase()):"";
          const zRule=ZONE_RULES?.[normZ2]||ZONE_RULES?.[plan.zone]||null;
          const estU2=parseNum(plan.estUnits)||1;
          if(zRule&&zRule.maxDwellings&&estU2>zRule.maxDwellings){
            planStatus="block";
            planIssues.push({gateId:"plan-units",sev:"block",tab:"plan",anchorId:"gate-anchor-units",
              msg:`Unit count (${estU2}) exceeds zone maximum (${zRule.maxDwellings} in ${plan.zone})`,
              fix:"Reduce unit count to match zone permit requirements, or obtain a planning permit for above-threshold density."});
          }
          if(plan.hasHO){
            if(planStatus==="pass")planStatus="warn";
            planIssues.push({gateId:"plan-ho",sev:"warn",tab:"plan",anchorId:"gate-anchor-overlays",
              msg:"Heritage Overlay  strict design guidelines and longer permit timeline",
              fix:"Engage heritage architect for Statement of Significance. Expect 36+ months additional permit time."});
          }
          if(plan.hasSBO){
            if(planStatus==="pass")planStatus="warn";
            planIssues.push({gateId:"plan-sbo",sev:"warn",tab:"plan",anchorId:"gate-anchor-overlays",
              msg:"Significant Building Overlay  heritage/character design review required",
              fix:"Pre-application meeting with council recommended before lodging planning permit."});

            if(planStatus==="pass")planStatus="warn";
            planIssues.push({gateId:"plan-ddo",sev:"warn",tab:"plan",anchorId:"gate-anchor-ddo",
              msg:"DDO in place  schedule not confirmed",
              fix:"Look up DDO schedule in VicPlan and enter the DDO number to confirm height/setback requirements."});
          }
          if(!plan.zone){
            if(planStatus==="pass")planStatus="warn";
            planIssues.push({gateId:"plan-zone",sev:"warn",tab:"plan",anchorId:"gate-anchor-zone",
              msg:"Planning zone not confirmed",
              fix:"Run Smart Search or look up VicPlan to confirm the zone before making investment decisions."});
          }
          /*  FINANCE GATE  */
          let finStatus="pass";
          const finIssues=[];
          const mg=calc.margin||0;
          const lvrPctG=parseNum(str.lvrPct)||65;
          if(mg<0){
            finStatus="block";
            finIssues.push({gateId:"fin-neg-margin",sev:"block",tab:"finance",anchorId:"gate-anchor-grv",
              msg:`Negative margin (${mg.toFixed(1)}%)  project is loss-making at current inputs`,
              fix:"Review land price, GRV assumptions, and cost estimates. Reduce unit count or increase sale price."});
          } else if(mg<15){
            finStatus="block";
            finIssues.push({gateId:"fin-thin-margin",sev:"block",tab:"finance",anchorId:"gate-anchor-grv",
              msg:`Margin ${mg.toFixed(1)}%  below minimum bank lending threshold (~15%)`,
              fix:"Banks typically require 1518% margin on cost. Review cost inputs or reconsider land price."});
          } else if(mg<18){
            if(finStatus==="pass")finStatus="warn";
            finIssues.push({gateId:"fin-low-margin",sev:"warn",tab:"finance",anchorId:"gate-anchor-grv",
              msg:`Margin ${mg.toFixed(1)}%  below preferred bank threshold (1820%)`,
              fix:"Some lenders may still fund at 1518% with additional equity or guarantees. Check with broker."});

              fix:"Enter land price in Financial Analysis tab to enable accurate LVR and equity calculations."});

            finIssues.push({gateId:"fin-dscr",sev:dscrSev,tab:"structure",anchorId:"gate-anchor-lvr",

          }

            const effectiveStatus=status==="block"&&allWaived?"waived":status;
            return{issues:newIssues,status:effectiveStatus};
          };

          const planG=applyWaiver(planIssues,planStatus);
          const finG=applyWaiver(finIssues,finStatus);
          const statuses=[legalG.status,planG.status,finG.status];

            statuses.includes("waived")?"waived":"pass";
          return{legal:{status:legalG.status,issues:legalG.issues},planning:{status:planG.status,issues:planG.issues},finance:{status:finG.status,issues:finG.issues},overall:overallGate};
        },[plan,calc,str,fin,waivers]);
