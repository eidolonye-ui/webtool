              `Memorandum of Common Provisions detected: "${(s32.mcpDesc||"").slice(0,80)}"  may impose design, material or use restrictions`);
          if(s32.hasRestrictiveCovenant&&!s32.hasSingleCovenant)
            register("plan.covenantDesc","Section32",s32.restrictiveCovenantDesc||s32.covenantDesc||"Restrictive covenant detected",82-sp,
              `Restrictive covenant found in Section 32  ${(s32.restrictiveCovenantDesc||s32.covenantDesc||"see document").slice(0,80)}`);
          if(s32.area){
            const n=parseFloat(s32.area.replace(/,/g,""));
            const inRange=n>=50&&n<=20000;
            register("site.area","Section32",String(n),(inRange?70:35)-sp,
              `Area ${n} m from Section 32${inRange?"":"  outside expected range"}`);
          }
          if(s32.lot) register("site.lotNumber","Section32",s32.lot,78-sp,"Lot reference from Section 32");
          /* Easement width  for setback lock */
          if(s32.easementWidthM)
            register("site.easementWidth","Section32",s32.easementWidthM,85-sp,
              `Easement width ${s32.easementWidthM}m  rear/side setback minimum should be locked to this value`);
          /* Mortgage / charge detection */
          if(s32.hasMortgage)
            register("plan.hasMortgage","Section32","true",82-sp,
              `Mortgage/charge detected: "${(s32.mortgageDesc||"").slice(0,80)}"  confirm discharge prior to settlement`);
          /* Other encumbrances */
          if(s32.hasEncumbrance)
            register("plan.hasEncumbrance","Section32","true",80-sp,
              `Encumbrance: "${(s32.encumbranceDesc||"").slice(0,80)}"  review with solicitor`);
          /* Certificate of Title reference */
          if(s32.titleVolume&&s32.titleFolio)
            register("site.titleRef","Section32",`Vol ${s32.titleVolume} Fol ${s32.titleFolio}`,90-sp,"Certificate of Title volume/folio from Section 32");
          /* Services connected  each "No" triggers a connection fee */
          if(s32.servicesElec) register("site.svcElec","Section32",s32.servicesElec,80-sp,`Electricity service: ${s32.servicesElec}`);
          if(s32.servicesGas)  register("site.svcGas","Section32",s32.servicesGas,80-sp,`Gas service: ${s32.servicesGas}`);
          if(s32.servicesSewer)register("site.svcSewer","Section32",s32.servicesSewer,80-sp,`Sewerage service: ${s32.servicesSewer}`);
          /* Council rates  holding cost auto-fill */
          if(s32.councilRatesAmt)
            register("site.councilRatesAmt","Section32",s32.councilRatesAmt,88-sp,
              `Council rates $${Number(s32.councilRatesAmt).toLocaleString()} p.a.  auto-fill into holding cost model`);
          /* Planning permit already attached */
          if(s32.hasPermit)
            register("plan.existingPermit","Section32",s32.permitNo+(s32.permitDesc?`  ${s32.permitDesc}`:""),85-sp,
              `Existing planning permit attached  consider switching to construction-phase calculation`);
          /* Registered dealing/instrument numbers on title */
          if(s32.covenantDocNums?.length>0)
            register("plan.covenantDocNums","Section32",s32.covenantDocNums.join(", "),87-sp,
              `Registered instrument number(s): ${s32.covenantDocNums.join(", ")}  request Office Copy at Land Victoria to review restrictions`);
          /* Easement net buildable area advisory */
          if(s32.hasEasement&&s32.easementWidthM&&s32.area){
            const _siteA=parseFloat(s32.area)||0;
            const _eW=parseFloat(s32.easementWidthM)||0;
            if(_siteA>0&&_eW>0)
              register("site.easementNetArea","Section32",s32.area,55-sp,
                `Easement ${_eW}m wide  net buildable area reduced. Apply ${Math.round(_eW)}m setback from easement edge. Confirm exact impact with survey overlay.`);
          }
        }

        /*  Survey registrations  */
        if(sv){
          const sp=scanned.sv?20:0;
          if(sv.area){
            const n=parseFloat(sv.area.replace(/,/g,""));
            const inRange=n>=50&&n<=20000;
            register("site.area","Survey",String(n),(inRange?95:52)-sp,
              `Area ${n} m from survey plan (highest geometric authority)${inRange?"":"  verify"}`);
          }
          if(sv.frontage){
            const n=parseFloat(sv.frontage);
            const inRange=n>=3&&n<=200;
            register("site.frontage","Survey",sv.frontage,(inRange?90:48)-sp,
              `Frontage ${n} m from road boundary${inRange?"":"  unusual, verify"}`);
          }
          if(sv.depth){
            const n=parseFloat(sv.depth);
            const inRange=n>=3&&n<=400;
            register("site.depth","Survey",sv.depth,(inRange?90:48)-sp,
              `Depth ${n} m from rear boundary${inRange?"":"  unusual, verify"}`);
          }
          if(sv.lotNumber) register("site.lotNumber","Survey",sv.lotNumber,85-sp,"Lot/plan reference from survey");
          if(sv.easements?.length>0){
            register("plan.hasEasementBoe","Survey","true",80-sp,
              `Easement in survey: "${sv.easements[0].slice(0,80)}"`);
            register("plan.easements","Survey",sv.easements[0],72-sp,"First easement reference from survey plan");
          }
          /* AHD datum  useful for drainage and earthworks context */
          if(sv.ahd)
            register("site.ahd","Survey",sv.ahd,85-sp,"AHD datum level from survey title block  use for earthworks & drainage design");
          /* Survey date  freshness indicator for the plan */
          if(sv.surveyDate)
            register("site.surveyDate","Survey",sv.surveyDate,80-sp,"Date survey was certified  verify currency for planning/title purposes");
          /* Surveyor */
          if(sv.surveyor)
            register("site.surveyor","Survey",sv.surveyor,75-sp,"Licensed surveyor who certified the plan");
          /* Tandem-only flag from frontage < 15.2m */
          if(sv.isTandemOnly)
            register("site.tandemOnly","Survey","true",88-sp,
              `Frontage ${sv.frontage}m < 15.2m  only front-rear (tandem) subdivision possible. $18K PS auto-included in Hard Costs.`);
          /* Contour range  earthworks advisory */
          if(sv.contourRange&&parseFloat(sv.contourRange)>0){
            const _cr=parseFloat(sv.contourRange);
            register("site.contourRange","Survey",sv.contourRange,80-sp,
              `Site height range ${_cr.toFixed(2)}m (min RL ${sv.contourMin}, max RL ${sv.contourMax})`
              +(_cr>=3?"  substantial earthworks: budget $40K$80K+ for cut/fill/retaining":_cr>=1.5?"  moderate earthworks: budget $20K$40K":"")
              +". Cross-check slope % against ArcGIS terrain data.");
          }
          /* Trees with DBH detected */
          if(sv.trees?.length>0){
            const _maxDBH=Math.max(...sv.trees.map(tr=>parseInt(tr.dbh)||0));
            if(_maxDBH>0)
              register("site.treeMaxDBH","Survey",String(_maxDBH),75-sp,
                `${sv.trees.length} tree(s) on survey  max DBH ${_maxDBH}mm. TPZ radius ~${(_maxDBH/1000*12).toFixed(1)}m (12DBH rule). Arborist report required if within 3m of proposed works.`);
          }
          /* Service infrastructure positions */
          if(sv.svcPositions?.length>0)
            register("site.svcPositions","Survey",sv.svcPositions.join("; ").slice(0,120),72-sp,
              `Service infrastructure on survey: ${sv.svcPositions.join(", ")}  confirm positions; overhead power  undergrounding cost $15K$60K`);
          /* Adjacent window context from survey annotations */
          if(sv.adjacentWindowH)
            register("site.adjacentWindowNote","Survey",sv.adjacentWindowH,65-sp,
              "First/upper floor window reference in survey  overlooking screening cost may apply ($8K$15K per window)");
        }

        /*  Conflict detection + recommended value  */
        const conflicts=[];
        const normForCompare=(v)=>{
          const n=parseFloat(v);
          return isNaN(n)?v.trim().toLowerCase():n.toFixed(1);
        };

        for(const [fieldKey,fieldData] of Object.entries(fields)){
          const {sources}=fieldData;
          if(sources.length===0)continue;
          if(sources.length===1){
            fieldData.status="ok";
            fieldData.recommended=sources[0];
          } else {
            const uniqVals=[...new Set(sources.map(s=>normForCompare(s.value)))];
            fieldData.status=uniqVals.length===1?"consistent":"conflict";
            if(fieldData.status==="conflict")conflicts.push(fieldKey);
            /* Recommended: highest source priority, then highest confidence */
            fieldData.recommended=sources.reduce((best,cur)=>{
              const pb=PRIORITY[best.sourceType]||0, pc=PRIORITY[cur.sourceType]||0;
              if(pc>pb)return cur;
              if(pc===pb&&cur.confidence>best.confidence)return cur;
              return best;
            });
          }
          fieldData.requiresManualConfirm=CRITICAL.has(fieldKey)||
            (fieldData.recommended?.confidence||0)<60||
            fieldData.status==="conflict";
        }
        return{fields,conflicts,audit,scanned};
      }

      /*  API CACHE HELPERS (localStorage, 24h / 7d TTL)  */
      const API_CACHE_PREFIX="cc_apicache_";
      function cacheGet(key){
        try{
          const raw=localStorage.getItem(API_CACHE_PREFIX+key);
          if(!raw)return null;
          const {data,expires}=JSON.parse(raw);
          if(Date.now()>expires){localStorage.removeItem(API_CACHE_PREFIX+key);return null;}
          return data;
        }catch{return null;}
      }
      function cacheSet(key,data,ttlMs=86400000){
        try{localStorage.setItem(API_CACHE_PREFIX+key,JSON.stringify({data,expires:Date.now()+ttlMs}));}catch{}
      }
      /* Fetch with timeout + 1 retry + cache */
      async function fetchWithCache(url,cacheKey,ttlMs=86400000,timeoutMs=8000){
        const cached=cacheGet(cacheKey);
        if(cached)return{data:cached,fromCache:true};
        const doFetch=()=>new Promise((res,rej)=>{
          const ctrl=new AbortController();
          const t=setTimeout(()=>{ctrl.abort();rej(new Error("timeout"))},timeoutMs);
          fetch(url,{signal:ctrl.signal}).then(r=>r.json()).then(d=>{clearTimeout(t);res(d);}).catch(e=>{clearTimeout(t);rej(e);});
        });
        try{
          const data=await doFetch();
          cacheSet(cacheKey,data,ttlMs);
          return{data,fromCache:false};
        }catch(e){
          /* one retry */
          try{const data=await doFetch();cacheSet(cacheKey,data,ttlMs);return{data,fromCache:false};}
          catch(e2){throw new Error(`API error (${e2.message}). Check connection.`);}
        }
      }

      /* Re-establishment, Feature and Level Survey Plan parser */
      function parseLandSurveyText(text){
        if(!text||!text.trim())return null;
        const t=text.replace(/\r\n/g,"\n").replace(/[ \t]+/g," ").trim();
        const result={frontage:"",depth:"",area:"",lotNumber:"",easements:[],bearings:[],notes:[],
          ahd:"",surveyDate:"",surveyor:"",datum:"",
          contourMin:"",contourMax:"",contourRange:"",trees:[],svcPositions:[],
          adjacentWindowH:"",isTandemOnly:false};

        /*  Area  */
        const areaM=t.match(/(?:area|lot\s+area|total\s+area)[:\s=]+(\d[\d,]*\.?\d*)\s*(?:m2|m|sq\.?m)/i)||
          t.match(/(\d[\d,]*\.?\d*)\s*m[2]\s*(?:approx|total|lot|site)/i);
        if(areaM)result.area=areaM[1].replace(/,/g,"");

        /*  Frontage  */
        const frontM=t.match(/(?:frontage|road\s+boundary|street\s+boundary)[:\s]+(\d+\.?\d*)\s*m/i)||
          t.match(/(\d+\.?\d*)\s*m\s+(?:to|along)\s+(?:road|street|frontage)/i);
        if(frontM)result.frontage=frontM[1];

        /*  Depth  */
        const depM=t.match(/(?:depth|rear\s+boundary|back\s+boundary|average\s+depth)[:\s]+(\d+\.?\d*)\s*m/i);
        if(depM)result.depth=depM[1];

        /*  Lot number  handles LP, PS, TP, SP, CP, DP, RE formats  */
        const lotM=t.match(/Lot\s+(\d+)\s+(?:on\s+)?(?:LP|PS|TP|SP|CP|DP|RE)\s*\.?\s*(\d+)/i);
        if(lotM){
          const plan=lotM[0].match(/\b(PS|LP|TP|SP|CP|DP|RE)\b/i)?.[0].toUpperCase()||"LP";
          result.lotNumber=`Lot ${lotM[1]} on ${plan}${lotM[2]}`;
        }

        /*  Easements  */
        const eMatches=t.matchAll(/easement[^.\n]{0,150}/gi);
        for(const m of eMatches)result.easements.push(m[0].trim().slice(0,120));

        /*  Survey Bearings  */
        const bearM=t.matchAll(/[NSEW]\s*\d+\d*[']?\s*[NSEW]/g);
        for(const m of bearM)result.bearings.push(m[0]);

        /*  AHD / Datum level (Australian Height Datum)  */
        const ahdM=t.match(/(?:AHD|Australian\s+Height\s+Datum|benchmark|datum)[:\s=]+(\d+\.?\d*)\s*(?:m|AHD)/i)||
          t.match(/RL\s+(\d+\.?\d*)\s*(?:m\s+)?AHD/i);
        if(ahdM)result.ahd=ahdM[1]+" m AHD";

        /*  Datum type  */
        const datumM=t.match(/(?:datum|projection)[:\s]+([A-Za-z0-9\s/]{3,30})/i);
        if(datumM)result.datum=datumM[1].trim().slice(0,30);

        /*  Survey date  */
        const dateM=t.match(/(?:surveyed|survey\s+date|date\s+of\s+survey|certified)[:\s]+(\d{1,2}[\s/.-]\w+[\s/.-]\d{4}|\w+\s+\d{4})/i)||
          t.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/);
        if(dateM)result.surveyDate=dateM[1].trim();

        /*  Surveyor name  */
        const surveyorM=t.match(/(?:licensed\s+surveyor|registered\s+surveyor|surveyor)[:\s]+([A-Z][A-Za-z\s.'-]{3,50})(?:\n|,|\(|Lic)/i);
        if(surveyorM)result.surveyor=surveyorM[1].trim().slice(0,60);

        /*  Contours / RL levels  height range  */
        const _rlA=[...t.matchAll(/\bRL\s+(\d{1,3}\.\d{1,3})\b/g)];
        const _rlB=[...t.matchAll(/(\d{2,3}\.\d{2,3})\s*m?\s*AHD\b/ig)];
        const _rlAll=[..._rlA,..._rlB].map(m=>parseFloat(m[1])).filter(v=>v>0&&v<999);
        if(_rlAll.length>=2){
          const _minV=Math.min(..._rlAll),_maxV=Math.max(..._rlAll);
          result.contourMin=_minV.toFixed(2);result.contourMax=_maxV.toFixed(2);
          result.contourRange=(_maxV-_minV).toFixed(2);
        }

        /*  Trees with DBH (diameter at breast height)  */
        const _treeMs=[...t.matchAll(/([A-Za-z][A-Za-z\s'-]{3,30}?)(?:\s+tree|\s+palm|\s+oak|\s+elm|\s+pine|\s+gum|\s+eucalypt[us]?)?[^.;\n]{0,60}DBH\s*[:=]?\s*(\d+)\s*mm/gi)];
        _treeMs.forEach(m=>{result.trees.push({species:m[1].trim().slice(0,30),dbh:m[2]});});
        if(!_treeMs.length){
          const _dbhFb=[...t.matchAll(/DBH\s*[:=]?\s*(\d+)\s*mm/gi)];
          _dbhFb.forEach(m=>{result.trees.push({species:"Unknown",dbh:m[1]});});
        }

        /*  Service infrastructure positions  */
        const _svcDefs=[
          {rx:/sewer\s+(?:cap|inspection\s+shaft|manhole|access\s+chamber|pit)/gi, label:"Sewer cap/pit"},
          {rx:/stormwater\s+(?:pit|drain|gully|inlet)/gi,                          label:"Stormwater pit"},
          {rx:/(?:power|electrical?|electricity)\s+(?:pole|pillar|tower)/gi,        label:"Power pole"},
          {rx:/(?:telecom|telecommunication|NBN|telephone)\s+(?:pit|manhole|box)/gi,label:"Telecom pit"},
          {rx:/water\s+(?:meter|main|service\s+connection)/gi,                     label:"Water main/meter"},
        ];
        _svcDefs.forEach(({rx,label})=>{if(rx.test(t)&&!result.svcPositions.includes(label))result.svcPositions.push(label);});

        /*  Adjacent building windows (overlooking context)  */
        const _adjWinM=t.match(/(?:first\s+floor|upper\s+floor|level\s+1|F\.?F\.?L\.?)[^.;\n]{0,100}(?:window|habitable)/i)||
          t.match(/(?:window|habitable\s+room)[^.;\n]{0,80}(?:first\s+floor|upper\s+floor)/i);
        if(_adjWinM)result.adjacentWindowH=_adjWinM[0].trim().slice(0,100);

        /*  Tandem flag from frontage  */
        if(result.frontage&&parseFloat(result.frontage)<15.2)result.isTandemOnly=true;

        return result;
      }

      /*  SITE POTENTIAL SCORE CALCULATOR
         Returns {score:0-100, band:"green"|"amber"|"red", label, breakdown[]}
         Used in Site Finder cards, Summary header, Metrics strip.
          */
      function calcSitePotential({zone,area,frontage,overlays=[],hasEasement,hasCovenant,slopeClass,bushfire,councilRate}){
        let score=50; /* neutral base */
        const bd=[];

        /* Zone bonus/penalty */
        const zoneScores={MUZ:30,C1Z:25,RGZ:20,GRZ:10,TZ:5,NRZ:-15,LDRZ:-25};
        const zKey=zone?(zone.replace(/\d+/,"").toUpperCase()):"";
        const zBonus=zoneScores[zKey]??0;
        score+=zBonus;
        if(zBonus>0)bd.push({label:`Zone ${zone}`,pts:zBonus,color:"#00b894"});
        else if(zBonus<0)bd.push({label:`Zone ${zone} (restrictive)`,pts:zBonus,color:"#e17055"});

        /* Area */
        const aNum=parseFloat(area)||0;
        if(aNum>=1000){score+=20;bd.push({label:"Large site 1000m",pts:20,color:"#00b894"});}
        else if(aNum>=700){score+=15;bd.push({label:"Good area 700m",pts:15,color:"#00b894"});}
        else if(aNum>=500){score+=8;bd.push({label:"Adequate area 500m",pts:8,color:"#00b894"});}
        else if(aNum>=350){score+=3;bd.push({label:"Min viable 350m",pts:3,color:"#fdcb6e"});}
        else if(aNum>0&&aNum<300){score-=15;bd.push({label:"Sub-300m site",pts:-15,color:"#e17055"});}

        /* Frontage */
        const fNum=parseFloat(frontage)||0;
        if(fNum>=20){score+=15;bd.push({label:"Wide frontage 20m",pts:15,color:"#00b894"});}
        else if(fNum>=16){score+=10;bd.push({label:"Good frontage 16m",pts:10,color:"#00b894"});}
        else if(fNum>=12){score+=5;bd.push({label:"Adequate frontage 12m",pts:5,color:"#fdcb6e"});}
        else if(fNum>0&&fNum<10){score-=12;bd.push({label:"Narrow frontage <10m",pts:-12,color:"#e17055"});}

        /* Overlays */
        const ovCount=overlays.filter(Boolean).length;
        if(ovCount>=4){score-=20;bd.push({label:`${ovCount} overlays  high compliance burden`,pts:-20,color:"#e17055"});}
        else if(ovCount>=2){score-=10;bd.push({label:`${ovCount} overlays`,pts:-10,color:"#e17055"});}
        else if(ovCount===1){score-=4;bd.push({label:"1 overlay",pts:-4,color:"#fdcb6e"});}

        /* Easement */
        if(hasEasement){score-=10;bd.push({label:"Easement present",pts:-10,color:"#e17055"});}

        /* Covenant (single dwelling) */
        if(hasCovenant){score-=20;bd.push({label:"Single dwelling covenant",pts:-20,color:"#e17055"});}

        /* Slope */
        if(slopeClass==="steep"){score-=15;bd.push({label:"Steep slope",pts:-15,color:"#e17055"});}
        else if(slopeClass==="moderate"){score-=7;bd.push({label:"Moderate slope",pts:-7,color:"#fdcb6e"});}

        /* Bushfire */
        if(bushfire){score-=12;bd.push({label:"Bushfire prone area",pts:-12,color:"#e17055"});}

        /* Clamp */
        score=Math.max(0,Math.min(100,Math.round(score)));
        const band=score>=70?"green":score>=45?"amber":"red";
        const label=score>=70?"High Potential":score>=45?"Moderate Potential":"Low Potential";
        const color=band==="green"?"#00b894":band==="amber"?"#f39c12":"#e17055";
        return{score,band,label,color,breakdown:bd};
      }

      function FeasibilityApp(){
        const [tab,setTab]=useState("site");
        const [explorerMode,setExplorerMode]=useState(true); /* true= false= */

                    /* Task #29  lot orientation from bbox */

                    const midLatRad=((bb[1]+bb[3])/2)*Math.PI/180;
                    const widthM=Math.abs(bb[2]-bb[0])*111320*Math.cos(midLatRad); // E-W extent
                    const heightM=Math.abs(bb[3]-bb[1])*111320;                     // N-S extent
                    const ratio=heightM>0?widthM/heightM:1;
                    // Deeper N-S = good solar; deeper E-W = poor solar
                    const orientation=ratio<0.85?"N-S (favourable solar)":ratio>1.15?"E-W (limited solar)":"Square / near-square";
                    setPhys(p=>p.orientation?p:({...p,orientation}));
                    /* Task 32  auto frontage/depth (shorter bbox side = frontage estimate) */
                    const frontEst=Math.round(Math.min(widthM,heightM));
                    const depthEst=Math.round(Math.max(widthM,heightM));
                    setSite(p=>({...p,
                      frontage:p.frontage||String(frontEst),
                      depth:p.depth||String(depthEst),
                    }));
                    setBboxDims({w:Math.round(widthM),h:Math.round(heightM),frontEst,depthEst});
                    /* Edit 10  Lot shape auto-detection from bbox vs actual polygon area ratio */
                    try{
                      const polyAreaM2=turf.area(feat);
                      const bboxPoly=turf.polygon([[
                        [bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]],[bb[0],bb[1]]
                      ]]);
                      const bboxAreaM2=turf.area(bboxPoly);
                      const ratio2=bboxAreaM2>0?polyAreaM2/bboxAreaM2:1;
                      const detectedShape=ratio2>=0.90?"Regular Rectangle":ratio2>=0.75?"Irregular":ratio2>=0.60?"L-Shape":"Battleaxe / Flag Lot";
                      setSite(p=>({...p,shape:p.shape||detectedShape}));
                    }catch(e2){/* non-critical */}
                  }catch(e){/* non-critical */}
                }
              }
              else setParcelStatus("error");
            }).catch(()=>setParcelStatus("error"));

            /*  Step 4: Auto-fill site amenity fields via OSM (runs after result is shown)  */
            setAutoFillStatus("loading");
            setTimeout(async()=>{
              try{
                const loc=await runLocationAnalysis(lat,lon);
                if(!loc||loc.error){setAutoFillStatus("idle");return;}
                const fmtList=(arr,n,fallback)=>arr.slice(0,n).map(x=>x.name?`${x.name} (${x.d}m)`:fallback+` (${x.d}m)`).filter(Boolean).join("; ");
                const transport=[
                  ...loc.trains.slice(0,2).map(t=>t.name?`${t.name} train (${t.d}m)`:""),
                  ...loc.trams.slice(0,2).map(t=>t.name?`${t.name} tram (${t.d}m)`:`Tram stop (${t.d}m)`),
                  ...loc.buses.slice(0,1).map(b=>`Bus stop (${b.d}m)`),
                ].filter(Boolean).join("; ");
                setSite(p=>({...p,
                  schools:       p.schools      ||fmtList(loc.schools,3,"School"),
                  publicTransport:p.publicTransport||transport,
                  shops:         p.shops        ||fmtList(loc.supermarkets,2,"Supermarket"),
                  parks:         p.parks        ||fmtList(loc.parks,3,"Park"),
                  medical:       p.medical      ||[
                    ...loc.hospitals.slice(0,1).map(h=>h.name?`${h.name} (${h.d}m)`:`Hospital (${h.d}m)`),
                    ...loc.doctors.slice(0,2).map(d=>d.name?`${d.name} (${d.d}m)`:`GP clinic (${d.d}m)`),
                  ].filter(Boolean).join("; "),
                }));
                setAutoFillStatus("done");
              }catch(e){setAutoFillStatus("idle");}
            },200);
          }catch(e){
            setLookupStatus("error");setLookupResult({msg:` Query failed: ${e.message}`});
          }
        },[lookupAddr,applySuburb]);

        /*  SELECT CANDIDATE ADDRESS  */
        const selectCandidate=useCallback(async(item)=>{
          const a=item.address||{};
          const suburb=cleanDisplay((a.suburb||a.town||a.city_district||a.municipality||"").trim());
          const postcode=(a.postcode||"").trim();
          const lat=+item.lat,lon=+item.lon;
          const cbdKm=calcCBDDist(lat,lon);
          /*  Build properly-structured address string (fix: was splitting display_name)  */
          const houseNum=(a.house_number||"").trim();
          const road=cleanDisplay((a.road||a.pedestrian||a.path||"").trim());
          const streetPart=houseNum&&road?`${houseNum} ${road}`:road||houseNum;
          const formattedAddr=(streetPart&&suburb)
            ? `${streetPart}, ${suburb} VIC${postcode?" "+postcode:""}`.trim()
            : cleanDisplay(item.display_name).split(",").slice(0,4).join(",").trim();
          setSite(p=>({...p,address:formattedAddr,cbdDist:`${cbdKm.toFixed(1)}km`}));
          const norm=s=>s.toLowerCase().replace(/[\s-]/g,"");
          const subKey=Object.keys(MEL_SUBURBS).find(k=>norm(suburb).includes(norm(k))||norm(k).includes(norm(suburb)));
          if(subKey)applySuburb(subKey);
          setLookupAddr(formattedAddr);
          setLookupCandidates([]);
          await lookupAddress(formattedAddr);
        },[applySuburb,lookupAddress]);

        /*
           LIVE MARKET INDICATORS: ABS Construction Index + RBA Rate
         */
        const fetchLiveIndicators=useCallback(async()=>{
          setLiveInd(s=>({...s,status:"loading"}));
          const result={status:"done",ts:new Date().toISOString(),rba:null,cpi:null,ppi:null};
          try{

          /*  RBA: Cash Rate via official XML  */
          try{
            // RBA publishes RSS/XML that is often CORS-blocked; try a known JSON mirror
            const rbaResp=await fetch(
              "https://api.rba.gov.au/statistics/tables/F4_001?format=csv",
              {signal:AbortSignal.timeout(6000)}
            );
            // If RBA API exists (may not), parse it; otherwise fall back to hardcoded
            if(rbaResp.ok){
              const txt=await rbaResp.text();
              const lines=txt.split("\n").filter(l=>l.trim());
              const last=lines[lines.length-1].split(",");
              result.rba={rate:parseFloat(last[1])||4.35,source:"RBA API",date:last[0]};
            }
          }catch(e){
            // RBA API unavailable  hardcode current rate with verification link
            result.rba={rate:4.10,source:"Hardcoded fallback  click to verify current rate",date:"2026-04",
              link:"https://www.rba.gov.au/statistics/cash-rate/"};
          }

          /*  ABS: CPI All Groups quarterly (SDMX REST API, no key needed)  */
          try{
            const absResp=await fetch(
              "https://api.data.abs.gov.au/data/CPI/1.10001.10.50.Q?startPeriod=2023-Q1&detail=DataOnly&format=jsondata",
              {signal:AbortSignal.timeout(10000),headers:{"Accept":"application/vnd.sdmx.data+json"}}
            );
            if(absResp.ok){
              const json=await absResp.json();
              const obs=json?.data?.dataSets?.[0]?.series?.["0:0:0:0:0"]?.observations||{};
              const periods=json?.data?.structure?.dimensions?.observation?.[0]?.values||[];
              const series=periods.map((p,i)=>({period:p.id,val:obs[i]?.[0]})).filter(x=>x.val!=null);
              if(series.length>=2){
                const lat=series[series.length-1],yr=series[series.length-5]||series[0];
                const yoy=yr?((lat.val-yr.val)/yr.val*100):null;
                result.cpi={latest:lat,yearAgo:yr,yoy,series:series.slice(-8),source:"ABS CPI API"};
              }
            }
          }catch(e){result.cpi={error:"ABS CPI API temporarily unavailable"}}

          /*  ABS: Building Activity (Construction) - residential  */
          try{
            const bldgResp=await fetch(
              "https://api.data.abs.gov.au/data/BLDG_ACTIVITY/1.1.3.AUS.Q?startPeriod=2023-Q1&detail=DataOnly&format=jsondata",
              {signal:AbortSignal.timeout(10000),headers:{"Accept":"application/vnd.sdmx.data+json"}}
            );
            if(bldgResp.ok){
              const json=await bldgResp.json();
              const obs=json?.data?.dataSets?.[0]?.series?.["0:0:0:0:0"]?.observations||{};
              const periods=json?.data?.structure?.dimensions?.observation?.[0]?.values||[];
              const series=periods.map((p,i)=>({period:p.id,val:obs[i]?.[0]})).filter(x=>x.val!=null);
              if(series.length>=2){
                const lat=series[series.length-1],prev=series[series.length-2];
                const qoq=prev?((lat.val-prev.val)/prev.val*100):null;
                result.ppi={latest:lat,prev,qoq,series:series.slice(-6),source:"ABS Building Activity API"};
              }
            }
          }catch(e){result.ppi={error:"ABS Building Activity API temporarily unavailable"}}

          setLiveInd(result);
          // P1.1: tag interest rate source when RBA data arrives
          if(result.rba?.rate){
            const isLive=result.rba.source==="RBA API";
            updateSource("interestRate",{
              source:isLive?"RBA":"Hardcoded Fallback",
              confidence:isLive?85:40,
              effectiveDate:result.rba.date||new Date().toISOString().slice(0,7),
              note:`Cash rate ${result.rba.rate}%  add ~3.54.5% margin for construction finance`
            });
          }
          }catch(e){
            /* Safety net: market indicator fetch failure must never cause white screen */
            console.warn("[LiveInd] Fetch error:",e.message);
            setLiveInd({status:"done",ts:new Date().toISOString(),rba:{rate:4.10,source:"Hardcoded fallback",date:"2026-04",link:"https://www.rba.gov.au/statistics/cash-rate/"},cpi:null,ppi:null});
          }
        },[]);

        /*  Trigger on mount  */
        useEffect(()=>{fetchLiveIndicators();},[]);

        /*  Keyboard tab navigation: Alt+ / Alt+ to cycle tabs  */
        useEffect(()=>{
          const handler=(e)=>{
            if(!e.altKey)return;
            const idx=TABS.findIndex(t=>t.id===tab);
            if(e.key==="ArrowRight"&&idx<TABS.length-1){e.preventDefault();setTab(TABS[idx+1].id);}
            else if(e.key==="ArrowLeft"&&idx>0){e.preventDefault();setTab(TABS[idx-1].id);}
          };
          window.addEventListener("keydown",handler);
          return()=>window.removeEventListener("keydown",handler);
        },[tab]);

        /*  Leaflet Map: initialise / update when coordinates change or tab is siteinv  */
        useEffect(()=>{
          if(tab!=="siteinv")return;
          if(!lookupResult?.lat||!lookupResult?.lon)return;
          if(typeof window.L==="undefined")return; /* Leaflet not loaded yet */
          const container=mapContainerRef.current;
          if(!container)return;
          const lat=lookupResult.lat,lon=lookupResult.lon;
          /* Destroy previous map instance if any */
          if(leafletMapRef.current){leafletMapRef.current.remove();leafletMapRef.current=null;}
          /* Slight delay to ensure container is rendered */
          const init=()=>{

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
              attribution:' <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:22
            }).addTo(map);
            /* Site marker */
            const siteIcon=L.divIcon({html:`<div style="background:#0f4c75;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>`,iconSize:[32,32],iconAnchor:[16,16],className:""});
            L.marker([lat,lon],{icon:siteIcon}).addTo(map).bindPopup(`<strong>${site.address||"Subject Site"}</strong><br>${site.area||""}m  ${plan.zone||"Zone TBC"}`);
            leafletMapRef.current=map;
            measureMarkersRef.current=[];
            measurePolysRef.current=[];
          };
          const t=setTimeout(init,80);
          return()=>{clearTimeout(t);if(leafletMapRef.current){leafletMapRef.current.remove();leafletMapRef.current=null;}};
        },[tab,lookupResult]);

        /*  Map click handler: ruler & area measure modes  */
        useEffect(()=>{
          const map=leafletMapRef.current;
          if(!map||typeof window.L==="undefined")return;
          const L=window.L;
          const onClick=(e)=>{
            if(measureMode==="none")return;
            const {lat,lng}=e.latlng;
            setMeasurePoints(prev=>{
              const next=[...prev,{lat,lng}];
              /* Draw marker */
              const mk=L.circleMarker([lat,lng],{radius:5,color:"#e67e22",fillColor:"#e67e22",fillOpacity:1}).addTo(map);
              measureMarkersRef.current.push(mk);
              if(measureMode==="ruler"&&next.length===2){
                /* Draw line */
                const poly=L.polyline([[next[0].lat,next[0].lng],[lat,lng]],{color:"#e67e22",weight:2,dashArray:"5,5"}).addTo(map);
                measurePolysRef.current.push(poly);
                const dist=map.distance([next[0].lat,next[0].lng],[lat,lng]);
                setMeasureResult({type:"distance",value:dist<1000?`${dist.toFixed(1)} m`:`${(dist/1000).toFixed(2)} km`});
                return[]; /* reset for next measurement */
              }
              if(measureMode==="area"&&next.length>=3){
                /* Update polygon */
                measurePolysRef.current.forEach(p=>p.remove());
                measurePolysRef.current=[];
                const coords=next.map(p=>[p.lat,p.lng]);
                const poly=L.polygon(coords,{color:"#6c5ce7",fillColor:"#6c5ce7",fillOpacity:0.2,weight:2}).addTo(map);
                measurePolysRef.current.push(poly);
                /* Area via turf */
                if(window.turf){
                  const tCoords=next.map(p=>[p.lng,p.lat]);
                  tCoords.push(tCoords[0]);
                  const area=window.turf.area(window.turf.polygon([tCoords]));
                  setMeasureResult({type:"area",value:`${area.toFixed(1)} m`});
                }
              }
              return next;
            });
          };
          map.on("click",onClick);
          return()=>map.off("click",onClick);
        },[measureMode]);

        /*
           DOMAIN API (Free Tier): Suburb Statistics
         */
        const fetchDomainData=useCallback(async(suburbName,postcode,key)=>{
          if(!key||!suburbName)return;
          try{
            const q=`${suburbName.toLowerCase().replace(/\s+/g,"%20")}%20VIC%20${postcode}`;
            const r=await fetch(
              `https://api.domain.com.au/v1/suburbPerformanceStatistics/vic/${suburbName.toLowerCase().replace(/\s+/g,"%20")}/${postcode}?propertyCategory=house&bedrooms=3&periodSize=quarters&startingPeriodRelativeToCurrent=1&totalPeriods=4`,
              {headers:{"X-Api-Key":key,"Content-Type":"application/json"},signal:AbortSignal.timeout(10000)}
            );
            if(r.ok){
              const data=await r.json();
              setDomainData({status:"ok",data,source:"Domain Developer API (Free Tier)",ts:new Date().toISOString()});
            }else if(r.status===401){
              setDomainData({status:"auth-error",msg:"Invalid API Key  please check and try again"});
            }else{
              setDomainData({status:"error",msg:`HTTP ${r.status}`});
            }
          }catch(e){setDomainData({status:"error",msg:e.message})}
        },[]);

        /*
           LOCATION ANALYSIS: Extended OSM Amenity Query + Scoring
         */
        const runLocationAnalysis=useCallback(async(lat,lon)=>{
          const distM=(a,b,c,d)=>{
            const dx=(a-c)*111320, dy=(b-d)*111320*Math.cos(a*Math.PI/180);
            return Math.round(Math.sqrt(dx*dx+dy*dy));
          };

          /* Build comprehensive Overpass query (3km radius) */
          const q=`[out:json][timeout:30];(
      node["railway"="station"](around:3000,${lat},${lon});
      node["railway"="halt"](around:3000,${lat},${lon});
      node["railway"="tram_stop"](around:1500,${lat},${lon});
      node["highway"="bus_stop"](around:700,${lat},${lon});
      node["amenity"="school"]["school:level"!~"tertiary"](around:2500,${lat},${lon});
      way["amenity"="school"](around:2500,${lat},${lon});
      node["amenity"="university"](around:5000,${lat},${lon});
      way["amenity"="university"](around:5000,${lat},${lon});
      node["amenity"="kindergarten"](around:1500,${lat},${lon});
      node["shop"="supermarket"](around:2000,${lat},${lon});
      way["shop"="supermarket"](around:2000,${lat},${lon});
      node["shop"="mall"](around:4000,${lat},${lon});
      way["landuse"="retail"](around:2000,${lat},${lon});
      way["leisure"="park"](around:1000,${lat},${lon});
      node["leisure"="pitch"](around:1000,${lat},${lon});
      way["leisure"="pitch"](around:1000,${lat},${lon});
      node["amenity"="hospital"](around:6000,${lat},${lon});
      node["amenity"="doctors"](around:2000,${lat},${lon});
      node["amenity"="pharmacy"](around:1500,${lat},${lon});
      node["amenity"="cafe"](around:800,${lat},${lon});
      node["amenity"="restaurant"](around:800,${lat},${lon});
      node["leisure"="fitness_centre"](around:2000,${lat},${lon});
      node["amenity"="childcare"](around:2000,${lat},${lon});
      node["amenity"="library"](around:2000,${lat},${lon});
      );out body center;`;

          /* Try multiple Overpass mirrors  primary + two fallbacks */
          const _overpassMirrors=[
            "https://overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter",
            "https://overpass.openstreetmap.ru/api/interpreter",
          ];
          let _osmResp=null;
          for(const _mirror of _overpassMirrors){
            try{
              _osmResp=await fetch(`${_mirror}?data=${encodeURIComponent(q)}`,{signal:AbortSignal.timeout(25000)});
              if(_osmResp.ok)break;
            }catch(_e){_osmResp=null;}
          }
          if(!_osmResp||!_osmResp.ok)throw new Error("Location analysis: all Overpass mirrors failed");
          const json=await _osmResp.json();
          const el=json.elements||[];

          const toList=(filter,maxD=9999)=>el
            .filter(filter)
            .map(e=>({
              id:e.id,
              d:distM(lat,lon,e.lat||e.center?.lat||lat,e.lon||e.center?.lon||lon),
              name:e.tags?.name||e.tags?.["name:en"]||"",
              tags:e.tags||{},
            }))
            .filter(x=>x.d<=maxD)
            .sort((a,b)=>a.d-b.d);

          const loc={
            trains:     toList(e=>["station","halt"].includes(e.tags?.railway),3000),
            trams:      toList(e=>e.tags?.railway==="tram_stop",1500),
            buses:      toList(e=>e.tags?.highway==="bus_stop",700),
            schools:    toList(e=>e.tags?.amenity==="school",2500),
            unis:       toList(e=>e.tags?.amenity==="university",5000),
            kinders:    toList(e=>e.tags?.amenity==="kindergarten",1500),
            supermarkets:toList(e=>e.tags?.shop==="supermarket",2000),
            parks:      toList(e=>e.tags?.leisure==="park",1000),
            hospitals:  toList(e=>e.tags?.amenity==="hospital",6000),
            doctors:    toList(e=>e.tags?.amenity==="doctors",2000),
            pharmacies: toList(e=>e.tags?.amenity==="pharmacy",1500),
            cafes:      toList(e=>e.tags?.amenity==="cafe",800),
            restaurants:toList(e=>e.tags?.amenity==="restaurant",800),
            gyms:       toList(e=>e.tags?.leisure==="fitness_centre",2000),
            childcare:  toList(e=>e.tags?.amenity==="childcare",2000),
            libraries:  toList(e=>e.tags?.amenity==="library",2000),
          };

          /*  Location Score (0-100)  */
          let score=0, breakdown={};

          // Transport (30 pts)
          const td=loc.trains[0]?.d||9999;
          const tPts=td<=400?30:td<=800?23:td<=1200?15:td<=2000?7:0;
          const tramBonus=loc.trams.some(t=>t.d<=600)?4:0;
          const busPts=loc.buses.some(b=>b.d<=300)?3:loc.buses.some(b=>b.d<=500)?1:0;
          breakdown.transport={score:Math.min(30,tPts+tramBonus+busPts),max:30,
            detail:`Train: ${td<=9000?td+"m":"none"}  ${loc.trams.length} tram stop(s)  ${loc.buses.length} bus stop(s)`};

          // Education (20 pts)
          const sd=loc.schools[0]?.d||9999;
          const sPts=sd<=600?12:sd<=1000?9:sd<=1500?5:sd<=2500?2:0;
          const uniBonus=loc.unis.length?3:0;
          const kindBonus=loc.kinders.length?3:0;
          breakdown.education={score:Math.min(20,sPts+uniBonus+kindBonus),max:20,
            detail:`${loc.schools.length} school(s)  ${loc.unis.length} uni(s)  ${loc.kinders.length} kinder(s)`};

          // Shopping (20 pts)
          const supD=loc.supermarkets[0]?.d||9999;
          const shPts=supD<=400?20:supD<=800?15:supD<=1200?9:supD<=2000?4:0;
          breakdown.shopping={score:shPts,max:20,
            detail:`${loc.supermarkets.length} supermarket(s), nearest ${supD<=9000?supD+"m":"none"}`};

          // Lifestyle (15 pts)
          const pD=loc.parks[0]?.d||9999;
          const pPts=pD<=400?7:pD<=700?5:pD<=1000?2:0;
          const cafePts=loc.cafes.length>=8?5:loc.cafes.length>=4?3:loc.cafes.length>=1?1:0;
          const gymPts=loc.gyms.length?3:0;
          breakdown.lifestyle={score:Math.min(15,pPts+cafePts+gymPts),max:15,
            detail:`${loc.parks.length} park(s)  ${loc.cafes.length} caf(s)  ${loc.restaurants.length} restaurant(s)`};

          // Health (15 pts)
          const hD=loc.hospitals[0]?.d||9999;
          const hPts=hD<=2000?7:hD<=4000?4:hD<=6000?2:0;
          const drPts=loc.doctors.some(d=>d.d<=800)?5:loc.doctors.some(d=>d.d<=1500)?3:0;
          const phPts=loc.pharmacies.some(p=>p.d<=600)?3:0;
          breakdown.health={score:Math.min(15,hPts+drPts+phPts),max:15,
            detail:`${loc.hospitals.length} hospital(s)  ${loc.doctors.length} GP clinic(s)  ${loc.pharmacies.length} pharmacy(ies)`};

          score=Object.values(breakdown).reduce((s,x)=>s+x.score,0);
          const label=score>=80?"Premium Location":score>=65?"Good Location":score>=50?"Average Location":score>=35?"Below Average":"Remote / Poor Access";

          return{...loc,score,label,breakdown};
        },[]);

        /*  SITE INVESTIGATION: ELEVATION + OSM  */
        const runSiteInvestigation=useCallback(async()=>{
          if(!lookupResult||!lookupResult.lat){addToast(" Search for a property address first (top of page)","warn");return;}
          const {lat,lon,postcode,suburb}=lookupResult;
          setSiteInv({status:"loading",msg:"Fetching terrain data",elev:null,osm:null});
          try{

          /*  1. Elevation via OpenTopoData (SRTM 30m) with open-elevation.com fallback  */
          let elevData=null;
          const d=0.000225; // ~25m offset
          const pts=[
            [lat,lon],
            [lat+d,lon],[lat-d,lon],[lat,lon+d],[lat,lon-d],
            [lat+d*2,lon],[lat-d*2,lon],[lat,lon+d*2],[lat,lon-d*2],
          ];
          const parseElevResponse=(json)=>{
            /* Handles both OpenTopoData {status,results:[{elevation}]} and open-elevation {results:[{elevation}]} */
            const results=json.results||[];
            if(!results.length)return null;
            const elevs=results.map(r=>r.elevation||0);
            const ctr=elevs[0];
            const sNS=(elevs[1]-elevs[2])/(2*25)*100;
            const sEW=(elevs[4]-elevs[3])/(2*25)*100;
            const sNS2=(elevs[5]-elevs[6])/(4*25)*100;
            const sEW2=(elevs[8]-elevs[7])/(4*25)*100;
            const avgNS=(sNS+sNS2)/2, avgEW=(sEW+sEW2)/2;
            const maxSlope=Math.sqrt(avgNS**2+avgEW**2);
            const aspects=[];
            if(avgNS<-0.5)aspects.push("Falls south");else if(avgNS>0.5)aspects.push("Falls north");
            if(avgEW<-0.5)aspects.push("Falls west");else if(avgEW>0.5)aspects.push("Falls east");
            const aspect=aspects.length?aspects.join(" + "):"Essentially flat";
            const category=maxSlope<2?"Flat (<2%  ideal)":maxSlope<5?"Gentle (25%  good)":maxSlope<10?"Moderate (510%  +$3060K site works)":"Steep (>10%  +$80K+ site works)";
            const categoryColor=maxSlope<2?C.accent:maxSlope<5?C.teal:maxSlope<10?C.gold:C.warn;
            return{elevs,ctr,maxSlope,aspect,category,categoryColor,sNS:avgNS,sEW:avgEW};
          };
          /* Try primary: OpenTopoData SRTM30m */
          try{
            const elvResp=await fetch(
              `https://api.opentopodata.org/v1/srtm30m?locations=${pts.map(p=>p.join(",")).join("|")}`,
              {signal:AbortSignal.timeout(10000)}
            );
            if(elvResp.ok){
              const elvJson=await elvResp.json();
              if(elvJson.status==="OK"||elvJson.results?.length)elevData=parseElevResponse(elvJson);
            }
          }catch(e1){/* primary timed out, fall through */}
          /* Fallback: open-elevation.com POST (more reliable CORS, different rate limits) */
          if(!elevData){
            try{
              const payload={locations:pts.map(p=>({latitude:p[0],longitude:p[1]}))};
              const elvResp2=await fetch("https://api.open-elevation.com/api/v1/lookup",{
                method:"POST",
                headers:{"Content-Type":"application/json","Accept":"application/json"},
                body:JSON.stringify(payload),
                signal:AbortSignal.timeout(12000),
              });
              if(elvResp2.ok){
                const elvJson2=await elvResp2.json();
                elevData=parseElevResponse(elvJson2);
              }
            }catch(e2){/* fallback also failed */}
          }
          if(!elevData)elevData={error:"Terrain data unavailable  both elevation services timed out. Try again or check your internet connection."};

          setSiteInv(s=>({...s,msg:"Querying nature strip features",elev:elevData}));

          /*  2. OSM Overpass: trees + poles + powerlines (with mirror fallback)  */
          let osmData=null;
          try{
            const q=`[out:json][timeout:25];(
      node["natural"="tree"](around:80,${lat},${lon});
      node["power"="pole"](around:70,${lat},${lon});
      node["power"="tower"](around:120,${lat},${lon});
      way["power"="line"](around:100,${lat},${lon});
      way["power"="minor_line"](around:80,${lat},${lon});
      node["highway"="street_lamp"](around:80,${lat},${lon});
      node["amenity"="post_box"](around:100,${lat},${lon});
      way["building"](around:200,${lat},${lon});
      );out body;`;
            /* Try multiple Overpass mirrors in order; first success wins */
            const overpassMirrors=[
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.openstreetmap.ru/api/interpreter",
            ];
            let osmResp=null;
            for(const mirror of overpassMirrors){
              try{
                osmResp=await fetch(`${mirror}?data=${encodeURIComponent(q)}`,{signal:AbortSignal.timeout(18000)});
                if(osmResp.ok)break;
              }catch(mirrorErr){osmResp=null;/* try next mirror */}
            }
            if(!osmResp||!osmResp.ok)throw new Error("All Overpass mirrors failed");
            const osmJson=await osmResp.json();
            const elements=osmJson.elements||[];

            /* distance from address centre */
            const dist=(a,b,c,dd)=>Math.round(Math.sqrt(((a-c)*111320)**2+((b-dd)*111320*Math.cos(a*Math.PI/180))**2));

            const trees=elements.filter(e=>e.type==="node"&&e.tags?.natural==="tree").map(e=>({
              id:e.id,d:dist(lat,lon,e.lat,e.lon),
              species:e.tags?.["species:en"]||e.tags?.species||e.tags?.["name:en"]||e.tags?.name||"Unknown species",
              height:e.tags?.height||e.tags?.est_height||"",
              diameter:e.tags?.diameter_crown||"",
              circumference:e.tags?.circumference||"",
              denotation:e.tags?.denotation||"",
              lat:e.lat,lon:e.lon,
            })).sort((a,b)=>a.d-b.d);

            const poles=elements.filter(e=>e.type==="node"&&(e.tags?.power==="pole")).map(e=>({
              id:e.id,d:dist(lat,lon,e.lat,e.lon),material:e.tags?.material||"",lat:e.lat,lon:e.lon
            })).sort((a,b)=>a.d-b.d);

            const towers=elements.filter(e=>e.type==="node"&&e.tags?.power==="tower").map(e=>({
              id:e.id,d:dist(lat,lon,e.lat,e.lon),lat:e.lat,lon:e.lon
            }));

            const powerLines=elements.filter(e=>e.type==="way"&&(e.tags?.power==="line"||e.tags?.power==="minor_line"));
            const streetLamps=elements.filter(e=>e.type==="node"&&e.tags?.highway==="street_lamp").length;

            // Nature strip trees: within 30m, likely road-facing
            // P0.2: canonical field name is "natureStripTrees" (was "naturStripTrees"  typo fixed)
            const natureStripTrees=trees.filter(t=>t.d<=35);
            const gardenTrees=trees.filter(t=>t.d>35&&t.d<=80);

            /* Task 34  Neighbourhood intensity from building footprint count (200m radius) */
            const nearbyBuildings=elements.filter(e=>e.type==="way"&&e.tags?.building&&e.tags.building!=="no").length;
            const neighbourIntensity=nearbyBuildings<8?"sparse":nearbyBuildings<25?"medium":"dense";

            osmData={trees,natureStripTrees,gardenTrees,poles,towers,powerLines,streetLamps,nearbyBuildings,neighbourIntensity,raw:elements.length};
          }catch(e){osmData={error:"OSM query failed: "+(e.message||"timeout")}}

          /*  3. Build comparable sales search URLs  */
          /* Strip CJK and encode safely for URL slugs */
          const subEn=(suburb||"").replace(/[\u4e00-\u9fff\u3040-\u30ff\uff00-\uffef]+/g,"").trim();
          /* URL encoding fix: strip non-alphanumeric/space then encode cleanly \u2014 prevents mobile link breakage */
          const subSafe=subEn.toLowerCase().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();
          const subSlug=subSafe.replace(/\s+/g,"-");
          const subPlus=subSafe.replace(/\s+/g,"+");
          const pc=postcode||"";
          const salesLinks=[
            {site:"Domain.com.au",icon:"",
              url:`https://www.domain.com.au/sold-listings/${subSlug}-vic-${pc}/?property-type=house&bedrooms=3-5`,
              note:"Filter Sold, set Last 6 months, filter by Land size 4001,200m"},
            {site:"REA Recent Sales",icon:"",
              url:`https://www.realestate.com.au/sold/property-house-vic-${subPlus}/list-1?channel=sold`,
              note:"Filter Sold, set Last 6 months, sort by Land size"},
            {site:"Property.com.au",icon:"",
              url:`https://www.property.com.au/sold-properties/${subSlug}-vic-${pc}/`,
              note:"Includes free market reports and recent sales distribution"},
            {site:"Homely.com.au",icon:"",
              url:`https://www.homely.com.au/real-estate/${subSlug}-vic-${pc}`,
              note:"Community ratings + recent sales including land size"},
            {site:"OnTheHouse (Free Valuation)",icon:"",
              url:`https://onthehouse.com.au/property/vic/${subSlug}/${pc}`,
              note:"Free historical sale prices  search the subject address directly"},
            {site:"PropertyValue.com.au",icon:"",
              url:`https://propertyvalue.com.au/?suburb=${subPlus}&state=VIC`,
              note:"Free property estimate + recent nearby sales with map view"},
            {site:"Pricefinder (Free Mode)",icon:"",
              url:`https://www.pricefinder.com.au/search#suburb=${subPlus}&state=VIC&postcode=${pc}`,
              note:"Historical sales map  some data free"},
            {site:"Valuer-General VIC (Official)",icon:"",
              url:`https://www.land.vic.gov.au/valuations/resources-and-reports/property-sales-statistics`,
              note:"Official VIC Valuer-General quarterly sales data  Excel download, authoritative source"},
          ];

          setSiteInv(s=>({...s,msg:"Analysing nearby amenities",elev:elevData,osm:osmData}));

          /*  4. Location Analysis (parallel to elevation, run concurrently)  */
          let locData=null;
          try{
            locData=await runLocationAnalysis(lat,lon);
          }catch(e){locData={error:"Location analysis failed: "+e.message}}

          setSiteInv({status:"done",msg:"",elev:elevData,osm:osmData,loc:locData,salesLinks,suburb,postcode:pc,lat,lon});
          }catch(fatalErr){
            /* Top-level safety net  prevents uncaught promise rejection causing white screen */
            console.error("[SiteInv] Fatal error:",fatalErr);
            setSiteInv({status:"error",msg:"Site investigation failed: "+fatalErr.message+". Please retry.",elev:null,osm:null,loc:null});
            addToast(" Site investigation error: "+fatalErr.message,"error",8000);
          }
        },[lookupResult,runLocationAnalysis]);

        /* Auto-calcs */
        /* Bug #3 fix: pass isOTP + buildCost so OTP concession actually reduces stamp duty.
           Build cost estimate for OTP = buildCostPSM  buildArea, or 60% of price if not entered. */
        const autoSD=useMemo(()=>{
          const price=parseNum(fin.landPrice);
          const buildEst=parseNum(fin.buildArea)&&parseNum(fin.buildCostPSM)
            ?parseNum(fin.buildArea)*parseNum(fin.buildCostPSM)
            :fin.isOTP?price*0.60:0; /* fallback: 60% of contract price = construction */
          return calcVicStampDuty(price,fin.isForeign,fin.isOTP,buildEst);
        },[fin.landPrice,fin.isForeign,fin.isOTP,fin.buildArea,fin.buildCostPSM]);
        const autoOS=useMemo(()=>{
          const sub=MEL_SUBURBS[selSuburb];
          const rate=sub?(COUNCIL_DB[sub.council]?.openSpace||0.05):0.05;
          return Math.round(parseNum(fin.landPrice)*rate);
        },[fin.landPrice,selSuburb]);
        /* Auto-estimates for professional fees  use as references only */
        /* Weighted build cost from area breakdown (Living 100% / Garage 65% / Balcony 40%) */
        const calcBuildCost=useMemo(()=>{
          const psm=parseNum(fin.buildCostPSM);
          if(!psm)return{total:0,breakdown:false,effArea:0};
          const living=parseNum(fin.areaLiving);
          const garage=parseNum(fin.areaGarage);
          const balcony=parseNum(fin.areaBalcony);
          const hasBreakdown=living>0||garage>0||balcony>0;
          if(hasBreakdown){
            const cost=living*psm + garage*psm*0.65 + balcony*psm*0.40;
            const effArea=living + garage*0.65 + balcony*0.40; // effective m at full rate
            return{total:Math.round(cost),breakdown:true,living,garage,balcony,effArea,
              costLiving:Math.round(living*psm),
              costGarage:Math.round(garage*psm*0.65),
              costBalcony:Math.round(balcony*psm*0.40)};
          }
          const fallback=parseNum(fin.buildArea);
          return{total:Math.round(psm*fallback),breakdown:false,effArea:fallback};
        },[fin.buildCostPSM,fin.areaLiving,fin.areaGarage,fin.areaBalcony,fin.buildArea]);

        const autoDBI=useMemo(()=>{
          /* DBI: ~0.7% of base construction cost (VBA mandatory warranty insurance) */
          const bc=calcBuildCost.total||parseNum(fin.buildCostPSM)*parseNum(fin.buildArea);
          return bc>0?Math.round(bc*0.007):0;
        },[calcBuildCost.total,fin.buildCostPSM,fin.buildArea]);
        const autoQS=useMemo(()=>{
          /* QS monthly monitoring: $1,200/month  construction months (drawdown stage only) */
          const constructMonths=Math.max(6,Math.round((parseNum(str.projectMonths)||30)*0.5));
          return constructMonths*1200;
        },[str.projectMonths]);

        /* Core financials */
        const calc=useMemo(()=>{
          const land=parseNum(fin.landPrice)+parseNum(fin.stampDuty)+parseNum(fin.legalFees);
          const baseSoft=parseNum(fin.architectFees)+parseNum(fin.townPlannerFees)+parseNum(fin.buildingSurveyorFees)
            +parseNum(fin.structuralGeoFees)+parseNum(fin.energyEsdFees)+parseNum(fin.surveyFees)
            +parseNum(fin.councilFees)+parseNum(fin.consultantFees)
            +parseNum(fin.openSpaceContrib)+parseNum(fin.infraContrib)
            +parseNum(fin.devFee) // #34: Developer/PM Fee
            +parseNum(fin.phase1ESA)+parseNum(fin.planOfSubdiv); /* absenteeOwner handled via auto-calc below */
          /* Provisional sums  auto-injected from site conditions */
          const soilPS={M:15000,H:40000,P:80000}[conds.soilClass]||0;
          /* Rock excavation provisional sum  Melbourne basalt / sandstone bands
             R1 Occasional fragments (Heidelberg, Donvale): +$25,000
             R2 Significant seam / prevalent basalt (Templestowe, Eltham, Research): +$65,000
             R3 Massive rock / blasting likely (Kangaroo Ground, Hurstbridge, upper Yarra): +$120,000 */
          const rockPS={R1:25000,R2:65000,R3:120000}[conds.rockGrade]||0;
          const slopeRaw=conds.slopeClass==="auto"&&siteInv?.elev&&!siteInv.elev.error
            ?(siteInv.elev.maxSlope>=10?"steep":siteInv.elev.maxSlope>=5?"moderate":siteInv.elev.maxSlope>=2?"slight":"flat")
            :(conds.slopeClass||"flat");
          const maxSlopeVal=siteInv?.elev&&!siteInv.elev.error?siteInv.elev.maxSlope:
            (slopeRaw==="steep"?14:slopeRaw==="moderate"?7:slopeRaw==="slight"?3:0);
          /*  Tiered site-works cost matrix (Melbourne 2026 market rates)
             Flat (<2%)    : $20/m  1.0   basic site preparation only
             Slight (25%) : $60/m  1.0   basic cut/fill
             Moderate (510%): $150/m 1.2   retaining walls required
             Steep (>10%)  : $350/m 1.5   structural engineering + major retaining
             Soil-class modifier: Class M 1.0 | Class H 1.3 | Class P 1.5          */
          const siteAreaFull=parseNum(site?.area||"0");
          /* Bug #2 fix: slope earthworks affect WHOLE site during excavation  use full lot area as base.
             GFA/buildArea is for construction cost only; earthworks cost is site-wide. */
          const siteAreaM2=siteAreaFull||parseNum(fin.buildArea)||parseNum(plan.buildableArea)||0;
          /* Non-linear slope: for steep sites (>10), each extra 1% of slope adds 1.15 compound
             e.g. 12%$3501.15=$463/m  15%$3501.15=$704/m  20%$3501.15=$1,416/m
             Source: Rawlinsons 2025 Melbourne site works table  exponential due to structural retaining */
          const _slopeBaseRate={flat:20,slight:60,moderate:150,steep:350}[slopeRaw]||20;
          const _slopeExponent=(slopeRaw==='steep'&&maxSlopeVal>10)
            ?Math.pow(1.15,Math.min(maxSlopeVal-10,15))  /* cap at 25% slope to avoid runaway */
            :1.0;
          const SLOPE_RATE=Math.round(_slopeBaseRate*_slopeExponent);
          const SLOPE_COMPLEXITY={flat:1.0,slight:1.0,moderate:1.2,steep:1.5}[slopeRaw]||1.0;
          const SOIL_FACTOR={M:1.0,H:1.3,P:1.5}[conds.soilClass]||1.0;
          const slopePS=Math.round(siteAreaM2*SLOPE_RATE*SLOPE_COMPLEXITY*SOIL_FACTOR);
          /* Driveway deduction: shared access corridor for multi-unit sites
             Cl.52.06 requires min 3.0m single / 5.5m double driveway. Use 3.2m typical.
             Depth estimated from site.depth or approximated as sqrt(area)*1.2 (rectangular assumption) */
          const estUnitsForDrive=parseNum(plan.estUnits)||parseNum(market.grvUnits)||1;
          const lotDepthEst=parseNum(site.depth)||Math.round(Math.sqrt(siteAreaFull||0)*1.2);
          const drivewaySqm=(estUnitsForDrive>1&&lotDepthEst>0)
            ?Math.round(3.2*lotDepthEst)   /* 3.2m wide  lot depth */
            :0;
          /* Note: TPZ encroachment is computed later (after elevOK/osmTreeCount are available)
             and applied in the returned effectiveBuildableArea via the formula below.
             We keep a base value here; the final is recalculated in the return statement. */
          const effectiveBuildableArea=Math.max(0,(parseNum(plan.buildableArea)||0)-drivewaySqm);
          /* Retaining wall depth estimate: if slope > 5% and site > 400m, cut depth likely > 1m */
          const retainingWallRisk=maxSlopeVal>=5&&siteAreaFull>=400;
          const boePS=plan.hasEasementBoe?3000:0;
          /* BAL (Bushfire Attack Level) construction uplift  tiered by AS 3959 rating (NCC Section 3)
             BAL-12: Ember attack only  standard construction, no uplift
             BAL-19: Ember + radiant heat  ember-proof vents, additional sealing ~$10k
             BAL-29: Higher radiant heat  metal framing, toughened glass, ~$18k
             BAL-40: Extreme radiant heat  non-combustible cladding, upgraded glazing ~$28k
             FZ (Flame Zone): Direct flame contact  concrete/steel construction ~$45k
             Source: ABCB NCC 2022 Section 3, CFA BAL assessment pathway */
          const BAL_PS={"BAL-12":0,"BAL-19":12000,"BAL-29":22000,"BAL-40":38000,"FZ":65000};
          const balRatingKey=conds.balRating||"";
          const balPS=conds.bushfireProne
            ?(BAL_PS[balRatingKey]??18000)  /* default BAL-29 if rating not specified */
            :0;
          const adjSoftPS=conds.adjNorthPOS?2000:0;
          const habWindowPS=conds.adjHabitableWindow?(parseNum(conds.habWindowCount)||1)*800:0;
          /*  OSM auto-detected provisional sums
             Power lines detected  undergrounding est. $35,000 (midpoint $25k$50k)  Hard Cost
             Nature strip trees detected  arborist report est. $3,500$6,000  Soft Cost */
          const osmOK=siteInv?.status==="done"&&siteInv?.osm&&!siteInv?.osm?.error;
          const powerLinePS=osmOK&&siteInv.osm.powerLines?.length>0?35000:0;
          // P0.1: use canonical getNatureStripTrees() accessor
          const _osmTrees=osmOK?getNatureStripTrees(siteInv.osm):[];
          const treeReportPS=_osmTrees.length>0?(_osmTrees.length>5?6000:3500):0;
          const osmTreeCount=_osmTrees.length;
          const osmLineCount=osmOK?siteInv.osm.powerLines?.length||0:0;
          /* Bug #1 fix: unified council name  always from selSuburb or Nominatim lookup */
          const councilNameCalc=MEL_SUBURBS[selSuburb]?.council||lookupResult?.council||"";
          /* VCAT Contingency: HO + VPO together  highest planning friction  $15k legal reserve in soft costs */
          const vcatPS=(plan.hasHO&&plan.hasVPO)?15000:0;
          /* CHMP: Cultural Heritage Management Plan  auto-triggered by Aboriginal Overlay */
          const chmpPS=plan.hasAboriginal&&!parseNum(fin.consultantFees)?12000:0; // ~$5K$30K; mid-estimate $12K provisional sum
          /* Council schedule rules: auto-inject council-specific soft costs */
          const councilRule=getCouncilRule(councilNameCalc,plan.zone);
          const councilRulesPS=councilRule.softPS||0;
          const councilOverlayHint=councilRule.hint||"";
          /* Growth Area Infrastructure Levy */
          const growthLevyResult=calcGrowthLevy(councilNameCalc,parseNum(site.area));
          const growthLevyPS=growthLevyResult.found?growthLevyResult.levy:0;
          /* Parking construction cost: based on type  spaces */
          const PARKING_COST_PER={"on-grade":10000,"semi-basement":45000,"full-basement":72000};
          const parkingSpaces=parseNum(conds.parkingSpaces)||0;
          const parkingPS=parkingSpaces>0?(PARKING_COST_PER[conds.parkingType]||8000)*parkingSpaces:0;
          /* FIRB: Foreign Acquirer Duty + application fee (auto-injected into soft costs) */
          const frbPrice=parseNum(fin.landPrice);
          const firbFee=fin.isForeign&&frbPrice>0?(()=>{
            /* FIRB application fee tiers (FIRB 2024-25)  FLAT fee per price bracket (NOT cumulative):
               $75K: $4,200 | $1M: $14,100 | $2M: $28,200 | $3M: $56,400
               $4M: $84,600 | $5M: $112,800 | >$5M: $141,000+
               Source: firb.gov.au/apply-for-approval/fees */
            if(frbPrice<=75000)    return 4200;
            if(frbPrice<=1000000)  return 14100;
            if(frbPrice<=2000000)  return 28200;
            if(frbPrice<=3000000)  return 56400;
            if(frbPrice<=4000000)  return 84600;
            if(frbPrice<=5000000)  return 112800;
            return Math.round(112800+Math.ceil((frbPrice-5000000)/1000000)*28200);
          })():0;
          /* Builder's margin + market risk premium (separate from trades PSM) */
          const builderMarginPct=(parseNum(params.builderMarginPct)||0)/100;
          const marketRiskPct=(parseNum(params.marketRiskPct)||0)/100;
          const buildCostBase=calcBuildCost.total||Math.round(parseNum(fin.buildCostPSM)*parseNum(fin.buildArea));
          const builderMarginAmt=Math.round(buildCostBase*builderMarginPct);
          const marketRiskAmt=Math.round(buildCostBase*marketRiskPct);
          /* Land tax auto-estimate (VIC non-PPR, site value proxy = landPrice) */
          const holdingYears=parseNum(str.projectMonths)/12||2;
          const siteValue=parseNum(fin.landPrice)||0;
          /* VIC SRO land tax  delegated to pure calcVicSROLandTax() (Console-testable)
             e.g. in Console: calcVicSROLandTax(1200000, 2)  $4,075 */
          const autoLandTax=calcVicSROLandTax(siteValue,holdingYears);
          /* Absentee Owner Surcharge auto-calc  VIC SRO 2024-25: 2% p.a. of site value
             Triggered by checkbox in Site Conditions / Financial tab */
          const autoAbsenteePS=conds.absenteeOwnerAuto&&siteValue>0?Math.round(siteValue*0.02*holdingYears):0;
          /* Trust Surcharge  additional 0.5% p.a. for eligible trusts (VIC SRO) */
          const autoTrustPS=conds.trustHolderAuto&&siteValue>0?Math.round(siteValue*0.005*holdingYears):0;
          /* Re-establishment survey PS  required for any subdivision (multi-lot titles) */
          const reSurveyPS=(parseNum(plan.estUnits)||1)>1&&!parseNum(fin.surveyFees)?4500:0;
          /* Effective absentee/trust: use auto unless user has manually entered fin.absenteeOwner */
          /* effectiveAbsentee: if user entered manual amount AND auto is off, use manual; if auto on, use auto */
          const effectiveAbsentee=(!conds.absenteeOwnerAuto&&!conds.trustHolderAuto)?parseNum(fin.absenteeOwner):0; // manual only when auto is off
          /* Structural engineer consultation  when survey shows contour range > 1.5m, retaining walls likely require
             structural certification under Building Regulations 2018 cl 152. $3,000 provisional design fee. */
          const contourStructuralPS=(()=>{const cr=parseFloat(site.contourRange||0);return cr>1.5?3000:0;})();
          const soft=baseSoft+effectiveAbsentee+(autoAbsenteePS+autoTrustPS)+adjSoftPS+boePS+treeReportPS+vcatPS+chmpPS+councilRulesPS+growthLevyPS+firbFee+reSurveyPS+contourStructuralPS;
          /* Low-point drainage detection: if lot center is >30cm below surrounding average  pump pit required */
          const elevOK=siteInv?.elev&&!siteInv.elev.error&&Array.isArray(siteInv.elev.elevs)&&siteInv.elev.elevs.length>=5;
          const drainageSinkPS=(()=>{
            if(!elevOK)return 0;
            const e=siteInv.elev.elevs;
            const surroundAvg=(e[1]+e[2]+e[3]+e[4])/4;
            return e[0]<surroundAvg-0.30?25000:0; // >30cm depression  charged stormwater / pump pit
          })();
          /* Build cost: use area-breakdown calc if breakdown entered, else fallback to PSM  area */
          const buildCostTotal=calcBuildCost.total||Math.round(parseNum(fin.buildCostPSM)*parseNum(fin.buildArea));
          /* NCC 2022 7-star energy compliance uplift  per dwelling, by build type */
          const ncc2022On=fin.ncc2022!=="off";
          const nccUpliftPerDwelling=(()=>{
            if(!ncc2022On)return 0;
            const NCC_UPLIFT={"dual-occ":8000,"std-th":10000,"med-th":11000,"prem-th":12000,"low-apt":13000,"mid-apt":15000};
            return NCC_UPLIFT[params.buildType]||0;
          })();
          const dwellingsForNCC=parseNum(market.grvUnits)||parseNum(plan.estUnits)||1;
          const nccUpliftTotal=nccUpliftPerDwelling*dwellingsForNCC;
          /* Material cost escalation (if project start deferred  Rawlinsons annual escalation ~48%) */
          const escalationPct=(parseNum(fin.escalationPct)||0)/100;
          const escalationAmt=Math.round(buildCostTotal*escalationPct);
          /*  TPZ Footprint Encroachment
             Tree Protection Zone (TPZ) = 12  DBH (diameter at breast height).
             OSM rarely has DBH; we use conservative defaults by tree presence & VPO:
               VPO significant tree (DBH ~600mm+): TPZ radius ~7.2m, footprint ~163m
               Nature-strip / standard tree (DBH ~300mm):  TPZ radius ~3.6m, footprint ~41m
             Only the fraction overlapping the buildable zone matters  conservatively 4060%.
             This encroachment is subtracted from effectiveBuildableArea for layout planning.
             NOTE: treeReportPS covers arborist cost. This is the AREA impact, not the cost. */
          const tpzEncroachSqm=(()=>{
            if(osmTreeCount===0)return 0;
            /* If VPO is flagged, at least one is significant (DBH 600mm+ assumed) */
            const sigTrees=plan.hasVPO?Math.max(1,Math.floor(osmTreeCount*0.5)):0;
            const stdTrees=osmTreeCount-sigTrees;
            /* Conservative overlap fraction: 45% of TPZ circle intersects buildable area */
            const sigArea=sigTrees*Math.round(Math.PI*7.2*7.2*0.45); // ~74m per significant tree
            const stdArea=stdTrees*Math.round(Math.PI*3.6*3.6*0.45); // ~18m per standard tree
            return Math.round(sigArea+stdArea);
          })();
          /*  North Light Shadowing Risk
             E-W oriented lots have longer north/south walls, which means neighbours to
             the north can block winter sun to habitable rooms (ResCode B17 compliance risk).
             sNS: positive = rises northward = lot falls south = N-S slope dominant
             sEW: positive = rises eastward
             If |sEW| > |sNS|  1.3  lot is predominantly E-W oriented  shadowing risk HIGH */
          const northLightRisk=(()=>{
            if(!elevOK)return "unknown";
            const sNS=Math.abs(siteInv.elev.sNS||0);
            const sEW=Math.abs(siteInv.elev.sEW||0);
            if(sNS<0.3&&sEW<0.3)return "flat"; /* essentially flat  orientation uncertain */
            if(sEW>sNS*1.3)return "high"; /* E-W dominated  shadowing constraint likely */
            if(sNS>sEW*1.3)return "low";  /* N-S dominated  street frontage helps light */
            return "moderate"; /* mixed orientation */
          })();
          /*  Subdivision Suitability (Frontage-based layout indicator)
             Melbourne ResCode cl.52.06: min 3.5m accessway width for 3 vehicles
             Frontage thresholds (per standard practice):
               <15.2m  Tandem only (front-rear arrangement; cannot fit two side-by-side GBLs)
               15.218m  Potential side-by-side (council & DDO dependent)
               >18m  Prime side-by-side (twin GBL or double-frontage subdivision) */
          const frontageM=parseNum(site?.frontage)||0;
          const subdivSuitability=frontageM<=0?"unknown"
            :frontageM<15.2?"tandem"
            :frontageM<18?"potential-sbs"
            :"prime-sbs";
          /* Tandem surcharge: extended shared driveway run (~2025m vs 8m) + extra services trenching
             Industry benchmark: +$15K$22K vs equivalent side-by-side for same unit count */
          const tandemPS=(subdivSuitability==="tandem"&&(parseNum(plan.estUnits)||1)>1)?18000:0;
          /*  Gravity Drainage Risk
             sNS > 0  site elevation rises northward = FALLS SOUTH (toward street) = gravity-OK
             sNS < 0  site elevation falls northward = FALLS NORTH (toward rear)
             If significant rear fall + no registered rear easement  pump system likely needed
             (Pump pit + stormwater management: $10K$15K add-on) */
          const gravDrainRisk=(()=>{
            if(!elevOK)return "unknown";
            const sNS=siteInv.elev.sNS||0;
            const fallsToRear=sNS<-1.0; /* negative sNS = falls north/rear by >1% grade */
            const hasEasement=plan.hasEasementBoe||false;
            if(fallsToRear&&!hasEasement)return "pump-risk";
            if(fallsToRear&&hasEasement)return "easement-check"; /* rear easement may allow gravity drain */
            if(sNS>1.0)return "gravity-ok"; /* falls toward street = ideal natural drainage */
            return "neutral";
          })();
          /* Pump system PS only if gravity risk AND not already flagged by low-point detection */
          const pumpSystemPS=(gravDrainRisk==="pump-risk"&&drainageSinkPS===0)?12000:0;
          /*  Driveway Concrete Pavement PS
             Tandem multi-unit layouts require a full-length concrete drive corridor.
             drivewaySqm (3.2m  lot depth) already deducted from buildable area above.
             Here we cost it: RC concrete driveway ~$200/m (Melbourne 2026 benchmark).
             Captured as a separate PS so it's not silently omitted when user leaves
             fin.externals blank on quick assessments. */
          const drivewayConcretPS=(subdivSuitability==="tandem"&&drivewaySqm>0&&(parseNum(plan.estUnits)||1)>1)
            ?Math.round(drivewaySqm*200):0;
          /*  Slope-Structural Factor
             slopePS above = earthworks (cut/fill/retaining). This is a SEPARATE cost:
             >8% gradient sites need engineered footings, stepped RC slabs, or cantilever
             framing  typically +58% on build cost (AS 3600; Boral steep-site guidelines).
             Uses 6% uplift on buildCostTotal. Only triggered when elevation data available. */
          const slopeStructuralPS=(elevOK&&maxSlopeVal>8)?Math.round(buildCostTotal*0.06):0;
          /* Building Permit Levy  VIC DTP 2024-25: 0.141% of construction cost (mandatory)
             Only auto-injects if user hasn't already entered in dbi/serviceConn fields.
             Source: Building Act 1993 s205ZZS; rate reviewed annually Jan 1 */
          const buildPermitLevy=buildCostTotal>0?Math.round(buildCostTotal*0.00141):0;
          const baseHard=parseNum(fin.demolition)+buildCostTotal+escalationAmt+builderMarginAmt+marketRiskAmt
            +parseNum(fin.siteWorks)+parseNum(fin.serviceConn)+parseNum(fin.externals)+parseNum(fin.dbi)
            +soilPS+slopePS+rockPS+balPS+habWindowPS+powerLinePS+drainageSinkPS+nccUpliftTotal+parkingPS
            +tandemPS+pumpSystemPS+drivewayConcretPS+slopeStructuralPS+buildPermitLevy;
          const contingencyAmt=parseNum(fin.contingency)>0?parseNum(fin.contingency):Math.round(baseHard*(parseNum(fin.contingencyPct)/100));
          const hard=baseHard+contingencyAmt;
          /* S-Curve Construction Loan Interest Auto-Calc:
             Land Loan  100% utilisation for full term
             Construction Loan  average 55% utilisation (Base/Frame/Lock-up/Fixing progressive drawdown)
             Only used when user has NOT manually entered a loan interest figure */
          const lvr=parseNum(str.lvrPct)/100||0.65;
          const loanMonths=parseNum(str.loanTermMonths)||18;
          const monthlyRate2=parseNum(str.interestRate)/100/12;
          const landDebt=Math.min(parseNum(fin.landPrice)*lvr, land*lvr);
          const constructionDebt=Math.max(0,(land+soft+hard)*lvr - landDebt);
          const sCurveInterest=Math.round(landDebt*monthlyRate2*loanMonths + constructionDebt*0.55*monthlyRate2*loanMonths);
          /* Undrawn facility line fee: charged on undrawn construction balance (avg 45% undrawn during build)
             lineFeePct p.a. on undrawn portion  construction months (50% of project term) */
          const lineFeePct2=(parseNum(str.lineFeePct)||0.75)/100;
          const constructMonths2=Math.max(6,Math.round((parseNum(str.loanTermMonths)||18)*0.55));
          const lineFee=Math.round(constructionDebt*(1-0.55)*(lineFeePct2/12)*constructMonths2);
          /* Use manually entered loanInterest if provided; otherwise use S-curve estimate */
          const effectiveLoanInterest=parseNum(fin.loanInterest)||sCurveInterest;
          /* Itemised holding costs: land tax (auto+manual), council rates, contract works insurance + catch-all */
          const manualLandTax=parseNum(fin.landTaxHold);
          /* Auto land tax only used when user hasn't manually entered a figure */
          const effectiveLandTax=manualLandTax>0?manualLandTax:autoLandTax;
          const holdingItemised=effectiveLandTax+parseNum(fin.councilRatesHold)+parseNum(fin.cwInsurance)+parseNum(fin.holdingCosts);
          const hold=effectiveLoanInterest+lineFee+parseNum(fin.loanFees)+parseNum(fin.bankValFees)+parseNum(fin.qsMonitorFees)+holdingItemised;
          const sale=parseNum(fin.agentComm)+parseNum(fin.marketing)+parseNum(fin.saleLegal)+parseNum(fin.titleInsurance||0); // #34: title insurance
          const total=land+soft+hard+hold+sale;
          /* Single Dwelling Covenant  force 1 dwelling regardless of user input */
          const covenantLocked=!!plan.hasSingleCovenant;
          const units=covenantLocked?1:(parseNum(market.grvUnits)||parseNum(plan.estUnits));
          const grv=parseNum(market.grvPerUnit)*units;
          const profit=grv-total;
          const margin=total>0?(profit/total)*100:0;
          const marginOnGrv=grv>0?(profit/grv)*100:0;
          /* NLA efficiency: GFA  nlaEff = saleable NLA. Validate GRV per unit against NLA if possible. */
          const nlaEff=parseNum(fin.nlaEff)||0.90;
          const totalGFA=calcBuildCost.effArea||parseNum(fin.buildArea)||0;
          const totalNLA=Math.round(totalGFA*nlaEff);
          const nlaPerUnit=units>0&&totalNLA>0?Math.round(totalNLA/units):0;
          const grvPSM_NLA=nlaPerUnit>0&&parseNum(market.grvPerUnit)>0?Math.round(parseNum(market.grvPerUnit)/nlaPerUnit):0;
          return{land,soft,hard,hold,sale,total,grv,profit,margin,marginOnGrv,units,contingencyAmt,
            soilPS,slopePS,rockPS,balPS,balRatingKey,slopeClass:slopeRaw,maxSlopeVal,SLOPE_RATE,SLOPE_COMPLEXITY,SOIL_FACTOR,retainingWallRisk,boePS,adjSoftPS,habWindowPS,drivewaySqm,effectiveBuildableArea,estUnitsForDrive,
            powerLinePS,treeReportPS,osmTreeCount,osmLineCount,covenantLocked,vcatPS,
            drainageSinkPS,councilRulesPS,councilOverlayHint,councilNameCalc,growthLevyPS,growthLevyResult,
            lgaAlerts:(()=>{const k=Object.keys(LGA_ALERTS).find(c=>councilNameCalc&&councilNameCalc.toLowerCase().includes(c.toLowerCase()));return k?LGA_ALERTS[k]:[];})(),
            sCurveInterest,effectiveLoanInterest,landDebt,constructionDebt,lineFee,
            nlaEff,totalGFA,totalNLA,nlaPerUnit,grvPSM_NLA,
            nccUpliftTotal,nccUpliftPerDwelling,ncc2022On,holdingItemised,
            parkingPS,parkingSpaces,firbFee,builderMarginAmt,marketRiskAmt,autoLandTax,effectiveLandTax,
            chmpPS,escalationAmt,escalationPct,
            frontageM,subdivSuitability,tandemPS,gravDrainRisk,pumpSystemPS,drivewayConcretPS,
            slopeStructuralPS,buildPermitLevy,
            autoAbsenteePS,autoTrustPS,reSurveyPS,effectiveAbsentee,
            tpzEncroachSqm,northLightRisk,contourStructuralPS,
            /* TPZ-adjusted effective buildable area: base - driveway - TPZ encroachment */
            effectiveBuildableAreaFinal:Math.max(0,effectiveBuildableArea-tpzEncroachSqm)};
        },[fin,market,plan.estUnits,plan.hasEasementBoe,plan.hasAboriginal,conds,siteInv,site,plan.hasSingleCovenant,plan.hasHO,plan.hasVPO,calcBuildCost,selSuburb,lookupResult,plan.zone,site.area,str,params.builderMarginPct,params.marketRiskPct]);  /* dedup: plan.zone was listed twice */

        /* Financing */
        const finStruct=useMemo(()=>{
          const tdc=calc.total;
          const lvr=parseNum(str.lvrPct)/100;
          /*  FIXED: Senior debt = MIN(TDC-based, GRV-based 65% cap)
             Banks will not lend more than 65% of GRV (end value) regardless of LVR covenant */
          const grvCap=0.65;
          const debtByTDC=tdc*lvr;
          const debtByGRV=calc.grv>0?calc.grv*grvCap:Infinity;
          const seniorDebt=Math.min(debtByTDC,debtByGRV);
          const debtConstraint=debtByGRV<debtByTDC?"GRV-capped (65% of GRV)":`TDC-based (${str.lvrPct}% LVR)`;
          const mez=parseNum(str.mezFunding)||0;
          const equityRequired=Math.max(0,tdc-seniorDebt-mez);
          /* S-curve interest: reuse from calc (already computed with full cost base) */
          const calcInterest=calc.sCurveInterest||0;
          /*  TRUE IRR: computed from monthly cash flow model, not simple annualised ROE */
